분할할 수 있다\n바른 표현: 해당 국어번역문이 제출된 경우에만 분할할 수 있다\n\n[암기 결론]\n외국어특허출원의 분할 → 국어번역문 제출 필요.","wrong":["국어번역문이 제출되지 않아도 분할할 수 있다"],"right":["해당 국어번역문이 제출된 경우에만 분할할 수 있다"],"reason":["외국어로 낸 특허출원을 나누려면 국어번역문이 제출되어 있어야 합니다. 따라서 '제출되지 않아도' 분할할 수"],"memory":["외국어특허출원의 분할 → 국어번역문 제출 필요."],"flags":[]},{"id":123,"area":"특허·실용신안","year":2012,"round":49,"page":53,"metadata":"2012년 제49회 / PDF p.127 / 교재 p.130 / 정답 ②","originalPdfPage":127,"bookPage":130,"answerKey":"②","question":"甲은 발명의 설명에 발명 A, B, C를 기재하고 청구항 1에 발명 A, 청구항 2에 발명 B를 기재하여 특허출원 X를\n했다. 乙은 甲의 출원일 후에 발명의 설명 및 청구항 1에 발명 C를 기재하여 특허출원 Y를 했다. 甲은 乙의 출원\n일 후에 발명의 설명 및 청구항 1에 발명 C를 기재하여 특허출원 X를 기초로 분할출원 Z를 했다. 다음 설명 중\n옳은 것은? (단, 특허출원 X와 Y의 발명자는 동일인이 아니며, 주어진 사항 이외는 고려하지 않는다.)","answer":"② 甲의 특허출원 X는 발명 C가 삭제 보정되었고, 특허출원 Y의 출원일 후에 공개되었다. 이 경우 乙의 특허출\n원 Y는 甲의 특허출원 X의 확대된 선출원의 지위로 인하여 거절될 수 있다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: X의 최초 명세서에 C 존재 → 나중 삭제해도 확대된 선출원의 비교대상으로 남음.","summary":"X의 최초 명세서에 C 존재 → 나중 삭제해도 확대된 선출원의 비교대상으로 남음.","wrong":[],"right":["X의 최초 명세서에 C 존재 → 나중 삭제해도 확대된 선출원의 비교대상으로 남음."],"reason":[],"memory":[],"flags":[]},{"id":124,"area":"특허·실용신안","year":2010,"round":47,"page":53,"metadata":"2010년 제47회 / PDF p.128 / 교재 p.131 / 정답 ③ (ㄱ, ㄹ)","originalPdfPage":128,"bookPage":131,"answerKey":"③ (ㄱ, ㄹ)","question":"특허법상 분할 및 변경출원에 관한 설명 중 옳은 것으로만 묶인 것은?","answer":"③ ㄱ, ㄹ\nㄱ. 적법한 분할출원은 원출원을 한 때에 출원한 것으로 보며, 따라서 신규성, 진보성, 출원공개의 시기, 존속기\n간의 기산일은 원출원일을 기준으로 판단한다.\nㄹ. 특허출원인은 그 특허출원에 관하여 최초의 거절결정등본을 송달받은 날부터 3개월이 경과한 때에는 해당\n특허출원을 실용신안등록출원으로 변경할 수 없으나, 원출원에 대하여 최초의 거절결정을 받은 자가 거절결정\n에 대한 불복심판을 청구하는 경우 그 거절결정에 대한 불복심판을 청구할 수 있는 기간이 연장된 때에는 그\n연장된 기간 내에 변경출원을 할 수 있다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 적법한 분할: 신규성·진보성·공개시기·존속기간 기산은 원출원일 기준.\n특허 → 실용신안 변경: 최초 거절등본 송달 후 3개월 / 불복기간 연장 시 그 기간.","summary":"적법한 분할: 신규성·진보성·공개시기·존속기간 기산은 원출원일 기준.\n특허 → 실용신안 변경: 최초 거절등본 송달 후 3개월 / 불복기간 연장 시 그 기간.","wrong":[],"right":["적법한 분할: 신규성·진보성·공개시기·존속기간 기산은 원출원일 기준."],"reason":[],"memory":[],"flags":[]},{"id":125,"area":"특허·실용신안","year":2023,"round":60,"page":53,"metadata":"2023년 제60회 / PDF p.129 / 교재 p.132 / 정답 ④ (ㄴ, ㄷ)","originalPdfPage":129,"bookPage":132,"answerKey":"④ (ㄴ, ㄷ)","question":"특허출원인 甲은 2022. 6. 1. 출원한 특허출원(청구항 제1항 내지 제10항)에 대한 의견제출통지서(청구항 제1항\n내지 제8항은 특허법 제29조 제2항 진보성 흠결, 제9항 및 제10항은 특허 가능한 청구항으로 인정)를 2022.\n8. 1. 통지받았다. 甲은 2022. 8. 30. 의견서 및 보정서를 제출하였으나, 심사관으로부터 2022. 10. 3. 특허거절결\n정서를 통지받았다. 이에 대응하여 甲은 특허거절결정에 대해서 특허법 제67조의2에 따른 재심사 청구를 하지\n않고 2022. 10. 21. 특허법 제132조의17에 따른 심판을 청구하였으나 2023. 2. 10. 특허법 제132조의17에 따른\n심판청구가 기각되었고, 2023. 2. 17. 심결의 등본을 송달받았다. 특허출원인 甲이 청구항 제9항 및 제10항에 대\n한 특허권을 획득하기 위하여 취할 수 있는 특허법상의 조치를 모두 고른 것은?","answer":"④ ㄴ, ㄷ\nㄴ. 특허법 제52조의2(분리출원)에 따라 청구항 제9항 및 제10항을 분리 출원\nㄷ. 특허법 제55조(특허출원 등을 기초로 한 우선권 주장)에 따라 청구항 제9항 및 제10항을 청구범위에 기재하\n여 국내 우선권 주장 출원","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 이 사례 9·10항 구제: 기각심결 등본 송달 후 30일 내 분리출원 가능.\n선출원 계속 중 + 선출원 후 1년 이내 → 국내우선권 주장출원 가능.","summary":"이 사례 9·10항 구제: 기각심결 등본 송달 후 30일 내 분리출원 가능.\n선출원 계속 중 + 선출원 후 1년 이내 → 국내우선권 주장출원 가능.","wrong":[],"right":["이 사례 9·10항 구제: 기각심결 등본 송달 후 30일 내 분리출원 가능."],"reason":[],"memory":[],"flags":[]},{"id":126,"area":"특허·실용신안","year":2017,"round":54,"page":54,"metadata":"2017년 제54회 / PDF p.130 / 교재 p.133 / 정답 ② (ㄱ, ㄴ)","originalPdfPage":130,"bookPage":133,"answerKey":"② (ㄱ, ㄴ)","question":"연구원 甲은 유전자에 관한 발명을 하여 2015년 5월 10일 미국에서 논문으로 발표를 하였다. 甲은 [판독 불명\n확] 2016년 3월 10일 미국 특허상표청에 특허출원을 하였다. 그 후 甲은 자신의 미국 특허출원에 근거하여 조\n약우선권을 주장하면서 2017년 2월 10일 한국 특허청에 특허출원을 하였다. 이에 관한 설명으로 옳은 것을 모\n두 고른 것은? (다른 무효사유는 없는 것으로 함)","answer":"② ㄱ, ㄴ\nㄱ. 甲은 미국 특허출원일인 2016년 3월 10일부터 1년 이내에 한국에 특허출원을 하였으므로, 다른 요건을 충\n족할 경우 조약에 의한 우선권을 인정받을 수 있다.\nㄴ. 甲이 조약에 의한 우선권 주장을 하지 않는 경우, 특허법 제30조(공지 등이 되지 아니한 발명으로 보는 경우)\n에 의한 신규성의제를 인정받기 위해서는 2015년 5월 10일부터 1년 이내에 특허출원을 하여야 한다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 조약우선권: 미국 출원 2016. 3. 10.부터 1년.\n공지예외: 논문 발표 2015. 5. 10.부터 1년.","summary":"조약우선권: 미국 출원 2016. 3. 10.부터 1년.\n공지예외: 논문 발표 2015. 5. 10.부터 1년.","wrong":[],"right":["조약우선권: 미국 출원 2016. 3. 10.부터 1년."],"reason":[],"memory":[],"flags":[]},{"id":127,"area":"특허·실용신안","year":null,"round":null,"page":54,"metadata":"출제연도·회차 판독 불명확 / PDF p.131 / 교재 p.134 / 정답 ③","originalPdfPage":131,"bookPage":134,"answerKey":"③","question":"파리협약에 의한 우선권과 국내 우선권과의 비교 설명 중 옳지 않은 것은?","answer":"③ 파리협약에 의한 우선권주장과 국내 우선권주장은 특허출원·실용신안등록출원·디자인등록출원을 대상으로\n한다.","correction":"틀린 부분: 국내 우선권주장은 특허출원·실용신안등록출원·디자인등록출원을 대상으로\n바른 표현: 국내우선권의 기초는 특허·실용신안 출원이며 디자인등록출원은 제외\n이유: 두 우선권 제도에서 기초로 삼을 수 있는 출원을 똑같이 보면 안 됩니다. 이 문제에서 구별할 핵심은 국내우선\n권은 디자인등록출원을 기초로 할 수 없다는 점입니다.\n암기 결론: 국내우선권의 기초: 특허·실용신안 출원 / 디자인등록출원 제외.","summary":"[틀린 표현 직접 수정]\n국내 우선권주장은 특허출원·실용신안등록출원·디자인등록출원을 대상으로 → 국내우선권의 기초는 특허·실용신안 출원이며\n디자인등록출원은 제외\n[암기 결론] 국내우선권의 기초: 특허·실용신안 출원 / 디자인등록출원 제외.","wrong":["국내 우선권주장은 특허출원·실용신안등록출원·디자인등록출원을 대상으로"],"right":["국내우선권의 기초는 특허·실용신안 출원이며 디자인등록출원은 제외"],"reason":["두 우선권 제도에서 기초로 삼을 수 있는 출원을 똑같이 보면 안 됩니다. 이 문제에서 구별할 핵심은 국내우선"],"memory":["국내우선권의 기초: 특허·실용신안 출원 / 디자인등록출원 제외."],"flags":["원문 판독·검증 필요"]},{"id":128,"area":"특허·실용신안","year":2009,"round":47,"page":55,"metadata":"2009년 제47회(교재 표기) / PDF p.132 / 교재 p.135 / 정답 ①","originalPdfPage":132,"bookPage":135,"answerKey":"①","question":"국내우선권에 관한 설명으로 옳지 않은 것은?","answer":"① 국내우선권주장을 수반하는 특허출원 된 발명 중 해당 우선권주장의 기초가 된 선출원의 최초 명세서에 기\n재된 발명과 같은 발명에 관하여 특허요건(제29조), 특허를 받을 수 없는 발명(제32조), 선출원(제36조), 선사용\n에 의한 통상실시권(제103조)에 대한 판단의 기준시점을 선출원일로 소급한다.","correction":"틀린 부분: 특허를 받을 수 없는 발명(제32조)\n바른 표현: 제32조 불특허발명의 판단시점은 특허여부결정시이므로 국내우선권으로 선출원일 소급되지 않음\n이유: 국내우선권이 있어도 모든 판단시점이 선출원일로 돌아가지는 않습니다. 보기 중 제32조의 특허를 받을 수 없\n는 발명인지는 특허여부 결정시를 기준으로 보므로, 이것까지 선출원일로 소급한다고 한 부분이 틀립니다.\n암기 결론: 제32조의 불특허발명 판단: 선출원일 소급 X / 특허여부 결정시 O.","summary":"[틀린 표현 직접 수정]\n특허를 받을 수 없는 발명(제32조) → 제32조 불특허발명의 판단시점은 특허여부결정시이므로 국내우선권으로 선출원일 소급되지 않음\n[암기 결론] 제32조의 불특허발명 판단: 선출원일 소급 X / 특허여부 결정시 O.","wrong":["특허를 받을 수 없는 발명(제32조)"],"right":["제32조 불특허발명의 판단시점은 특허여부결정시이므로 국내우선권으로 선출원일 소급되지 않음"],"reason":["국내우선권이 있어도 모든 판단시점이 선출원일로 돌아가지는 않습니다. 보기 중 제32조의 특허를 받을 수 없"],"memory":["제32조의 불특허발명 판단: 선출원일 소급 X / 특허여부 결정시 O."],"flags":[]},{"id":129,"area":"특허·실용신안","year":2017,"round":54,"page":55,"metadata":"2017년 제54회 / PDF p.133 / 교재 p.136 / 정답 ①","originalPdfPage":133,"bookPage":136,"answerKey":"①","question":"우선권 주장 출원에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"① 국내우선권 주장 출원은 선출원의 증명서류를 제출할 필요가 없고, 조약우선권주장 출원은 산업통상자원부\n령으로 정하는 국가의 경우 최초로 출원한 국가의 정부가 인증하는 서류로서 특허출원의 연월일을 적은 서면,\n발명의 명세서 및 도면의 등본만을 증명서류로 제출하면 인정된다.","correction":"틀린 부분: 등본만을 증명서류로\n바른 표현: 인증서류 외에 출원번호 등 확인정보를 적은 서면으로도 증명 가능\n이유: 정해진 국가의 출원이라면 정부 인증 등본만 가능한 것이 아니라 출원번호 등 확인 정보를 적은 서면을 제출하\n는 방법도 있습니다. 따라서 보기의 '등본만'이라는 제한이 틀립니다.\n\n암기 결론: 정해진 국가의 조약우선권 증명: 인증서류 또는 출원번호 등 확인정보 서면. '등본만' X.","summary":"[틀린 표현 직접 수정]\n등본만을 증명서류로 → 인증서류 외에 출원번호 등 확인정보를 적은 서면으로도 증명 가능\n[암기 결론] 정해진 국가의 조약우선권 증명: 인증서류 또는 출원번호 등 확인정보 서면. '등본만' X.","wrong":["등본만을 증명서류로"],"right":["인증서류 외에 출원번호 등 확인정보를 적은 서면으로도 증명 가능"],"reason":["정해진 국가의 출원이라면 정부 인증 등본만 가능한 것이 아니라 출원번호 등 확인 정보를 적은 서면을 제출하"],"memory":["정해진 국가의 조약우선권 증명: 인증서류 또는 출원번호 등 확인정보 서면. '등본만' X."],"flags":[]},{"id":130,"area":"특허·실용신안","year":2022,"round":59,"page":56,"metadata":"2022년 제59회 / PDF p.134 / 교재 p.137 / 정답 ④ (ㄱ, ㄴ, ㄹ)","originalPdfPage":134,"bookPage":137,"answerKey":"④ (ㄱ, ㄴ, ㄹ)","question":"甲은 자신이 발명한 '발명 X'에 관하여 학술논문으로 공개 발표하였고, 얼마 되지 않아 乙도 독자적으로 '발명\nX'를 발명하여 학술논문으로 공개 발표하였다. 그 후, 甲은 제1국 특허청에 '발명 X'에 관하여 특허출원하였다.\n甲은 우리나라 특허청에 제1국에서의 출원을 근거로 조약우선권을 주장하면서 '발명 X'에 관하여 특허출원하였\n다(이하 '국내출원 A'). 이어서 甲은 자신이 학술논문에 발표한 '발명 X'에 대하여 공지예외의 적용과 '국내출원\nA'를 기초로 국내우선권을 주장하면서 출원하였다(이하 '국내출원 B'). 다음 설명에서 옳지 않은 것을 모두 고른\n것은?","answer":"④ ㄱ, ㄴ, ㄹ\nㄱ. 甲의 '국내출원 B'가 특허 등록된다면, 특허권은 '국내출원 A'의 출원일부터 20년이 되는 날까지 존속한다.\nㄴ. 甲이 공지예외의 적용을 받기 위한 증명서류의 제출은, '국내출원 A'의 출원일로부터 30일 이내에 하여야\n한다.\nㄹ. 甲의 '국내출원 A'는 제1국 출원일로부터 1년 3개월이 지난 시점에서 취하된 것으로 본다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: B 존속기간 만료: B 출원일 후 20년 / B 공지예외 증명: B 출원 후 30일이 원칙.\n기초출원 A 취하간주: A 출원 후 1년 3개월.","summary":"B 존속기간 만료: B 출원일 후 20년 / B 공지예외 증명: B 출원 후 30일이 원칙.\n기초출원 A 취하간주: A 출원 후 1년 3개월.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":131,"area":"특허·실용신안","year":2020,"round":57,"page":56,"metadata":"2020년 제57회 / PDF p.135 / 교재 p.138 / 정답 ③","originalPdfPage":135,"bookPage":138,"answerKey":"③","question":"특허출원에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","answer":"③ 출원인이 국제특허출원을 하면서 파리협약의 당사국에서 행하여진 선출원에 의한 우선권을 주장하였다면\n특허법 제201조(국제특허출원의 국어번역문) 제1항 본문의 우선일은 국제특허출원의 제출일이 아니라 우선권\n을 주장한 선출원의 제출일이 된다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 우선권 있는 국제출원의 제201조 본문 기준: 선출원일인 우선일부터 31개월.","summary":"우선권 있는 국제출원의 제201조 본문 기준: 선출원일인 우선일부터 31개월.","wrong":[],"right":["우선권 있는 국제출원의 제201조 본문 기준: 선출원일인 우선일부터 31개월."],"reason":[],"memory":[],"flags":[]},{"id":132,"area":"특허·실용신안","year":2011,"round":48,"page":56,"metadata":"2011년 제48회 / PDF p.136 / 교재 p.139 / 정답 ⑤","originalPdfPage":136,"bookPage":139,"answerKey":"⑤","question":"甲은 미국에서 2021년 2월 10일 특허출원한 발명 A를 2021년 12월 1일 우리나라에 특허법 제54조(조약에 의\n한 우선권주장)의 규정에 의한 우선권을 주장하여 특허출원하였고, 현재 국내에서 심사가 진행 중이다. 한편,\n乙은 2021년 1월 5일에 간행된 저명한 학술잡지에 甲의 발명 A와 동일한 발명을 발표하였고, 2021년 6월 10일\n에 특허법 제30조(공지 등이 되지 아니한 발명으로 보는 경우)의 규정에 의하여 공지 등이 되지 아니하였다는\n취지를 기재한 서면 및 증명서를 첨부하여 발명 A를 우리나라에 특허출원하였다. 다음 설명 중 옳은 것은? (단,\n甲과 乙은 각각 독자적으로 발명 A를 발명한 것으로 본다)","answer":"⑤ 甲과 乙의 국내출원은 모두 특허를 받을 수 없다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 甲: 앞선 乙의 논문 때문에 신규성 부정 / 乙: 甲 출원의 후공개에 따른 확대된 선출원 문제.","summary":"甲: 앞선 乙의 논문 때문에 신규성 부정 / 乙: 甲 출원의 후공개에 따른 확대된 선출원 문제.","wrong":[],"right":["甲: 앞선 乙의 논문 때문에 신규성 부정 / 乙: 甲 출원의 후공개에 따른 확대된 선출원 문제."],"reason":[],"memory":[],"flags":[]},{"id":133,"area":"특허·실용신안","year":2013,"round":50,"page":57,"metadata":"2013년 제50회 / PDF p.137 / 교재 p.140 / 정답 ② (ㄱ, ㄹ)","originalPdfPage":137,"bookPage":140,"answerKey":"② (ㄱ, ㄹ)","question":"甲이 A라는 발명을 하고 이를 특허출원 전에 학회에서 서면으로 발표한 후에 특허법 제30조(공지 등이 되지 아\n니한 발명으로 보는 경우)의 규정을 적용받으면서 발표일로부터 5개월만에 한국과 일본에 각각 출원하였다(한\n국과 일본에서 신규성 의제와 관련하여 필요한 절차는 모두 이행하였고, 발명 A는 다른 특허요건은 모두 만족\n함). 한편, 경쟁관계에 있는 乙은 甲의 발명 사실을 모른 채 甲보다는 늦게 A를 발명하여, 甲보다 3개월 먼저 발\n명 A에 대하여 한국에 출원하였고, 그로부터 1개월 내에 파리조약에 의한 우선권 주장을 하면서 미국, 중국, 일\n본을 지정국으로 하여 국제특허출원을 하였으나, 중국과 미국에 대해서만 번역문을 제출하였다. 이 경우, 다음\n중 옳은 것을 모두 고른 것은? [단, 일본특허법에도 동법 제30조(발명의 신규성 상실의 예외) 및 제201조(국제\n특허출원의 번역문) 규정이 있음]","answer":"② ㄱ, ㄹ\nㄱ. 乙의 한국출원은 특허를 받을 수 없다.\nㄹ. 甲은 발명 A에 대하여 乙의 허락 없이 한국에서 업으로 실시할 수 있다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 乙 출원 전 甲의 공개 → 乙 신규성 부정 → 이 사례의 甲 실시에는 乙 허락 불필요.","summary":"乙 출원 전 甲의 공개 → 乙 신규성 부정 → 이 사례의 甲 실시에는 乙 허락 불필요.","wrong":[],"right":["乙 출원 전 甲의 공개 → 乙 신규성 부정 → 이 사례의 甲 실시에는 乙 허락 불필요."],"reason":[],"memory":[],"flags":[]},{"id":134,"area":"특허·실용신안","year":2009,"round":46,"page":57,"metadata":"2009년 제46회 / PDF p.138 / 교재 p.141 / 정답 ④","originalPdfPage":138,"bookPage":141,"answerKey":"④","question":"국내우선권과 관련된 설명 중 옳은 것은?","answer":"④ 선출원의 최초명세서 또는 도면에는 기재되어 있었으나, 보정에 의해 삭제된 발명을 기초로 하여 국내우선\n권주장을 할 수 있다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 최초 명세서·도면에 있던 발명 → 나중 삭제해도 국내우선권의 기초 가능.","summary":"최초 명세서·도면에 있던 발명 → 나중 삭제해도 국내우선권의 기초 가능.","wrong":[],"right":["최초 명세서·도면에 있던 발명 → 나중 삭제해도 국내우선권의 기초 가능."],"reason":[],"memory":[],"flags":[]},{"id":135,"area":"특허·실용신안","year":2011,"round":48,"page":58,"metadata":"2011년 제48회 / PDF p.139 / 교재 p.142 / 정답 ③","originalPdfPage":139,"bookPage":142,"answerKey":"③","question":"甲과 乙은 2018년 5월 1일 공동으로 A를 발명하여 2019년 4월 1일 발명 A에 대하여 공동으로 특허출원 X를 하\n였으나, 출원 후 乙은 자신의 특허를 받을 수 있는 권리를 甲의 동의 없이 2019년 6월 1일 丙에게 양도하였다.\n이후 丙은 미공개 상태인 발명 A를 현저하게 개량시킨 발명 A′를 단독으로 완성하였고, 특허출원 X를 선출원으\n로 하여 국내우선권주장을 하면서 2020년 3월 2일 발명 A와 발명 A′에 대해서 단독으로 특허출원 Y를 하였다.\n다음 설명 중 옳은 것은? (단, 발명 A에 비하여 발명 A′은 진보성이 인정되며, 설문에서 제시된 사항 외의 다른\n거절이유는 없는 것으로 한다)","answer":"③ 丙이 출원한 특허출원 Y는 무권리자의 출원일뿐만 아니라 선출원주의 규정에 위배되어 특허를 받을 수 없다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 공유자 甲 동의 없는 乙의 지분 양도 → 丙의 A 권리 취득 불가.\n부적법한 국내우선권 → Y 실제 출원일로 판단 → A에 선출원 위반.","summary":"공유자 甲 동의 없는 乙의 지분 양도 → 丙의 A 권리 취득 불가.\n부적법한 국내우선권 → Y 실제 출원일로 판단 → A에 선출원 위반.","wrong":[],"right":["공유자 甲 동의 없는 乙의 지분 양도 → 丙의 A 권리 취득 불가."],"reason":[],"memory":[],"flags":[]},{"id":136,"area":"특허·실용신안","year":2014,"round":51,"page":58,"metadata":"2014년 제51회 / PDF p.140 / 교재 p.143 / 정답 ③ (ㄱ, ㄷ, ㅁ)","originalPdfPage":140,"bookPage":143,"answerKey":"③ (ㄱ, ㄷ, ㅁ)","question":"특허법 제54조의 조약에 의한 우선권(이하 '조약우선권'이라 함) 및 특허법 제55조의 특허출원 등을 기초로 한\n우선권(이하 '국내우선권'이라 함)에 관한 설명으로 옳은 것을 모두 고른 것은?","answer":"③ ㄱ, ㄷ, ㅁ\nㄱ. 조약우선권 규정에 따라 우리나라에 특허출원을 하려는 경우 그 특허출원을 할 때에 우선권의 기초가 되는\n제1국 출원이 포기 또는 무효 되었다라도 그 우선권을 주장할 수 있지만, 국내우선권 규정에 따라 특허출원을\n하려는 경우 그 특허출원을 할 때에 선출원이 포기·무효 또는 취하 되었으면 그 우선권을 주장할 수 없다.\nㄷ. 심사를 위하여 필요한 경우, 특허청장은 기간을 정하여 우선권증명서류에 대한 국어 번역문의 제출을 명할\n수 있다.\nㅁ. 국제특허출원절차에 따라 우리나라 특허청에 국내단계를 밟는 경우, 국제단계에서 조약우선권 증명서류를\n제출하지 않았더라도 특허청장은 기간을 정하여 우선권증명서류 제출기회를 반드시 부여하여야 하며, 그 기간\n내에 우선권 증명서류를 제출하지 않으면 그 우선권주장은 효력을 상실한다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 제1국 출원 포기·무효와 달리, 국내우선권은 후출원시 선출원 포기·무효·취하이면 불가.\n필요한 우선권 증명 번역문 → 제출명령 가능. 국제단계 증명 누락 → 제출기회 부여 후 미제출 시 실효.","summary":"제1국 출원 포기·무효와 달리, 국내우선권은 후출원시 선출원 포기·무효·취하이면 불가.\n필요한 우선권 증명 번역문 → 제출명령 가능. 국제단계 증명 누락 → 제출기회 부여 후 미제출 시 실효.","wrong":[],"right":["제1국 출원 포기·무효와 달리, 국내우선권은 후출원시 선출원 포기·무효·취하이면 불가."],"reason":[],"memory":[],"flags":[]},{"id":137,"area":"특허·실용신안","year":2025,"round":62,"page":59,"metadata":"2025년 제62회 / PDF p.141 / 교재 p.144 / 정답 ③ / 교재의 두 번째 42번","originalPdfPage":141,"bookPage":144,"answerKey":"③","question":"甲은 스스로 A를 발명한 후 2023. 6. 1. 발명 A에 대하여 특허출원 X를 하였고, 이어서 A를 개량한 A+B를 발명\n한 후 2024. 6. 1. 특허출원 X를 기초로 특허법 제55조(특허출원 등을 기초로 한 우선권 주장) 우선권 주장을 수\n반하면서 발명 A, A+B, C에 대하여 특허출원 Y를 하였고, 특허출원 Y는 2024. 12. 1. 출원공개 되었다. 다음 중\n옳지 않은 것은? (각 설명은 독립적임)","answer":"③ 甲이 특허법 제56조(선출원의 취하 등)에 따라 취하 간주된 특허출원 X에 관한 서류의 열람·복사를 2025. 2.\n1. 신청하는 경우, 특허청장은 비밀로 유지할 필요가 있다고 인정하면 그 서류의 열람·복사를 허가하지 아니할\n수 있다.","correction":"틀린 부분: 열람·복사를 허가하지 아니할 수 있다\n바른 표현: 후출원 Y가 이미 공개된 경우 그 기초출원 X는 해당 비밀열람 제한 예외에 해당\n이유: 출원공개 전 서류는 비밀을 위해 열람을 제한할 수 있지만, 국내우선권을 주장한 후출원 Y가 이미 공개된 경우\n그 기초출원 X의 서류는 이 제한의 예외입니다. 따라서 X가 취하간주되었다는 사정만으로 보기처럼 비밀유지\n를 이유로 열람을 막을 수 있다고 할 수 없습니다.\n암기 결론: 국내우선권 후출원 Y 공개 → 기초출원 X 서류는 미공개 출원의 열람제한 대상에서 제외.","summary":"[틀린 표현 직접 수정]\n열람·복사를 허가하지 아니할 수 있다 → 후출원 Y가 이미 공개된 경우 그 기초출원 X는 해당 비밀열람 제한 예외에 해당\n[암기 결론] 국내우선권 후출원 Y 공개 → 기초출원 X 서류는 미공개 출원의 열람제한 대상에서 제외.","wrong":["열람·복사를 허가하지 아니할 수 있다"],"right":["후출원 Y가 이미 공개된 경우 그 기초출원 X는 해당 비밀열람 제한 예외에 해당"],"reason":["출원공개 전 서류는 비밀을 위해 열람을 제한할 수 있지만, 국내우선권을 주장한 후출원 Y가 이미 공개된 경우"],"memory":["국내우선권 후출원 Y 공개 → 기초출원 X 서류는 미공개 출원의 열람제한 대상에서 제외."],"flags":[]},{"id":138,"area":"특허·실용신안","year":2025,"round":62,"page":59,"metadata":"2025년 제62회 / PDF p.142 / 교재 p.145 / 정답 ④","originalPdfPage":142,"bookPage":145,"answerKey":"④","question":"특허법상 우선권 주장 출원에 관한 설명으로 옳지 않은 것은?","answer":"④ 특허법 제55조(특허출원 등을 기초로 한 우선권 주장)제1항에 따른 우선권 주장을 수반하는 특허출원된 발\n명 중 해당 우선권 주장의 기초가 된 선출원의 출원서에 최초로 첨부된 명세서 또는 도면에 기재된 발명과 같\n은 발명에 관하여 제96조(특허권의 효력이 미치지 아니하는 범위)제1항제1호(연구 또는 시험을 하기 위한 특허\n발명의 실시)와 제3호(특허출원을 한 때부터 국내에 있는 물건)를 적용할 때에는 그 특허출원은 그 선출원을 한\n때에 특허출원한 것으로 본다.","correction":"틀린 부분: 제96조(특허권의 효력이 미치지 아니하는 범위)제1항제1호\n바른 표현: 제96조 제1항 제3호는 소급 대상이지만 제1호 연구·시험 실시는 아님\n이유: 국내우선권의 판단시점 소급은 법에서 정한 조문에 적용됩니다. 출원 때부터 국내에 있는 물건에 관한 제96조\n제1항 제3호는 포함되지만, 연구·시험에 관한 제1호까지 포함되는 것은 아니므로, 두 규정을 함께 적은 보기가\n틀립니다.\n암기 결론: 제55조 제3항의 소급 대상: 제96조 제1항 제3호 포함 / 제1호 제외.","summary":"[틀린 표현 직접 수정]\n제96조(특허권의 효력이 미치지 아니하는 범위)제1항제1호 → 제96조 제1항 제3호는 소급 대상이지만 제1호 연구·시험 실시는 아님\n[암기 결론] 제55조 제3항의 소급 대상: 제96조 제1항 제3호 포함 / 제1호 제외.","wrong":["제96조(특허권의 효력이 미치지 아니하는 범위)제1항제1호"],"right":["제96조 제1항 제3호는 소급 대상이지만 제1호 연구·시험 실시는 아님"],"reason":["국내우선권의 판단시점 소급은 법에서 정한 조문에 적용됩니다. 출원 때부터 국내에 있는 물건에 관한 제96조"],"memory":["제55조 제3항의 소급 대상: 제96조 제1항 제3호 포함 / 제1호 제외."],"flags":[]},{"id":139,"area":"특허·실용신안","year":2011,"round":null,"page":60,"metadata":"2011년 / 회차 판독 불명확 / PDF p.144 / 교재 p.148 / 정답 ⑤","originalPdfPage":144,"bookPage":148,"answerKey":"⑤","question":"특허법상 심사청구에 관한 설명으로 옳은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"⑤ 국제특허출원의 출원인은 국어번역문 제출 및 수수료 납부 후에는 특허협력조약(PCT) 제2조(정의)에 의한\n우선일부터 2년 7월 전이라도 심사청구를 할 수 있지만, 국제특 d":62,"page":61,"metadata":"2025년 제62회 / PDF p.148 / 교재 p.152 / 정답 ③","originalPdfPage":148,"bookPage":152,"answerKey":"③","question":"특허법상 절차에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"③ 특허출원에 대한 적법한 정보제공이 있는 경우 심사관은 제공된 정보에 기속되고 이를 근거로 특허여부를\n결정하여야 한다.","correction":"틀린 부분: 제공된 정보에 기속되고\n바른 표현: 제공된 정보에 기속되지 않는다\n이유: 정보제공은 심사에 참고할 자료를 내는 것이며, 제출자의 주장대로 결정하도록 심사관을 묶는 제도가 아닙니다.\n심사관은 정보를 검토해 독자적으로 판단하므로, 보기의 '기속되고'가 틀립니다.","summary":"[틀린 부분 → 바른 표현 → 이유]\n틀린 부분: 제공된 정보에 기속되고\n바른 표현: 제공된 정보에 기속되지 않는다\n[암기 결론]\n적법한 정보제공도 심사관을 기속하지 않음.","wrong":["제공된 정보에 기속되고"],"right":["제공된 정보에 기속되지 않는다"],"reason":["정보제공은 심사에 참고할 자료를 내는 것이며, 제출자의 주장대로 결정하도록 심사관을 묶는 제도가 아닙니다."],"memory":["적법한 정보제공도 심사관을 기속하지 않음."],"flags":[]},{"id":144,"area":"특허·실용신안","year":2010,"round":47,"page":61,"metadata":"2010년 제47회 / PDF p.149 / 교재 p.153 / 정답 ⑤","originalPdfPage":149,"bookPage":153,"answerKey":"⑤","question":"특허법 상 출원공개에 관한 설명으로 옳은 것은?","answer":"⑤ 국제특허출원의 경우에는 원칙적으로 국내서면제출기간이 지난 때에 출원공개된 것으로 보며, 이로 인한 보\n상금청구권은 설정등록 후가 아니면 이를 행사할 수 없다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 교재의 국제출원 공개효과: 국내서면제출기간 경과가 원칙 / 보상금청구권 행사는 설정등록 후.","summary":"교재의 국제출원 공개효과: 국내서면제출기간 경과가 원칙 / 보상금청구권 행사는 설정등록 후.","wrong":[],"right":["교재의 국제출원 공개효과: 국내서면제출기간 경과가 원칙 / 보상금청구권 행사는 설정등록 후."],"reason":[],"memory":[],"flags":[]},{"id":145,"area":"특허·실용신안","year":2014,"round":51,"page":61,"metadata":"2014년 제51회 / PDF p.150 / 교재 p.154 / 정답 ④","originalPdfPage":150,"bookPage":154,"answerKey":"④","question":"출원공개제도에 관한 설명으로 옳지 않은 것은?","answer":"④ 출원공개가 있은 후 그 특허출원된 발명을 업으로서 실시한 자는 그 침해행위에 대하여 과실이 있는 것으로\n추정한다.","correction":"틀린 부분: 과실이 있는 것으로 추정한다\n바른 표현: 출원공개 후 보상금청구에는 특허침해의 과실추정 규정을 준용하지 않는다\n이유: 출원공개만 된 단계의 보상금청구에 등록 특허권 침해의 과실추정 규정을 그대로 가져올 수는 없습니다. 교재\n는 공개 후 경고를 받았거나 공개된 발명임을 알고 실시했는지 확인하도록 연결하므로, 공개 뒤 실시했다는 사\n실만으로 과실이 추정된다는 보기가 틀립니다.","summary":"[틀린 부분 → 바른 표현 → 이유]\n틀린 부분: 과실이 있는 것으로 추정한다\n바른 표현: 출원공개 후 보상금청구에는 특허침해의 과실추정 규정을 준용하지 않는다\n[암기 결론]\n출원공개에 따른 보상금청구 → 과실추정 규정 준용 안 됨.","wrong":["과실이 있는 것으로 추정한다"],"right":["출원공개 후 보상금청구에는 특허침해의 과실추정 규정을 준용하지 않는다"],"reason":["출원공개만 된 단계의 보상금청구에 등록 특허권 침해의 과실추정 규정을 그대로 가져올 수는 없습니다. 교재"],"memory":["출원공개에 따른 보상금청구 → 과실추정 규정 준용 안 됨."],"flags":[]},{"id":146,"area":"특허·실용신안","year":2015,"round":52,"page":62,"metadata":"2015년 제52회 / PDF p.151 / 교재 p.155 / 정답 ③","originalPdfPage":151,"bookPage":155,"answerKey":"③","question":"특허법상 출원공개제도에 관한 설명으로 옳은 것을 모두 고른 것은?","answer":"③ ㄷ\nㄷ. 국제특허출원의 경우 국제공개에 의해서도 보상금청구권 발생이 가능하다","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 국어 국제출원: 국제공개에 의한 보상금청구권 발생 가능 → 행사는 설정등록 후.","summary":"국어 국제출원: 국제공개에 의한 보상금청구권 발생 가능 → 행사는 설정등록 후.","wrong":[],"right":["국어 국제출원: 국제공개에 의한 보상금청구권 발생 가능 → 행사는 설정등록 후."],"reason":[],"memory":[],"flags":[]},{"id":147,"area":"특허·실용신안","year":2025,"round":62,"page":62,"metadata":"2025년 제62회 / PDF p.152 / 교재 p.156 / 정답 ②","originalPdfPage":152,"bookPage":156,"answerKey":"②","question":"甲은 2023. 6. 1. 미국에 발명 A에 대하여 특허출원 X를 하였고, 이후 2023. 12. 1. 국내에 특허출원 X를 기초로\n특허법 제54조(조약에 의한 우선권 주장) 우선권 주장을 수반하면서 명세서에 발명의 설명에만 A, B를 기재하\n고 청구범위를 적지 않은 특허출원 Y를 하였다. 한편 乙은 2023. 9. 1.부터 발명 A를 국내에서 실시하고 있는 자\n이다. 다음 중 옳지 않은 것을 모두 고른 것은? (각 설명은 독립적임)","answer":"② ㄹ\nㄹ. 乙이 甲의 발명의 내용을 알지 못하고 스스로 실시하는 것이라면 乙은 甲에 대하여 특허법 제103조(선사용\n에 의한 통상실시권)에 따른 통상실시권을 가진다.","correction":"틀린 부분: 乙은 甲에 대하여 특허법 제103조(선사용에 의한 통상실시권)에 따른 통상실시권을 가진다\n바른 표현: 이 사례의 선사용권은 우선일 당시 이미 실시사업 또는 준비를 했는지 확인해야 한다\n이유: 자기 개발이라는 사실만으로 성립하지 않으며, 우선일 기준 실시나 사업 준비 시점이 핵심입니다.","summary":"틀린 부분: 乙은 甲에 대하여 특허법 제103조(선사용에 의한 통상실시권)에 따른 통상실시권을 가진다\n바른 표현: 이 사례의 선사용권은 우선일 당시 이미 실시사업 또는 준비를 했는지 확인해야 한다\n이유: 자기 개발이라는 사실만으로 성립하지 않으며, 우선일 기준 실시나 사업 준비 시점이 핵심입니다.\n암기 결론: 발명 A의 선사용권 기준일 = 우선일 2023. 6. 1.\n2023. 9. 1. 실시 개시만으로는 기준일 요건 충족 불가.","wrong":["乙은 甲에 대하여 특허법 제103조(선사용에 의한 통상실시권)에 따른 통상실시권을 가진다"],"right":["이 사례의 선사용권은 우선일 당시 이미 실시사업 또는 준비를 했는지 확인해야 한다"],"reason":["자기 개발이라는 사실만으로 성립하지 않으며, 우선일 기준 실시나 사업 준비 시점이 핵심입니다."],"memory":["발명 A의 선사용권 기준일 = 우선일 2023. 6. 1."],"flags":[]},{"id":148,"area":"특허·실용신안","year":2017,"round":54,"page":63,"metadata":"2017년 제54회 / PDF p.153 / 교재 p.157 / 정답 ③","originalPdfPage":153,"bookPage":157,"answerKey":"③","question":"특허출원에 대한 거절이유통지 및 보정에 관한 설명으로 옳은 것은?","answer":"③ 심사관의 거절이유통지에 대한 보정에 따라 발생한 거절이유에 대하여 거절이유를 통지받은 경우에는, 청구\n항을 한정 또는 삭제하거나 청구항에 부가하여 청구범위를 감축하는 경우, 잘못 기재된 사항을 정정하는 경우,\n분명하지 아니한 사항을 명확히 하는 경우에 보정할 수 있다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 보정으로 생긴 거절이유에 대한 통지 → 청구범위 보정 목적 제한.\n감축·오기 정정·불명확 사항 명확화는 허용 유형.","summary":"보정으로 생긴 거절이유에 대한 통지 → 청구범위 보정 목적 제한.\n감축·오기 정정·불명확 사항 명확화는 허용 유형.","wrong":[],"right":["보정으로 생긴 거절이유에 대한 통지 → 청구범위 보정 목적 제한."],"reason":[],"memory":[],"flags":[]},{"id":149,"area":"특허·실용신안","year":2024,"round":61,"page":63,"metadata":"2024년 제61회 / PDF p.154 / 교재 p.158 / 정답 ①","originalPdfPage":154,"bookPage":158,"answerKey":"①","question":"특허출원에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"① 누구든지 특허출원에 대하여 특허출원일부터 3년 이내에 특허청장에게 출원심사의 청구를 할 수 있다. 다만,\n공동출원인 중 1인이 특허출원을 한 경우 출원심사의 청구를 취하할 수 있다.","correction":"틀린 부분: 출원심사의 청구를 취하할 수 있다\n바른 표현: 출원심사의 청구는 취하할 수 없다\n이유: 출원심사청구는 심사관에게 출원을 심사해 달라고 요청하는 절차입니다. 일단 한 출원심사청구는 취하할 수 없\n으므로, 공동출원인 중 한 사람이 한 경우에는 취하할 수 있다는 예외를 둔 보기가 틀립니다. 출원 자체의 취하\n와 심사청구의 취하를 구별해야 합니다.","summary":"[틀린 부분 → 바른 표현 → 이유]\n틀린 부분: 출원심사의 청구를 취하할 수 있다\n바른 표현: 출원심사의 청구는 취하할 수 없다\n[암기 결론]\n출원심사청구는 취하 불가. 공동출원인 1인이라는 이유로 예외가 되지 않는다.","wrong":["출원심사의 청구를 취하할 수 있다"],"right":["출원심사의 청구는 취하할 수 없다"],"reason":["출원심사청구는 심사관에게 출원을 심사해 달라고 요청하는 절차입니다. 일단 한 출원심사청구는 취하할 수 없"],"memory":["출원심사청구는 취하 불가. 공동출원인 1인이라는 이유로 예외가 되지 않는다."],"flags":[]},{"id":150,"area":"특허·실용신안","year":2022,"round":59,"page":64,"metadata":"2022년 제59회 / PDF p.155 / 교재 p.159 / 정답 ②","originalPdfPage":155,"bookPage":159,"answerKey":"②","question":"특허출원심사에 관한 설명으로 옳은 것은?","answer":"② 심사관의 직권 재심사에 의하여 특허결정을 취소한다는 사실이 특허출원인에게 통지가 되기 이전에 특허권\n설정등록이 이루어졌다면, 특허취소결정은 처음부터 없었던 것으로 본다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 직권 재심사 취소 통지를 받기 전 설정등록 → 특허결정 취소는 처음부터 없었던 것으로 취급.","summary":"직권 재심사 취소 통지를 받기 전 설정등록 → 특허결정 취소는 처음부터 없었던 것으로 취급.","wrong":[],"right":["직권 재심사 취소 통지를 받기 전 설정등록 → 특허결정 취소는 처음부터 없었던 것으로 취급."],"reason":[],"memory":[],"flags":[]},{"id":151,"area":"특허·실용신안","year":2011,"round":48,"page":64,"metadata":"2011년 제48회 / PDF p.156 / 교재 p.160 / 정답 ③","originalPdfPage":156,"bookPage":160,"answerKey":"③","question":"특허거절결정 및 이에 대한 불복심판에 관한 설명으로 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"③ 특허거절결정에 대한 심판은 특허를 받을 수 있는 권리가 공유인 경우 공유자 전원이 청구하여야 하며, 일부\n공유자가 누락된 경우, 심판청구기간 이내에는 청구인을 추가하는 보정이 가능하나 심판청구기간이 경과한 후\n청구인을 추가하는 보정은 심판청구서의 요지변경에 해당되어 허용되지 않는다.","correction":"틀린 부분: 심판청구기간이 경과한 후 청구인을 추가하는 보정은 심판청구서의 요지변경에 해당되어 허용되지 않는다\n바른 표현: 교재에 따르면 누락된 당사자 기재를 바로잡는 보정은 심결시까지 허용될 수 있다\n이유: 공유인 권리에 대한 거절결정불복심판은 공유자 전원이 함께 청구해야 합니다. 그러나 누락된 공유자를 추가해\n당사자 기재를 바로잡는 보정은 교재가 설명하는 요지변경 금지의 예외에 해당합니다. 따라서 심판청구기간이\n지났다는 이유만으로 보정이 금지되는 것은 아니며, 교재는 심결 전까지 가능하다고 설명합니다.","summary":"[틀린 부분 → 바른 표현 → 이유]\n틀린 부분: 심판청구기간이 경과한 후 청구인을 추가하는 보정은 심판청구서의 요지변경에 해당되어 허용되지 않는다\n바른 표현: 교재에 따르면 누락된 당사자 기재를 바로잡는 보정은 심결시까지 허용될 수 있다\n[암기 결론]\n공유자는 전원이 청구하되, 누락된 공유자를 추가하는 당사자 보정은 심판청구기간 경과 후에도 가능.","wrong":["심판청구기간이 경과한 후 청구인을 추가하는 보정은 심판청구서의 요지변경에 해당되어 허용되지 않는다"],"right":["교재에 따르면 누락된 당사자 기재를 바로잡는 보정은 심결시까지 허용될 수 있다"],"reason":["공유인 권리에 대한 거절결정불복심판은 공유자 전원이 함께 청구해야 합니다. 그러나 누락된 공유자를 추가해"],"memory":["공유자는 전원이 청구하되, 누락된 공유자를 추가하는 당사자 보정은 심판청구기간 경과 후에도 가능."],"flags":[]},{"id":152,"area":"특허·실용신안","year":2014,"round":51,"page":64,"metadata":"2014년 제51회 / PDF p.157 / 교재 p.161 / 정답 ①","originalPdfPage":157,"bookPage":161,"answerKey":"①","question":"특허거절결정에 대한 특허법 제67조의2(재심사의 청구) 및 특허법 제132조의17(특허거절결정 등에 대한 심판)\n에 관한 설명으로 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"① 출원인이 특허출원의 특허거절결정에 대해 재심사 청구를 한 경우에 해당 거절결정등본을 송달받은 날부터\n3개월 이내에는 분할출원을 할 수 있다.","correction":"틀린 부분: 거절결정등본을 송달받은 날부터 3개월 이내에는 분할출원을 할 수 있다\n바른 표현: 재심사 청구 시 기존 거절결정은 취소간주하므로 그 결정 송달에 따른 3개월 특례를 그대로 주장할 수 없음\n이유: 재심사를 청구하면 종전 거절결정은 취소된 것으로 취급합니다. 따라서 이미 취소된 그 거절결정의 송달일을\n근거로 ‘3개월 안이니 분할출원할 수 있다’고 주장할 수 없다는 취지입니다. 교재의 설명은 이 거절결정에 따른\n분할 기회에 관한 것이므로, 모든 별도 분할 가능 시점까지 없어진다는 뜻 전성을 확인하기 위한 임상시험을 약 2년간 진행하여, 2017. 8. 1. 제조판매품목허가를\n받기 위한 서류를 식품의약품안전청에 제출하였다. 그러나 2017. 9. 1. 자료가 미비하여 추가 시험 자료가 필요\n하다는 통지를 받았다. 甲은 추가시험을 한 다음 2017. 10. 12. 추가 자료를 제출하여 2018. 1. 8. 최종적으로 화\n합물 A를 유효성분으로 하는 제조판매품목허가를 받았다. 다음 설명 중 옳은 것은?","answer":"② 특허청장은 甲이 특허권 존속기간의 연장등록출원을 한 때에는 최종적으로 연장등록결정이 되는지 여부와\n무관하게 그 특허권 존속기간의 연장등록 출원서에 기재된 사항들을 특허공보에 게재하여야 한다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 허가에 따른 연장등록출원이 있으면 출원서 기재사항을 특허공보에 게재. 최종 등록 여부와 별개.","summary":"허가에 따른 연장등록출원이 있으면 출원서 기재사항을 특허공보에 게재. 최종 등록 여부와 별개.","wrong":[],"right":["허가에 따른 연장등록출원이 있으면 출원서 기재사항을 특허공보에 게재. 최종 등록 여부와 별개."],"reason":[],"memory":[],"flags":[]},{"id":175,"area":"특허·실용신안","year":2012,"round":49,"page":73,"metadata":"2012년 제49회 / PDF p.181 / 교재 p.186 / 정답 ①","originalPdfPage":181,"bookPage":186,"answerKey":"①","question":"특허권의 소멸사유에 관한 설명으로 옳은 것은?","answer":"① 전시, 사변 또는 이에 준하는 비상시에 있어서 국방상의 필요를 이유로 특허권이 수용된 경우, 그 특허발명\n에 관한 전용실시권이나 통상실시권은 소멸되지만 특허권까지 소멸되는 것은 아니다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 특허권 수용: 특허권은 존속하며 국가가 취득, 특허권 외의 권리는 소멸.","summary":"특허권 수용: 특허권은 존속하며 국가가 취득, 특허권 외의 권리는 소멸.","wrong":[],"right":["특허권 수용: 특허권은 존속하며 국가가 취득, 특허권 외의 권리는 소멸."],"reason":[],"memory":[],"flags":[]},{"id":176,"area":"특허·실용신안","year":2008,"round":45,"page":74,"metadata":"2008년 제45회 / PDF p.182 / 교재 p.187 / 정답 ③","originalPdfPage":182,"bookPage":187,"answerKey":"③","question":"다음 보기 중 특허권이 소멸하지 않는 것으로만 묶인 것은?","answer":"③ ㄴ, ㅁ\nㄴ. 특허권이 수용된 경우\nㅁ. 특허발명이 계속하여 3년 이상 국내에서 실시되고 있지 아니한 경우","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 수용·계속 3년 이상 국내 불실시 → 그 사실만으로 특허권 소멸 아님.","summary":"수용·계속 3년 이상 국내 불실시 → 그 사실만으로 특허권 소멸 아님.","wrong":[],"right":["수용·계속 3년 이상 국내 불실시 → 그 사실만으로 특허권 소멸 아님."],"reason":[],"memory":[],"flags":[]},{"id":177,"area":"특허·실용신안","year":2024,"round":61,"page":74,"metadata":"2024년 제61회 / PDF p.183 / 교재 p.188 / 정답 ⑤","originalPdfPage":183,"bookPage":188,"answerKey":"⑤","question":"특허권에 관한 설명으로 옳은 것은?","answer":"⑤ 특허권을 포기한 때에는 특허권은 그때부터 소멸한다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 특허권 포기의 효과는 장래효: 그때부터 소멸.","summary":"특허권 포기의 효과는 장래효: 그때부터 소멸.","wrong":[],"right":["특허권 포기의 효과는 장래효: 그때부터 소멸."],"reason":[],"memory":[],"flags":[]},{"id":178,"area":"특허·실용신안","year":2020,"round":57,"page":74,"metadata":"2020년 제57회 / PDF p.184 / 교재 p.189 / 정답 ④","originalPdfPage":184,"bookPage":189,"answerKey":"④","question":"특허발명의 실시에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)","answer":"④ ㄱ, ㄷ, ㄹ\nㄱ. ‘실시’란 ‘물건의 발명’인 경우 그 물건을 생산·사용·양도·대여 또는 수입하거나 그 물건의 양도 또는 대여의\n청약(양도 또는 대여를 위한 전시를 포함한다)을 하는 행위를 말한다.\nㄷ. ‘물건의 발명’에 대한 특허권자 또는 특허권자로부터 허락을 받은 실시권자가 우리나라에서 그 특허발명이\n구현된 물건을 적법하게 양도한 경우, 양수인이나 전득자가 물건을 사용, 양도하는 등의 행위에 대하여 특허권\n의 효력이 미치지 않는다.\nㄹ. 타인의 특허발명을 허락 없이 실시한 자에게 과실이 없다고 하기 위해서는 특허권의 존재를 알지 못하였다\n는 점을 정당화할 수 있는 사정이 있다거나 자신이 실시하는 기술이 특허발명의 권리범위에 속하지 않는다고\n믿은 점을 정당화할 수 있는 사정이 있다는 것을 주장, 입증하여야 한다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 물건 발명의 실시에는 생산뿐 아니라 사용·양도·대여·수입·청약도 포함.\n국내 적법 양도된 특정 물건에는 특허권 소진.\n과실 추정을 뒤집으려면 몰랐거나 비침해라 믿은 정당한 사정을 주장·증명.","summary":"물건 발명의 실시에는 생산뿐 아니라 사용·양도·대여·수입·청약도 포함.\n국내 적법 양도된 특정 물건에는 특허권 소진.\n과실 추정을 뒤집으려면 몰랐거나 비침해라 믿은 정당한 사정을 주장·증명.","wrong":[],"right":["물건 발명의 실시에는 생산뿐 아니라 사용·양도·대여·수입·청약도 포함."],"reason":[],"memory":[],"flags":[]},{"id":179,"area":"특허·실용신안","year":null,"round":null,"page":75,"metadata":"출제 연도·회차 [판독 불명확] / PDF p.185 / 교재 p.190 / 정답 ⑤","originalPdfPage":185,"bookPage":190,"answerKey":"⑤","question":"甲은 ‘화합물 [기호 판독 불명확]를 유효성분으로 하는 [판독 불명확]’에 대한 특허권자로 이 특허권을 특허권 A′\n라 한다. [판독 불명확] 2016년 5월에 만료될 예정이다. 다음 중 옳지 않은 것은? (다툼이 있으면 판례에 따르며\n乙의 행위는 모두 권한 없이 업으로서 행해진 것으로 본다)","answer":"⑤ 乙이 화합물 [기호 판독 불명확]를 유효성분으로 하는 [판독 불명확]에 대하여 약사법에 따른 품목허가를 받\n은 후 특허권 A′의 존속기간 중에 화합물 [기호 판독 불명확]를 유효성분으로 하는 [판독 불명확](乙 제품)의 제\n조·판매를 하였고 존속기간 만료 후에도 계속 乙 제품의 제조·판매를 하고 있는 사실에 대해 [판독 불명확] 특허\n권 A′의 존속기간 만료 후에 알았다면, 甲은 乙 제품의 폐기를 구할 수 있다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 침해금지·예방을 위한 폐기청구는 특허권 존속을 전제로 한다. 소송에서는 변론종결시 기준.","summary":"침해금지·예방을 위한 폐기청구는 특허권 존속을 전제로 한다. 소송에서는 변론종결시 기준.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":180,"area":"특허·실용신안","year":2017,"round":54,"page":75,"metadata":"2017년 제54회 / PDF p.186 / 교재 p.191 / 정답 ⑤","originalPdfPage":186,"bookPage":191,"answerKey":"⑤","question":"특허권의 효력 등에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"⑤ 물건(A)을 생산하는 기계(B)를 청구범위로 하는 특허 X의 권리범위는 그 기계(B)로 생산된 물건(A) 및 그 제\n조방법에는 미치지 않는 것이므로 그 기계(B)를 제3자로부터 구입하여 물건(A)을 제조·판매하는 행위는 그 제3\n자가 X의 특허권자로부터 정당한 실시허락을 받았는지에 관계없이 특허 X의 특허권을 침해하는 행위가 아니다.","correction":"틀린 부분: 정당한 실시허락을 받았는지에 관계없이 특허 X의 특허권을 침해하는 행위가 아니다\n바른 표현: 특허 기계 B의 사용도 실시이며, 권리소진 등의 사정이 없다면 침해가 될 수 있다\n이유: 물건 A를 만드는 과정에서 특허 기계 B를 사용한다는 점과 권리소진 여부를 구별해야 합니다.","summary":"틀린 부분: 정당한 실시허락을 받았는지에 관계없이 특허 X의 특허권을 침해하는 행위가 아니다\n바른 표현: 특허 기계 B의 사용도 실시이며, 권리소진 등의 사정이 없다면 침해가 될 수 있다\n이유: 물건 A를 만드는 과정에서 특허 기계 B를 사용한다는 점과 권리소진 여부를 구별해야 합니다.\n암기 결론: 기계 B로 물건 A 생산 = 기계 B의 사용. 기계 특허 침해 가능성은 별도로 판단.","wrong":["정당한 실시허락을 받았는지에 관계없이 특허 X의 특허권을 침해하는 행위가 아니다"],"right":["특허 기계 B의 사용도 실시이며, 권리소진 등의 사정이 없다면 침해가 될 수 있다"],"reason":["물건 A를 만드는 과정에서 특허 기계 B를 사용한다는 점과 권리소진 여부를 구별해야 합니다."],"memory":["기계 B로 물건 A 생산 = 기계 B의 사용. 기계 특허 침해 가능성은 별도로 판단."],"flags":[]},{"id":181,"area":"특허·실용신안","year":2016,"round":53,"page":75,"metadata":"2016년 제53회 / PDF p.187 / 교재 p.192 / 정답 ①","originalPdfPage":187,"bookPage":192,"answerKey":"①","question":"甲은 발명 X에 대하여 특허권 등록을 받은 후, X기술이 구현된 제품을 생산·판매하고 있었다. 乙은 甲의 특허발\n명 X와 동일한 기술을 이용하여 정당한 권한 없이 제품을 생산·판매하였다. 甲은 乙에 대하여 특허권 침해를 주\n장하면서 침해금지 및 손해배상을 청구하는 소송을 제기하였다. 그러나 甲의 특허발명 X는 출원시 선행기술로\n부터 통상의 기술자가 쉽게 생각해 낼 수 있는 발명이었다. 다음 설명 중 옳은 것을 모두 고른 것은? (다툼이 있\n으면 판례에 따름)","answer":"① ㄱ, ㄴ, ㄷ\nㄱ. 甲의 침해금지 및 손해배상의 청구가 권리남용에 해당한다고 乙이 항변하는 경우, 법원은 권리남용항변의\n당부를 살피기 위한 전제로서 특허발명의 진보성에 대하여 심리·판단할 수 있다.\nㄴ. 甲의 청구는 권리남용에 해당하므로 甲의 乙에 대한 침해금지 및 손해배상청구는 인용되지 않는다.\nㄷ. 乙이 실시하는 발명이 통상의 기술자가 선행기술로부터 쉽게 실시할 수 있는 것이므로 乙의 실시가 특허발\n명의 권리범위에 속하지 않는다는 乙의 항변은 타당하다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 진보성 부정으로 무효가 명백 → 특별한 사정 없으면 침해금지·손해배상 청구는 권리남용.\n자유실시기술 → 특허발명과 대비할 필요 없이 권리범위에 속하지 않음.","summary":"진보성 부정으로 무효가 명백 → 특별한 사정 없으면 침해금지·손해배상 청구는 권리남용.\n자유실시기술 → 특허발명과 대비할 필요 없이 권리범위에 속하지 않음.","wrong":[],"right":["진보성 부정으로 무효가 명백 → 특별한 사정 없으면 침해금지·손해배상 청구는 권리남용."],"reason":[],"memory":[],"flags":[]},{"id":182,"area":"특허·실용신안","year":2016,"round":53,"page":76,"metadata":"2016년 제53회 / PDF p.188 / 교재 p.193 / 정답 ①","originalPdfPage":188,"bookPage":193,"answerKey":"①","question":"물건발명 X에 관한 특허권자 A사는 B사가 Y물건을 생산·판매하자 B사를 상대로 특허권 침해금지청구소송을 제\n기하였다. 이 경우 B사의 주장으로 적절하지 못한 것은?","answer":"① B사는 A사보다 특허출원일이 늦기는 하지만 자신도 특허권이 있다고 주장한다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 후출원 특허권 보유만으로 비침해가 되지 않는다. 선행 특허 이용에는 권리자의 허락이 필요할 수 있다.","summary":"후출원 특허권 보유만으로 비침해가 되지 않는다. 선행 특허 이용에는 권리자의 허락이 필요할 수 있다.","wrong":[],"right":["후출원 특허권 보유만으로 비침해가 되지 않는다. 선행 특허 이용에는 권리자의 허락이 필요할 수 있다."],"reason":[],"memory":[],"flags":[]},{"id":183,"area":"특허·실용신안","year":2008,"round":45,"page":76,"metadata":"2008년 제45회 / PDF p.189 / 교재 p.194 / 정답 ④","originalPdfPage":189,"bookPage":194,"answerKey":"④","question":"특허권의 효력에 관한 판례의 입장으로 옳지 않은 것은?","answer":"④ 출원이 경합된 상태에서 등록된 특허권이나 실용신안권 중 어느 하나에 대하여 등록 후 권리자가 그 권리를\n포기한 때에는 경합출원으로 인한 하자가 치유된다고 할 것이다.","correction":"틀린 부분: 경합출원으로 인한 하자가 치유된다고\n바른 표현: 나중에 어느 한 등록권리를 포기하더라도 경합출원의 하자는 치유되지 않는다고\n\n이유: 등록 후 권리 포기는 원칙적으로 과거 출원 경합을 없었던 일로 만들지 않습니다.","summary":"틀린 부분: 경합출원으로 인한 하자가 치유된다고\n바른 표현: 나중에 어느 한 등록권리를 포기하더라도 경합출원의 하자는 치유되지 않는다고\n이유: 등록 후 권리 포기는 원칙적으로 과거 출원 경합을 없었던 일로 만들지 않습니다.\n암기 결론: 경합출원 상태에서 등록 후 한 권리 포기 → 다른 출원의 하자 치유 불가.","wrong":["경합출원으로 인한 하자가 치유된다고"],"right":["나중에 어느 한 등록권리를 포기하더라도 경합출원의 하자는 치유되지 않는다고"],"reason":["등록 후 권리 포기는 원칙적으로 과거 출원 경합을 없었던 일로 만들지 않습니다."],"memory":["경합출원 상태에서 등록 후 한 권리 포기 → 다른 출원의 하자 치유 불가."],"flags":[]},{"id":184,"area":"특허·실용신안","year":2008,"round":45,"page":77,"metadata":"2008년 제45회 / PDF p.190 / 교재 p.195 / 정답 ⑤","originalPdfPage":190,"bookPage":195,"answerKey":"⑤","question":"청구범위의 해석에 관한 판례의 입장이 아닌 것은?","answer":"⑤ 청구범위는 각 항이 상호 독립되어 있는 이상, 그 독립항은 그대로 두고 그 독립항을 기술적으로 한정하고\n구체화하는 종속항만을 추가하는 정정심판청구는 가능하다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 독립항 유지 + 한정·구체화한 새 종속항 추가 → 교재 판례상 허용되지 않는 정정.","summary":"독립항 유지 + 한정·구체화한 새 종속항 추가 → 교재 판례상 허용되지 않는 정정.","wrong":[],"right":["독립항 유지 + 한정·구체화한 새 종속항 추가 → 교재 판례상 허용되지 않는 정정."],"reason":[],"memory":[],"flags":[]},{"id":185,"area":"특허·실용신안","year":2016,"round":53,"page":77,"metadata":"2016년 제53회 / PDF p.191 / 교재 p.196 / 정답 ②","originalPdfPage":191,"bookPage":196,"answerKey":"②","question":"청구범위 해석의 원칙에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"② 특허요건 판단의 대상이 되는 출원발명의 확정은 특별한 사정이 없는 한 청구범위에 기재된 사항에 의하여\n야 하지만, 청구범위가 통상적인 구조, 방법, 물질 등이 아니라 기능, 효과, 성질 등의 이른바 기능적 표현으로\n기재된 경우에는 발명의 설명이나 도면 등 다른 기재에 의하여 청구범위를 제한하여 해석할 수 있다.","correction":"틀린 부분: 청구범위가 통상적인 구조, 방법, 물질 등이 아니라 기능, 효과, 성질 등의 이른바 기능적 표현으로 기재된 경우에는 발명의\n설명이나 도면 등 다른 기재에 의하여 청구범위를 제한하여 해석할 수 있다\n바른 표현: 기능적 표현이라는 이유만으로 발명의 설명·도면을 이용해 청구범위를 제한하는 것은 허용되지 않는다\n이유: 교재는 기능적 표현도 청구범위 중심으로 해석한다고 설명합니다. 특정 용어에 특별한 정의가 있을 때 의미를 파악하는 경우와\n구별합니다.","summary":"틀린 부분: 청구범위가 통상적인 구조, 방법, 물질 등이 아니라 기능, 효과, 성질 등의 이른바 기능적 표현으로 기재된 경우에는 발명의\n설명이나 도면 등 다른 기재에 의하여 청구범위를 제한하여 해석할 수 있다\n바른 표현: 기능적 표현이라는 이유만으로 발명의 설명·도면을 이용해 청구범위를 제한하는 것은 허용되지 않는다\n이유: 교재는 기능적 표현도 청구범위 중심으로 해석한다고 설명합니다. 특정 용어에 특별한 정의가 있을 때 의미를 파악하는 경우와\n구별합니다.\n암기 결론: 기능적 표현도 청구범위 문구를 기준으로 해석한다. 기능적이라는 이유만으로 다른 기재를 끌어와 범위를 제한\n하지 않는다.\n문구의 특별한 의미가 발명의 설명·도면에 정의된 경우에는 그 뜻을 파악하기 위해 참작한다.\n[판례 대조]\n대법원 2009. 7. 23. 선고 2007후4977 판결에서 기능적 표현에도 청구범위 중심의 해석 원칙이 적용되고, 특별\n\n한 의미가 정의·설명된 경우 그 기재를 참작한다고 확인했습니다.","wrong":["청구범위가 통상적인 구조, 방법, 물질 등이 아니라 기능, 효과, 성질 등의 이른바 기능적 표현으로 기재된 경우에는 발명의"],"right":["기능적 표현이라는 이유만으로 발명의 설명·도면을 이용해 청구범위를 제한하는 것은 허용되지 않는다"],"reason":["교재는 기능적 표현도 청구범위 중심으로 해석한다고 설명합니다. 특정 용어에 특별한 정의가 있을 때 의미를 파악하는 경우와"],"memory":["기능적 표현도 청구범위 문구를 기준으로 해석한다. 기능적이라는 이유만으로 다른 기재를 끌어와 범위를 제한"],"flags":[]},{"id":186,"area":"특허·실용신안","year":2008,"round":45,"page":78,"metadata":"2008년 제45회 / PDF p.192 / 교재 p.197 / 정답 ①","originalPdfPage":192,"bookPage":197,"answerKey":"①","question":"甲은 “a+b+c”로 구성된 에어컨을 발명하여 특허등록을 하였다. 이후 乙은 甲의 발명 중 실외기 c를 c′로 주지관\n용 기술의 범위 내에서 개조하고 새로운 기능을 가진 구성요소 d를 추가하여 “a+b+c′+d”로 구성된 발명을 하\n여 특허등록을 하였다. 다음 보기 중 옳은 것으로만 묶인 것은? (단, 甲과 乙의 발명은 각각 특허요건을 충족하\n며, c와 c′는 동일한 효과를 발생시킨다)","answer":"① ㄱ, ㄴ, ㄹ\nㄱ. 乙의 발명은 甲의 발명을 개조하였다 하더라도 균등범위에 속하는 발명을 이용하였으므로 양 발명은 이용\n관계가 성립한다고 볼 수 있다.\nㄴ. 甲이 정당한 이유 없이 실시의 허락을 하지 않는 경우 乙은 통상실시권허여의 심판을 청구하여 심결의 주문\n에서 정하여지는 범위 내에서 업으로서 자신의 특허발명을 실시할 수 있다.\nㄹ. 乙은 甲으로부터 실시허락을 받거나 특허권을 양수하여 발명을 실시할 수 있다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 후발명 특허 등록 ≠ 선특허를 자유롭게 실시할 권한.\n선특허를 이용한다면 허락·허여심판·양수 등 정당한 권원을 확인한다.\n[교재 인용 확인]\n교재는 이용관계 설명 뒤에 ‘2000후235’를 인용하지만, 국가법령정보센터에서 확인되는 해당 판결의 판시사항\n은 이 문장의 이용관계 설명과 일치하지 않습니다. 교재 표기는 그대로 두고 판례번호는 확인 필요로 표시합니\n다.","summary":"후발명 특허 등록 ≠ 선특허를 자유롭게 실시할 권한.\n선특허를 이용한다면 허락·허여심판·양수 등 정당한 권원을 확인한다.\n[교재 인용 확인]\n교재는 이용관계 설명 뒤에 ‘2000후235’를 인용하지만, 국가법령정보센터에서 확인되는 해당 판결의 판시사항\n은 이 문장의 이용관계 설명과 일치하지 않습니다. 교재 표기는 그대로 두고 판례번호는 확인 필요로 표시합니\n다.","wrong":[],"right":["후발명 특허 등록 ≠ 선특허를 자유롭게 실시할 권한."],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":187,"area":"특허·실용신안","year":2017,"round":54,"page":78,"metadata":"2017년 제54회 / PDF p.193 / 교재 p.198 / 정답 ②","originalPdfPage":193,"bookPage":198,"answerKey":"②","question":"특허권에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"② 동일한 발명 A에 대하여 甲과 乙이 각각 특허를 받았고 甲이 선출원하여 선등록된 상태라면, 乙이 A 발명을\n실시하기 위해서는 특허법 제98조(타인의 특허발명 등과의 관계)에 따라 甲의 허락을 받아야 한다.","correction":"틀린 부분: 특허법 제98조(타인의 특허발명 등과의 관계)에 따라\n바른 표현: 동일 발명의 선·후 권리 저촉은 제98조 이용관계로 곧바로 설명할 수 없다\n이유: 교재는 동일 발명에 관한 특허와 특허의 저촉을 제98조의 이용관계로 취급하지 않는다고 명시합니다.","summary":"틀린 부분: 특허법 제98조(타인의 특허발명 등과의 관계)에 따라\n바른 표현: 동일 발명의 선·후 권리 저촉은 제98조 이용관계로 곧바로 설명할 수 없다\n이유: 교재는 동일 발명에 관한 특허와 특허의 저촉을 제98조의 이용관계로 취급하지 않는다고 명시합니다.\n암기 결론: 동일 발명의 선·후 권리 저촉 문제를 제98조의 이용관계로 곧바로 설명하지 않는다.\n결론이 비슷해 보여도 적용 근거 조문을 확인한다.\n[판례 대조]\n대법원 2021. 3. 18. 선고 2018다253444 전원합의체 판결의 선출원·선발생 권리 우선 법리를 대조했습니다.","wrong":["특허법 제98조(타인의 특허발명 등과의 관계)에 따라"],"right":["동일 발명의 선·후 권리 저촉은 제98조 이용관계로 곧바로 설명할 수 없다"],"reason":["교재는 동일 발명에 관한 특허와 특허의 저촉을 제98조의 이용관계로 취급하지 않는다고 명시합니다."],"memory":["동일 발명의 선·후 권리 저촉 문제를 제98조의 이용관계로 곧바로 설명하지 않는다."],"flags":[]},{"id":188,"area":"특허·실용신안","year":2012,"round":49,"page":79,"metadata":"2012년 제49회 / PDF p.194 / 교재 p.199 / 정답 ⑤","originalPdfPage":194,"bookPage":199,"answerKey":"⑤","question":"선출원 특허권자 甲은 접착제에 관한 발명에 대해서 특허권을 획득했다. 후출원 특허권자 乙은 甲의 특허발명\n인 접착제가 자신이 새로 개발한 집광필름의 접합방법에 가장 적합한 것을 실험을 통해 알아내고, 甲의 특허발\n명인 접착제를 그대로 사용하여 기존보다 효과가 뛰어난 집광필름에 관한 발명에 대하여 특허를 획득했다. 다\n음 설명 중 옳은 것은?","answer":"⑤ 乙이 甲을 상대로 통상실시권허여의 심판을 통해 통상실시권을 획득한 경우, 乙의 허락이 없더라도 甲은 통\n상실시권허여의 심판에 의하여 집광필름을 실시할 수 있다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 후발명 실시권을 먼저 허여받아도 선권리자에게 후발명의 실시권이 자동으로 생기지는 않는다.\n선권리자가 후발명을 실시하려면 허락 또는 제138조 제3항 심판이 필요하다.\n[조문 대조]\n특허법 제138조 제3항을 대조했습니다.","summary":"후발명 실시권을 먼저 허여받아도 선권리자에게 후발명의 실시권이 자동으로 생기지는 않는다.\n선권리자가 후발명을 실시하려면 허락 또는 제138조 제3항 심판이 필요하다.\n[조문 대조]\n특허법 제138조 제3항을 대조했습니다.","wrong":[],"right":["후발명 실시권을 먼저 허여받아도 선권리자에게 후발명의 실시권이 자동으로 생기지는 않는다."],"reason":[],"memory":[],"flags":[]},{"id":189,"area":"특허·실용신안","year":2021,"round":58,"page":79,"metadata":"2021년 제58회 / PDF p.195 / 교재 p.200 / 교재 정답란: 정답 없음 (교재 해설에는 실제 기출 정답 ①이라고 별 / 도 기재)","originalPdfPage":195,"bookPage":200,"answerKey":"란: 정답 없음 (교재 해설에는 실제 기출 정답 ①이라고 별","question":"甲은 ‘살균성분이 있는 물질 A’에 대한 선출원 등록 특허권자이고, 乙은 ‘살균성분이 있는 물질 A와 B를 결합하\n여 생성한 제초제 AB’에 대한 후출원 등록 특허권자이다. 甲과 乙의 특허권 행사에 관한 설명으로 옳지 않은 것\n은? (다툼이 있으면 판례에 따름)","answer":"교재의 정답란은 ‘정답 없음’으로 인쇄되어 있습니다. 교재 해설이 ‘실제 기출에서는 ①을 답으로 하였다’고 밝\n히므로, 비교를 위해 ①만 기록합니다.\n① 甲은 자기의 특허발명인 물질 A가 乙의 제초제에 그대로 실시되고 있다는 이유로 乙의 특허발명을 확인대\n상발명으로 하여 자기의 특허발명의 권리범위에 속한다는 확인을 구하는 적극적 권리범위확인심판을 청구할\n수 있다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 교재 정답: 없음 / 교재가 기록한 실제 기출 정답: ①.\n이용관계와 저촉관계에 따른 심판 가능 여부를 구별한다.\n[문항 주의]\n\n교재의 정답란과 ‘실제 기출’에 관한 설명이 서로 다릅니다. 원문 표시를 그대로 보존했습니다.","summary":"교재 정답: 없음 / 교재가 기록한 실제 기출 정답: ①.\n이용관계와 저촉관계에 따른 심판 가능 여부를 구별한다.\n[문항 주의]\n교재의 정답란과 ‘실제 기출’에 관한 설명이 서로 다릅니다. 원문 표시를 그대로 보존했습니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":190,"area":"특허·실용신안","year":2021,"round":58,"page":80,"metadata":"2021년 제58회 / PDF p.196 / 교재 p.201 / 정답 ③, ⑤","originalPdfPage":196,"bookPage":201,"answerKey":"③, ⑤","question":"甲이 다음과 같은 청구범위로 특허권을 받은 경우, 그 특허권의 효력범위와 침해판단에 관한 설명으로 옳지 않\n은 것은? (다툼이 있으면 판례에 따름)\n[청구범위]\n제1항 A의 스마트폰에서 B와 C로 구성되는 스마트폰의 음성인식장치\n제2항 제1항에 있어서, 상기 C는 음성인식시스템(c)으로 구성되는 스마트폰의 음성인식장치\n제3항 C와 결합하여 D 단계, E 단계, F 단계로 음성을 컴퓨터에 의하여 인식하는 프로그램(P)에 의하여 구현되\n는 스마트폰의 음성인식방법","answer":"③ 乙이 甲의 허락없이 제2항의 특허발명의 실시에만 사용하는 음성인식시스템(c)을 생산·판매하는 경우에는\n특허법 제127조(침해로 보는 행위) 제1호의 규정에 의한 침해이다.\n⑤ 제3자가 甲의 특허권을 인지하지 못하고 개발한 프로그램(P′)이 제3항 방법발명의 실시에만 사용되는 경우,\n그 프로그램(P′)의 양도의 청약은 특허법 제127조(침해로 보는 행위) 제2호의 규정에 의한 침해이다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 물건발명 간접침해: ‘생산에만 사용하는 물건’이라는 문구를 확인한다.\n이 문항의 ⑤: 교재는 프로그램 자체가 제127조 제2호의 ‘물건’ 요건을 충족하지 않는다고 본다.\n[조문 대조]\n특허법 제127조의 제1호·제2호 문구를 대조했습니다.","summary":"물건발명 간접침해: ‘생산에만 사용하는 물건’이라는 문구를 확인한다.\n이 문항의 ⑤: 교재는 프로그램 자체가 제127조 제2호의 ‘물건’ 요건을 충족하지 않는다고 본다.\n[조문 대조]\n특허법 제127조의 제1호·제2호 문구를 대조했습니다.","wrong":[],"right":["물건발명 간접침해: ‘생산에만 사용하는 물건’이라는 문구를 확인한다."],"reason":[],"memory":[],"flags":[]},{"id":191,"area":"특허·실용신안","year":2018,"round":55,"page":80,"metadata":"2018년 제55회 / PDF p.197 / 교재 p.202 / 정답 ④","originalPdfPage":197,"bookPage":202,"answerKey":"④","question":"간접침해에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","answer":"④ 간접침해에서 말하는 ‘특허 물건의 생산에만 사용하는 물건’에 해당하는 점은 특허권자가 주장·입증하여야\n한다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 간접침해의 성립요건은 원칙적으로 특허권자가 주장·입증한다.\n구체적인 타용도 주장이 나오면 ‘생산에만 사용’ 요건을 다시 따져 본다.","summary":"간접침해의 성립요건은 원칙적으로 특허권자가 주장·입증한다.\n구체적인 타용도 주장이 나오면 ‘생산에만 사용’ 요건을 다시 따져 본다.","wrong":[],"right":["간접침해의 성립요건은 원칙적으로 특허권자가 주장·입증한다."],"reason":[],"memory":[],"flags":[]},{"id":192,"area":"특허·실용신안","year":2020,"round":57,"page":81,"metadata":"2020년 제57회 / PDF p.198 / 교재 p.203 / 정답 ①","originalPdfPage":198,"bookPage":203,"answerKey":"①","question":"특허권의 간접침해를 규정한 특허법 제127조(침해로 보는 행위)에 관한 설명으로 옳지 않은 것은? (다툼이 있\n으면 판례에 따름)","answer":"① 시장에서 다른 용도로 판매되고 있어 오로지 특허발명의 생산에만 사용하는 전용품이 아니더라도, 그것이\n특허발명의 과제해결에 필수불가결한 기능을 하고, 당사자가 그 물건이 특허발명의 실시에 사용된다는 사정을\n알면서 업으로 이를 공급한다면 특허법 제127조에서 정한 간접침해에 해당한다.","correction":"틀린 부분: 오로지 특허발명의 생산에만 사용하는 전용품이 아니더라도\n바른 표현: 제127조가 정한 전용품 요건을 충족하는지를 판단해야 한다\n이유: 교재가 강조한 법문상의 ‘에만’ 요건을, 기능의 필수성이나 공급자의 인식만으로 대체할 수 없습니다.","summary":"틀린 부분: 오로지 특허발명의 생산에만 사용하는 전용품이 아니더라도\n바른 표현: 제127조가 정한 전용품 요건을 충족하는지를 판단해야 한다\n이유: 교재가 강조한 법문상의 ‘에만’ 요건을, 기능의 필수성이나 공급자의 인식만으로 대체할 수 없습니다.\n암기 결론: 간접침해 판단에서는 ‘필수적’·‘알고 공급’보다 조문의 ‘에만’ 요건을 먼저 확인한다.\n실제로 쓸 수 있는 다른 용도가 있는 물건을 곧바로 전용품으로 보지 않는다.\n[조문 대조]\n특허법 제127조의 ‘생산에만 사용하는 물건’이라는 문구를 대조했습니다.","wrong":["오로지 특허발명의 생산에만 사용하는 전용품이 아니더라도"],"right":["제127조가 정한 전용품 요건을 충족하는지를 판단해야 한다"],"reason":["교재가 강조한 법문상의 ‘에만’ 요건을, 기능의 필수성이나 공급자의 인식만으로 대체할 수 없습니다."],"memory":["간접침해 판단에서는 ‘필수적’·‘알고 공급’보다 조문의 ‘에만’ 요건을 먼저 확인한다."],"flags":[]},{"id":193,"area":"특허·실용신안","year":2016,"round":53,"page":81,"metadata":"2016년 제53회 / PDF p.199 / 교재 p.204 / 정답 ⑤","originalPdfPage":199,"bookPage":204,"answerKey":"⑤","question":"甲은 물건 X 발명의 특허권자이며, 물건 a는 물건 X의 생산에만 사용되는 물건이다. 乙은 물건 a를 우리나라에\n서 100개 생산한 다음 전량 미국에 수출하였고 미국에 수출된 물건 a는 모두 미국에서 물건 X를 생산하는 데\n사용되었다. 한편, 丙은 일본에서 물건 a를 100개 생산한 다음 전량 우리나라에 수입하였고 우리나라에 수입된\n물건 a는 모두 우리나라에서 물건 X를 생산하는 데 사용되었다. 또한, 丁은 물건 a를 우리나라에서 100개 생산\n한 다음 50개는 일본에 수출하고, 나머지 50개는 우리나라에서 판매하였는데 일본에 수출된 물건 a는 모두 일\n본에서 물건 X를 생산하는 데 사용되었고, 우리나라에서 판매된 물건 a도 모두 우리나라에서 물건 X를 생산하\n는 데 사용되었다. 乙, 丙, 丁의 행위는 모두 특허권 존속기간 중 권한 없이 업으로서 행해진 것이다. 다음 중 특\n허법 제127조에 따른 ‘침해로 보는 행위’에 해당하는 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)","answer":"⑤ ㄴ, ㄷ, ㄹ, ㅁ\nㄴ. 乙이 물건 a를 미국에 수출한 행위\nㄷ. 丙이 물건 a를 우리나라에 수입한 행위\nㄹ. 丁이 물건 a를 우리나라에서 판매한 행위\nㅁ. 丁이 물건 a를 일본에 수출한 행위","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 전용품 a의 수입·양도·수출은 제127조의 열거 행위인지 확인한다.\n2025. 7. 22. 시행 개정 반영: 수출도 제127조에 추가.","summary":"전용품 a의 수입·양도·수출은 제127조의 열거 행위인지 확인한다.\n2025. 7. 22. 시행 개정 반영: 수출도 제127조에 추가.","wrong":[],"right":["전용품 a의 수입·양도·수출은 제127조의 열거 행위인지 확인한다."],"reason":[],"memory":[],"flags":[]},{"id":194,"area":"특허·실용신안","year":2011,"round":48,"page":82,"metadata":"2011년 제48회 / PDF p.200 / 교재 p.205 / 정답 ⑤","originalPdfPage":200,"bookPage":205,"answerKey":"⑤","question":"甲은 프린터에 관한 발명을 하여 2020년 2월 15일 특허출원한 후 이를 제작·판매하면서, 사용수명이 다 되면\n교체해주어야 하는 프린터의 핵심부품으로 甲의 프린터에만 사용될 수 있는 카트리지를 별도로 독자 판매하였\n다. 그런데 경쟁업자인 乙이 甲의 허락 없이 甲의 프린터의 소모품인 카트리지를 제작·판매하기 시작하였고, 甲\n은 이에 대한 조치를 취하고자 한다. 甲이 특허등록 전·후 취할 수 있는 조치 및 결과로서 옳지 않은 것은? (다\n툼이 있는 경우에는 판례에 의함)","answer":"⑤ 甲은 특허등록 후 乙을 특허권 침해죄로 고소할 수 있으며, 乙의 행위는 침해죄에 해당한다.","correction":"틀린 부분: 乙의 행위는 침해죄에 해당한다\n바른 표현: 교재 인용 구법 판례의 간접침해 행위는 형사처벌 구성요건으로 확대할 수 없다\n이유: 교재 92도3350 판례는 간접침해 민사책임과 직접침해죄 형사처벌을 구별합니다.","summary":"틀린 부분: 乙의 행위는 침해죄에 해당한다\n바른 표현: 교재 인용 구법 판례의 간접침해 행위는 형사처벌 구성요건으로 확대할 수 없다\n이유: 교재 92도3350 판례는 간접침해 민사책임과 직접침해죄 형사처벌을 구별합니다.\n암기 결론: 간접침해에 따른 민사책임과 형사처벌은 구별한다.\n이 문항의 인용 판례: 구법 간접침해 규정을 형벌 구성요건으로 확장하지 않음.","wrong":["乙의 행위는 침해죄에 해당한다"],"right":["교재 인용 구법 판례의 간접침해 행위는 형사처벌 구성요건으로 확대할 수 없다"],"reason":["교재 92도3350 판례는 간접침해 민사책임과 직접침해죄 형사처벌을 구별합니다."],"memory":["간접침해에 따른 민사책임과 형사처벌은 구별한다."],"flags":[]},{"id":195,"area":"특허·실용신안","year":2013,"round":50,"page":82,"metadata":"2013년 제50회 / PDF p.201 / 교재 p.206 / 정답 ①","originalPdfPage":201,"bookPage":206,"answerKey":"①","question":"특허권 침해에 관한 설명으로 옳은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"① 특허권자의 금지청구권에 관한 원심 변론종결일 이전에 특허권의 존속기간이 경과하여 소멸한 경우에, 특허\n권자는 소멸된 특허발명에 터잡아 특허침해금지 및 특허침해물품의 폐기를 주장할 수 없다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 변론종결 전 특허권 소멸 → 그 권리에 근거한 침해금지·폐기청구 불가.\n[판례 대조]\n대법원 2009. 10. 15. 선고 2007다45876 판결의 존속기간 만료 부분을 대조했습니다. 교재 이미지의 특허번호\n는 명확하게 읽히지 않아 추측하지 않았습니다.","summary":"변론종결 전 특허권 소멸 → 그 권리에 근거한 침해금지·폐기청구 불가.\n[판례 대조]\n대법원 2009. 10. 15. 선고 2007다45876 판결의 존속기간 만료 부분을 대조했습니다. 교재 이미지의 특허번호\n는 명확하게 읽히지 않아 추측하지 않았습니다.","wrong":[],"right":["변론종결 전 특허권 소멸 → 그 권리에 근거한 침해금지·폐기청구 불가."],"reason":[],"memory":[],"flags":[]},{"id":196,"area":"특허·실용신안","year":2009,"round":46,"page":82,"metadata":"2009년 제46회 / PDF p.202 / 교재 p.207 / 정답 ④","originalPdfPage":202,"bookPage":207,"answerKey":"④","question":"다음 설명 중 옳은 것은?","answer":"④ 특허권에 질권이 설정된 경우, 계약으로 특별히 정한 경우를 제외하고는 질권자가 그 특허발명을 업으로서\n실시하는 것은 당해 특허권의 침해가 된다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 특허권에 질권 설정 ≠ 질권자에게 실시권 자동 부여.\n질권자의 업으로서의 실시에는 계약상 별도 허용 여부를 확인한다.","summary":"특허권에 질권 설정 ≠ 질권자에게 실시권 자동 부여.\n질권자의 업으로서의 실시에는 계약상 별도 허용 여부를 확인한다.","wrong":[],"right":["특허권에 질권 설정 ≠ 질권자에게 실시권 자동 부여."],"reason":[],"memory":[],"flags":[]},{"id":197,"area":"특허·실용신안","year":2010,"round":47,"page":83,"metadata":"2010년 제47회 / PDF p.203 / 교재 p.208 / 정답 ⑤","originalPdfPage":203,"bookPage":208,"answerKey":"⑤","question":"특허권침해에 관한 설명으로 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"⑤ 특허권의 존속기간이 만료된 때라도 특허권자는 소멸된 특허권에 터잡아 특허법 제126조(권리침해에 대한\n금지청구권 등)에 따른 특허침해금지 및 특허침해제품의 폐기를 주장할 수 있는 경우가 있다.","correction":"틀린 부분: 특허권의 존속기간이 만료된 때라도\n바른 표현: 존속기간 만료 후에는 소멸한 특허권을 근거로 침해금지를 청구할 수 없다\n이유: 손해배상 등 다른 쟁점과 달리 침해금지는 현재 행사할 특허권이 있는지가 전제입니다.","summary":"틀린 부분: 특허권의 존속기간이 만료된 때라도\n바른 표현: 존속기간 만료 후에는 소멸한 특허권을 근거로 침해금지를 청구할 수 없다\n이유: 손해배상 등 다른 쟁점과 달리 침해금지는 현재 행사할 특허권이 있는지가 전제입니다.\n암기 결론: 특허권 만료 후 → 소멸한 권리에 근거한 침해금지·제품 폐기청구 불가.","wrong":["특허권의 존속기간이 만료된 때라도"],"right":["존속기간 만료 후에는 소멸한 특허권을 근거로 침해금지를 청구할 수 없다"],"reason":["손해배상 등 다른 쟁점과 달리 침해금지는 현재 행사할 특허권이 있는지가 전제입니다."],"memory":["특허권 만료 후 → 소멸한 권리에 근거한 침해금지·제품 폐기청구 불가."],"flags":[]},{"id":198,"area":"특허·실용신안","year":2008,"round":45,"page":83,"metadata":"2008년 제45회 / PDF p.204 / 교재 p.209 / 정답 ③","originalPdfPage":204,"bookPage":209,"answerKey":"③","question":"특허권의 침해 및 그 구제수단에 관한 다음 보기 중 옳은 것으로만 묶인 것은?","answer":"③ ㄴ, ㄹ, ㅁ\nㄴ. 균등론을 사실상 적용하는 것이 우리나라 판례의 태도로 존재한다.\nㄹ. 특허권자는 침해의 금지 또는 예방을 청구함과 동시에 침해행위를 조성한 물건의 폐기를 구할 수 있다.\nㅁ. 특허권 침해에 대해서는 권리자가 침해자의 처벌을 구하는 고소가 없어도 침해자를 처벌할 수 있다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 균등론 인정 / 금지·예방과 폐기청구 가능 / 고소 없이도 공소 가능하나 피해자의 명시적 반대의사 존중.","summary":"균등론 인정 / 금지·예방과 폐기청구 가능 / 고소 없이도 공소 가능하나 피해자의 명시적 반대의사 존중.","wrong":[],"right":["균등론 인정 / 금지·예방과 폐기청구 가능 / 고소 없이도 공소 가능하나 피해자의 명시적 반대의사 존중."],"reason":[],"memory":[],"flags":[]},{"id":199,"area":"특허·실용신안","year":2020,"round":57,"page":84,"metadata":"2020년 제57회 / PDF p.205 / 교재 p.210 / 정답 ④","originalPdfPage":205,"bookPage":210,"answerKey":"④","question":"특허권자의 보호에 관한 설명으로 옳지 않은 것은?","answer":"④ 당사자가 정당한 이유 없이 자기의 구체적 행위의 내용, 방식, 형태를 제시하지 않는 경우에는 법원은 특허\n권자 또는 전용실시권자가 주장하는 침해행위의 구체적 행위의 내용, 방식, 형태를 진실한 것으로 본다.","correction":"틀린 부분: 진실한 것으로 본다\n바른 표현: 진실한 것으로 인정할 수 있다\n이유: 제126조의2 제4항은 반드시 사실로 확정하는 규정이 아니라 법원이 인정할 수 있도록 하는 규정입니다.","summary":"틀린 부분: 진실한 것으로 본다\n바른 표현: 진실한 것으로 인정할 수 있다\n이유: 제126조의2 제4항은 반드시 사실로 확정하는 규정이 아니라 법원이 인정할 수 있도록 하는 규정입니다.\n암기 결론: **제126조의2 제4항: 정당한 이유 없는 미제시\n[조문 대조]\n현행 특허법 제126조의2 제4항의 표현을 대조했습니다.","wrong":["진실한 것으로 본다"],"right":["진실한 것으로 인정할 수 있다"],"reason":["제126조의2 제4항은 반드시 사실로 확정하는 규정이 아니라 법원이 인정할 수 있도록 하는 규정입니다."],"memory":["**제126조의2 제4항: 정당한 이유 없는 미제시"],"flags":[]},{"id":200,"area":"특허·실용신안","year":2019,"round":56,"page":84,"metadata":"2019년 제56회 / PDF p.206 / 교재 p.211 / 정답 ①","originalPdfPage":206,"bookPage":211,"answerKey":"①","question":"특허권 침해소송에서 피고의 의무 및 부담에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"① 특허권자가 주장하는 침해행위의 구체적 내용, 방식, 형태를 부인하는 피고는 자기의 구체적 내용, 방식, 형\n태를 제시할 의무가 없다.","correction":"틀린 부분: 제시할 의무가 없다\n바른 표현: 자기의 구체적 행위 내용·방식·형태를 제시하여야 한다\n이유: 특허권자의 구체적 침해행위 주장을 부인하는 당사자에게 제126조의2가 설명 의무를 부과합니다.","summary":"틀린 부분: 제시할 의무가 없다\n바른 표현: 자기의 구체적 행위 내용·방식·형태를 제시하여야 한다\n이유: 특허권자의 구체적 침해행위 주장을 부인하는 당사자에게 제126조의2가 설명 의무를 부과합니다.\n암기 결론: 침해행위 주장을 부인하는 당사자 → 자신의 구체적 행위를 제시해야 한다.\n정당한 이유 없이 제시하지 않으면 법원이 상대방 주장을 진실한 것으로 인정할 수 있다.","wrong":["제시할 의무가 없다"],"right":["자기의 구체적 행위 내용·방식·형태를 제시하여야 한다"],"reason":["특허권자의 구체적 침해행위 주장을 부인하는 당사자에게 제126조의2가 설명 의무를 부과합니다."],"memory":["침해행위 주장을 부인하는 당사자 → 자신의 구체적 행위를 제시해야 한다."],"flags":[]},{"id":201,"area":"특허·실용신안","year":2012,"round":49,"page":84,"metadata":"2012년 제49회 / PDF p.207 / 교재 p.212 / 정답 ②","originalPdfPage":207,"bookPage":212,"answerKey":"②","question":"특허권 침해의 구제에 관한 설명으로 옳은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"② 특허법 제128조(손해액의 추정 등) 제4항은 특허권자에게 손해가 발생한 경우에 그 손해액을 평가하는 방법\n을 정한 것에 불과하여 불법행위에도 불구하고 특허권자에게 손해가 없는 경우에는 적용되지 않지만, 손해의\n\n발생에 관한 주장·입증의 정도에 있어서는 경험칙상 등으로 인하여 손해 발생의 염려 내지 개연성이 있음을 주\n장·입증하는 것으로 충분하다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 손해액 산정 규정의 전제는 손해 발생. 손해 발생은 염려·개연성의 주장·입증으로 충분하다.","summary":"손해액 산정 규정의 전제는 손해 발생. 손해 발생은 염려·개연성의 주장·입증으로 충분하다.","wrong":[],"right":["손해액 산정 규정의 전제는 손해 발생. 손해 발생은 염려·개연성의 주장·입증으로 충분하다."],"reason":[],"memory":[],"flags":[]},{"id":202,"area":"특허·실용신안","year":2014,"round":51,"page":85,"metadata":"2014년 제51회 / PDF p.208 / 교재 p.213 / 정답 ③","originalPdfPage":208,"bookPage":213,"answerKey":"③","question":"특허권 침해의 손해배상에 관한 설명으로 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"③ 특허법 제128조(손해액의 추정등) 제4항에서의 침해행위에 의한 이익은 침해자가 특허침해행위에 의하여\n얻게 된 것을 말하는데, 그 침해행위에도 불구하고 특허권자에게 손해가 없는 경우에도 침해자가 침해행위로\n인하여 이익을 받았으면 이 규정을 적용할 수 있다.","correction":"틀린 부분: 특허권자에게 손해가 없는 경우에도\n바른 표현: 특허권자의 손해 발생을 전제로 손해액을 추정한다\n이유: 침해자의 이익을 이용하는 추정 규정이라도 특허권자에게 손해가 발생한 사실을 전제한다는 해설입니다.","summary":"틀린 부분: 특허권자에게 손해가 없는 경우에도\n바른 표현: 특허권자의 손해 발생을 전제로 손해액을 추정한다\n이유: 침해자의 이익을 이용하는 추정 규정이라도 특허권자에게 손해가 발생한 사실을 전제한다는 해설입니다.\n암기 결론: 침해자 이익을 이용한 손해액 추정도 특허권자의 손해 발생이 전제다.","wrong":["특허권자에게 손해가 없는 경우에도"],"right":["특허권자의 손해 발생을 전제로 손해액을 추정한다"],"reason":["침해자의 이익을 이용하는 추정 규정이라도 특허권자에게 손해가 발생한 사실을 전제한다는 해설입니다."],"memory":["침해자 이익을 이용한 손해액 추정도 특허권자의 손해 발생이 전제다."],"flags":[]},{"id":203,"area":"특허·실용신안","year":2021,"round":58,"page":85,"metadata":"2021년 제58회 / PDF p.209 / 교재 p.214 / 정답 ④","originalPdfPage":209,"bookPage":214,"answerKey":"④","question":"특허법 제128조(손해배상청구권 등)에 따른 손해액과 배상액의 산정에 관한 설명으로 옳지 않은 것은?","answer":"④ 특허권자가 생산할 수 있었던 물건의 수량에서 실제 판매한 물건의 수량을 뺀 수량에 특허권자가 판매한 단\n위수량당 이익액을 곱한 금액을 손해액의 한도로 하고, 여기서 침해행위 외의 사유로 판매할 수 없었던 수량에\n따른 금액은 빼야 한다.","correction":"틀린 부분: 여기서 침해행위 외의 사유로 판매할 수 없었던 수량에 따른 금액은 빼야 한다\n바른 표현: 침해 외 사유로 판매하지 못하는 수량은 손해액 한도가 아니라 침해자의 양도수량에서 제외한다\n이유: 교재 제128조 제2항 제1호 해설은 공제 위치를 구별합니다.","summary":"틀린 부분: 여기서 침해행위 외의 사유로 판매할 수 없었던 수량에 따른 금액은 빼야 한다\n바른 표현: 침해 외 사유로 판매하지 못하는 수량은 손해액 한도가 아니라 침해자의 양도수량에서 제외한다\n이유: 교재 제128조 제2항 제1호 해설은 공제 위치를 구별합니다.\n암기 결론: 침해 외 사유로 판매 불가능한 수량 → 침해자의 양도수량에서 제외.","wrong":["여기서 침해행위 외의 사유로 판매할 수 없었던 수량에 따른 금액은 빼야 한다"],"right":["침해 외 사유로 판매하지 못하는 수량은 손해액 한도가 아니라 침해자의 양도수량에서 제외한다"],"reason":["교재 제128조 제2항 제1호 해설은 공제 위치를 구별합니다."],"memory":["침해 외 사유로 판매 불가능한 수량 → 침해자의 양도수량에서 제외."],"flags":[]},{"id":204,"area":"특허·실용신안","year":2015,"round":52,"page":86,"metadata":"2015년 제52회 / PDF p.210 / 교재 p.215 / 정답 ②","originalPdfPage":210,"bookPage":215,"answerKey":"②","question":"甲은 자신이 특허 받은 제품을 매년 25,000개 생산할 수 있는 공장시설을 완공하여 2021년 1년간 10,000개를\n제조·판매하였다. 甲의 제품 한 개당 판매가격은 11,000원이며, 한 개당 이익액은 1,000원이다. 乙은 甲의 특허\n제품과 동일한 제품을 2021년 1년간 15,000개를 제조·판매하였다. 乙의 제품 한 개당 판매가격은 10,000원이며,\n한 개당 이익액은 2,000원이다. 한편, 甲의 특허제품의 실시에 대하여 합리적 실시료율은 乙의 판매액의 5%이\n다. 특허법 제128조(손해액의 추정 등)에 따른 甲의 2021년 1년간 손해액에 관한 설명으로 옳지 않은 것은? (단,\n乙의 제조·판매 행위가 甲의 특허권을 침해한 것으로 보며, 특허권자 甲이 침해행위 외의 사유로 판매할 수 없\n었던 사정은 없는 것으로 본다.)","answer":"② 만일 甲 공장의 생산능력이 연간 20,000개라면, 특허법 제128조 제2항에 따를 경우 1,000만원까지를 甲의\n손해액으로 할 수 있다.","correction":"틀린 부분: 1,000만원까지\n바른 표현: 1,250만원까지\n이유: 교재가 계산한 해당 사례의 손해액은 1,250만원입니다. 세부 수량 계산은 원문 자료를 함께 검토해야 합니다.","summary":"틀린 부분: 1,000만원까지\n바른 표현: 1,250만원까지\n이유: 교재가 계산한 해당 사례의 손해액은 1,250만원입니다. 세부 수량 계산은 원문 자료를 함께 검토해야 합니다.\n암기 결론: 생산능력 20,000개 → 추가판매 가능 10,000개 이익 1,000만원 + 초과 5,000개 실시료 250만원 = 1,250만원.","wrong":["1,000만원까지"],"right":["1,250만원까지"],"reason":["교재가 계산한 해당 사례의 손해액은 1,250만원입니다. 세부 수량 계산은 원문 자료를 함께 검토해야 합니다."],"memory":["생산능력 20,000개 → 추가판매 가능 10,000개 이익 1,000만원 + 초과 5,000개 실시료 250만원 = 1,250만원."],"flags":[]},{"id":205,"area":"특허·실용신안","year":2019,"round":56,"page":86,"metadata":"2019년 제56회 / PDF p.211 / 교재 p.216 / 정답 ④","originalPdfPage":211,"bookPage":216,"answerKey":"④","question":"甲은 2016년 1월 1일 설정등록된 특허발명 X의 특허권자이고, 乙은 甲의 허락 없이 2016년 1월 1일부터 甲의\n특허제품과 동일한 제품(이하 ‘침해제품’이라 함)을 생산하여 판매하고 있는 자이다. 甲은 자신의 특허제품을\n2016년에 0개, 2017년에 1,000개, 2018년에 1,500개를 판매하였고, 乙은 침해제품을 2016년에 2,000개, 2017\n년에 2,500개, 2018년에 3,000개를 판매하였다(특허제품 및 침해제품의 단위 수량 당 이익액은 모두 1,000원임)\n. 甲은 2016년 12월말까지 공장을 건설하였기 때문에 그 기간까지는 특허제품을 생산할 수 없었고, 공장 완공\n후 2017년 1월 1일부터 연간 2,000개까지 생산할 수 있었다. 특허발명 X의 실시에 대하여 합리적으로 받을 수\n있는 금액은 개당 200원에 판매수량을 곱한 것이다. 다음 설명 중 옳은 것은?","answer":"④ 특허법 제128조 제4항에 따를 경우 2,500,000원이 甲이 2017년 중 입은 손해액으로 추정될 수 있다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 2017년 침해자 이익액 → 2,500개 × 1,000원 = 2,500,000원(손해액 추정).","summary":"2017년 침해자 이익액 → 2,500개 × 1,000원 = 2,500,000원(손해액 추정).","wrong":[],"right":["2017년 침해자 이익액 → 2,500개 × 1,000원 = 2,500,000원(손해액 추정)."],"reason":[],"memory":[],"flags":[]},{"id":206,"area":"특허·실용신안","year":2010,"round":47,"page":86,"metadata":"2010년 제47회 / PDF p.212 / 교재 p.217 / 정답 ②","originalPdfPage":212,"bookPage":217,"answerKey":"②","question":"특허권 침해에 대한 민사구제 [판독 불명확] 관련된 설명 중 옳지 않은 것으로만 묶인 것은?","answer":"② ㄱ, ㄷ\nㄱ. 특허권자는 특허법 제128조(손해액의 추정 등) 제2항에 특허권자 또는 전용실시권자가 생산할 수 있었던\n물건의 수량에서 실제 판매한 물건의 수량을 뺀 수량을 넘지 않는 수량 범위 내에서는 침해로 인해 감소한 특\n허권자의 특허물품 판매수량에 침해자가 판매한 침해물품의 단위당 이익액을 곱한 금액을 손해로 주장할 수\n있다.\nㄷ. 특허법 제128조(손해배상청구권 등) 제5항에 의하여 실시에 대하여 합리적으로 받을 수 있는 금액이 손해\n액으로 추정되는 경우 침해자에게 고의 또는 중과실이 없는 때에는 손해배상의 액을 정함에 있어 위 추정된 손\n해액에서 이를 참작할 수 있다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: ㄱ: 양도수량 × 특허권자 개당 이익액. ㄷ: 실시료 상당액은 추정이 아니라 간주.","summary":"ㄱ: 양도수량 × 특허권자 개당 이익액. ㄷ: 실시료 상당액은 추정이 아니라 간주.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":207,"area":"특허·실용신안","year":2017,"round":54,"page":87,"metadata":"2017년 제54회 / PDF p.213 / 교재 p.218 / 정답 ④","originalPdfPage":213,"bookPage":218,"answerKey":"④","question":"특허권 침해 구제에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"④ 특허법 제128조(손해배상청구권 등) 제5항에 따라 합리적인 실시료 상당의 손해배상을 명할 때, 특허법은\n법원으로 하여금 특허침해한 자에게 고의 또는 중대한 과실이 없다고 인정할 경우 합리적인 실시료 상당의 손\n해배상액을 산정함에 있어 고의 또는 중과실이 없다는 사실을 고려할 수 있도록 명시하고 있다.","correction":"틀린 부분: 합리적인 실시료 상당의 손해배상액을 산정함에 있어 고의 또는 중과실이 없다는 사실을 고려할 수 있도록\n바른 표현: 합리적인 실시료 상당액 자체가 아니라 dfPage":240,"bookPage":246,"answerKey":"⑤","question":"일사부재리에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"⑤ 확정된 심결이 각하심결인 경우에는 일사부재리의 효력이 없다고 정한 특허법 제163조(일사부재리) 단서 규\n정은 새로 제출된 증거가 선행 확정 심결을 번복할 수 있을 만큼 유력한 증거인지에 관한 심리 판단이 이루어\n진 후 선행 확정 심결과 동일 증거에 의한 심판청구라는 이유로 각하된 심결인 경우에는 적용되지 않는다.","correction":"틀린 부분: 적용되지 않는다\n바른 표현: 각하심결인 경우에는 심리 과정에서 새 증거의 유력성을 판단했더라도 단서가 적용될 수 있다\n이유: 교재 2021후100777 판례는 본안심결과 각하심결을 구별하여 단서 적용 범위를 설명합니다.","summary":"틀린 부분: 적용되지 않는다\n바른 표현: 각하심결인 경우에는 심리 과정에서 새 증거의 유력성을 판단했더라도 단서가 적용될 수 있다\n이유: 교재 2021후100777 판례는 본안심결과 각하심결을 구별하여 단서 적용 범위를 설명합니다.\n암기 결론: 각하심결 전 새 증거의 유력성 심리 → 여전히 각하심결 / 제163조 단서 적용.","wrong":["적용되지 않는다"],"right":["각하심결인 경우에는 심리 과정에서 새 증거의 유력성을 판단했더라도 단서가 적용될 수 있다"],"reason":["교재 2021후100777 판례는 본안심결과 각하심결을 구별하여 단서 적용 범위를 설명합니다."],"memory":["각하심결 전 새 증거의 유력성 심리 → 여전히 각하심결 / 제163조 단서 적용."],"flags":[]},{"id":234,"area":"특허·실용신안","year":2018,"round":55,"page":97,"metadata":"2018년 제55회 / PDF p.241 / 교재 p.247 / 정답 ③","originalPdfPage":241,"bookPage":247,"answerKey":"③","question":"특허취소신청에 관한 설명으로 옳지 않은 것을 모두 고른 것은?","answer":"③ ㄱ, ㄷ, ㄹ\nㄱ. 누구든지 특허권의 설정등록일부터 등록공고일 후 6개월이 되는 날까지 그 특허가 특허법 제29조(특허요건)\n제1항 제2호에 위반되는 경우에는 특허청장에게 특허취소신청을 할 수 있다.\nㄷ. 특허취소신청절차가 진행 중인 특허에 대한 특허권자가 정정청구를 한 경우에 정정을 청구할 수 있도록 지\n정된 기간과 그 기간이 만료일부터 2개월 이내의 기간에는 정정을 취하할 수 있다.\nㄹ. 부적법한 특허취소신청으로서 그 흠을 보정할 수 없을 때에는 특허취소신청의 합의체는 특허권자에게 특허\n취소신청서의 부본을 송달하지 아니하고, 결정으로 그 특허취소신청을 각하할 수 있으며, 각하결정에 대해서는\n결정등본송달일부터 1주일 이내에 불복할 수 있다.","correction":"틀린 부분: 특허청장에게 특허취소신청을 할 수 있다\n바른 표현: 특허심판원장에게 특허취소신청서를 제출한다\n이유: 교재 제132조의2 제1항 해설이 제출 주체를 구별합니다.","summary":"틀린 부분: 특허청장에게 특허취소신청을 할 수 있다\n바른 표현: 특허심판원장에게 특허취소신청서를 제출한다\n이유: 교재 제132조의2 제1항 해설이 제출 주체를 구별합니다.\n암기 결론: 특허취소신청 → 특허심판원장 / 정정청구 취하 추가 기간 → 1개월 / 취소신청 각하결정 → 불복 불가.","wrong":["특허청장에게 특허취소신청을 할 수 있다"],"right":["특허심판원장에게 특허취소신청서를 제출한다"],"reason":["교재 제132조의2 제1항 해설이 제출 주체를 구별합니다."],"memory":["특허취소신청 → 특허심판원장 / 정정청구 취하 추가 기간 → 1개월 / 취소신청 각하결정 → 불복 불가."],"flags":[]},{"id":235,"area":"특허·실용신안","year":2024,"round":61,"page":  경우에는 그 방법에 의하여 생산된 물건에까지 특허권의 효력이 미치므로,\n특정한 생산방법에 의하여 생산한 물건을 실시발명으로 특정하여 특허권의 보호범위에 속하는지 여부의 확인\n을 구할 수 있다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 물건 생산방법 특허 → 그 방법으로 생산한 물건에도 효력 → 권리범위 확인 가능.","summary":"물건 생산방법 특허 → 그 방법으로 생산한 물건에도 효력 → 권리범위 확인 가능.","wrong":[],"right":["물건 생산방법 특허 → 그 방법으로 생산한 물건에도 효력 → 권리범위 확인 가능."],"reason":[],"memory":[],"flags":[]},{"id":241,"area":"특허·실용신안","year":2013,"round":50,"page":99,"metadata":"2013년 제50회 / PDF p.248 / 교재 p.254 / 정답 ③","originalPdfPage":248,"bookPage":254,"answerKey":"③","question":"특허법상 권리범위확인심판에 관한 설명으로 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"③ 특허발명의 청구항이 ‘어떤 구성요소들을 포함하는 것을 특징으로 하는 방법(물건)’이라는 형식으로 기재된\n경우 그 특허발명의 청구항에 명시적으로 기재된 구성요소 전부에 기재되어 있지 아니한 요소를 추가하여 실\n시하는 것은 그 특허발명의 권리범위에 속한다고 볼 수 없다.","correction":"틀린 부분: 권리범위에 속한다고 볼 수 없다\n바른 표현: 기재된 구성요소를 모두 포함한다면 다른 요소를 추가했어도 권리범위에 속할 수 있다\n이유: 교재 2003후2072 판례는 개방형 청구항에서 추가 요소와 필수 구성요소의 충족을 구별합니다.","summary":"틀린 부분: 권리범위에 속한다고 볼 수 없다\n바른 표현: 기재된 구성요소를 모두 포함한다면 다른 요소를 추가했어도 권리범위에 속할 수 있다\n이유: 교재 2003후2072 판례는 개방형 청구항에서 추가 요소와 필수 구성요소의 충족을 구별합니다.\n암기 결론: 개방형 청구항의 모든 구성요소를 실시하면서 다른 요소를 추가해도 권리범위에 속할 수 있음.","wrong":["권리범위에 속한다고 볼 수 없다"],"right":["기재된 구성요소를 모두 포함한다면 다른 요소를 추가했어도 권리범위에 속할 수 있다"],"reason":["교재 2003후2072 판례는 개방형 청구항에서 추가 요소와 필수 구성요소의 충족을 구별합니다."],"memory":["개방형 청구항의 모든 구성요소를 실시하면서 다른 요소를 추가해도 권리범위에 속할 수 있음."],"flags":[]},{"id":242,"area":"특허·실용신안","year":2013,"round":50,"page":100,"metadata":"2013년 제50회 / PDF p.249 / 교재 p.255 / 정답 ⑤","originalPdfPage":249,"bookPage":255,"answerKey":"⑤","question":"다음 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"⑤ 두 개의 실용신안권에 있어서 후등록 실용신안권자는 선등록 실용신안권자를 상대로 양 고안의 내용이 서\n로 다르다고 주장하면서 후등록된 실용신안권이 선등록된 실용신안권의 권리범위에 속하지 아니함을 청구하는\n권리범위확인심판을 청구할 이익이 없다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 후등록 실용신안권자도 선등록권의 권리범위에 속하지 않는다는 확인을 구할 이익이 있을 수 있음.","summary":"후등록 실용신안권자도 선등록권의 권리범위에 속하지 않는다는 확인을 구할 이익이 있을 수 있음.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":243,"area":"특허·실용신안","year":2019,"round":56,"page":100,"metadata":"2019년 제56회 / PDF p.250 / 교재 p.256 / 정답 ⑤","originalPdfPage":250,"bookPage":256,"answerKey":"⑤","question":"특허법상 권리범위 확인심판에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"⑤ 특허권자 甲과 그로부터 특허권 침해의 고소를 당한 乙사이에 乙이 그 특허권을 인정하고 그 권리에 위반되\n는 행위를 하지 않는다는 내용의 약정을 하였다면, 그 약정으로 인하여 乙이 권리범위 확인심판을 청구할 이익\n이 상실되었다고 보아야 한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 비침해 약정만으로 자기 실시행위가 권리범위에 속한다고 인정한 것 또는 심판청구권을 포기한 것으로 보지\n않음.","summary":"비침해 약정만으로 자기 실시행위가 권리범위에 속한다고 인정한 것 또는 심판청구권을 포기한 것으로 보지\n않음.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":244,"area":"특허·실용신안","year":2020,"round":57,"page":100,"metadata":"2020년 제57회 / PDF p.251 / 교재 p.257 / 정답 ②","originalPdfPage":251,"bookPage":257,"answerKey":"②","question":"권리범위 확인심판에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)","answer":"② ㄱ, ㄷ, ㄹ\nㄱ. 일단 적법하게 발생한 특허권이라 할지라도 그 권리가 소멸된 이후에는 그에 대한 권리범위 확인을 구할 이\n익이 없어졌다.\nㄷ. 계속 중인 특허침해소송에서 특허권의 효력이 미치는 범위를 확정할 수 있더라도 이를 이유로 침해소송과\n\n별개로 청구된 권리범위 확인심판의 심판청구의 이익이 부정된다고 볼 수 없다.\nㄹ. 특허발명이 공지의 기술인 경우 등을 제외하고는 특허발명의 진보성이 부정되는 경우에도 권리범위 확인심\n판에서 등록되어 있는 특허권의 효력을 당연히 부인할 수는 없다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 특허권 소멸 → 확인이익 없음 / 침해소송 계속 → 확인이익 유지 / 진보성 부족만으로 확인심판에서 권리효력\n부인 불가.","summary":"특허권 소멸 → 확인이익 없음 / 침해소송 계속 → 확인이익 유지 / 진보성 부족만으로 확인심판에서 권리효력\n부인 불가.","wrong":[],"right":["특허권 소멸 → 확인이익 없음 / 침해소송 계속 → 확인이익 유지 / 진보성 부족만으로 확인심판에서 권리효력"],"reason":[],"memory":[],"flags":[]},{"id":245,"area":"특허·실용신안","year":2016,"round":53,"page":101,"metadata":"2016년 제53회 / PDF p.252 / 교재 p.258 / 정답 ⑤","originalPdfPage":252,"bookPage":258,"answerKey":"⑤","question":"특허법상 권리범위확인심판(특허법 제135조)에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"⑤ 등록실용신안의 권리범위확인심판에서 진보성이 없어 해당 실용신안등록을 무효로 할 수 있는 사유가 있는\n경우, 특허의 경우와 다르게 무효심판절차를 거치지 않고 권리범위를 부정할 수 있다.","correction":"틀린 부분: 특허의 경우와 다르게 무효심판절차를 거치지 않고 권리범위를 부정할 수 있다\n바른 표현: 진보성 부족만을 이유로 권리범위확인심판에서 바로 권리범위를 부정할 수 없다\n이유: 교재 2012후4162 판례는 진보성 결여만으로 권리범위를 부정하 n과 丁 판매제품을 각각 대상발명으로 하는 권리범위확인심판을 각각 청구하였다. 다음 설명 중 옳은 것은? (다\n툼이 있으면 판례에 따르며, 아래 지문과 관련하여 위 소송·심판에서 당사자의 관련 주장이 있는 것으로 본다)","answer":"④ 위 소송에서 甲 특허발명의 신규성이 부정되는 경우 甲 특허발명의 권리범위가 부정되며, 위 심판에서도 그\n러하다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 공지기술과 동일하여 신규성 없음 → 권리범위 부정 가능. 진보성 부족과 구별.","summary":"공지기술과 동일하여 신규성 없음 → 권리범위 부정 가능. 진보성 부족과 구별.","wrong":[],"right":["공지기술과 동일하여 신규성 없음 → 권리범위 부정 가능. 진보성 부족과 구별."],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":251,"area":"특허·실용신안","year":2017,"round":54,"page":103,"metadata":"2017년 제54회 / PDF p.259 / 교재 p.265 / 정답 ②","originalPdfPage":259,"bookPage":265,"answerKey":"②","question":"설정등록된 특허권의 정정심판에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"② 정정심판에서 잘못 기재된 사항을 정정하는 경우, 보정이 인정된 특허발명의 명세서 또는 도면의 범위 내에\n서 할 수 있다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 잘못 기재된 사항의 정정 범위 → 최초 첨부 명세서·도면 기준.","summary":"잘못 기재된 사항의 정정 범위 → 최초 첨부 명세서·도면 기준.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":252,"area":"특허·실용신안","year":null,"round":null,"page":103,"metadata":"[출제연도 판독 불명확] / PDF p.260 / 교재 p.266 / 정답 ②","originalPdfPage":260,"bookPage":266,"answerKey":"②","question":"특허법상 정정심판에 관한 설명으로 옳지 않은 것은?","answer":"② 정정심판은 특허권의 설정등록 후부터 특허권이 소멸할 때까지만 청구할 수 있고, 특허를 무효로 한다는 심\n결이 확정된 후에는 청구할 수 없다.","correction":"틀린 부분: 특허권이 소멸할 때까지만\n바른 표현: 후발적 무효사유로 무효심결이 확정된 경우에도 정정심판 청구가 가능한 예외가 있다\n이유: 교재 제136조 제7항 해설에서는 후발적 무효사유에 따른 예외를 인정하므로 ‘때까지만’이라는 절대 표현이 잘못입니다.","summary":"틀린 부분: 특허권이 소멸할 때까지만\n바른 표현: 후발적 무효사유로 무효심결이 확정된 경우에도 정정심판 청구가 가능한 예외가 있다\n이유: 교재 제136조 제7항 해설에서는 후발적 무효사유에 따른 예외를 인정하므로 ‘때까지만’이라는 절대 표현이 잘못입니다.\n암기 결론: 후발적 무효사유로 무효심결 확정 → 정정심판 청구가 가능한 예외.","wrong":["특허권이 소멸할 때까지만"],"right":["후발적 무효사유로 무효심결이 확정된 경우에도 정정심판 청구가 가능한 예외가 있다"],"reason":["교재 제136조 제7항 해설에서는 후발적 무효사유에 따른 예외를 인정하므로 ‘때까지만’이라는 절대 표현이 잘못입니다."],"memory":["후발적 무효사유로 무효심결 확정 → 정정심판 청구가 가능한 예외."],"flags":["원문 판독·검증 필요"]},{"id":253,"area":"특허·실용신안","year":2014,"round":51,"page":104,"metadata":"2014년 제51회 / PDF n":"특허 정정심판 및 정정의 무효심판에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"② 청구항에 기재된 ‘온도 1,000℃’는 특허법 제136조(정정심판) 제1항 제2호의 ‘잘못 기재된 사항을 정정’하는\n경우에 해당한다는 이유로 명세서에 기재된 ‘온도 20∼50℃’의 범위를 넘더라도 ‘온도 100℃’로 정정할 수 있다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 오기 정정 → 올바른 내용이 명세서 전체에서 객관적으로 명백해야 함.","summary":"오기 정정 → 올바른 내용이 명세서 전체에서 객관적으로 명백해야 함.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":257,"area":"특허·실용신안","year":2011,"round":48,"page":105,"metadata":"2011년 제48회 / PDF p.265 / 교재 p.271 / 정답 ④","originalPdfPage":265,"bookPage":271,"answerKey":"④","question":"특허법상 무효심판 및 정정심판에 관한 설명으로 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"④ 무효심판은 특허권의 설정등록이 있는 날부터 등록공고일 후 3월 이내에 이해관계인 또는 심사관에 한하여\n청구할 수 있다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 무효심판 청구인과 과거 누구나 청구 규정을 구별. 3월 제한을 현재 규정처럼 적용하지 않음.","summary":"무효심판 청구인과 과거 누구나 청구 규정을 구별. 3월 제한을 현재 규정처럼 적용하지 않음.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":258,"area":"특허·실용신안","year":2016,"round":53,"page":105,"metadata":"2016년 제53회 / PDF p.266 / 교재 p.272 / 정답 ⑤","originalPdfPage":266,"bookPage":272,"answerKey":"⑤","question":"특허법상의 정정에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"⑤ [원본 스캔 흐림으로 문장 전체 판독 보류]","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 판독 보류: 학습 내용으로 사용하지 말 것.","summary":"판독 보류: 학습 내용으로 사용하지 말 것.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":259,"area":"특허·실용신안","year":2012,"round":49,"page":106,"metadata":"2012년 제49회 / PDF p.267 / 교재 p.273 / 정답 ①","originalPdfPage":267,"bookPage":273,"answerKey":"①","question":"특허의 정정에 관한 설명으로 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"① 특허무효 심판절차에서 정정청구의 인정 여부는 특별한 사정이 없는 한 청구항 별로 판단하여야 한다.","correction":"틀린 부분: 청구항 별로 판단하여야 한다\n바른 표현: 정정청구의 허용 여부는 특별한 사정이 없으면 일체로 판단한다\n이유: 무효사유를 청구항별로 판단하는 것과 정정청구의 허용 여부 판단을 구별합니다.","summary":"틀린 부분: 청구항 별로 판단하여야 한다\n바른 표현: 정정청구의 허용 여부는 특별한 사정이 없으면 일체로 판단한다\n이유: 무효사유를 청구항별로 판단하는 것과 정정청구의 허용 여부 판단을 구별합니다.\n암기 결론: 교재·인용 판례 기준: 무효 여부는 청구항별, 정정청구 허용 여부는 특별한 사정이 없으면 일체로 판단.","wrong":["청구항 별로 판단하여야 한다"],"right":["정정청구의 허용 여부는 특별한 사정이 없으면 일체로 판단한다"],"reason":["무효사유를 청구항별로 판단하는 것과 정정청구의 허용 여부 판단을 구별합니다."],"memory":["교재·인용 판례 기준: 무효 여부는 청구항별, 정정청구 허용 여부는 특별한 사정이 없으면 일체로 판단."],"flags":[]},{"id":260,"area":"특허·실용신안","year":2015,"round":52,"page":106,"metadata":"2015년 제52회 / PDF p.268 / 교재 p.274 / 정답 ③","originalPdfPage":268,"bookPage":274,"answerKey":"③","question":"특허법 제132조의2(특허무효심판절차에서의 특허의 정정), 특허법 제136조(정정심판) 및 특허법 제137조(정정\n의 무효심판)에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)","answer":"③ ㄱ, ㄹ, ㅁ\nㄱ. 특허발명에 대한 정정무효심판청구가 기각되고 난 후 해당 기각 심결의 취소를 구하는 소송이 계속되던 중\n그 특허발명에 대한 무효심결이 확정되었을 경우, 위 정정무효심판의 기각 심결에 관한 소는 부적법하다.\nㄹ. 정정청구의 적법 여부를 판단하는 특허무효심판이나 그 심결취소소송에서 주문 취지에 있어서 정정의견제\n출통지서에 기재된 사유와 실질적으로 동일한 사유로 정정청구를 받아들이지 않는 심결을 하거나 그 심결에\n대한 취소청구를 기각하는 것은 허용된다.\nㅁ. 특허무효심판절차에서 정정청구가 있는 경우, 정정청구 부분은 따로 확정되지 아니하고 무효심판의 심결이\n확정되는 때에 함께 확정된다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 특허 무효 확정 → 정정 이익 없음 / 같은 통지 사유로 정정 거절 가능 / 정정청구는 무효심판 심결과 함께 확\n정.","summary":"특허 무효 확정 → 정정 이익 없음 / 같은 통지 사유로 정정 거절 가능 / 정정청구는 무효심판 심결과 함께 확\n정.","wrong":[],"right":["특허 무효 확정 → 정정 이익 없음 / 같은 통지 사유로 정정 거절 가능 / 정정청구는 무효심판 심결과 함께 확"],"reason":[],"memory":[],"flags":[]},{"id":261,"area":"특허·실용신안","year":2018,"round":55,"page":106,"metadata":"2018년 제55회 / PDF p.269 / 교재 p.275 / 정답 ⑤","originalPdfPage":269,"bookPage":275,"answerKey":"⑤","question":"특허심판에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"⑤ 확인대상발명이 특허발명인 경우에는 적극적 권리범위확인심판을 허용한다면 특허권의 무효를 인정하는 것\n과 다름이 없게 되므로 확인대상발명이 특허발명의 이용발명인 경우에는 이와 같은 권리범위확인심판은 허용\n\n되지 않는다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 이용관계가 있는 후등록 특허를 대상으로 한 적극적 권리범위확인심판도 확인의 이익이 인정될 수 있음.","summary":"이용관계가 있는 후등록 특허를 대상으로 한 적극적 권리범위확인심판도 확인의 이익이 인정될 수 있음.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":262,"area":"특허·실용신안","year":2013,"round":50,"page":107,"metadata":"2013년 제50회 / PDF p.270 / 교재 p.276 / 정답 ①","originalPdfPage":270,"bookPage":276,"answerKey":"①","question":"특허심판절차에 관한 설명으로 옳지 않은 것은?","answer":"① 무효심판 계속 중 정정청구의 기간 내에 특허권자가 1차 정정청구를 한 후, 청구인이 새롭게 제출한 무효증\n거에 대응하여 특허권자가 2차 정정청구를 한 경우, 심판관은 2차 정정청구가 1차 정정청구와 비교하여 요지변\n경이 된 것인지 여부를 살펴보고 만약 요지변경이 된 것이라면 1차 정정청구를 심리대상으로 삼아야 한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 무효심판 중 후행 정정청구 → 선행 정정청구는 취하한 것으로 봄.","summary":"무효심판 중 후행 정정청구 → 선행 정정청구는 취하한 것으로 봄.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":263,"area":"특허·실용신안","year":2021,"round":58,"page":107,"metadata":"2021년 제58회 / PDF p.271 / 교재 p.277 / 정답 ②","originalPdfPage":271,"bookPage":277,"answerKey":"②","question":"특허 및 실용신안의 심판에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"② 동일한 특허발명에 대하여 특허 무효심판과 정정심판이 특허심판원에 동시에 계속 중에 있는 경우에는 정\n정심판제도의 취지상 정정심판을 특허 무효심판에 우선하여 심리·판단하는 것이 바람직하므로 반드시 정정심\n판을 먼저 심리·판단하여야 한다.","correction":"틀린 부분: 반드시 정정심판을 먼저 심리·판단하여야 한다\n바른 표현: 정정심판 우선 심리가 바람직할 수 있지만 반드시 먼저 심리할 의무는 없다\n이유: 심리 순서의 바람직함과 법적 의무를 혼동한 표현입니다.","summary":"틀린 부분: 반드시 정정심판을 먼저 심리·판단하여야 한다\n바른 표현: 정정심판 우선 심리가 바람직할 수 있지만 반드시 먼저 심리할 의무는 없다\n이유: 심리 순서의 바람직함과 법적 의무를 혼동한 표현입니다.\n암기 결론: 정정심판 우선 심리가 바람직할 수 있음 ≠ 반드시 먼저 심리해야 함.","wrong":["반드시 정정심판을 먼저 심리·판단하여야 한다"],"right":["정정심판 우선 심리가 바람직할 수 있지만 반드시 먼저 심리할 의무는 없다"],"reason":["심리 순서의 바람직함과 법적 의무를 혼동한 표현입니다."],"memory":["정정심판 우선 심리가 바람직할 수 있음 ≠ 반드시 먼저 심리해야 함."],"flags":[]},{"id":264,"area":"특허·실용신안","year":2009,"round":46,"page":107,"metadata":"2009년 제46회 / PDF p.272 / 교재 p.278 / 정답 ③","originalPdfPage":272,"bookPage":278,"answerKey":"③","question":"2016. 5. 7. 甲은 A와 B를 결합시켜 D를 제조하는 방법에 관한 특허출원을 하여 2017. 2. 4. 특허권 설정등록을\n완료하였다. 乙은 A와 B를 물속에서 결합시키면 D의 강도가 보다 견고해진다는 것을 발견하고 2017. 9. 7. A와\nB를 수중에서 결합시켜 D를 제조하는 방법에 관한 특허출원을 하여 2018. 7. 9. 특허권 설정등록을 완료하였으\n며, 丙에게 이 특허권에 대한 통상실시권을 허락하였다. 다음 설명 중 옳지 않은 것은?","answer":"③ 丙이 乙로부터 허락받은 통상실시권에 따라 그 특허발명을 실시하기 위해 甲과 협의하였으나 협의가 성립\n되지 않았다면, 丙은 甲을 상대로 한 통상실시권 허여 심판의 청구인 적격이 없으므로 乙로 하여금 甲을 상대로\n통상실시권 허여의 심판을 청구하도록 요청할 수밖에 없다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 통상실시권자도 요건을 갖추면 필요한 범위에서 통상실시권 허여 심판을 직접 청구 가능.","summary":"통상실시권자도 요건을 갖추면 필요한 범위에서 통상실시권 허여 심판을 직접 청구 가능.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":265,"area":"특허·실용신안","year":2009,"round":46,"page":108,"metadata":"2009년 제46회 / PDF p.273 / 교재 p.279 / 정답 ①","originalPdfPage":273,"bookPage":279,"answerKey":"①","question":"특허심판에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)","answer":"① 심판청구인들이 실제 사용하고 있는 고안이 B임에도 불구하고 이를 은폐하기 위해 A에 대해 소극적 권리범\n위확인심판을 청구한 경우, 피청구인이 실제로는 심판청구인에 의해 사용되고 있는 고안이 B라는 것을 입증하\n였다면 그 심판대상은 B가 되어야 한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 실제 실시 고안이 다르더라도 확인대상발명을 보정하지 않으면 심판대상은 그대로.","summary":"실제 실시 고안이 다르더라도 확인대상발명을 보정하지 않으면 심판대상은 그대로.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":266,"area":"특허·실용신안","year":2009,"round":46,"page":108,"metadata":"2009년 제46회 / PDF p.274 / 교재 p.280 / 정답 ③","originalPdfPage":274,"bookPage":280,"answerKey":"③","question":"특허심판에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)","answer":"③ 거절결정에 대한 심판을 담당하는 심판관이 과거에 그 특허출원에 대해서 진보성이 결여되어 특허 받을 수\n없으니 이에 대해 의견을 제출하라는 내용의 의견제출통지서를 발송한 심사관이었다면, 설사 거절결정 자체는\n다른 심사관에 의해 이루어졌다고 해도 그 심판관은 당해 심판에 대해 심판관 제척사유를 갖는 것으로 보아야\n한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 거절이유 통지만 한 경력 ≠ 거절결정에 직접 관여한 것으로 보지 않음.","summary":"거절이유 통지만 한 경력 ≠ 거절결정에 직접 관여한 것으로 보지 않음.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":267,"area":"특허·실용신안","year":2009,"round":46,"page":108,"metadata":"2009년 제46회 / PDF p.275 / 교재 p.281 / 정답 ①","originalPdfPage":275,"bookPage":281,"answerKey":"①","question":"심판에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)","answer":"① 어느 발명이 특허발명의 권리범위에 속하는지를 판단함에 있어서 특허발명과 대비되는 발명이 공지의 기술\n만으로 이루어지거나 그 기술분야에서 통상의 지식을 가진 자가 용이하게 실시할 수 있는 경우에는 특허발명\n과 대비할 필요없이 특허발명의 보호범위에 속하지 않는다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 확인대상발명이 자유실시기술 → 특허발명과 구체적 대비 없이 권리범위 밖.","summary":"확인대상발명이 자유실시기술 → 특허발명과 구체적 대비 없이 권리범위 밖.","wrong":[],"right":["확 ason":["교재 해설은 각 쟁점의 주장·증명책임 주체를 구별합니다."],"memory":["발명 성립: 출원인 / 신규성 결여: 특허청장. 모두 출원인에게 돌린 ⑤가 틀립니다."],"flags":[]},{"id":290,"area":"특허·실용신안","year":2005,"round":42,"page":116,"metadata":"2005년 제42회 / PDF p.299 / 교재 p.306 / 정답 ③","originalPdfPage":299,"bookPage":306,"answerKey":"③","question":"특허법상 심결취소소송에 관한 설명으로 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)","answer":"③ 주지관용의 기술이 소송상 공지 또는 현저한 사실이라고 볼 수 있을 만큼 일반적으로 알려져 있지 아니한\n경우에도 그 주지관용의 기술은 심결취소소송에 있어서 증명을 필요로 하지 아니하므로, 법원은 자유로운 심증\n에 의하여 증거 등 기록에 나타난 자료를 통하여 주지관용의 기술로서 인정할 수 있다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 일반적으로 알려진 사실이 아니라면 주지관용기술도 증명이 필요합니다.","summary":"일반적으로 알려진 사실이 아니라면 주지관용기술도 증명이 필요합니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":291,"area":"특허·실용신안","year":2023,"round":60,"page":116,"metadata":"2023년 제60회 / PDF p.300 / 교재 p.307 / 정답 ④","originalPdfPage":300,"bookPage":307,"answerKey":"④","question":"특허권자 甲이 경쟁사 乙 및 丙을 상대로 서울중앙지방법원에 특허권 침해금지청구 소송을 제기하자, 乙과 丙\n은 공동으로 甲을 상대로 특허심판원에 甲의 특허 중 청구항 제1항에 대한 무효심판을 청구하였고 특허심판원\n은 乙이 주장한 선행기술 A에 의하여 甲의 특허는 진보성이 부정된다는 이유로 청구를 인용하는 심결을 하였\n다. 다음 중 옳지 않은 것은? (각 설명은 독립적이고, 다툼이 있으면 판례에 따름)","answer":"④ 甲이 제기한 심결취소소송에서 기술심리관은 자신이 甲의 친족이었다고 인정하면 그 소속 법원의 허가를\n받아 회피할 수 있다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 기술심리관 회피 허가: 소속 법원이 아니라 특허법원장.","summary":"기술심리관 회피 허가: 소속 법원이 아니라 특허법원장.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":292,"area":"특허·실용신안","year":2025,"round":62,"page":117,"metadata":"2025년 제62회 / PDF p.301 / 교재 p.308 / 정답 ⑤","originalPdfPage":301,"bookPage":308,"answerKey":"⑤","question":"甲은 乙이 자신의 특허를 침해한다고 판단하고 乙을 상대로 특허법 제135조(권리 범위 확인심판)에 따른 권리\n범위확인심판을 청구하였다. 하지만 이 청구는 특허심판원에서 기각되었고, 甲은 2024. 4. 1.(월요일)에 심결등\n본을 송달받았다. 이에 관한 설명으로 옳지 않은 것은? (각 설명은 독립적이고, 다툼이 있으면 판례에 따름)","answer":"⑤ 甲이 2024. 5. 1.(수요일)에 부가기간지정신청을 하였고 그 신청이 받아들여져 2024. 5. 2.(목요일)에 20일의\n부가기간이 지정된 경우, 甲이 2024. 5. 21.(화요일)에 특허법원에 심결취소소송을 제기한 것은 적법하다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n
