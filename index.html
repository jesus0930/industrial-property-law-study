.beginner-bot{margin-top:12px;font-size:12px;color:#496777;line-height:1.7}

56,"page":3,"metadata":"2019년 제56회 / PDF p.9 / 교재 p.12 / 정답 ③","originalPdfPage":9,"bookPage":12,"answerKey":"③","question":"특허에 관한 절차를 밟기 위해서 사용되는 고유번호(특허고객번호)에 관한 설명으로 옳지 않은 것은?","answer":"③ 특허청장 또는 특허심판원장은 특허에 관한 절차를 밟는 자가 고유번호(특허고객번호)를 신청하지 아니하면\n그에게 기간을 정하여 보정을 명하여야 한다.","correction":"정답보기에서 바로 고칠 부분: 기간을 정하여 보정을 명하여야 한다\n바르게 이해: 직권으로 고유번호를 부여하고 그 사실을 알려야 한다","summary":"[틀린 부분 직접 대비]\n정답보기에서 바로 고칠 부분: 기간을 정하여 보정을 명하여야 한다\n바르게 이해: 직권으로 고유번호를 부여하고 그 사실을 알려야 한다\n[암기 결론]\n고유번호 미신청 → 직권 부여 + 그 사실 통지.","wrong":["기간을 정하여 보정을 명하여야 한다"],"right":["직권으로 고유번호를 부여하고 그 사실을 알려야 한다"],"reason":[],"memory":["고유번호 미신청 → 직권 부여 + 그 사실 통지."],"flags":[]},{"id":8,"area":"특허·실용신안","year":2024,"round":61,"page":3,"metadata":"2024년 제61회 / PDF p.10 / 교재 p.13 / 정답 ⑤","originalPdfPage":10,"bookPage":13,"answerKey":"⑤","question":"특허법상 서류제출 등에 관한 설명으로 옳지 않은 것은?","answer":"⑤ 제28조의5(정보통신망을 이용한 통지 등의 수행) 제1항에 따른 서류의 통지등은 그 통지등을 받을 자가 자\n신이 사용하는 전산정보처리조직을 통하여 그 서류를 수신한 때에 특허청 또는 특허심판원에서 사용하는 발송\n용 전산정보처리조직의 파일에 기록된 내용으로 도달한 것으로 본다.","correction":"정답보기에서 바로 고칠 부분: 수신한 때\n바르게 이해: 확인한 때","summary":"[틀린 부분 직접 대비]\n정답보기에서 바로 고칠 부분: 수신한 때\n바르게 이해: 확인한 때\n[암기 결론]\n제28조의5 전자 통지의 도달 시점 → 상대방이 서류를 확인한 때.","wrong":["수신한 때"],"right":["확인한 때"],"reason":[],"memory":["제28조의5 전자 통지의 도달 시점 → 상대방이 서류를 확인한 때."],"flags":[]},{"id":9,"area":"특허·실용신안","year":2011,"round":48,"page":4,"metadata":"2011년 제48회 / PDF p.11 / 교재 p.14 / 정답 ①","originalPdfPage":11,"bookPage":14,"answerKey":"①","question":"특허법상 기간에 관한 설명으로 옳지 않은 것은?","answer":"① 특허법상 기간에는 법정기간과 지정기간이 있으며, 법정기간에는 분할출원기간, 변경출원기간, 절차의 보정\n기간 등이 있다.","correction":"정답보기에서 바로 고칠 부분: 법정기간에는 분할출원기간, 변경출원기간, 절차의 보정기간\n바르게 이해: 절차의 보정기간은 지정기간(법정기간에 포함되지 않음)","summary":"[틀린 부분 직접 대비]\n정답보기에서 바로 고칠 부분: 법정기간에는 분할출원기간, 변경출원기간, 절차의 보정기간\n바르게 이해: 절차의 보정기간은 지정기간(법정기간에 포함되지 않음)\n[암기 결론]\n절차의 보정기간 → 지정기간.","wrong":["법정기간에는 분할출원기간, 변경출원기간, 절차의 보정기간"],"right":["절차의 보정기간은 지정기간(법정기간에 포함되지 않음)"],"reason":[],"memory":["절차의 보정기간 → 지정기간."],"flags":[]},{"id":10,"area":"특허·실용신안","year":2008,"round":45,"page":4,"metadata":"2008년 제45회 / PDF p.12 / 교재 p.15 / 정답 ④","originalPdfPage":12,"bookPage":15,"answerKey":"④","question":"특허법에 규정된 기간에 관한 다음 보기 중 옳지 않은 것으로만 묶인 것은?","answer":"④ ㄴ, ㄷ\n정답 조합에 포함된 지문:\nㄴ. 특허심판원장은 청구에 따라 특허법 제132조의17(특허거절결정 등에 대한 심판)의 규정에 의한 거절결정불\n복심판의 청구기간을 연장하여야 한다.\nㄷ. 특허청장·특허심판원장·심판장 또는 심사관은 특허법에 따라 특허에 관한 절차를 밟을 기간을 정한 때에는\n청구에 따라 또는 직권으로 그 기간을 단축 또는 연장할 수 있다.","correction":"정답보기에서 바로 고칠 부분: ㄴ. 특허심판원장은\n바르게 이해: ㄴ. 연장 주체는 특허청장","summary":"[틀린 부분 직접 대비]\n정답보기에서 바로 고칠 부분: ㄴ. 특허심판원장은\n바르게 이해: ㄴ. 연장 주체는 특허청장\n[암기 결론]\n거절결정불복심판 청구기간: 특허청장이 연장할 수 있다.\n지정기간: 연장 = 청구·직권 / 단축 = 청구만.","wrong":["ㄴ. 특허심판원장은"],"right":["ㄴ. 연장 주체는 특허청장"],"reason":[],"memory":["거절결정불복심판 청구기간: 특허청장이 연장할 수 있다.\n지정기간: 연장 = 청구·직권 / 단축 = 청구만."],"flags":[]},{"id":11,"area":"특허·실용신안","year":2009,"round":46,"page":4,"metadata":"2009년 제46회 / PDF p.13 / 교재 p.16 / 정답 ⑤","originalPdfPage":13,"bookPage":16,"answerKey":"⑤","question":"특허법상 기간에 관한 설명 중 옳은 것은? (단, 2월은 28일까지 있는 것으로 한다)","answer":"⑤ 甲은 2017. 2. 10. (월) 일본에 a발명을 특허출원하고, 2017. 3. 10.(화) 미국에 a+b발명을 특허출원한 후, 이\n두 출원을 기초로 파리협약에 의거하여 2018. 2. 1.(수) 우리나라에 a와 a+b발명을 우선권주장하여 출원한 경우,\n우리나라에서 甲의 출원에 대하여 심사청구 할 수 있는 최종일은 2021. 2. 1.(목)이다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 우선권주장 출원의 심사청구기간 → 국내 실제 출원일부터 계산.\n교재의 2018. 2. 1. 출원 → 3년 이내, 2021. 2. 1.까지.","summary":"우선권주장 출원의 심사청구기간 → 국내 실제 출원일부터 계산.\n교재의 2018. 2. 1. 출원 → 3년 이내, 2021. 2. 1.까지.","wrong":[],"right":["우선권주장 출원의 심사청구기간 → 국내 실제 출원일부터 계산."],"reason":[],"memory":[],"flags":[]},{"id":12,"area":"특허·실용신안","year":2018,"round":55,"page":5,"metadata":"2018년 제55회 / PDF p.14 / 교재 p.17 / 정답 ②","originalPdfPage":14,"bookPage":17,"answerKey":"②","question":"특허법상 기간 또는 기일에 관한 설명으로 옳지 않은 것은?","answer":"② 특허심판원장은 청구에 따라 또는 직권으로 특허법 제132조의17(특허거절결정 등에 대한 심판)에 따른 심\n판의 청구기간을 30일 이내에서 한 차례만 연장할 수 있다.","correction":"정답보기에서 바로 고칠 부분: 특허심판원장은\n바르게 이해: 특허청장은","summary":"[틀린 부분 직접 대비]\n정답보기에서 바로 고칠 부분: 특허심판원장은\n바르게 이해: 특허청장은\n[암기 결론]\n교재 기준 청구기간 연장 주체 → 특허청장.\n원칙 30일 이내 1회 / 교통 불편 지역은 추가 연장 예외.","wrong":["특허심판원장은"],"right":["특허청장은"],"reason":[],"memory":["교재 기준 청구기간 연장 주체 → 특허청장.\n원칙 30일 이내 1회 / 교통 불편 지역은 추가 연장 예외."],"flags":[]},{"id":13,"area":"특허·실용신안","year":2009,"round":46,"page":5,"metadata":"2009년 제46회 / PDF p.15 / 교재 p.18 / 정답 ④","originalPdfPage":15,"bookPage":18,"answerKey":"④","question":"다음 괄호 속 A, B, C에 들어갈 기간으로 바르게 조합된 것은?\nㄱ. 심판청구서의 각하결정에 대한 소는 그 결정의 등본을 송달받은 날부터 ( A ) 이내에 제기하여야 한다.\nㄴ. 특허청장은 조약에 의한 우선권주장을 수반하는 특허출원은 그 우선권주장의 기초가 된 출원일부터 ( B )이\n경과한 때 출원 공개를 하여야 한다.\nㄷ. 실용신안등록출원이 있는 때에는 누구든지 그 날부터 ( C ) 이내에 특허청장에게 그 실용신안등록출원에 관\n하여 출원심사의 청구를 할 수 있다.","answer":"④ A: 30일 / B: 1년 6월 / C: 3년","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 심판청구서 각하결정에 대한 소 → 등본 송달일부터 30일.\n조약우선권 출원공개 → 기초 출원일부터 1년 6월.\n실용신안 심사청구 → 출원일부터 3년.","summary":"심판청구서 각하결정에 대한 소 → 등본 송달일부터 30일.\n조약우선권 출원공개 → 기초 출원일부터 1년 6월.\n실용신안 심사청구 → 출원일부터 3년.","wrong":[],"right":["심판청구서 각하결정에 대한 소 → 등본 송달일부터 30일."],"reason":[],"memory":[],"flags":[]},{"id":14,"area":"특허·실용신안","year":2023,"round":60,"page":6,"metadata":"2023년 제60회 / PDF p.16 / 교재 p.19 / 정답 ③","originalPdfPage":16,"bookPage":19,"answerKey":"③","question":"기간에 관한 설명으로 옳지 않은 것은?","answer":"③ 기간의 기산일이 공휴일인 경우 그 기간은 공휴일의 다음날부터 시작된다.","correction":"정답보기에서 바로 고칠 부분: 공휴일의 다음날부터 시작된다\n바르게 이해: 공휴일이라는 이유만으로 기산일을 뒤로 미루지 않는다","summary":"[틀린 부분 직접 대비]\n정답보기에서 바로 고칠 부분: 공휴일의 다음날부터 시작된다\n바르게 이해: 공휴일이라는 이유만으로 기산일을 뒤로 미루지 않는다\n[암기 결론]\n기간 첫날: 원칙 불산입 / 오전 0시 시작이면 산입.\n첫날이 공휴일인지 여부는 기산일을 바꾸지 않는다.","wrong":["공휴일의 다음날부터 시작된다"],"right":["공휴일이라는 이유만으로 기산일을 뒤로 미루지 않는다"],"reason":[],"memory":["기간 첫날: 원칙 불산입 / 오전 0시 시작이면 산입.\n첫날이 공휴일인지 여부는 기산일을 바꾸지 않는다."],"flags":[]},{"id":15,"area":"특허·실용신안","year":2025,"round":62,"page":6,"metadata":"2025년 제62회 / PDF p.17 / 교재 p.20 / 정답 ③","originalPdfPage":17,"bookPage":20,"answerKey":"③","question":"특허법상 기간 또는 기일에 관한 설명으로 옳지 않은 것을 모두 고른 것은?","answer":"③ ㄱ, ㄴ, ㄷ\n정답 조합에 포함된 지문:\nㄱ. 특허심판원장은 청구에 따라 또는 직권으로 특허법 제132조의17(특허거절 결정 등에 대한 심판)에 따른 심\n판의 청구기간을 30일 이내에서 한 차례만 연장할 수 있다.\nㄴ. 특허출원에 있어서 거절이유통지에 따른 의견서 제출기간의 마지막 날이 2025. 1. 28.(화요일, 28일부터 30\n일은 법정공휴일)인 경우 2025. 1. 31.(금요일) 제출된 의견서는 적법한 서류로 볼 수 없어 반려되어야 한다.\nㄷ. 특허에 관한 절차에서 기간이 2025. 1. 31.(금요일) 오전 0시부터 시작하는 경우 그 기간은 2025. 2. 3.(월요\n일) 부터 기산한다.","correction":"정답보기에서 바로 고칠 부분: 특허심판원장은\n바르게 이해: 특허청장은","summary":"[틀린 부분 직접 대비]\n정답보기에서 바로 고칠 부분: 특허심판원장은\n\n바르게 이해: 특허청장은\n[암기 결론]\n심판청구기간 연장 주체 → 교재 기준 특허청장.\n의견서 기간 말일이 연속 공휴일 → 이 사례는 1월 31일 24시까지.\n오전 0시 시작 → 그날부터 계산.","wrong":["특허심판원장은"],"right":["특허청장은"],"reason":[],"memory":["심판청구기간 연장 주체 → 교재 기준 특허청장.\n의견서 기간 말일이 연속 공휴일 → 이 사례는 1월 31일 24시까지.\n오전 0시 시작 → 그날부터 계산."],"flags":[]},{"id":16,"area":"특허·실용신안","year":2022,"round":59,"page":7,"metadata":"2022년 제59회 / PDF p.18 / 교재 p.21 / 교재 정답 ①·⑤","originalPdfPage":18,"bookPage":21,"answerKey":"①·⑤","question":"특허 제도에 관한 설명으로 옳지 않은 것은?","answer":"① 물건을 생산하는 방법에 관한 발명이 있는 경우, 그 방법에 의하여 생산한 물건을 수출하는 행위 자체는 특\n허발명의 실시행위에 해당하지 않는다.\n⑤ 특허권 및 특허에 관한 권리의 등록신청서류와 특허협력조약 제2조(vii)에 따른 국제출원에 관한 서류를 우\n편으로 제출하는 경우, 우편물의 통신일부인(通信日附印)에 표시된 날이 분명하다면 표시된 날부터 효력이 발\n생한다.","correction":"정답보기에서 바로 고칠 부분: 실시행위에 해당하지 않는다\n바르게 이해: 2025.7.22. 시행 개정법 기준 수출도 실시(출제 당시와 구별)","summary":"[틀린 부분 직접 대비]\n정답보기에서 바로 고칠 부분: 실시행위에 해당하지 않는다\n바르게 이해: 2025.7.22. 시행 개정법 기준 수출도 실시(출제 당시와 구별)\n[암기 결론]\n2025. 7. 22. 이후: 생산방법으로 만든 물건의 수출도 실시.\n등록신청서류·국제출원 서류의 우편 제출 → 실제 도달일부터 효력.","wrong":["실시행위에 해당하지 않는다"],"right":["2025.7.22. 시행 개정법 기준 수출도 실시(출제 당시와 구별)"],"reason":[],"memory":["2025. 7. 22. 이후: 생산방법으로 만든 물건의 수출도 실시.\n등록신청서류·국제출원 서류의 우편 제출 → 실제 도달일부터 효력."],"flags":[]},{"id":17,"area":"특허·실용신안","year":2025,"round":62,"page":7,"metadata":"2025년 제62회 / PDF p.19 / 교재 p.22 / 정답 ④","originalPdfPage":19,"bookPage":22,"answerKey":"④","question":"특허법과 실용신안법에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"④ 재외자가 국내에 체류하지 않으면서 특허관리인에 의하지 아니하고 서류를 제출한 경우 이를 반려하지 않\n고 수리하여 진행한 특허에 관한 절차는 특허법 제5조(재외자의 특허관리인)제1항에 위반되어 효력이 없다.","correction":"정답보기에서 바로 고칠 부분: 효력이 없다\n바르게 이해: 반려 없이 수리해 진행한 경우 특허청이 그 절차상 하자를 사후 주장할 수 없다","summary":"[틀린 부분 직접 대비]\n정답보기에서 바로 고칠 부분 ry":["인체 채취물 처리 + 의료행위와 분리 가능한 별개 단계 → 산업상 이용가능성 인정."],"flags":[]},{"id":23,"area":"특허·실용신안","year":2021,"round":58,"page":10,"metadata":"2021년 제58회 / PDF p.26 / 교재 p.29 / 정답 ①","originalPdfPage":26,"bookPage":29,"answerKey":"①","question":"특허요건으로서의 산업상 이용가능성이 인정될 수 없는 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)","answer":"① ㄱ, ㄴ\n정답 조합에 포함된 지문:\nㄱ. 인간의 질병을 경감하고 예방하거나 건강을 증진시키기 위한 방법\nㄴ. 인체의 일부를 필수구성요소로 하여 치료효과와 미용효과를 동시에 가지는 수술방법","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 사람에 대한 치료·예방 등 의료행위 → 산업상 이용가능성 부정.\n치료·미용효과가 분리되지 않는 수술방법 → 치료방법으로 취급.","summary":"사람에 대한 치료·예방 등 의료행위 → 산업상 이용가능성 부정.\n치료·미용효과가 분리되지 않는 수술방법 → 치료방법으로 취급.","wrong":[],"right":["사람에 대한 치료·예방 등 의료행위 → 산업상 이용가능성 부정."],"reason":[],"memory":[],"flags":[]},{"id":24,"area":"특허·실용신안","year":2023,"round":60,"page":10,"metadata":"2023년 제60회 / PDF p.27 / 교재 p.30 / 교재 정답 ④","originalPdfPage":27,"bookPage":30,"answerKey":"④","question":"특허요건 중 ‘산업상 이용 가능성’에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"④ 인간의 수술, 치료 또는 진단에 사용하기 위한 의료 기기 그 자체, 의약품 그 자체 등은 산업상 이용 가능성\n이 있는 것으로 취급한다.","correction":"교재 정답·해설 불일치 확인: 의료 기기 그 자체, 의약품 그 자체 등은 산업상 이용 가능성이 있는 것으로 취급한다\n바르게 이해: 이 문구 자체는 옳음. 교재의 ④·X 및 정답 표시가 불일치하므로 오류 검증 필요","summary":"[틀린 부분 직접 대비]\n교재 정답·해설 불일치 확인: 의료 기기 그 자체, 의약품 그 자체 등은 산업상 이용 가능성이 있는 것으로 취급한다\n바르게 이해: 이 문구 자체는 옳음. 교재의 ④·X 및 정답 표시가 불일치하므로 오류 검증 필요\n[암기 결론]\n의료기기·의약품 자체 → 산업상 이용가능성 인정.\n이 페이지의 ④·X 표시는 교재 오류 확인 대상으로 보류.","wrong":["의료 기기 그 자체, 의약품 그 자체 등은 산업상 이용 가능성이 있는 것으로 취급한다"],"right":["이 문구 자체는 옳음. 교재의 ④·X 및 정답 표시가 불일치하므로 오류 검증 필요"],"reason":[],"memory":["의료기기·의약품 자체 → 산업상 이용가능성 인정.\n이 페이지의 ④·X 표시는 교재 오류 확인 대상으로 보류."],"flags":["정답·해설 확인 필요"]},{"id":25,"area":"특허·실용신안","year":2016,"round":53,"page":10,"metadata":"2016년 제53회 / PDF p.28 / 교재 p.31 / 정답 ④","originalPdfPage":28,"bookPage":31,"answerKey":"④","question":"甲은 2015년 7월 1일 동물뿐 아니라 인간의 신경계 질환을 치료하는 조성물과 그 조성물을 이용한 치료방법을\n세계 최초로 개발하였다. 이후 甲은 2015년 10월 5일 자신의 연구 내용이 기재된 논문을 공개된 학회에서 발\n표한 다음, 2015년 10월 12일 청구범위 제1항에는 ‘신경계 질환 치료용 조성물’에 관한 발명에 대해서, 제2항에\n\n는 ‘그 조성물 투여를 통한 신경계 질환 치료방법’에 관한 발명에 대해서 각각 기재하여 특허출원을 하였다(청\n구범위 제1항과 제2항 모두 동물에만 한정한다는 내용이 기재되어 있지는 않다). 한편, 乙은 위와 같은 치료용\n조성물을 스스로 발명하여 2015년 10월 21일 특허출원(청구범위 제1항에 치료용 조성물에 관한 발명에 대하여\n기재하였다)을 하였다. 乙이 발명한 조성물에 관한 발명은 甲이 발명한 조성물에 관한 발명과 기술적 사상이\n같다. 다음 설명 중 옳지 않은 것은?","answer":"④ 甲 출원의 경우 자기공지 예외 규정(특허법 제30조 제1항 제1호)에 해당한다는 취지가 특허출원서에 기재되\n어 있지 아니한 채 출원된 경우에는 자기공지 예외 규정의 적용을 받을 수 없다.","correction":"정답보기에서 바로 고칠 부분: 적용을 받을 수 없다\n바르게 이해: 법정 기간·절차를 지키면 사후 보완 가능","summary":"[틀린 부분 직접 대비]\n정답보기에서 바로 고칠 부분: 적용을 받을 수 없다\n바르게 이해: 법정 기간·절차를 지키면 사후 보완 가능\n[암기 결론]\n자기공지 예외 취지의 출원서 기재 누락 → 제30조 제3항의 기간·절차에 따른 사후 보완 가능.","wrong":["적용을 받을 수 없다"],"right":["법정 기간·절차를 지키면 사후 보완 가능"],"reason":[],"memory":["자기공지 예외 취지의 출원서 기재 누락 → 제30조 제3항의 기간·절차에 따른 사후 보완 가능."],"flags":[]},{"id":26,"area":"특허·실용신안","year":2016,"round":53,"page":11,"metadata":"2016년 제53회 / PDF p.29 / 교재 p.32 / 정답 ⑤","originalPdfPage":29,"bookPage":32,"answerKey":"⑤","question":"특허법상 다음 설명 중 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"⑤ 권리범위확인심판에서 특허발명의 각 구성요소와 그 구성요소간의 유기적 결합관계가 확인대상발명에 그대\n로 포함되어 있지 않으면 그 확인대상발명은 항상 특허발명의 권리범위에 속하지 않는다.","correction":"정답보기에서 바로 고칠 부분: 항상 특허발명의 권리범위에 속하지 않는다\n바르게 이해: 균등요건을 충족하면 구성 일부가 달라도 권리범위에 속할 수 있다","summary":"[틀린 부분 직접 대비]\n정답보기에서 바로 고칠 부분: 항상 특허발명의 권리범위에 속하지 않는다\n바르게 이해: 균등요건을 충족하면 구성 일부가 달라도 권리범위에 속할 수 있다\n[암기 결론]\n일부 구성 변경 ≠ 항상 권리범위 밖.\n동일 해결원리 + 실질적으로 동일한 효과 + 쉬운 변경 → 특별한 사정 없으면 균등으로 포함 가능.","wrong":["항상 특허발명의 권리범위에 속하지 않는다"],"right":["균등요건을 충족하면 구성 일부가 달라도 권리범위에 속할 수 있다"],"reason":[],"memory":["일부 구성 변경 ≠ 항상 권리범위 밖.\n동일 해결원리 + 실질적으로 동일한 효과 + 쉬운 변경 → 특별한 사정 없으면 균등으로 포함 가능."],"flags":[]},{"id":27,"area":"특허·실용신안","year":2011,"round":48,"page":11,"metadata":"2011년 제48회 / PDF p.30 / 교재 p.33 / 정답 ①","originalPdfPage":30,"bookPage":33,"answerKey":"①","question":"특허요건에 관한 설명으로 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"① 선행발명이 기술구성 전체가 명확하게 표현되어 있지 않고 자료의 부족으로 표현이 불충분하거나 일부 내\n용에 흠결이 있는 경우에는, 당해 기술분야에서 통상의 지식을 가진 자가 경험칙에 의하여 쉽게 그 기술내용을\n\n파악할 수 있더라도 진보성 판단을 위한 대비대상이 될 수 없다.","correction":"정답보기에서 바로 고칠 부분: 대비대상이 될 수 없다\n바르게 이해: 통상의 기술자가 기술내용을 쉽게 파악하면 대비대상이 될 수 있다","summary":"[틀린 부분 직접 대비]\n정답보기에서 바로 고칠 부분: 대비대상이 될 수 없다\n바르게 이해: 통상의 기술자가 기술내용을 쉽게 파악하면 대비대상이 될 수 있다\n[암기 결론]\n자료가 불충분해도 통상의 기술자가 기술내용을 쉽게 파악 가능 → 신규성·진보성 비교자료 가능.","wrong":["대비대상이 될 수 없다"],"right":["통상의 기술자가 기술내용을 쉽게 파악하면 대비대상이 될 수 있다"],"reason":[],"memory":["자료가 불충분해도 통상의 기술자가 기술내용을 쉽게 파악 가능 → 신규성·진보성 비교자료 가능."],"flags":[]},{"id":28,"area":"특허·실용신안","year":2019,"round":56,"page":12,"metadata":"2019년 제56회 / PDF p.31 / 교재 p.34 / 정답 ④","originalPdfPage":31,"bookPage":34,"answerKey":"④","question":"발명의 신규성 또는 진보성 판단에 사용되는 선행기술에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따\n름)","answer":"④ 특허법 제29조 제1항 제2호 소정의 간행물에 기재된 발명이라 함은 그 기재된 내용에 따라 해당 기술분야에\n서 통상의 지식을 가진 사람이 쉽게 실시할 수 있을 정도로 기재되어 있는 발명을 말하므로, 발명이 간행물에\n기재되어 있다고 하기 위해서는 적어도 발명이 어떤 구성을 가지고 있는지가 제시되어 있어야 할 것이고, 따라\n서 내부에 특징이 있는 발명에 대해 그 외형 사진만이 게재되어 있는 경우에는 그 발명은 기재된 것이 아니다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 내부 구조가 특징인 발명 + 외형 사진만 공개 → 그 내부 발명의 간행물 기재 인정 안 됨.","summary":"내부 구조가 특징인 발명 + 외형 사진만 공개 → 그 내부 발명의 간행물 기재 인정 안 됨.","wrong":[],"right":["내부 구조가 특징인 발명 + 외형 사진만 공개 → 그 내부 발명의 간행물 기재 인정 안 됨."],"reason":[],"memory":[],"flags":[]},{"id":29,"area":"특허·실용신안","year":2014,"round":51,"page":12,"metadata":"2014년 제51회 / PDF p.32 / 교재 p.35 / 정답 ②","originalPdfPage":32,"bookPage":35,"answerKey":"②","question":"특허법 제29조(특허요건)의 신규성에 관한 설명으로 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"② 심사의 대상이 되는 출원의 명세서 중에 종래 기술로 기재된 발명의 경우, 출원인이 그 명세서 또는 의견서\n등에서 그 종래기술이 출원 전에 공지되었음을 인정하고 있는 경우라도 이를 인용발명으로 하여 청구항에 기\n재된 발명의 신규성을 판단 할 수 없다.","correction":"정답보기에서 바로 고칠 부분: 신규성을 판단 할 수 없다\n바르게 이해: 출원 전 공지를 인정했다면 인용발명으로 신규성을 판단할 수 있다","summary":"[틀린 부분 직접 대비]\n정답보기에서 바로 고칠 부분: 신규성을 판단 할 수 없다\n바르게 이해: 출원 전 공지를 인정했다면 인용발명으로 신규성을 판단할 수 있다\n\n[암기 결론]\n단순 종래기술 기재와 공지 인정은 구별.\n출원 전 공지를 인정한 경우 → 사실상 추정하여 인용발명으로 사용 가능.","wrong":["신규성을 판단 할 수 없다"],"right":["출원 전 공지를 인정했다면 인용발명으로 신규성을 판단할 수 있다"],"reason":[],"memory":["단순 종래기술 기재와 공지 인정은 구별.\n출원 전 공지를 인정한 경우 → 대비 자료가 될 수 있다"],"reason":[],"memory":["다른 분야 기술도 문제 해결에 쉽게 이용 가능한 구성 → 비교자료 가능.\n명시되지 않은 효과도 발명의 설명에서 추론 가능 → 진보성 판단에 참작 가능."],"flags":[]},{"id":38,"area":"특허·실용신안","year":2015,"round":52,"page":16,"metadata":"2015년 제52회 / PDF p.41 / 교재 p.44 / 정답 ⑤","originalPdfPage":41,"bookPage":44,"answerKey":"⑤","question":"진보성에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)","answer":"⑤ ㄷ, ㄹ\n정답 조합에 포함된 지문:\nㄷ. 결합발명의 진보성을 판단함에 있어서 청구항에 기재된 발명의 구성요소 각각이 공지 또는 인용발명으로부\n터 자명하다고 하여 청구항에 기재된 발명의 진보성을 부정해서는 안 된다.\nㄹ. 진보성의 판단대상이 되는 발명의 명세서에 개시되어 있는 기술을 알고 있음을 전제로 하여 사후적으로 통\n상의 기술자가 그 발명을 쉽게 발명 할 수 있는지를 판단해서는 안 된다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 결합발명 → 개별 요소가 아니라 결합 전체의 곤란성·효과 판단.\n완성된 발명을 미리 알고 사후적으로 쉽다고 판단하면 안 됨.","summary":"결합발명 → 개별 요소가 아니라 결합 전체의 곤란성·효과 판단.\n완성된 발명을 미리 알고 사후적으로 쉽다고 판단하면 안 됨.","wrong":[],"right":["결합발명 → 개별 요소가 아니라 결합 전체의 곤란성·효과 판단."],"reason":[],"memory":[],"flags":[]},{"id":39,"area":"특허·실용신안","year":2018,"round":55,"page":16,"metadata":"2018년 제55회 / PDF p.42 / 교재 p.45 / 정답 ③","originalPdfPage":42,"bookPage":45,"answerKey":"③","question":"특허법상 진보성에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"③ 최후거절이유통지에 따른 보정이 신규사항 추가금지, 청구범위 보정범위제한을 위반하여 새로운 거절이유\n가 발생한 것으로 인정되면 심사관은 보정에 대하여 서면으로 이유를 붙여서 결정으로 그 보정을 각하하여야\n하고, 보정각하 결정시에는 기간을 정하여 의견서를 제출할 기회를 부여하여야 한다.","correction":"정답보기에서 바로 고칠 부분: 의견서를 제출할 기회를 부여하여야 한다\n바르게 이해: 해당 보정각하 결정에는 의견제출 기회를 다시 줄 의무 없음","summary":"[틀린 부분 직접 대비]\n정답보기에서 바로 고칠 부분: 의견서를 제출할 기회를 부여하여야 한다\n바르게 이해: 해당 보정각하 결정에는 의견제출 기회를 다시 줄 의무 없음\n[암기 결론]\n여기서의 보정각하 결정 → 의견제출 기회를 다시 줄 의무 없음.","wrong":["의견서를 제출할 기회를 부여하여야 한다"],"right":["해당 보정각하 결정에는 의견제출 기회를 다시 줄 의무 없음"],"reason":[],"memory":["여기서의 보정각하 결정 → 의견제출 기회를 다시 줄 의무 없음."],"flags":[]},{"id":40,"area":"특허·실용신안","year":2023,"round":60,"page":17,"metadata":"2023년 제60회 / PDF p.43 / 교재 p.46 / 정답 ⑤","originalPdfPage":43,"bookPage":46,"answerKey":"⑤","question":"특허법상 신규성 또는 진보성에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"⑤ 선행기술이 미완성 발명이거나 표현이 불충분하거나 또는 일부 내용에 흠결이 있다면, 통상의 기술자가 기\n술상식이나 경험칙에 의하여 쉽게 기술내용을 파악할 수 있다고 하더라도 진보성 판단의 대비 자료로 인용할\n수 없다.","correction":"정답보기에서 바로 고칠 부분: 인용할 수 없다\n바르게 이해: 기술내용 파악이 가능하면 인용할 수 있다","summary":"[틀린 부분 직접 대비]\n정답보기에서 바로 고칠 부분: 인용할 수 없다\n바르게 이해: 기술내용 파악이 가능하면 인용할 수 있다\n[암기 결론]\n미완성·불충분한 자료라도 기술내용 파악 가능 → 신규성·진보성 비교에 사용 가능.","wrong":["인용할 수 없다"],"right":["기술내용 파악이 가능하면 인용할 수 있다"],"reason":[],"memory":["미완성·불충분한 자료라도 기술내용 파악 가능 → 신규성·진보성 비교에 사용 가능."],"flags":[]},{"id":41,"area":"특허·실용신안","year":2021,"round":58,"page":17,"metadata":"2021년 제58회 / PDF p.44 / 교재 p.47 / 정답 ④","originalPdfPage":44,"bookPage":47,"answerKey":"④","question":"청구항에 기재된 발명(AB)의 진보성의 판단에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"④ 발명(AB)이 선행의 인용발명에 기재된 A와 본 특허출원 명세서의 실시예에 기재된 구성요소 B를 전제로 결\n합하여 통상의 기술자가 쉽게 발명할 수 있는 경우에는 진보성이 없다.","correction":"정답보기에서 바로 고칠 부분: 본 특허출원 명세서의 실시예에 기재된 구성요소 B\n바르게 이해: 미공지 실시예 B를 출원 전 공지기술처럼 사용해서는 안 됨","summary":"[틀린 부분 직접 대비]\n정답보기에서 바로 고칠 부분: 본 특허출원 명세서의 실시예에 기재된 구성요소 B\n바르게 이해: 미공지 실시예 B를 출원 전 공지기술처럼 사용해서는 안 됨\n[암기 결론]\n\n이 사례의 미공지 실시예 B → 선행기술처럼 가져와 A와 결합해 진보성을 부정할 수 없음.","wrong":["본 특허출원 명세서의 실시예에 기재된 구성요소 B"],"right":["미공지 실시예 B를 출원 전 공지기술처럼 사용해서는 안 됨"],"reason":[],"memory":["이 사례의 미공지 실시예 B → 선행기술처럼 가져와 A와 결합해 진보성을 부정할 수 없음."],"flags":[]},{"id":42,"area":"특허·실용신안","year":2022,"round":59,"page":18,"metadata":"2022년 제59회 / PDF p.45 / 교재 p.48 / 정답 ⑤","originalPdfPage":45,"bookPage":48,"answerKey":"⑤","question":"발명의 진보성 판단에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)","answer":"⑤ ㄴ, ㄷ, ㄹ\n정답 조합에 포함된 지문:\nㄴ. 특허발명의 진보성을 판단할 때에는 청구항에 기재된 복수의 구성을 분해한 후 각각 분해된 개별 구성요소\n들이 공지된 것인지 여부만을 따져서는 아니 되고, 특유의 과제해결원리에 기초하여 유기적으로 결합한 전체로\n서의 구성의 곤란성을 따져 보아야 한다.\nㄷ. 효과의 현저성은 특허발명의 명세서에 기재되어 통상의 기술자가 인식하거나 추론할 수 있는 효과를 중심\n으로 판단하여야 하고, 만일 그 효과가 의심스러울 때에는 그 기재 내용의 범위를 넘지 않는 한도에서 출원일\n이후에 추가적인 실험 자료를 제출하는 등의 방법으로 그 효과를 구체적으로 주장·입증하는 것이 허용된다.\nㄹ. 의약용도발명에서는 통상의 기술자가 선행발명들로부터 특정 물질의 특정 질병에 대한 치료효과를 쉽게 예\n측할 수 있는 정도에 불과하다면 그 진보성이 부정되고, 이러한 경우 선행발명들에서 임상시험 등에 의한 치료\n효과가 확인될 것까지 요구된다고 볼 수 없다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 기존 최종정리가 비어 있어 원본 대조 필요.","summary":"","wrong":[],"right":["기존 최종정리가 비어 있어 원본 대조 필요."],"reason":[],"memory":[],"flags":["최종 정리 원문 없음"]},{"id":43,"area":"특허·실용신안","year":2020,"round":57,"page":18,"metadata":"2020년 제57회 / PDF p.46 / 교재 p.49 / 정답 ③","originalPdfPage":46,"bookPage":49,"answerKey":"③","question":"발명의 유형에 따른 신규성 및 진보성 판단에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"③ 제법한정 물건발명의 기술적 구성을 파악함에 있어, 청구항에 제조방법과는 다른 기재가 있는 경우에도 제\n조방법 자체만으로 한정하여 출원 전에 공지된 선행기술과 비교하여 진보성이 있는지 여부를 살펴야 한다.","correction":"정답보기에서 바로 고칠 부분: 제조방법 자체만으로 한정\n바르게 이해: 제조방법을 포함한 청구범위 전체로 특정되는 물건의 구조·성질을 파악","summary":"[틀린 부분 직접 대비]\n정답보기에서 바로 고칠 부분: 제조방법 자체만으로 한정\n바르게 이해: 제조방법을 포함한 청구범위 전체로 특정되는 물건의 구조·성질을 파악\n[암기 결론]\n제조방법이 적힌 물건발명 → 청구범위 전체로 특정되는 최종 물건의 구조·성질을 비교.","wrong":["제조방법 자체만으로 한정"],"right":["제조방법을 포함한 청구범위 전체로 특정되는 물건의 구조·성질을 파악"],"reason":[],"memory":["제조방법이 적힌 물건발명 → 청구범위 전체로 특정되는 최종 물건의 구조·성질을 비교."],"flags":[]},{"id":44,"area":"특허·실용신안","year":2014,"round":51,"page":18,"metadata":"2014년 제51회 / PDF p.47 / 교재 p.50 / 정답 ⑤","originalPdfPage":47,"bookPage":50,"answerKey":"⑤","question":"특허법 제29조(특허요건)의 진보성 판단에 관한 설명으로 옳지 않은 것은?","answer":"⑤ 수치한정발명의 청구항에 기재된 수치범위가 비교대상발명에 기재된 수치범위 내에서 동일하지 않은 경우,\n해당 발명은 진보성이 인정된다.","correction":"정답보기에서 바로 고칠 부분: 동일하지 않은 경우, 해당 발명은 진보성이 인정된다\n바르게 이해: 수치가 다르다는 이유만으로 진보성이 인정되지는 않는다","summary":"[틀린 부분 직접 대비]\n정답보기에서 바로 고칠 부분: 동일하지 않은 경우, 해당 발명은 진보성이 인정된다\n바르게 이해: 수치가 다르다는 이유만으로 진보성이 인정되지는 않는다\n[암기 결론]\n수치범위 차이만으로 진보성 인정 안 됨.\n쉽게 선택할 단순 수치한정 + 이질적·현저한 효과 차이 없음 → 진보성 부정.","wrong":["동일하지 않은 경우, 해당 발명은 진보성이 인정된다"],"right":["수치가 다르다는 이유만으로 진보성이 인정되지는 않는다"],"reason":[],"memory":["수치범위 차이만으로 진보성 인정 안 됨.\n쉽게 선택할 단순 수치한정 + 이질적·현저한 효과 차이 없음 → 진보성 부정."],"flags":[]},{"id":45,"area":"특허·실용신안","year":2009,"round":46,"page":19,"metadata":"2009년 제46회 / PDF p.48 / 교재 p.51 / 정답 ①","originalPdfPage":48,"bookPage":51,"answerKey":"①","question":"특허요건에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)","answer":"① 법원은 특허출원 후에 작성된 문건들에 기초하여서는 어떤 발명 또는 기술이 특허출원 전에 공지 또는 공연\n실시된 것인지 여부를 인정할 수 없다.","correction":"정답보기에서 바로 고칠 부분: 인정할 수 없다\n바르게 이해: 출원 후 작성된 문건으로도 출원 전 공지 사실을 인정할 수 있다","summary":"[틀린 부분 직접 대비]\n정답보기에서 바로 고칠 부분: 인정할 수 없다\n바르게 이해: 출원 후 작성된 문건으로도 출원 전 공지 사실을 인정할 수 있다\n[암기 결론]\n출원 후 작성된 문건으로도 출원 전 공지·공연실시 사실을 인정할 수 있다.","wrong":["인정할 수 없다"],"right":["출원 후 작성된 문건으로도 출원 전 공지 사실을 인정할 수 있다"],"reason":[],"memory":["출원 후 작성된 문건으로도 출원 전 공지·공연실시 사실을 인정할 수 있다."],"flags":[]},{"id":46,"area":"특허·실용신안","year":2010,"round":47,"page":19,"metadata":"2010년 제47회 / PDF p.49 / 교재 p.52 / 정답 ⑤","originalPdfPage":49,"bookPage":52,"answerKey":"⑤","question":"신규성 및 진보성의 판단에 관한 설명으로 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"⑤ 발명의 진보성 판단자료가 되는 목적은 발명의 기술적 구성에 의하여 정하여지는 객관적인 목적과 발명자\n가 의도한 주관적인 목적을 모두 포함한다.","correction":"정답보기에서 바로 고칠 부분: 발명자가 의도한 주관적인 목적\n바르게 이해: 기술적 구성에 의한 객관적인 목적을 중심으로 판단(주관적인 목적 제외)","summary":"[틀린 부분 직접 대비]\n정답보기에서 바로 고칠 부분: 발명자가 의도한 주관적인 목적\n바르게 이해: 기술적 구성에 의한 객관적인 목적을 중심으로 판단(주관적인 목적 제외)\n[암기 결론]\n진보성 판단의 목적 → 기술구성에 따른 객관적 목적 / 발명자의 주관적 의도는 제외.","wrong":["발명자가 의도한 주관적인 목적"],"right":["기술적 구성에 의한 객관적인 목적을 중심으로 판단(주관적인 목적 제외)"],"reason":[],"memory":["진보성 판단의 목적 → 기술구성에 따른 객관적 목적 / 발명자의 주관적 의도는 제외."],"flags":[]},{"id":47,"area":"특허·실용신안","year":2024,"round":61,"page":20,"metadata":"2024년 제61회 / PDF p.50 / 교재 p.53 / 정답 ①","originalPdfPage":50,"bookPage":53,"answerKey":"①","question":"특허요건 중 진보성에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"① 그 발명이 속하는 기술분야에서 통상의 지식을 가진 사람이란 특허법에 규정한 상상의 인물을 말한다 할 지\n라도 실제 심사단계에서 심사관, 심판단계에서 심판관 합의체의 입장에서 판단한다. 이때 법원은 문제된 사안\n에서 법관의 판단을 배제하고 심사관·심판관 합의체가 어떻게 진보성을 적용하였는지를 판단한다.","correction":"정답보기에서 바로 고칠 부분: 심사관·심판관 합의체가 어떻게 진보성을 적용하였는지를 판단한다\n바르게 이해: 가상의 통상의 기술자를 기준으로 객관적으로 진보성을 판단","summary":"[틀린 부분 직접 대비]\n정답보기에서 바로 고칠 부분: 심사관·심판관 합의체가 어떻게 진보성을 적용하였는지를 판단한다\n바르게 이해: 가상의 통상의 기술자를 기준으로 객관적으로 진보성을 판단\n[암기 결론]\n통상의 기술자 → 출원시 기술수준에 따른 가상의 객관적 기준 인물.\n특정 심사관·심판관의 실제 능력으로 대체하지 않는다.","wrong":["심사관·심판관 합의체가 어떻게 진보성을 적용하였는지를 판단한다"],"right":["가상의 통상의 기술자를 기준으로 객관적으로 진보성을 판단"],"reason":[],"memory":["통상의 기술자 → 출원시 기술수준에 따른 가상의 객관적 기준 인물.\n특정 심사관·심판관의 실제 능력으로 대체하지 않는다."],"flags":[]},{"id":48,"area":"특허·실용신안","year":2025,"round":62,"page":20,"metadata":"2025년 제62회 / PDF p.51 / 교재 p.54 / 정답 ⑤","originalPdfPage":51,"bookPage":54,"answerKey":"⑤","question":"특허법상 진보성에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"⑤ 특허발명의 청구범위에 기재된 청구항이 복수의 구성요소로 되어 있는 경우에는, 복수의 구성을 분해한 후\n각각 분해된 개별 구성요소들을 기초로 특허발명의 진보성을 판단해야 한다.","correction":"정답보기에서 바로 고칠 부분: 개별 구성요소들을 기초로\n바르게 이해: 유기적으로 결합된 전체 구성의 곤란성과 효과를 기준으로","summary":"[틀린 부분 직접 대비]\n정답보기에서 바로 고칠 부분: 개별 구성요소들을 기초로\n바르게 이해: 유기적으로 결합된 전체 구성의 곤란성과 효과를 기준으로\n[암기 결론]\n결합발명 진보성 → 결합 전체의 곤란성 + 특유한 효과.","wrong":["개별 구성요소들을 기초로"],"right":["유기적으로 결합된 전체 구성의 곤란성과 효과를 기준으로"],"reason":[],"memory":["결합발명 진보성 → 결합 전체의 곤란성 + 특유한 효과."],"flags":[]},{"id":49,"area":"특허·실용신안","year":2013,"round":50,"page":20,"metadata":"2013년 제50회 / PDF p.52 / 교재 p.55 / 정답 ③","originalPdfPage":52,"bookPage":55,"answerKey":"③","question":"선택발명에 관한 설명으로 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"③ 구성의 곤란성이 인정되기 어려워, 효과의 현저성을 고려하여 선택발명으로서 진보성이 있다고 하려면 선택\n발명에 포함되는 여러 개의 하위개념들 중 하나 이상의 하위개념이 선행발명이 갖는 효과와 이질의 효과 또는\n양적으로 현저히 우수한 동질의 효과를 가지고 있어야 한다.","correction":"정답보기에서 바로 고칠 부분: 하나 이상의 하위개념\n바르게 이해: 하위개념들 모두","summary":"[틀린 부분 직접 대비]\n정답보기에서 바로 고칠 부분: 하나 이상의 하위개념\n바르게 이해: 하위개념들 모두\n[암기 결론]\n이 보기처럼 효과로 진보성을 뒷받침하는 선택발명 → 하위개념 모두의 이질적·현저한 효과 필요.","wrong":["하나 이상의 하위개념"],"right":["하위개념들 모두"],"reason":[],"memory":["이 보기처럼 효과로 진보성을 뒷받침하는 선택발명 → 하위개념 모두의 이질적·현저한 효과 필요."],"flags":[]},{"id":50,"area":"특허·실용신안","year":2015,"round":52,"page":21,"metadata":"2015년 제52회 / PDF p.53 / 교재 p.56 / 정답 ⑤","originalPdfPage":53,"bookPage":56,"answerKey":"⑤","question":"수치한정발명에 관련한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)","answer":"⑤ ㄱ, ㄴ, ㄷ, ㄹ\n정답 조합에 포함된 지문:\nㄱ. 공지된 발명과 비교하여 한정된 수치범위 내외에서 현저한 효과의 차이가 생기는 경우에는 그 수치범위가\n공지된 발명에 구체적으로 개시되어 있다고 할 수 없다.\nㄴ. 특허등록된 발명이 그 출원 전에 공지된 발명이 가지는 구성요소의 범위를 수치로서 한정하여 표현한 경우\n에 있어, 그 특허발명의 과제 및 효과가 공지된 발명의 연장선상에 있고 수치한정의 유무에서만 차이가 있는 경\n우에는, 그 한정된 수치범위 내외에서 현저한 효과의 차이가 생기지 않는다면 진보성이 부정된다.\nㄷ. 성질 또는 특성 등에 의해 물(物)을 특정하려고 하는 기재를 포함하는 특허발명과, 이와 다른 성질 또는 특\n성 등에 의해 물(物)을 특정하고 있는 인용발명을 대비할 때, 특허발명의 청구범위에 기재된 성질 또는 특성을\n다른 시험·측정방법에 의한 것으로 환산해 본 결과 인용발명의 대응되는 것과 동일·유사한 경우에는, 달리 특별\n한 사정이 없는 한, 양 발명은 실질적으로 동일·유사한 것으로 보아야 한다.\nㄹ. 수치한정을 제외한 양 발명의 구성이 동일한 경우 그 수치한정이 공지된 발명과는 상이한 과제를 달성하기\n위한 기술수단으로서의 의의를 가지고 그 효과가 이질적인 경우라면, 수치한정의 임계적 의의가 없다고 하여\n특허발명의 진보성이 부정되지 않는다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 기존 최종정리가 비어 있어 원본 대조 필요.","summary":"","wrong":[],"right":["기존 최종정리가 비어 있어 원본 대조 필요."],"reason":[],"memory":[],"flags":["최종 정리 원문 없음"]},{"id":51,"area":"특허·실용신안","year":2012,"round":49,"page":21,"metadata":"2012년 제49회 / PDF p.54 / 교재 p.57 / 정답 ④","originalPdfPage":54,"bookPage":57,"answerKey":"④","question":"다음 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"④ 물건발명의 특허청구범위에 그 물건을 제조하는 방법이 기재되어 있다고 하더라도 그 제조방법에 의해서만\n물건을 특정할 수밖에 없는 등의 특별한 사정이 없는 이상, 당해 특허발명의 진보성 유무를 판단함에 있어서는\n그 제조방법 자체는 고려할 필요 없이 그 특허청구범위의 기재에 의하여 물건으로 특정되는 발명만을 그 출원\n전에 공지된 발명등과 비교하면 된다.","correction":"정답보기에서 바로 고칠 부분: 그 제조방법 자체는 고려할 필요 없이\n바르게 이해: 제조방법의 기재를 포함하여 청구범위 전체로 물건을 파악","summary":"[틀린 부분 직접 대비]\n정답보기에서 바로 고칠 부분: 그 제조방법 자체는 고려할 필요 없이\n바르게 이해: 제조방법의 기재를 포함하여 청구범위 전체로 물건을 파악\n[암기 결론]\n교재 기준: 제조방법도 고려하여 청구범위 전체가 정하는 물건의 구조·성질을 파악.","wrong":["그 제조방법 자체는 고려할 필요 없이"],"right":["제조방법의 기재를 포함하여 청구범위 전체로 물건을 파악"],"reason":[],"memory":["교재 기준: 제조방법도 고려하여 청구범위 전체가 정하는 물건의 구조·성질을 파악."],"flags":[]},{"id":52,"area":"특허·실용신안","year":2020,"round":57,"page":22,"metadata":"2020년 제57회 / PDF p.55 / 교재 p.58 / 정답 ⑤","originalPdfPage":55,"bookPage":58,"answerKey":"⑤","question":"의약용도발명에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","answer":"⑤ 의약용도발명의 특허청구범위에 기재되는 약리기전은 특정 물질이 가지고 있는 의약용도를 특정하는 한도\n내에서만 발명의 구성요소로서 의미를 가질 뿐, 약리기전 그 자체가 특허청구범위를 한정하는 구성요소라고 볼\n수 없다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 약리기전 → 의약용도를 특정하는 범위에서 의미 / 그 자체로 청구범위를 한정하지 않음.","summary":"약리기전 → 의약용도를 특정하는 범위에서 의미 / 그 자체로 청구범위를 한정하지 않음.","wrong":[],"right":["약리기전 → 의약용도를 특정하는 범위에서 의미 / 그 자체로 청구범 약 없으면 다른 공유자의 동의 없이 가능."],"reason":[],"memory":[],"flags":[]},{"id":59,"area":"특허·실용신안","year":2010,"round":47,"page":24,"metadata":"2010년 제47회 / PDF p.62 / 교재 p.65 / 정답 ⑤","originalPdfPage":62,"bookPage":65,"answerKey":"⑤","question":"특허법 상 신규성 및 선출원주의에 관한 설명으로 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"⑤ 특허를 무효로 하는 심결이 확정되기 전에는 선원주의의 위반을 이유로 그 등록된 특허의 권리범위를 부정\n할 수 없다.","correction":"정답보기에서 바로 고칠 부분: 무효로 하는 심결이 확정되기 전에는\n바르게 이해: 무효심결 확정 전에도(선출원주의 위반으로 권리범위 부정 가능)","summary":"[틀린 부분 직접 대비]\n정답보기에서 바로 고칠 부분: 무효로 하는 심결이 확정되기 전에는\n바르게 이해: 무효심결 확정 전에도(선출원주의 위반으로 권리범위 부정 가능)\n[암기 결론]\n선원주의 위반: 무효심결 확정 전에도 권리범위 부정 가능.","wrong":["무효로 하는 심결이 확정되기 전에는"],"right":["무효심결 확정 전에도(선출원주의 위반으로 권리범위 부정 가능)"],"reason":[],"memory":["선원주의 위반: 무효심결 확정 전에도 권리범위 부정 가능."],"flags":[]},{"id":60,"area":"특허·실용신안","year":2010,"round":47,"page":25,"metadata":"2010년 제47회 / PDF p.63 / 교재 p.66 / 정답 ③ (3개: ㄱ·ㄴ·ㄹ)","originalPdfPage":63,"bookPage":66,"answerKey":"③ (3개: ㄱ·ㄴ·ㄹ)","question":"선출원주의와 관련하여 다음 중 옳은 것의 개수는? (다툼이 있는 경우에는 판례에 의함)","answer":"③ 3개\nㄱ. 선출원주의는 중복특허를 배제한다는 취지에서 하나의 발명에 대하여 복수의 출원이 있을 때에는 가장 먼\n저 출원한 자만이 특허를 받을 수 있도록 하는 것이다.\nㄴ. 선출원주의에서 발명의 동일성 판단대상은 특허청구범위에 기재된 발명이므로 발명의 상세한 설명이나 도\n면에만 기재되고 특허청구범위에는 기재되어 있지 않은 발명은 판단대상이 아니다.\nㄹ. 무권리자의 출원은 선출원주의를 적용함에 있어서는 처음부터 없었던 것으로 보나 무권리자의 출원이라도\n공개된 후에는 제3자에 대한 관계에서 확대된 선출원으로서의 지위를 가진다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 일반 선출원: 청구범위 비교.\n무권리자 출원: 일반 선출원 지위는 없지만, 공개 후 확대된 선출원 지위는 가능.","summary":"일반 선출원: 청구범위 비교.\n무권리자 출원: 일반 선출원 지위는 없지만, 공개 후 확대된 선출원 지위는 가능.","wrong":[],"right":["일반 선출원: 청구범위 비교."],"reason":[],"memory":[],"flags":[]},{"id":61,"area":"특허·실용신안","year":2014,"round":51,"page":25,"metadata":"2014년 제51회 / PDF p.64 / 교재 p.67 / 정답 ⑤","originalPdfPage":64,"bookPage":67,"answerKey":"⑤","question":"특허법 제36조(선출원)에 관한 설명으로 옳지 않은 것은?","answer":"⑤ 甲이 2013년 9월 1일에 특허출원한 발명과, 乙이 같은 해 9월 1일에 실용신안등록출원한 고안이 동일한 경\n우에는 甲의 특허출원과 乙의 실용신안등록출원은 별개이므로 甲과 乙은 협의 없이 둘 다 적법한 해당 권리를\n받을 수 있다.","correction":"정답보기에서 바로 고칠 부분: 협의 없이 둘 다\n바르게 이해: 특허·실용신안 같은 날 동일 기술 출원에는 협의 필요","summary":"[틀린 부분 직접 대비]\n정답보기에서 바로 고칠 부분: 협의 없이 둘 다\n바르게 이해: 특허·실용신안 같은 날 동일 기술 출원에는 협의 필요\n\n[암기 결론]\n동일 기술의 특허·실용신안 같은 날 출원 → 협의 필요.","wrong":["협의 없이 둘 다"],"right":["특허·실용신안 같은 날 동일 기술 출원에는 협의 필요"],"reason":[],"memory":["동일 기술의 특허·실용신안 같은 날 출원 → 협의 필요."],"flags":[]},{"id":62,"area":"특허·실용신안","year":2012,"round":49,"page":26,"metadata":"2012년 제49회 / PDF p.65 / 교재 p.68 / 정답 ①","originalPdfPage":65,"bookPage":68,"answerKey":"①","question":"선출원주의에 관한 설명으로 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"① 동일인이 동일한 발명에 대하여 특허와 실용신안을 같은 날 출원하여 모두 등록된 경우, 등록된 특허권이나\n실용신안권 중 어느 하나가 포기되면 경합출원으로 인한 하자는 치유된다.","correction":"정답보기에서 바로 고칠 부분: 하자는 치유된다\n바르게 이해: 등록된 권리 중 하나를 나중에 포기해도 하자는 치유되지 않는다","summary":"[틀린 부분 직접 대비]\n정답보기에서 바로 고칠 부분: 하자는 치유된다\n바르게 이해: 등록된 권리 중 하나를 나중에 포기해도 하자는 치유되지 않는다\n[암기 결론]\n이중등록 후 한 권리 포기 ≠ 경합출원 하자 치유.\n출원의 포기와 등록된 권리의 포기를 구별.","wrong":["하자는 치유된다"],"right":["등록된 권리 중 하나를 나중에 포기해도 하자는 치유되지 않는다"],"reason":[],"memory":["이중등록 후 한 권리 포기 ≠ 경합출원 하자 치유.\n출원의 포기와 등록된 권리의 포기를 구별."],"flags":[]},{"id":63,"area":"특허·실용신안","year":2017,"round":54,"page":26,"metadata":"2017년 제54회 / PDF p.66 / 교재 p.69 / 정답 ⑤","originalPdfPage":66,"bookPage":69,"answerKey":"⑤","question":"특허출원에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"⑤ 甲이 발명 A에 대하여 같은 날 특허출원과 실용신안등록출원을 하여 모두 등록되었더라도 A에 대한 특허등\n록 무효심판이 제기되기 전에 실용신안등록을 포기하였다면, A에 대한 특허등록은 유효하다.","correction":"정답보기에서 바로 고칠 부분: 특허등록은 유효하다\n바르게 이해: 무효심판 전에 실용신안권을 포기해도 경합출원 하자는 치유되지 않는다","summary":"[틀린 부분 직접 대비]\n정답보기에서 바로 고칠 부분: 특허등록은 유효하다\n바르게 이해: 무효심판 전에 실용신안권을 포기해도 경합출원 하자는 치유되지 않는다\n[암기 결론]\n무효심판 전 권리 포기라도, 이중등록 하자는 치유되지 않는다.","wrong":["특허등록은 유효하다"],"right":["무효심판 전에 실용신안권을 포기해도 경합출원 하자는 치유되지 않는다"],"reason":[],"memory":["무효심판 전 권리 포기라도, 이중등록 하자는 치유되지 않는다."],"flags":[]},{"id":64,"area":"특허·실용신안","year":2009,"round":46,"page":26,"metadata":"2009년 제46회 / PDF p.67 / 교재 p.70 / 교재 정답 ④ (ㄴ·ㄷ)","originalPdfPage":67,"bookPage":70,"answerKey":"④ (ㄴ·ㄷ)","question":"다음 중 옳은 것만을 있는 대로 고른 것은?","answer":"④ ㄴ, ㄷ\nㄴ. 특허출원 X(X의 출원일: 2019. 1. 15. X의 발명의 설명 및 청구범위에는 각각 발명 a와 b 모두가 기재됨)는\n출원 A, B를 기초로 하는 파리협약에 의한 우선권주장 2건(A의 출원일: 2018. 11. 6. B의 출원일: 2018. 12. 1. A\n의 발명의 설명 및 청구범위에는 각각 발명 a만이 기재되었고 B의 발명의 설명 및 청구범위에는 각각 발명 a와\nb 모두가 기재됨)을 수반하였고, 특허출원 Y(출원일: 2018. 11. 20. 발명의 설명 및 청구범위 각각에 발명 b만\n기재됨)는 우선권주장을 수반하지 않은 경우, 출원 X는 출원 Y에 대해 특허법 제36조에 규정된 선출원의 지위\n를 가질 수 없다.\nㄷ. 특허출원 또는 실용신안등록출원이 포기되었을 경우에는 특허법 제36조에 규정된 선출원의 지위를 가질\n수 없다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 복수 우선권은 비교하는 발명이 처음 기재된 기초출원의 날짜로 판단.\n이 사례 b: Y(11.20.)가 X의 기준일(12.1.)보다 먼저.\n출원 포기 → 선출원 지위 없음.","summary":"복수 우선권은 비교하는 발명이 처음 기재된 기초출원의 날짜로 판단.\n이 사례 b: Y(11.20.)가 X의 기준일(12.1.)보다 먼저.\n출원 포기 → 선출원 지위 없음.","wrong":[],"right":["복수 우선권은 비교하는 발명이 처음 기재된 기초출원의 날짜로 판단."],"reason":[],"memory":[],"flags":[]},{"id":65,"area":"특허·실용신안","year":2017,"round":54,"page":27,"metadata":"2017년 제54회 / PDF p.68 / 교재 p.71 / 정답 ③","originalPdfPage":68,"bookPage":71,"answerKey":"③","question":"특허법 제29조 제3항(확대된 선출원)과 특허법 제36조(선출원)에 관한 설명으로 옳지 않은 것은? (다툼이 있으\n면 판례에 따름)","answer":"③ '확대된 선출원'에 있어서는 선출원의 발명자와 후출원의 발명자가 동일한 경우 후출원은 선출원에 의해 배\n제되어야 하지만, '선출원'에서는 선출원 발명자가 후출원 발명자와 동일한 경우라도 특허를 받을 수 있다.","correction":"정답보기에서 바로 고칠 부분: 확대된 선출원\n바르게 이해: 동일 발명자 예외가 적용되는 것은 확대된 선출원이고, 일반 선출원에는 그 예외가 없다","summary":"[틀린 부분 직접 대비]\n정답보기에서 바로 고칠 부분: 확대된 선출원\n바르게 이해: 동일 발명자 예외가 적용되는 것은 확대된 선출원이고, 일반 선출원에는 그 예외가 없다\n[암기 결론]\n동일 발명자: 확대된 선출원 적용 제외 / 일반 선출원 적용.","wrong":["확대된 선출원"],"right":["동일 발명자 예외가 적용되는 것은 확대된 선출원이고, 일반 선출원에는 그 예외가 없다"],"reason":[],"memory":["동일 발명자: 확대된 선출원 적용 제외 / 일반 선출원 적용."],"flags":[]},{"id":66,"area":"특허·실용신안","year":2015,"round":52,"page":27,"metadata":"2015년 제52회 / PDF p.69 / 교재 p.72 / 정답 ⑤","originalPdfPage":69,"bookPage":72,"answerKey":"⑤","question":"특허법 제29조(특허요건) 제3항부터 제7항(이른바 '확대된 선출원')과 제36조(선출원)에 관한 설명으로 옳지 않\n은 것은? (특허법 제36조 제4항 또는 제5항에 따라 출원이 처음부터 없었던 것으로 보는 경우는 고려하지 않고,\n선출원은 후출원 후 공개된 것으로 보며, 선출원과 후출원 모두 심사청구된 것으로 본다. 다툼이 있으면 판례\n\n에 따름)","answer":"⑤ 후출원의 청구범위가 선출원의 청구범위와 다르지만 선출원 명세서의 발명의 설명 및 도면에 기재된 사항\n과 완전히 동일한 경우에는 선출원 규정에 따라 후출원은 특허를 받을 수 없다.","correction":"정답보기에서 바로 고칠 부분: 선출원 규정에 따라\n바르게 이해: 일반 선출원이 아니라 확대된 선출원 규정을 검토","summary":"[틀린 부분 직접 대비]\n정답보기에서 바로 고칠 부분: 선출원 규정에 따라\n바르게 이해: 일반 선출원이 아니라 확대된 선출원 규정을 검토\n[암기 결론]\n앞 청구범위와 비교 → 일반 선출원.\n앞 최초 명세서·도면까지 비교 → 확대된 선출원.","wrong":["선출원 규정에 따라"],"right":["일반 선출원이 아니라 확대된 선출원 규정을 검토"],"reason":[],"memory":["앞 청구범위와 비교 → 일반 선출원.\n앞 최초 명세서·도면까지 비교 → 확대된 선출원."],"flags":[]},{"id":67,"area":"특허·실용신안","year":2025,"round":62,"page":28,"metadata":"2025년 제62회 / PDF p.70 / 교재 p.73 / 정답 ②","originalPdfPage":70,"bookPage":73,"answerKey":"②","question":"甲은 벤처기업육성에 관한 특별법 제25조에 따른 벤처기업의 확인을 받은 기업으로서 2023. 6. 1. 명세서에 '발\n명의 설명 A, B, C 및 청구범위 A'를 기재하여 특허출원하였다. 이후 甲은 2024. 2. 1. 발명의 설명에서 B를 삭제\n하고 청구범위를 A에서 C로 변경하는 보정을 하였다. 이후 甲의 특허출원은 2024. 12. 1. 출원공개 되었다. 다음\n중 옳지 않은 것은? (각 설명은 독립적임)","answer":"② 丙이 2023. 6. 1. 발명 B를 특허출원하였다면 이 출원은 특허법 제29조(특허요건)제3항 위반에 해당한다.","correction":"틀린 부분: 제29조(특허요건)제3항 위반에 해당한다\n바른 표현: 같은 날 출원한 경우이므로 확대된 선출원 규정을 적용하지 않는다\n이유: 확대된 선출원은 먼저 출원한 발명이 나중 출원에 미치는 문제입니다. 이 사례의 두 출원일이 같아 제29조 제3항의 선후관계가\n성립하지 않습니다.","summary":"틀린 부분: 제29조(특허요건)제3항 위반에 해당한다\n바른 표현: 같은 날 출원한 경우이므로 확대된 선출원 규정을 적용하지 않는다\n이유: 확대된 선출원은 먼저 출원한 발명이 나중 출원에 미치는 문제입니다. 이 사례의 두 출원일이 같아 제29조 제3항의 선후관계가\n성립하지 않습니다.\n암기 결론: 확대된 선출원: 같은 날 출원에는 적용하지 않는다.","wrong":["제29조(특허요건)제3항 위반에 해당한다"],"right":["같은 날 출원한 경우이므로 확대된 선출원 규정을 적용하지 않는다"],"reason":["확대된 선출원은 먼저 출원한 발명이 나중 출원에 미치는 문제입니다. 이 사례의 두 출원일이 같아 제29조 제3항의 선후관계가"],"memory":["확대된 선출원: 같은 날 출원에는 적용하지 않는다."],"flags":[]},{"id":68,"area":"특허·실용신안","year":2014,"round":51,"page":28,"metadata":"2014년 제51회 / PDF p.71 / 교재 p.74 / 정답 ②","originalPdfPage":71,"bookPage":74,"answerKey":"②","question":"특허요건에 관한 설명으로 옳은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"② 특허청구범위에 기재된 청구항이 복수의 구성요소로 되어 있는 경우는 각 구성요소가 유기적으로 결합한\n전체로서의 기술사상이 진보성 판단의 대상이 되는 것이지 각 구성요소가 독립하여 진보성 판단의 대상이 되\n는 것은 아니다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 결합발명의 진보성은 부품별 분해 판단이 아니라 유기적으로 결합된 전체로 판단.","summary":"결합 으로 옳지 않은 것은? (다툼이 있으면 판\n례에 따름)","answer":"② 발명의 설명에서의 기재 오류가 청구범위에 기재되어 있지 아니한 발명에 관한 것이거나 청구범위에 기재\n된 발명의 실시를 위하여 필요한 사항 이외의 부분에 관한 것이어서 그 오류에도 불구하고 통상의 기술자가 청\n구항에 기재된 발명을 정확하게 이해하고 쉽게 재현할 수 있다고 할지라도 이러한 기재 오류는 특허법 제42조(\n특허출원) 제3항 제1호에 위배된다.","correction":"정답보기에서 바로 고칠 부분: 특허법 제42조(특허출원) 제3항 제1호에 위배된다\n바르게 이해: 청구발명의 이해·재현과 무관한 부분의 오류라면 곧바로 위반이라고 볼 수 없다","summary":"[틀린 부분 직접 대비]\n정답보기에서 바로 고칠 부분: 특허법 제42조(특허출원) 제3항 제1호에 위배된다\n바르게 이해: 청구발명의 이해·재현과 무관한 부분의 오류라면 곧바로 위반이라고 볼 수 없다\n[암기 결론]\n청구발명의 이해·재현을 방해하지 않는 불필요 부분의 오류 → 곧바로 실시가능요건 위반 X.","wrong":["특허법 제42조(특허출원) 제3항 제1호에 위배된다"],"right":["청구발명의 이해·재현과 무관한 부분의 오류라면 곧바로 위반이라고 볼 수 없다"],"reason":[],"memory":["청구발명의 이해·재현을 방해하지 않는 불필요 부분의 오류 → 곧바로 실시가능요건 위반 X."],"flags":[]},{"id":75,"area":"특허·실용신안","year":2025,"round":62,"page":31,"metadata":"2025년 제62회 / PDF p.78 / 교재 p.81 / 정답 ⑤","originalPdfPage":78,"bookPage":81,"answerKey":"⑤","question":"특허법상 특허출원 명세서 기재요건에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"⑤ 의약의 용도발명에 있어서 의약의 용도가 구성요소에 해당하므로 청구범위에는 의약용도를 치료 대상 질병\n또는 약효로 명확하게 기재해야 하는 것인 바, 통상의 기술자의 기술상식에 비추어 약리기전만으로 구체적인\n의약으로서의 용도를 명확하게 파악할 수 있다고 하더라도 이것만으로는 청구범위가 명확하게 기재된 것이 아\n니어서 특허법 제42조 (특허출원)제4항제2호의 요건을 충족한 것이라고 볼 수 없다.","correction":"틀린 부분: 이것만으로는 청구범위가 명확하게 기재된 것이 아니어서\n바른 표현: 약리기전만으로도 의약용도를 명확히 파악할 수 있다면 명확성 요건 충족 가능\n이유: 원칙적으로는 어떤 질병을 치료하거나 어떤 약효를 내는지 명확하게 적습니다. 그러나 약이 작용하는 원리인\n약리기전으로 표현했어도, 설명과 기술상식으로 구체적 의약용도를 명확하게 알 수 있다면 명확성 요건을 충족\n할 수 있습니다. 보기는 이러한 경우까지 일률적으로 부정하여 틀립니다.\n암기 결론: 약리기전 기재라도 구체적 의약용도가 명확히 파악되면 명확성 충족 가능.","summary":"[틀린 표현 직접 수정]\n이것만으로는 청구범위가 명확하게 기재된 것이 아니어서 → 약리기전만으로도 의약용도를 명확히 파악할 수 있다면 명확성 요건 충족\n\n가능\n[암기 결론] 약리기전 기재라도 구체적 의약용도가 명확히 파악되면 명확성 충족 가능.","wrong":["이것만으로는 청구범위가 명확하게 기재된 것이 아니어서"],"right":["약리기전만으로도 의약용도를 명확히 파악할 수 있다면 명확성 요건 충족 가능"],"reason":["원칙적으로는 어떤 질병을 치료하거나 어떤 약효를 내는지 명확하게 적습니다. 그러나 약이 작용하는 원리인"],"memory":["약리기전 기재라도 구체적 의약용도가 명확히 파악되면 명확성 충족 가능."],"flags":[]},{"id":76,"area":"특허·실용신안","year":2016,"round":53,"page":32,"metadata":"2016년 제53회 / PDF p.79 / 교재 p.82 / 정답 ①","originalPdfPage":79,"bookPage":82,"answerKey":"①","question":"제조방법이 기재된 물건의 발명에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"① 제조방법이 기재된 물건발명을 그 제조방법에 의해서만 물건을 특정할 수밖에 없는 등의 특별한 사정이 있\n는지 여부로 구분하여, 그러한 특별한 사정이 없는 경우에만 그 제조방법 자체를 고려할 필요없이 청구범위의\n기재에 의하여 특정되는 물건의 발명만을 선행기술과 대비하는 방법으로 진보성 결여 여부를 판단하여야 한다.","correction":"틀린 부분: 특별한 사정이 없는 경우에만\n바른 표현: 특별한 사정 유무로 나누지 않고 청구범위 전체가 특정하는 물건을 파악\n이유: 제조방법으로 표현했어도 청구하는 대상은 최종 물건입니다. 특별한 사정이 있는지에 따라 해석을 나누는 대신,\n제조방법 기재까지 포함한 청구범위 전체로 물건의 구조·성질을 파악하고 선행기술과 비교합니다. 제조방법\n문구를 아예 무시하거나, 제조방법 자체만을 발명으로 보는 것도 아닙니다.\n암기 결론: 제조방법 기재를 포함한 청구범위 전체 → 물건의 구조·성질 파악 → 신규성·진보성 비교.","summary":"[틀린 표현 직접 수정]\n특별한 사정이 없는 경우에만 → 특별한 사정 유무로 나누지 않고 청구범위 전체가 특정하는 물건을 파악\n[암기 결론] 제조방법 기재를 포함한 청구범위 전체 → 물건의 구조·성질 파악 → 신규성·진보성 비교.","wrong":["특별한 사정이 없는 경우에만"],"right":["특별한 사정 유무로 나누지 않고 청구범위 전체가 특정하는 물건을 파악"],"reason":["제조방법으로 표현했어도 청구하는 대상은 최종 물건입니다. 특별한 사정이 있는지에 따라 해석을 나누는 대신,"],"memory":["제조방법 기재를 포함한 청구범위 전체 → 물건의 구조·성질 파악 → 신규성·진보성 비교."],"flags":[]},{"id":77,"area":"특허·실용신안","year":2013,"round":50,"page":32,"metadata":"2013년 제50회 / PDF p.80 / 교재 p.83 / 정답 ①","originalPdfPage":80,"bookPage":83,"answerKey":"①","question":"기능식 청구항에 관한 설명으로 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"① 기능식 청구항은 청구항이 기능적으로 기재된 사정이 있으므로 독립항과 종속항으로 이루어진 특허청구범\n위의 기술내용을 파악하는 경우에 광범위하게 규정된 독립항의 기술내용을 독립항보다 구체적으로 한정하고\n있는 종속항의 기술구성이나 발명의 상세한 설명에 나오는 특정의 실시례로 제한하여 해석하는 것이 원칙이다.","correction":"틀린 부분: 종속항의 기술구성이나 발명의 상세한 설명에 나오는 특정의 실시례로 제한하여 해석하는 것이 원칙이다\n바른 표현: 기능식이라는 이유만으로 독립항을 종속항·특정 실시례에 한정하는 것이 원칙은 아니다\n이유: 독립항은 기본적인 보호범위를, 종속항은 여기에 조건을 더한 좁은 범위를 적습니다. 독립항이 기능으로 표현\n되었다는 이유만으로 종속항이나 실시례의 조건까지 끌어와 독립항을 좁혀 읽는 것이 원칙은 아닙니다. 특별한\n사정이 없다면 그러한 제한해석은 할 수 없습니다.\n암기 결론: 기능식이라는 이유만으로 독립항을 종속항·특정 실시례로 제한해석하지 않는다.","summary":"[틀린 표현 직접 수정]\n종속항의 기술구성이나 발명의 상세한 설명에 나오는 특정의 실시례로 제한하여 해석하는 것이 원칙이다 → 기능식이라는 이유만으로\n독립항을 종속항·특정 실시례에 한정하는 것이 원칙은 아니다\n[암기 결론] 기능식이라는 이유만으로 독립항을 종속항·특정 실시례로 제한해석하지 않는다.","wrong":["종속항의 기술구성이나 발명의 상세한 설명에 나오는 특정의 실시례로 제한하여 해석하는 것이 원칙이다"],"right":["기능식이라는 이유만으로 독립항을 종속항·특정 실시례에 한정하는 것이 원칙은 아니다"],"reason":["독립항은 기본적인 보호범위를, 종속항은 여기에 조건을 더한 좁은 범위를 적습니다. 독립항이 기능으로 표현"],"memory":["기능식이라는 이유만으로 독립항을 종속항·특정 실시례로 제한해석하지 않는다."],"flags":[]},{"id":78,"area":"특허·실용신안","year":2009,"round":null,"page":32,"metadata":"2009년 / 회차 표기 판독 불명확 / PDF p.81 / 교재 p.84 / 정답 ②","originalPdfPage":81,"bookPage":84,"answerKey":"②","question":"다음 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)","answer":"② 도면은 특허출원서에 반드시 첨부하여야 하는 것이 아니고, 도면만으로 발명의 설명을 대체할 수 [일부 판독\n불명확] 아니며, 도면은 실시예 등을 구체적으로 보여줌으로써 발명의 구성을 더욱 쉽게 이해할 수 있도록 해\n주는 것에 불과하므로, 도면이 첨부되어 있다고 해서 도면 및 도면의 간단한 설명을 종합적으로 참작하여 발명\n의 설명이 청구항을 뒷받침하고 있는지 여부를 판단할 수는 없다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 도면은 설명의 대체물이 아니지만, 뒷받침 판단에는 종합 참작 가능.","summary":"도면은 설명의 대체물이 아니지만, 뒷받침 판단에는 종합 참작 가능.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":79,"area":"특허·실용신안","year":2014,"round":51,"page":33,"metadata":"2014년 제51회 / PDF p.82 / 교재 p.85 / 정답 ④","originalPdfPage":82,"bookPage":85,"answerKey":"④","question":"특허법 시행령 제5조(특허청구범위의 기재방법)에 관한 설명으로 옳은 것은?\n청구항 1. 프레임; 동력전달기구; 및 회전축을 구비한 장치\n청구항 2. 청구항 2에 있어서, 프레임에 장착되는 축전지를 더 구비한 장치\n청구항 3. 청구항 1 또는 청구항 2에 있어서, …… 장치\n청구항 4. 청구항 3에 있어서, …… 장치\n청구항 5. 청구항 2 또는 청구항 4에 있어서, …… 장치\n청구항 6. 청구항 1에 있어서, 동력전달기구는 벨트인 장치\n청구항 7. 청구항 1의 장치를 …… 구동하는 방법\n청구항 8. 청구항 1 또는 청구항 7에 있어서, …… 장치 또는 방법","answer":"④ 청구항 7은 청구범위 기재방법으로 적합하다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 장치 청구항을 인용한 '구동 방법' 청구항: 인용형식의 독립항 가능.","summary":"장치 청구항을 인용한 '구동 방법' 청구항: 인용형식의 독립항 가능.","wrong":[],"right":["장치 청구항을 인용한 '구동 방법' 청구항: 인용형식의 독립항 가능."],"reason":[],"memory":[],"flags":[]},{"id":80,"area":"특허·실용신안","year":2013,"round":50,"page":33,"metadata":"2013년 제50회 / PDF p.83 / 교재 p.86 / 정답 ④","originalPdfPage":83,"bookPage":86,"answerKey":"④","question":"다음 설명 중 옳지 않은 것은?\n가. 특허발명(1)의 특허청구범위\n제1항 A와 B를 포함하는 의약 조성물\n제2항 제1항에 있어서, C를 추가로 포함하는 것을 특징으로 하는 의약 조성물\n제3항 제1항 또는 제5항에 있어서, D를 추가로 포함하는 것을 특징으로 하는 의약 조성물\n제4항 제1항에 있어서, E를 추가로 포함하는 것을 특징으로 하는 의약 조성물\n제5항 제4항에 있어서, F를 추가로 포함하는 것을 특징으로 하는 의약 조성물\n제6항 제4항 또는 제5항에 있어서, G를 추가로 포함하는 것을 특징으로 하는 의약 조성물\n제7항 제2항 또는 제6항에 있어서, H를 추가로 포함하는 것을 특징으로 하는 의약 조성물\n나. 특허발명(2)의 특허청구범위\n\n제1항 A′와 B′를 포함하는 조성물\n제2항 제1항에 있어서, C′를 추가로 포함하는 것을 특징으로 하는 조성물\n확인대상발명(1)\nA′와 B′만으로 이루어진 조성물\n다. 특허발명(3)의 특허청구범위\n제1항 A″와 B″를 포함하는 조성물\n제2항 제1항에 있어서, C″를 추가로 포함하는 것을 특징으로 하는 조성물\n확인대상발명(2)\nA″와 C″만으로 이루어진 조성물","answer":"④ 확인대상발명(1)은 특허발명(2)의 청구항 제1항의 권리범위에 속하므로, 당연히 특허발명(2)의 청구항 제2항\n의 권리범위에도 속한다.","correction":"틀린 부분: 당연히 특허발명(2)의 청구항 제2항\n바른 표현: 제2항의 추가 구성 C′까지 충족하는지를 별도로 판단\n이유: 제1항은 A′와 B′를 요구하지만, 제2항은 여기에 C′까지 추가로 요구합니다. 확인대상발명에는 C′가 없으므로 제\n1항에 속한다고 해도 제2항에는 속하지 않습니다. 조건이 더 많은 종속항의 범위가 더 좁다는 점을 이해하면\n됩니다.\n암기 결론: A′+B′는 제1항 충족, C′가 없으므로 A′+B′+C′인 제2항은 불충족.","summary":"[틀린 표현 직접 수정]\n당연히 특허발명(2)의 청구항 제2항 → 제2항의 추가 구성 C′까지 충족하는지를 별도로 판단\n[암기 결론] A′+B′는 제1항 충족, C′가 없으므로 A′+B′+C′인 제2항은 불충족.","wrong":["당연히 특허발명(2)의 청구항 제2항"],"right":["제2항의 추가 구성 C′까지 충족하는지를 별도로 판단"],"reason":["제1항은 A′와 B′를 요구하지만, 제2항은 여기에 C′까지 추가로 요구합니다. 확인대상발명에는 C′가 없으므로 제"],"memory":["A′+B′는 제1항 충족, C′가 없으므로 A′+B′+C′인 제2항은 불충족."],"flags":[]},{"id":81,"area":"특허·실용신안","year":2008,"round":45,"page":34,"metadata":"2008년 제45회 / PDF p.84 / 교재 p.87 / 교재 정답 ③","originalPdfPage":84,"bookPage":87,"answerKey":"③","question":"다음 설명 중 옳지 않은 것은?","answer":"③ 甲은 2006년 7월 20일 특허출원을 하였고 조기공개신청을 하지 않았다. 그 후 2006년 10월 20일 적법하게\n분할출원 하였고, 분할된 출원의 최초 명세서 및 도면에는 a라는 기술적 사상이 포함되어 있는데(원출원의 최\n초 명세서 및 도면에는 a가 기재되어 있지 않다.) 乙이 2006년 9월 20일 a를 특허출원한 경우, 乙은 a에 대하여\n특허를 받을 수 없다.","correction":"틀린 부분: 乙은 a에 대하여 특허를 받을 수 없다\n바른 표현: 乙의 9월 20일 출원은 분할출원일(10월 20일)보다 앞서므로 그 확대된 선출원만으로 막을 수 없다\n이유: 분할출원이 다른 출원을 막는 확대된 선출원의 지위를 갖는지는 실제 분할출원일을 기준으로 봅니다. 이 사례\n에서는 분할출원일인 10월 20일이 乙의 9월 20일보다 늦으므로 그 규정으로 乙을 막지 못합니다. 원출원에 a가\n없다는 전제도 있으므로, 원출원일인 7월 20일을 곧바로 a의 선출원일로 삼아 乙이 특허를 받을 수 없다고 해\n서는 안 됩니다.\n암기 결론: 확대된 선출원의 지위를 부여하는 기준일: 실제 분할출원일.\n이 사례: 乙 9.20. → 분할출원 10.20. 확대된 선출원을 이유로 乙을 막지 못함.","summary":"[틀린 표현 직접 수정]\n乙은 a에 대하여 특허를 받을 수 없다 → 乙의 9월 20일 출원은 분할출원일(10월 20일)보다 앞서므로 그 확대된 선출원만으로 막을 수\n없다\n[암기 결론] 확대된 선출원의 지위를 부여하는 기준일: 실제 분할출원일.\n\n이 사례: 乙 9.20. → 분할출원 10.20. 확대된 선출원을 이유로 乙을 막지 못함.","wrong":["乙은 a에 대하여 특허를 받을 수 없다"],"right":["乙의 9월 20일 출원은 분할출원일(10월 20일)보다 앞서므로 그 확대된 선출원만으로 막을 수 없다"],"reason":["분할출원이 다른 출원을 막는 확대된 선출원의 지위를 갖는지는 실제 분할출원일을 기준으로 봅니다. 이 사례"],"memory":["확대된 선출원의 지위를 부여하는 기준일: 실제 분할출원일.\n\n이 사례: 乙 9.20. → 분할출원 10.20. 확대된 선출원을 이유로 乙을 막지 못함.","확대된 선출원의 지위를 부여하는 기준일: 실제 분할출원일."],"flags":[]},{"id":82,"area":"특허·실용신안","year":2011,"round":48,"page":35,"metadata":"2011년 제48회 / PDF p.85 / 교재 p.88 / 해설상 정답 ② (정답표시 우측이 잘림)","originalPdfPage":85,"bookPage":88,"answerKey":"② (정답표시 우측이 잘림)","question":"특허청구범위 제출 유예제도에 관한 설명으로 옳지 않은 것은?","answer":"② 특허출원을 하는 경우에 특허청구범위를 기재하지 않는 명세서를 출원서에 첨부한 특허출원인이 출원[우측\n일부 판독 불가]선권주장이 있는 경우에는 최선일)부터 1년 2개월이 되는 날까지 특허청구범위를 기재하는 보\n정을 [우측 일부 판독 불가] 아니하면 당해 출원은 그 기한이 되는 날에 취하된 것으로 본다.","correction":"틀린 부분: 그 기한이 되는 날에 취하된 것으로 본다\n바른 표현: 그 기한이 되는 날의 다음 날에 취하된 것으로 본다\n이유: 교재 제42조의2 제3항 해설에서 취하간주 시점을 기한 다음 날로 구별합니다.","summary":"틀린 부분: 그 기한이 되는 날에 취하된 것으로 본다\n바른 표현: 그 기한이 되는 날의 다음 날에 취하된 것으로 본다\n이유: 교재 제42조의2 제3항 해설에서 취하간주 시점을 기한 다음 날로 구별합니다.\n암기 결론: 청구범위 미보정에 따른 취하간주: 기한 당일 X / 다음 날 O.","wrong":["그 기한이 되는 날에 취하된 것으로 본다"],"right":["그 기한이 되는 날의 다음 날에 취하된 것으로 본다"],"reason":["교재 제42조의2 제3항 해설에서 취하간주 시점을 기한 다음 날로 구별합니다."],"memory":["청구범위 미보정에 따른 취하간주: 기한 당일 X / 다음 날 O."],"flags":["원문 판독·검증 필요"]},{"id":83,"area":"특허·실용신안","year":2016,"round":53,"page":35,"metadata":"2016년 제53회 / PDF p.86 / 교재 p.89 / 정답 ②","originalPdfPage":86,"bookPage":89,"answerKey":"②","question":"외국어 특허출원에 관한 설명으로 옳지 않은 것은?","answer":"② 출원의 종류와 무관하게 명세서 등을 외국어로 적어 출원한 경우 출원인은 최우선일로부터 1년 2개월이 경\n과하면 국어 번역문을 제출할 수 있는 기회를 갖지 못한다.","correction":"틀린 부분: 출원의 종류와 무관하게\n바른 표현: 분할·변경출원에는 국어번역문 제출 특례가 있으므로 출원 종류별로 구별\n이유: 분할·변경출원에는 해당 출원일부터 30일이라는 국어번역문 제출 특례가 있습니다. 따라서 최우선일부터 1년\n2개월이 지났다는 이유만으로, 출원의 종류와 무관하게 제출 기회가 전혀 없다고 할 수는 없습니다. 변경출원\n은 변경출원일을 기준으로 하므로, 두 경우 모두 '분할출원'이라고 적은 교재 해설 문구는 구분해서 읽습니다.\n암기 결론: 분할·변경출원 국어번역문: 해당 출원일부터 30일의 특례 확인.","summary":"[틀린 표현 직접 수정]\n출원의 종류와 무관하게 → 분할·변경출원에는 국어번역문 제출 특례가 있으므로 출원 종류별로 구별\n[암기 결론] 분할·변경출원 국어번역문: 해당 출원일부터 30일의 특례 확인.","wrong":["출원의 종류와 무관하게"],"right":["분할·변경출원에는 국어번역문 제출 특례가 있으므로 출원 종류별로 구별"],"reason":["분할·변경출원에는 해당 출원일부터 30일이라는 국어번역문 제출 특례가 있습니다. 따라서 최우선일부터 1년"],"memory":["분할·변경출원 국어번역문: 해당 출원일부터 30일의 특례 확인."],"flags":[]},{"id":84,"area":"특허·실용신안","year":2021,"round":null,"page":35,"metadata":"2021년 / 회차 우측 판독 불가 / PDF p.87 / 교재 p.90 / 해설상 정답 ③","originalPdfPage":87,"bookPage":90,"answerKey":"③","question":"甲은 면역 성분 A와 해독 성분 B를 1 : 2로 배합하는 “코로나19 항체치료제”를 개발[우측 일부 판독 불가] 이를\n2020. 5. 1. 발간된 영문저널에 게재하였으며, 이 영문저널에 게재된 발명을 특허법 제42조의3(외국어특허출원\n\n등)의 규정에 의하여 2021. 2. 1. 외국어특허출원을 하였다. 이 [우측 일부 판독 불가]원에 관한 설명으로 옳지\n않은 것은?","answer":"③ 甲은 영문저널에 게재된 날부터 1년 2개월이 되는 날까지 그 명세서 및 도면의 국어번역문을 제출하여[우측\n일부 판독 불가]고 그 국어번역문은 보정된 것으로 본다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 국어번역문 기한의 출발점은 논문 공개일이 아니다. 이 사례는 특허출원일 기준.","summary":"국어번역문 기한의 출발점은 논문 공개일이 아니다. 이 사례는 특허출원일 기준.","wrong":[],"right":["국어번역문 기한의 출발점은 논문 공개일이 아니다. 이 사례는 특허출원일 기준."],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":85,"area":"특허·실용신안","year":2012,"round":49,"page":36,"metadata":"2012년 제49회 / PDF p.88 / 교재 p.91 / 정답 ④","originalPdfPage":88,"bookPage":91,"answerKey":"④","question":"특허를 받을 수 있는 권리에 관한 설명으로 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"④ 특허를 받을 수 있는 권리의 양도 계약에 따라 양수인 명의로 출원인 명의변경이 이루어지고 양수인이 특허\n권의 설정등록을 받은 경우, 그 양도계약이 무효나 취소 등의 사유로 효력을 상실하게 되는 때에 그 특허를 받\n을 수 있는 권리와 설정등록이 이루어진 특허권이 동일한 발명에 관한 것이라도 양도인은 양수인에 대하여 그\n특허권에 관하여 이전등록을 청구할 수 없다.","correction":"틀린 부분: 이전등록을 청구할 수 없다\n바른 표현: 양도계약이 무효·취소 등으로 효력을 잃고 동일 발명이라면 이전등록 청구 가능\n이유: 권리를 넘긴 계약이 무효·취소로 효력을 잃으면, 양수인이 그 특허를 계속 보유할 법적 근거도 없어집니다. 같\n은 발명에 관한 권리라면 양도인은 부당이득 반환의 방법으로 특허권 이전등록을 청구할 수 있으므로, '청구할\n수 없다'가 틀립니다.\n암기 결론: 양도계약 효력 상실 + 동일 발명 → 부당이득 반환에 따른 이전등록청구 가능.","summary":"[틀린 표현 직접 수정]\n이전등록을 청구할 수 없다 → 양도계약이 무효·취소 등으로 효력을 잃고 동일 발명이라면 이전등록 청구 가능\n[암기 결론] 양도계약 효력 상실 + 동일 발명 → 부당이득 반환에 따른 이전등록청구 가능.", 차에 관한 설명으로 옳지 않은 것은?","answer":"② 등록된 특허발명에 대하여 무권리자의 의한 출원이라는 사유로 무효심결이 확정된 경우에 무권리자의 특허\n출원에 대한 등록공고가 있는 날부터 2년이 경과한 후에 정당한 권리자가 출원을 하였더라도 무권리자의 특허\n출원일부터 3년이 경과하지 않았다면 정당한 권리자의 출원일이 무권리자가 특허출원한 날로 소급된다.","correction":"틀린 부분: 무권리자의 특허 출원일부터 3년이 경과하지 않았다면\n바른 표현: 이 3년 기준만으로 출원일 소급을 인정할 수 없음; 출제 당시 등록공고 후 2년 제한, 교재 개정법 설명은 무효심결 확정 후\n30일을 별도 확인\n이유: 이 문제의 출원일 소급 요건을 심사청구기간과 섞으면 안 됩니다. 출제 당시에는 등록공고일부터 2년이라는 제\n한도 있었으므로, 그 기간을 넘겼는데 단지 출원일부터 3년이 지나지 않았다는 이유로 소급된다는 보기는 틀립\n니다. 교재가 덧붙인 개정법 설명에서는 무효심결 확정 후 정당한 권리자의 출원에 관한 30일 기한이 핵심입니\n다.\n암기 결론: '무권리자 출원일부터 3년 미경과'는 소급출원을 보장하는 요건이 아니다.\n교재 개정법 기준: 무효심결 확정 후 정당한 권리자 출원의 30일 기한 확인.","summary":"[틀린 표현 직접 수정]\n무권리자의 특허 출원일부터 3년이 경과하지 않았다면 → 이 3년 기준만으로 출원일 소급을 인정할 수 없음; 출제 당시 등록공고 후 2년\n제한, 교재 개정법 설명은 무효심결 확정 후 30일을 별도 확인\n[암기 결론] '무권리자 출원일부터 3년 미경과'는 소급출원을 보장하는 요건이 아니다.\n교재 개정법 기준: 무효심결 확정 후 정당한 권리자 출원의 30일 기한 확인.","wrong":["무권리자의 특허 출원일부터 3년이 경과하지 않았다면"],"right":["이 3년 기준만으로 출원일 소급을 인정할 수 없음; 출제 당시 등록공고 후 2년 제한, 교재 개정법 설명은 무효심결 확정 후"],"reason":["이 문제의 출원일 소급 요건을 심사청구기간과 섞으면 안 됩니다. 출제 당시에는 등록공고일부터 2년이라는 제"],"memory":["'무권리자 출원일부터 3년 미경과'는 소급출원을 보장하는 요건이 아니다.\n교재 개정법 기준: 무효심결 확정 후 정당한 권리자 출원의 30일 기한 확인.","'무권리자 출원일부터 3년 미경과'는 소급출원을 보장하는 요건이 아니다."],"flags":[]},{"id":91,"area":"특허·실용신안","year":2017,"round":54,"page":38,"metadata":"2017년 제54회 / PDF p.94 / 교재 p.97 / 정답 ⑤","originalPdfPage":94,"bookPage":97,"answerKey":"⑤","question":"甲, 乙은 발명 A의 공동발명자, 丙, 丁은 제3자이다. 이에 관한 설명으로 옳은 것은?","answer":"⑤ 丙이 甲과 乙로부터 발명 A에 대한 권리 일체를 양수한 후 그 출원을 하기 전에, 그러한 사정을 모르는 丁이\n甲과 乙로부터 발명 A에 대한 특허를 받을 수 있는 권리를 이중으로 양수하여 자신의 이름으로 출원한 경우,\n丁의 출원은 적법하다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 출원 전 양도: 먼저 계약했다는 사실만으로 충분하지 않고, 제3자 대항에는 출원이 중요.","summary":"출원 전 양도: 먼저 계약했다는 사실만으로 충분하지 않고, 제3자 대항에는 출원이 중요.","wrong":[],"right":["출원 전 양도: 먼저 계약했다는 사실만으로 충분하지 않고, 제3자 대항에는 출원이 중요."],"reason":[],"memory":[],"flags":[]},{"id":92,"area":"특허·실용신안","year":2023,"round":60,"page":39,"metadata":"2023년 제60회 / PDF p.95 / 교재 p.98 / 정답 ⑤","originalPdfPage":95,"bookPage":98,"answerKey":"⑤","question":"특허법 제33조(특허를 받을 수 있는 자)에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"⑤ 미성년자 丁은 법정대리인 戊의 동의가 있어야만 제3자로부터 특허를 받을 수 있는 권리를 무상으로 양도받\n을 수 있다.","correction":"틀린 부분: 동의가 있어야만\n바른 표현: 부담 없이 권리만 무상으로 얻는 경우 법정대리인 동의 없이 가능\n이유: 미성년자라도 권리만 얻는 행위는 법정대리인 동의 없이 할 수 있습니다. 이 보기는 부담 없이 권리를 무상으로\n받는 경우이므로 '동의가 있어야만'이라는 제한이 틀립니다. 대금을 내거나 의무를 부담하는 양수까지 같은 결\n론으로 넓혀서는 안 됩니다.\n암기 결론: 부담 없이 권리만 무상 양수 → 미성년자도 법정대리인 동의 없이 가능.","summary":"[틀린 표현 직접 수정]\n동의가 있어야만 → 부담 없이 권리만 무상으로 얻는 경우 법정대리인 동의 없이 가능\n[암기 결론] 부담 없이 권리만 무상 양수 → 미성년자도 법정대리인 동의 없이 가능.","wrong":["동의가 있어야만"],"right":["부담 없이 권리만 무상으로 얻는 경우 법정대리인 동의 없이 가능"],"reason":["미성년자라도 권리만 얻는 행위는 법정대리인 동의 없이 할 수 있습니다. 이 보기는 부담 없이 권리를 무상으로"],"memory":["부담 없이 권리만 무상 양수 → 미성년자도 법정대리인 동의 없이 가능."],"flags":[]},{"id":93,"area":"특허·실용신안","year":2013,"round":50,"page":39,"metadata":"2013년 제50회 / PDF p.96 / 교재 p.99 / 교재 정답 ④","originalPdfPage":96,"bookPage":99,"answerKey":"④","question":"특허요건의 판단에 관한 설명으로 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"④ 물건의 청구항에 있어 하나 이상의 구성이 그것을 제조하는 방법이나 수단으로 표현된 제법한정 물건발명\n의 경우에 그 제조방법에 의해서만 물건을 특정할 수밖에 없는 등의 특별한 사정이 있다면, 그 물건으로 특정되\n는 발명과 제조방법을 함께 고려하여 진보성 유무를 판단하여야 한다.","correction":"틀린 부분: 특별한 사정이 있다면\n바른 표현: 특별한 사정 유무로 이분하지 말고 제조방법 기재를 포함한 청구범위 전체로 특정되는 물건을 비교\n이유: 교재는 특별한 사정 유무로 나누는 과거의 판단구조 대신, 제조방법 문구까지 포함한 청구범위 전체로 물건의\n구조·성질을 파악하는 판례를 제시합니다. 그렇다고 제조방법 문구를 무시하는 것은 아니며, 방법 자체를 별도\n\n의 발명처럼 더해 평가하는 것도 아닙니다. 이 보기의 '함께 고려'라는 말만 따로 떼어 항상 틀린 표현으로 외우\n지 말고, 교재가 붙인 변경 판례와 함께 읽어야 합니다.\n암기 결론: 특별한 사정에 따라 이분하지 않고, 모든 기재로 특정되는 물건을 선행기술과 비교.","summary":"[틀린 표현 직접 수정]\n특별한 사정이 있다면 → 특별한 사정 유무로 이분하지 말고 제조방법 기재를 포함한 청구범위 전체로 특정되는 물건을 비교\n[암기 결론] 특별한 사정에 따라 이분하지 않고, 모든 기재로 특정되는 물건을 선행기술과 비교.","wrong":["특별한 사정이 있다면"],"right":["특별한 사정 유무로 이분하지 말고 제조방법 기재를 포함한 청구범위 전체로 특정되는 물건을 비교"],"reason":["교재는 특별한 사정 유무로 나누는 과거의 판단구조 대신, 제조방법 문구까지 포함한 청구범위 전체로 물건의"],"memory":["특별한 사정에 따라 이분하지 않고, 모든 기재로 특정되는 물건을 선행기술과 비교."],"flags":[]},{"id":94,"area":"특허·실용신안","year":2024,"round":61,"page":40,"metadata":"2024년 제61회 / PDF p.97 / 교재 p.100 / 정답 ④","originalPdfPage":97,"bookPage":100,"answerKey":"④","question":"특허를 받을 수 있는 권리에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"④ 발명이 정신적 창작활동의 결과로 얻어지는 것이라는 점에서 피성년후견인은 특허를 받을 수 있는 권리를\n가지지 못한다.","correction":"틀린 부분: 특허를 받을 수 있는 권리를 가지지 못한다\n바른 표현: 피성년후견인도 실제로 발명했다면 발명자·특허를 받을 권리의 주체가 될 수 있다\n이유: 발명을 실제로 만들어 내는 것과 계약·출원절차를 혼자 처리할 수 있는지는 서로 다른 문제입니다. 발명은 사실\n행위이므로 피성년후견인도 실제 발명을 했다면 발명자가 되고 특허를 받을 권리를 가질 수 있습니다.\n암기 결론: 행위능력 제한 ≠ 발명자 자격 부정. 피성년후견인도 발명자가 될 수 있다.","summary":"[틀린 표현 직접 수정]\n특허를 받을 수 있는 권리를 가지지 못한다 → 피성년후견인도 실제로 발명했다면 발명자·특허를 받을 권리의 주체가 될 수 있다\n[암기 결론] 행위능력 제한 ≠ 발명자 자격 부정. 피성년후견인도 발명자가 될 수 있다.","wrong":["특허를 받을 수 있는 권리를 가지지 못한다"],"right":["피성년후견인도 실제로 발명했다면 발명자·특허를 받을 권리의 주체가 될 수 있다"],"reason":["발명을 실제로 만들어 내는 것과 계약·출원절차를 혼자 처리할 수 있는지는 서로 다른 문제입니다. 발명은 사실"],"memory":["행위능력 제한 ≠ 발명자 자격 부정. 피성년후견인도 발명자가 될 수 있다."],"flags":[]},{"id":95,"area":"특허·실용신안","year":2018,"round":55,"page":40,"metadata":"2018년 제55회 / PDF p.99 / 교재 p.102 / 정답 ④","originalPdfPage":99,"bookPage":102,"answerKey":"④","question":"특허법 제30조의 공지 등이 되지 아니한 발명으로 보는 경우(이하 '공지예외적용'이라 함)에 관한 설명으로 옳\n은 것은?","answer":"④ 특허를 받을 수 있는 권리를 가진 자에 의하여 발명이 공지된 경우에 공지예외적용을 받을 수 있으나, 그 발\n명이 조약 또는 법률에 따라 국내 또는 국외에서 출원공개 되거나 등록공고 된 경우는 제외한다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 자기 공개의 공지예외에서 제외: 국내외 법정 출원공개·등록공고.","summary":"자기 공개의 공지예외에서 제외: 국내외 법정 출원공개·등록공고.","wrong":[],"right":["자기 공개의 공지예외에서 제외: 국내외 법정 출원공개·등록공고."],"reason":[],"memory":[],"flags":[]},{"id":96,"area":"특허·실용신안","year":2014,"round":51,"page":40,"metadata":"2014년 제51회 / PDF p.100 / 교재 p.103 / 정답 ④","originalPdfPage":100,"bookPage":103,"answerKey":"④","question":"특허법 제30조의 공지 등이 되지 아니한 발명으로 보는 경우(이하 '공지예외적용'이라 함)에 관한 설명 중 옳지\n않은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"④ 특허를 받을 수 있는 권리를 가진 자가 특허출원 전에 해당 발명을 공지한 후 공지예외적용 요건을 갖추어\n특허출원을 하였는데, 그 공지일과 특허출원일 사이에 제3자에 의하여 해당 발명과 동일한 발명의 공개가 있는\n경우, 제3자의 공지가 공지예외적용에 해당하는 공지에 의하여 지득한 발명의 공개라는 사실이 명백하더라도\n출원인이 그 의사에 반하여 공지된 발명이라는 사실을 입증하지 못하면 그 특허출원은 제3자의 공지에 기초하\n여 신규성을 상실한다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 공지예외 대상 공개에서 지득한 재공개임이 명백 → 의사에 반한 공개의 별도 입증 불요.","summary":"공지예외 대상 공개에서 지득한 재공개임이 명백 → 의사에 반한 공개의 별도 입증 불요.","wrong":[],"right":["공지예외 대상 공개에서 지득한 재공개임이 명백 → 의사에 반한 공개의 별도 입증 불요."],"reason":[],"memory":[],"flags":[]},{"id":97,"area":"특허·실용신안","year":2016,"round":null,"page":41,"metadata":"2016년 / 회차 판독 불명확 / PDF p.101 / 교재 p.104 / 정답 ①","originalPdfPage":101,"bookPage":104,"answerKey":"①","question":"특허법 제30조(공지 등이 되지 아니한 발명으로 보는 경우)에 관한 설명으로 옳지 않은 것은?","answer":"① 공지 등이 있는 날로부터 12개월 이내에 공지예외적용 신청을 수반하여 선출원을 한 경우, 해당 선출원을\n기초로 한 국내우선권 주장출원을 위 공지 등이 있는 날로부터 12개월 이내에 하여야 특허법 제30조의 적용을\n받을 수 있다.","correction":"틀린 부분: 공지 등이 있는 날로부터 12개월 이내에 하여야\n바른 표현: 공지예외요건을 갖춘 선출원이 있다면 국내우선권 주장출원은 선출원일부터 1년 이내에 하면 된다\n이유: 국내우선권은 먼저 낸 출원에 기재된 발명에 대해 그 선출원일을 일정 요건의 판단 기준으로 사용하는 제도입\n니다. 이 사례에서는 공지 후 12개월 안에 선출원을 했다면, 이를 기초로 하는 국내우선권 주장출원은 선출원\n후 1년 안에 하면 됩니다. 나중 출원에도 공지일로부터 12개월이라는 기한을 그대로 적용한 것이 보기의 잘못\n입니다.","summary":"[틀린 부분 → 바른 표현 → 이유]\n틀린 부분: 공지 등이 있는 날로부터 12개월 이내에 하여야\n바른 표현: 공지예외요건을 갖춘 선출원이 있다면 국내우선권 주장출원은 선출원일부터 1년 이내에 하면 된다\n[암기 결론]\n이 사례의 두 시계: 공지 → 12개월 이내 선출원 / 선출원 → 1년 이내 국내우선권 주장출원.","wrong":["공지 등이 있는 날로부터 12개월 이내에 하여야"],"right":["공지예외요건을 갖춘 선출원이 있다면 국내우선권 주장출원은 선출원일부터 1년 이내에 하면 된다"],"reason":["국내우선권은 먼저 낸 출원에 기재된 발명에 대해 그 선출원일을 일정 요건의 판단 기준으로 사용하는 제도입"],"memory":["이 사례의 두 시계: 공지 → 12개월 이내 선출원 / 선출원 → 1년 이내 국내우선권 주장출원."],"flags":["원문 판독·검증 필요"]},{"id":98,"area":"특허·실용신안","year":2025,"round":62,"page":41,"metadata":"2025년 제62회 / PDF p.102 / 교재 p.105 / 정답 ③","originalPdfPage":102,"bookPage":105,"answerKey":"③","question":"특허법 제30조(공지 등이 되지 아니한 발명으로 보는 경우)에 관한 설명으로 옳지 않은 것은?","answer":"③ 특허법 제30조는 발명이 출원 전에 공지되었다 하더라도 일정요건을 갖출 경우 특허법 제29조(특허요건)제\n1항 또는 제2항을 적용할 때 그 발명을 선행기술로 사용하지 않도록 하는 규정이지 출원일이 소급되는 것은 아\n니므로 그 공지일과 출원일 사이에 동일한 발명에 대한 제3자의 독립적 출원이 있는 경우에는 특허법 제30조\n의 규정을 적용받을 수 없다.","correction":"틀린 부분: 특허법 제30조의 규정을 적용받을 수 없다\n바른 표현: 제30조 공지예외는 적용받을 수 있으나, 제3자의 독립적 출원은 다른 거절사유가 될 수 있다\n이유: 공지예외 적용 자체와 제3자의 선출원에 따른 별도 특허요건 심사를 혼동한 표현입니다.","summary":"틀린 부분: 특허법 제30조의 규정을 적용받을 수 없다\n바른 표현: 제30조 공지예외는 적용받을 수 있으나, 제3자의 독립적 출원은 다른 거절사유가 될 수 있다\n이유: 공지예외 적용 자체와 제3자의 선출원에 따른 별도 특허요건 심사를 혼동한 표현입니다.\n암기 결론: 공지예외 적용 가능 ≠ 등록 보장. 제3자의 확대된 선출원은 별도로 판단.","wrong":["특허법 제30조의 규정을 적용받을 수 없다"],"right":["제30조 공지예외는 적용받을 수 있으나, 제3자의 독립적 출원은 다른 거절사유가 될 수 있다"],"reason":["공지예외 적용 자체와 제3자의 선출원에 따른 별도 특허요건 심사를 혼동한 표현입니다."],"memory":["공지예외 적용 가능 ≠ 등록 보장. 제3자의 확대된 선출원은 별도로 판단."],"flags":[]},{"id":99,"area":"특허·실용신안","year":2008,"round":45,"page":42,"metadata":"2008년 제45회 / PDF p.103 / 교재 p.106 / 정답 ③ (ㄴ)","originalPdfPage":103,"bookPage":106,"answerKey":"③ (ㄴ)","question":"다음 보기 중 甲이 특허를 받을 수 없는 경우로만 묶인 것은? [단, 필요한 경우 甲이 특허법 제30조(공지 등이\n되지 아니한 발명으로 보는 경우)의 주장을 한 것으로 본다]","answer":"③ ㄴ\nㄴ. 甲은 암을 치료할 수 있는 획기적인 항암제를 발명하였고, 이 발명을 비밀리에 알아낸 직장동료인 乙이 이\n를 2017년 8월 20일 공개하였다. 이러한 사실을 알지 못한 丙은 甲과 동일한 발명을 하여 2017년 10월 19일 특\n허출원하였고 甲은 2018년 1월 21일 특허출원하였으며, 丙의 출원은 2018년 2월 14일 조기 공개되었다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 몰래 공개된 사정은 공지예외로 처리해도, 독립한 丙의 선출원·후공개가 甲을 막는다.","summary":"몰래 공개된 사정은 공지예외로 처리해도, 독립한 丙의 선출원·후공개가 甲을 막는다.","wrong":[],"right":["몰래 공개된 사정은 공지예외로 처리해도, 독립한 丙의 선출원·후공개가 甲을 막는다."],"reason":[],"memory":[],"flags":[]},{"id":100,"area":"특허·실용신안","year":2023,"round":60,"page":42,"metadata":"2023년 제60회 / PDF p.104 / 교재 p.107 / 정답 ①","originalPdfPage":104,"bookPage":107,"answerKey":"①","question":"발명 A에 대한 공지의 예외 주장을 할 수 없는 경우는? (다툼이 있으면 판례에 따름)","answer":"① 甲은 2021. 5. 15. 학회에서 발명 A를 공개하고 2021. 9. 15. 출원하였으나 출원서에 자기공지 예외문구를 누\n락하였다. 甲은 2021. 12. 15. 특허등록결정등본을 송달받았고, 설정등록 전인 2022. 3. 30. 소정의 수수료를 내\n고 자기공지 예외취지의 서류를 제출하였다.","correction":"틀린 부분: 2022. 3. 30.\n바른 표현: 송달일인 2021.12.15.로부터 3개월 이내에 보완해야 하므로 2022.3.30.은 늦다\n이유: 이 보완기간은 특허결정등본 송달 후 3개월 이내이고, 그보다 먼저 설정등록을 받으려면 그 날까지입니다.\n2022년 3월 30일은 2021년 12월 15일부터 3개월을 이미 넘겼으므로, 아직 등록 전이고 수수료를 냈다는 사정\n으로 기한을 되살릴 수 없습니다.\n암기 결론: 등록 전이라도 송달 후 3개월을 넘긴 공지예외 보완은 불가.","summary":"[틀린 표현 직접 수정]\n2022. 3. 30. → 송달일인 2021.12.15.로부터 3개월 이내에 보완해야 하므로 2022.3.30.은 늦다\n[암기 결론] 등록 전이라도 송달 후 3개월을 넘긴 공지예외 보완은 불가.","wrong":["2022. 3. 30."],"right":["송달일인 2021.12.15.로부터 3개월 이내에 보완해야 하므로 2022.3.30.은 늦다"],"reason":["이 보완기간은 특허결정등본 송달 후 3개월 이내이고, 그보다 먼저 설정등록을 받으려면 그 날까지입니다."],"memory":["등록 전이라도 송달 후 3개월을 넘긴 공지예외 보완은 불가."],"flags":[]},{"id":101,"area":"특허·실용신안","year":2009,"round":46,"page":43,"metadata":"2009년 제46회 / PDF p.105 / 교재 p.108 / 정답 ⑤","originalPdfPage":105,"bookPage":108,"answerKey":"⑤","question":"대학교수 甲은 세계 최초로 하이브리드카 엔진을 개발한 후 그 내용을 2017. 3. 4. A학회에서 서면으로 발표하\n였다. 한편, 乙은 A학회에 참석하여 甲이 개발한 하이브리드카 엔진이 자기가 그동안 비밀리에 연구해 온 하이\n브리드카 엔진과 동일한 기술구성을 가진 것임을 깨닫고 서둘러 자기의 명의로 하이브리드카 엔진에 관한 특\n허출원을 2017. 3. 10.에 하였으며, 甲은 이 하이브리드카 엔진에 관한 특허출원을 2017. 3. 11.에 하였다. 다음\n설명 중 옳은 것은? (甲의 발명과 乙의 발명은 실질적으로 동일하고, 모두 완성된 것으로 하여 설문 외의 별도\n의 사항은 고려하지 않는다)","answer":"⑤ 甲의 특허출원은 乙의 특허출원이 공개된 경우에 특허를 받을 수 없다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 먼저 발명·발표한 甲도, 독립 발명한 乙의 선출원·후공개에 막힐 수 있다.","summary":"먼저 발명·발표한 甲도, 독립 발명한 乙의 선출원·후공개에 막힐 수 있다.","wrong":[],"right":["먼저 발명·발표한 甲도, 독립 발명한 乙의 선출원·후공개에 막힐 수 있다."],"reason":[],"memory":[],"flags":[]},{"id":102,"area":"특허·실용신안","year":2021,"round":58,"page":43,"metadata":"2021년 제58회 / PDF p.106 / 교재 p.109 / 정답 ②, ④","originalPdfPage":106,"bookPage":109,"answerKey":"②, ④","question":"甲은 자신이 개발한 발명 A의 제품을 2019. 9. 1. 판매하였고, 그 판매 제품에 대해 고객의 의견을 받아서 발명\nA에 구성 B를 추가한 발명의 신제품(A+B)을 2020. 5. 1. 판매하였으며, 그 후 甲은 특허법 제30조(공지 등이 되\n지 아니한 발명으로 보는 경우)의 규정에 의하여 2020. 8. 1. 특허출원(제1항: A, 제2항: B)을 하였다. 다른 거절\n이유가 없는 경우 甲의 특허출원과 그 특허심사에 관한 설명으로 옳지 않은 것은?","answer":"② 甲은 특허법 제30조를 적용받고자 하는 취지를 특허출원서에 기재하고 이를 증명할 수 있는 서류를 2020.\n5. 1. 판매한 신제품(A+B)에 대해서만 제출하면 특허를 받을 수 있다.\n④ 丙이 甲의 판매제품을 인지하지 못한 상태에서 개발한 발명 B를 2020. 7. 1. 특허출원 한 경우, 甲은 제1항에\n대해서는 특허를 받을 수 있지만, 제2항에 대해서는 특허를 받을 수 없다.","correction":"틀린 부분: 2020. 5. 1. 판매한 신제품(A+B)에 대해서만\n바른 표현: 앞선 2019.9.1. A의 공개에 대한 처리 여부도 확인\n틀린 부분: 제2항에 대해서는 특허를 받을 수 없다\n바른 표현: 丙의 선출원이 미공개 상태로 거절 확정된다면 반드시 甲의 제2항이 막히는 것은 아니다\n이유: ②는 나중 판매만 공지예외로 처리하면 앞선 A 판매가 남는다는 문제입니다. ④는 丙이 먼저 출원했다는 이유\n만으로 甲의 B가 반드시 거절된다고 단정할 수 없다는 문제입니다. 교재의 전제처럼 丙의 출원이 공개 전에 거\n절확정되어 공개되지 않으면, 그 출원이 甲을 막는 일반 선출원·확대된 선출원의 지위를 갖지 못할 수 있습니다.\n암기 결론: 나중 공개만 예외 처리하면 앞선 공개가 남을 수 있다.\n먼저 출원했다는 사실만으로 타인의 후출원을 반드시 막는 것은 아니다.","summary":"[틀린 표현 직접 수정]\n2020. 5. 1. 판매한 신제품(A+B)에 대해서만 → 앞선 2019.9.1. A의 공개에 대한 처리 여부도 확인\n제2항에 대해서는 특허를 받을 수 없다 → 丙의 선출원이 미공개 상태로 거절 확정된다면 반드시 甲의 제2항이 막히는 것은 아니다\n[암기 결론] 나중 공개만 예외 처리하면 앞선 공개가 남을 수 있다.\n먼저 출원했다는 사실만으로 타인의 후출원을 반드시 막는 것은 아니다.","wrong":["2020. 5. 1. 판매한 신제품(A+B)에 대해서만","제2항에 대해서는 특허를 받을 수 없다"],"right":["앞선 2019.9.1. A의 공개에 대한 처리 여부도 확인","丙의 선출원이 미공개 상태로 거절 확정된다면 반드시 甲의 제2항이 막히는 것은 아니다"],"reason":["②는 나중 판매만 공지예외로 처리하면 앞선 A 판매가 남는다는 문제입니다. ④는 丙이 먼저 출원했다는 이유"],"memory":["나중 공개만 예외 처리하면 앞선 공개가 남을 수 있다.\n먼저 출원했다는 사실만으로 타인의 후출원을 반드시 막는 것은 아니다.","나중 공개만 예외 처리하면 앞선 공개가 남을 수 있다."],"flags":[]},{"id":103,"area":"특허·실용신안","year":2019,"round":56,"page":44,"metadata":"2019년 제56회 / PDF p.107 / 교재 p.110 / 정답 ②","originalPdfPage":107,"bookPage":110,"answerKey":"②","question":"甲은 2016년 3월 3일 발명 A가 기재된 논문을 공개학회에서 서면으로 발표하고, 2017년 3월 2일 발명 A에 대\n해서 특허출원을 하였다. 다음 설명 중 옳지 않은 것은?","answer":"② 甲이 2017년 3월 2일 특허출원서에 특허법 제30조 제1항 제1호의 적용을 받으려는 취지를 기재한 경우,\n2017년 4월 1일(토요일)까지 이를 증명할 수 있는 서류를 특허청장에게 제출하여야 한다.","correction":"틀린 부분: 2017년 4월 1일(토요일)까지\n바른 표현: 기간 마지막 날이 토요일이므로 2017년 4월 3일(월요일)까지\n이유: 증명서류의 원칙적인 제출기간은 출원일부터 30일 이내입니다. 그런데 계산한 마지막 날이 토요일이면 그 날\n로 끝나지 않고, 다음 날도 일요일이므로 이 사례에서는 4월 3일 월요일까지 제출할 수 있습니다.\n암기 결론: 2017. 4. 1. 토요일 → 4. 2. 일요일 → 제출기한 4. 3. 월요일.","summary":"[틀린 표현 직접 수정]\n2017년 4월 1일(토요일)까지 → 기간 마지막 날이 토요일이므로 2017년 4월 3일(월요일)까지\n[암기 결론] 2017. 4. 1. 토요일 → 4. 2. 일요일 → 제출기한 4. 3. 월요일.","wrong":["2017년 4월 1일(토요일)까지"],"right":["기간 마지막 날이 토요일이므로 2017년 4월 3일(월요일)까지"],"reason":["증명서류의 원칙적인 제출기간은 출원일부터 30일 이내입니다. 그런데 계산한 마지막 날이 토요일이면 그 날"],"memory":["2017. 4. 1. 토요일 → 4. 2. 일요일 → 제출기한 4. 3. 월요일."],"flags":[]},{"id":104,"area":"특허·실용신안","year":2015,"round":52,"page":44,"metadata":"2015년 제52회 / PDF p.108 / 교재 p.111 / 정답 ④","originalPdfPage":108,"bookPage":111,"answerKey":"④","question":"무권리자인 甲은 2012년 5월 10일에 발명 A를 출원하였고, 그 출원은 2013년 12월 10일에 출원공개 되었으며,\n2014년 5월 10일에 무권리자에 의한 출원이라는 이유로 거절결정이 확정되었다. 한편 무권리자인 乙은 2010\n년 6월 10일에 발명 B를 출원하였고, 그 출원은 2012년 1월 10일에 출원공개 되었으며, 2012년 10월 5일에 등\n록공고 되었으나, 무효심판이 제기되어 무권리자라는 이유로 2014년 9월 20일에 무효심결이 확정되었다. 다음\n설명 중 옳지 않은 것은? 단, 현재 법령에 따라 판단한다.","answer":"④ 발명 B의 정당한 권리자 丁이 2014년 10월 20일이 경과한 후 자신의 발명 B를 특허출원하였다면, 丁의 출원\n은 취하된 것으로 간주된다.","correction":"틀린 부분: 丁의 출원 은 취하된 것으로 간주된다\n바른 표현: 출원일 소급효를 인정받지 못할 뿐 그 출원이 곧바로 취하 간주되는 것은 아니다\n이유: 정당한 권리자가 정해진 기간을 넘겨 출원하면 무권리자의 출원일로 되돌려 주는 혜택을 받지 못합니다. 그것\n이 곧 새 출원 자체를 취하한 것으로 처리한다는 뜻은 아닙니다. 출원일 소급의 실패와 출원절차의 소멸을 구별\n해야 합니다.","summary":"[틀린 부분 → 바른 표현 → 이유]\n틀린 부분: 丁의 출원 은 취하된 것으로 간주된다\n바른 표현: 출원일 소급효를 인정받지 못할 뿐 그 출원이 곧바로 취하 간주되는 것은 아니다\n[암기 결론]\n제35조 기간을 넘긴 출원: 소급효 없음 ≠ 취하간주.","wrong":["丁의 출원 은 취하된 것으로 간주된다"],"right":["출원일 소급효를 인정받지 못할 뿐 그 출원이 곧바로 취하 간주되는 것은 아니다"],"reason":["정당한 권리자가 정해진 기간을 넘겨 출원하면 무권리자의 출원일로 되돌려 주는 혜택을 받지 못합니다. 그것"],"memory":["제35조 기간을 넘긴 출원: 소급효 없음 ≠ 취하간주."],"flags":[]},{"id":105,"area":"특허·실용신안","year":2015,"round":52,"page":44,"metadata":"2015년 제52회 / PDF p.109 / 교재 p.112 / 정답 ② (ㄱ, ㄴ)","originalPdfPage":109,"bookPage":112,"answerKey":"② (ㄱ, ㄴ)","question":"특허를 받을 수 있는 자 또는 무권리자의 특허출원에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있으면\n판례에 따름)","answer":"② ㄱ, ㄴ\nㄱ. 무권리자가 발명자의 발명의 구성을 일부 변경함으로써 그 기술적 구성이 발명자가 한 발명과 상이하게 되\n었다 하더라도, 그 변경이 그 기술분야에서 통상의 지식을 가진 사람이 보통으로 채용하는 정도의 기술적 구성\n의 부가·삭제·변경에 지나지 아니하고 그로 인하여 발명의 작용효과에 특별한 차이를 일으키지 아니하는 등 기\n술적 사상의 창작에 실질적으로 기여하지 않은 경우에는 그 특허발명은 무권리자의 특허출원에 해당하여 그\n등록이 무효이다.\nㄴ. 화학발명에서 예측가능성 내지 실현가능성이 현저히 부족하여 실험데이터가 제시된 실험예가 없으면 완성\n된 발명으로 보기 어려운 경우에는 실제 실험을 통하여 발명을 구체화하고 완성하는데 실질적으로 기여하였는\n지 여부의 관점에서 발명자인지의 여부를 결정해야 한다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 평범한 일부 변경만으로는 무권리자 문제가 사라지지 않는다.\n실험 의존적인 화학발명: 구체화·완성에 대한 실질적 기여로 발명자 판단.","summary":"평범한 일부 변경만으로는 무권리자 문제가 사라지지 않는다.\n실험 의존적인 화학발명: 구체화·완성에 대한 실질적 기여로 발명자 판단.","wrong":[],"right":["평범한 일부 변경만으로는 무권리자 문제가 사라지지 않는다."],"reason":[],"memory":[],"flags":[]},{"id":106,"area":"특허·실용신안","year":2016,"round":53,"page":45,"metadata":"2016년 제53회 / PDF p.110 / 교재 p.113 / 정답 ④","originalPdfPage":110,"bookPage":113,"answerKey":"④","question":"무권리자 甲은 발명 X를 2021년 11월 1일에 특허출원하였고, 그 출원은 2022년 10월 2일에 출원공개 되었으며\n2023년 3월 12일에 등록공고 되었다. 이 사건 특허발명은 원래 乙이 발명한 것으로서 乙이 특허를 받을 수 있\n는 권리를 가지고 있는데 乙이 甲에게 그 발명을 기술로 한 사업을 제안하면서 그 발명의 내용을 甲에게 알려\n준 것을 계기로 甲이 乙로부터 특허를 받을 수 있는 권리를 양도 받은 사실 없이 무단으로 특허출원하여 특허\n권의 설정등록을 받은 것이다. 乙은 甲의 특허발명 X에 대해 무권리자임을 이유로 무효심판을 청구하였고, 상\n기 무효심판의 무효심결이 2025년 3월 2일에 확정되었다. 다음 설명 중 옳지 않은 것은? (다툼이 있으면 판례\n에 따름)","answer":"④ 乙이 발명 X를 2025년 3월 13일에 특허출원하였다면, 乙의 출원은 특허를 받을 수 없다.","correction":"틀린 부분: 乙의 출원은 특허를 받을 수 없다\n바른 표현: 교재 기준 개정법에서는 등록공고 후 2년 경과만으로 정당권리자 출원을 배제하지 않는다\n이유: 교재는 종전 2년 제한이 삭제되었고 무효심결 확정 후 기간을 따져야 한다고 설명합니다. 판례·개정 시점 독립 확인 필요.","summary":"틀린 부분: 乙의 출원은 특허를 받을 수 없다\n바른 표현: 교재 기준 개정법에서는 등록공고 후 2년 경과만으로 정당권리자 출원을 배제하지 않는다\n이유: 교재는 종전 2년 제한이 삭제되었고 무효심결 확정 후 기간을 따져야 한다고 설명합니다. 판례·개정 시점 독립 확인 필요.\n암기 결론: 제35조: 삭제된 등록공고 후 2년 제한을 적용하지 말 것. 확정 후 30일 기준 확인.","wrong":["乙의 출원은 특허를 받을 수 없다"],"right":["교재 기준 개정법에서는 등록공고 후 2년 경과만으로 정당권리자 출원을 배제하지 않는다"],"reason":["교재는 종전 2년 제한이 삭제되었고 무효심결 확정 후 기간을 따져야 한다고 설명합니다. 판례·개정 시점 독립 확인 필요."],"memory":["제35조: 삭제된 등록공고 후 2년 제한을 적용하지 말 것. 확정 후 30일 기준 확인."],"flags":["원문 판독·검증 필요"]},{"id":107,"area":"특허·실용신안","year":2022,"round":59,"page":45,"metadata":"2022년 제59회 / PDF p.111 / 교재 p.114 / 정답 ①","originalPdfPage":111,"bookPage":114,"answerKey":"①","question":"특허출원 절차에 관한 설명으로 옳지 않은 것은?","answer":"① 특허출원인의 의사에 반한 공지가 있어 이를 주장하고자 하는 경우, 특허출원시에 그 취지와 증거자료를 제\n출하여야 하나, 보완수수료를 납부하면 보정 기간에 그 취지를 적은 서류 또는 이를 증명할 수 있는 서류를 제\n출할 수 있다.","correction":"틀린 부분: 의사에 반한 공지가 있어 이를 주장하고자 하는 경우, 특허출원시에 그 취지와 증거자료를 제출하여야\n바른 표현: 의사에 반한 공지는 자기공지와 같은 출원서 취지 기재·증명서류 제출 형식요건을 요구하지 않음\n이유: 출원서에 취지를 적고 정해진 기간에 증명서류를 제출하는 절차는 자기공지인 제1항 제1호에 관한 것입니다.\n보기의 의사에 반한 공지는 제1항 제2호이므로 같은 형식적 절차를 요구하지 않습니다. 그렇다고 의사에 반한\n공개였다는 사실 자체를 다툴 때 입증이 전혀 필요 없다는 뜻은 아닙니다.\n암기 결론: 자기공지의 취지 기재·증명서류 제출 절차를 의사에 반한 공지에 그대로 적용하지 말 것.","summary":"[틀린 표현 직접 수정]\n의사에 반한 공지가 있어 이를 주장하고자 하는 경우, 특허출원시에 그 취지와 증거자료를 제출하여야 → 의사에 반한 공지는 자기공지와\n같은 출원서 취지 기재·증명서류 제출 형식요건을 요구하지 않음\n[암기 결론] 자기공지의 취지 기재·증명서류 제출 절차를 의사에 반한 공지에 그대로 적용하지 말 것.","wrong":["의사에 반한 공지가 있어 이를 주장하고자 하는 경우, 특허출원시에 그 취지와 증거자료를 제출하여야"],"right":["의사에 반한 공지는 자기공지와 같은 출원서 취지 기재·증명서류 제출 형식요건을 요구하지 않음"],"reason":["출원서에 취지를 적고 정해진 기간에 증명서류를 제출하는 절차는 자기공지인 제1항 제1호에 관한 것입니다."],"memory":["자기공지의 취지 기재·증명서류 제출 절차를 의사에 반한 공지에 그대로 적용하지 말 것."],"flags":[]},{"id":108,"area":"특허·실용신안","year":2024,"round":61,"page":46,"metadata":"2024년 제61회 / PDF p.112 / 교재 p.115 / 정답 ⑤","originalPdfPage":112,"bookPage":115,"answerKey":"⑤","question":"무권리자의 특허출원 등에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","answer":"⑤ 이전등록된 특허권에 대하여 이전등록 당시에 전용실시권을 취득하고 등록을 받은 자가 특허권의 이전청구\n에 따른 특허권의 이전등록이 있기 전에 해당 특허가 무효심판 대상임을 알지 못하고 국내에서 해당 발명의 실\n시사업을 준비하고 있는 경우에 그 준비를 하고 있는 발명 및 사업목적의 범위에서 그 특허권에 대하여 통상실\n시권을 가진다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 이전등록 전 선의의 국내 실시 준비 + 등록 전용실시권자 → 준비한 발명·사업목적 범위의 통상실시권.","summary":"이전등록 전 선의의 국내 실시 준비 + 등록 전용실시권자 → 준비한 발명·사업목적 범위의 통상실시권.","wrong":[],"right":["이전등록 전 선의의 국내 실시 준비 + 등록 전용실시권자 → 준비한 발명·사업목적 범위의 통상실시권."],"reason":[],"memory":[],"flags":[]},{"id":109,"area":"특허·실용신안","year":2010,"round":47,"page":46,"metadata":"2010년 제47회 / PDF p.113 / 교재 p.116 / 정답 ③ (ㄴ, ㄹ)","originalPdfPage":113,"bookPage":116,"answerKey":"③ (ㄴ, ㄹ)","question":"보정에 관한 설명으로 옳지 않은 것으로만 묶인 것은? (단, 각 출원은 2015. 1. 1. 이후에 이루어지는 것을 전제\n로 한다)","answer":"③ ㄴ, ㄹ\nㄴ. 최후 거절이유통지에 따른 보정 및 재심사 청구에 수반한 보정 시 구성요소의 직렬적 부가로 청구범위가 감\n축되더라도 실질적으로 청구범위가 변경되면 보정이 허용되지 않는다.\nㄹ. 특허거절결정에 대하여 특허법 제67조의2(재심사의 청구) 제1항에 따른 출원인의 재심사 청구가 있다는 사\n실만으로 종전에 이루어진 특허거절결정이 취소되는 것은 아니다.","correction":"틀린 부분: 실질적으로 청구범위가 변경되면 보정이 허용되지 않는다\n바른 표현: 실질적 변경 여부 자체는 교재 기준에서 보정의 적법 요건이 아니다\n틀린 부분: 종전에 이루어진 특허거절결정이 취소되는 것은 아니다\n바른 표현: 재심사청구가 있으면 종전 특허거절결정은 취소된 것으로 본다\n이유: ㄴ은 삭제된 구법의 제한을 그대로 적용한 문장입니다. 실질적 청구범위 변경이라는 이유만으로 보정을 금지할\n수는 없지만, 신규사항 추가 금지 등 나머지 보정요건은 여전히 지켜야 합니다. ㄹ은 적법하게 재심사를 청구\n하면 종전 결정이 취소된 것으로 보아 다시 심사한다는 점을 뒤집은 문장입니다.","summary":"[틀린 부분 → 바른 표현 → 이유]\n틀린 부분: 실질적으로 청구범위가 변경되면 보정이 허용되지 않는다\n바른 표현: 실질적 변경 여부 자체는 교재 기준에서 보정의 적법 요건이 아니다\n틀린 부분: 종전에 이루어진 특허거절결정이 취소되는 것은 아니다\n바른 표현: 재심사청구가 있으면 종전 특허거절결정은 취소된 것으로 본다\n[암기 결론]\n삭제된 '실질적 청구범위 변경 금지'를 독립 요건으로 적용하지 말 것.\n재심사 청구 → 종전 결정 취소간주.","wrong":["실질적으로 청구범위가 변경되면 보정이 허용되지 않는다","종전에 이루어진 특허거절결정이 취소되는 것은 아니다"],"right":["실질적 변경 여부 자체는 교재 기준에서 보정의 적법 요건이 아니다","재심사청구가 있으면 종전 특허거절결정은 취소된 것으로 본다"],"reason":["ㄴ은 삭제된 구법의 제한을 그대로 적용한 문장입니다. 실질적 청구범위 변경이라는 이유만으로 보정을 금지할"],"memory":["삭제된 '실질적 청구범위 변경 금지'를 독립 요건으로 적용하지 말 것.\n재심사 청구 → 종전 결정 취소간주."],"flags":[]},{"id":110,"area":"특허·실용신안","year":2011,"round":48,"page":47,"metadata":"2011년 제48회 / PDF p.114 / 교재 p.117 / 정답 ③ (ㄴ, ㄷ)","originalPdfPage":114,"bookPage":117,"answerKey":"③ (ㄴ, ㄷ)","question":"특허출원의 보정에 관하여 옳지 않은 것만을 모두 고른 것은?","answer":"③ ㄴ, ㄷ\nㄴ. 특허출원인이 최후거절이유통지에 대한 의견서제출기간 내에, 신규사항을 추가하지는 않았으나 특허청구\n범위를 확장하는 보정을 하여 특허등록이 된 경우, 위 보정이 위법하다는 사유로 특허무효심판을 청구할 수 있\n다.\nㄷ. 특허출원인이 최후거절이유통지에 대한 의견서제출기간 내에 청구항을 삭제하여 특허청구범위를 감축하는\n보정을 한 경우에 심사관은 그 보정에 따라 새로운 거절이유가 발생한 경우 서면으로 이유를 붙여 그 보정에\n대해 직권으로 각하 결정할 수 있다.","correction":"틀린 부분: 특허무효심판을 청구할 수 있 다\n바른 표현: 제47조 제3항 보정범위 위반 자체는 특허무효사유가 아니다\n틀린 부분: 직권으로 각하 결정할 수 있다\n바른 표현: 청구항 삭제 보정은 새로운 거절이유가 생겨도 보정각하하지 않는다\n이유: ㄴ은 심사 중 보정 제한을 위반한 것과 등록 후 특허를 무효로 할 수 있는 사유를 혼동했습니다. 제47조 제3항\n위반 자체는 무효사유가 아닙니다. ㄷ은 청구항 삭제 보정에 관한 예외로, 삭제 때문에 새 거절이유가 생겼다면\n곧바로 보정을 각하하지 않고 거절이유를 알려 대응 기회를 주는 취지입니다.","summary":"[틀린 부분 → 바른 표현 → 이유]\n틀린 부분: 특허무효심판을 청구할 수 있 다\n바른 표현: 제47조 제3항 보정범위 위반 자체는 특허무효사유가 아니다\n틀린 부분: 직권으로 각하 결정할 수 있다\n바른 표현: 청구항 삭제 보정은 새로운 거절이유가 생겨도 보정각하하지 않는다\n[암기 결론]\n제47조 제3항 위반 자체 ≠ 특허무효사유.\n청구항 삭제로 새 거절이유 발생 → 그 이유만으로 보정각하하지 않음.","wrong":["특허무효심판을 청구할 수 있 다","직권으로 각하 결정할 수 있다"],"right":["제47조 제3항 보정범위 위반 자체는 특허무효사유가 아니다","청구항 삭제 보정은 새로운 거절이유가 생겨도 보정각하하지 않는다"],"reason":["ㄴ은 심사 중 보정 제한을 위반한 것과 등록 후 특허를 무효로 할 수 있는 사유를 혼동했습니다. 제47조 제3항"],"memory":["제47조 제3항 위반 자체 ≠ 특허무효사유.\n청구항 삭제로 새 거절이유 발생 → 그 이유만으로 보정각하하지 않음."],"flags":[]},{"id":111,"area":"특허·실용신안","year":2012,"round":49,"page":48,"metadata":"2012년 제49회 / PDF p.115 / 교재 p.118 / 정답 ②","originalPdfPage":115,"bookPage":118,"answerKey":"②","question":"보정에 관한 설명으로 옳은 것은?","answer":"② 하나의 청구항에 기재된 2이상의 발명 중 일부에 대해서 의견제출통지서를 받아 이를 해소시키기 위한 보정\n을 했고 심사관이 그 청구항의 나머지 발명에 대해서 다시 거절이유를 통지한 경우 이는 최초거절이유 통지에\n해당한다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 통지 횟수보다 원인: 보정과 무관하게 원래 있던 거절이유 → 최초거절이유통지.","summary":"통지 횟수보다 원인: 보정과 무관하게 원래 있던 거절이유 → 최초거절이유통지.","wrong":[],"right":["통지 횟수보다 원인: 보정과 무관하게 원래 있던 거절이유 → 최초거절이유통지."],"reason":[],"memory":[],"flags":[]},{"id":112,"area":"특허·실용신안","year":2017,"round":54,"page":48,"metadata":"2017년 제54회 / PDF p.116 / 교재 p.119 / 정답 ④","originalPdfPage":116,"bookPage":119,"answerKey":"④","question":"특허법상 보정에 관한 설명으로 옳지 않은 것은?","answer":"④ 출원인이 거절이유통지서에 지정된 기간 내에 한 명세서에 대한 보정이 출원서에 최초로 첨부한 명세서 또\n는 도면에 기재한 사항의 범위를 벗어나는 것이라면 심사관은 그 보정을 각하해야 한다.","correction":"틀린 부분: 심사관은 그 보정을 각하해야 한다\n바른 표현: 최초거절이유통지 대응 중의 신규사항 추가이면 최후거절이유통지, 최후거절이유통지 대응 중이면 보정각하를 구별\n이유: 신규사항을 추가한 보정은 잘못이지만, 언제 한 보정인지에 따라 처리 방법이 다릅니다. 최초 통지에 대응한 보\n정이라면 최후거절이유를 통지하고, 최후 통지에 대응한 보정이라면 보정을 각하하므로, 보기처럼 언제나 각하\n한다고 할 수 없습니다.","summary":"[틀린 부분 → 바른 표현 → 이유]\n틀린 부분: 심사관은 그 보정을 각하해야 한다\n바른 표현: 최초거절이유통지 대응 중의 신규사항 추가이면 최후거절이유통지, 최후거절이유통지 대응 중이면 보정각하를 구별\n[암기 결론]\n신규사항 추가: 최초 통지 대응 보정 → 최후 통지 / 최후 통지 대응 보정 → 각하.","wrong":["심사관은 그 보정을 각하해야 한다"],"right":["최초거절이유통지 대응 중의 신규사항 추가이면 최후거절이유통지, 최후거절이유통지 대응 중이면 보정각하를 구별"],"reason":["신규사항을 추가한 보정은 잘못이지만, 언제 한 보정인지에 따라 처리 방법이 다릅니다. 최초 통지에 대응한 보"],"memory":["신규사항 추가: 최초 통지 대응 보정 → 최후 통지 / 최후 통지 대응 보정 → 각하."],"flags":[]},{"id":113,"area":"특허·실용신안","year":2021,"round":58,"page":48,"metadata":"2021년 제58회 / PDF p.117 / 교재 p.120 / 정답 ④","originalPdfPage":117,"bookPage":120,"answerKey":"④","question":"특허 명세서 및 도면의 보정에 관한 설명으로 옳은 것은?","answer":"④ 거절결정에 대한 재심사청구에서는 보정을 하여야 하며, 이 경우에는 청구항을 신설할 수 없지만, 청구항의\n구성 A에 발명의 설명에 기재된 하위개념의 구성 'a'를 직렬 부가하는 'A+a'로 보정할 수 있다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: A → A+a의 직렬적 부가: 청구범위 감축.\n청구항 신설을 일률적으로 금지한다고 암기하지 말 것 — 교재도 유보한 표현.","summary":"A → A+a의 직렬적 부가: 청구범위 감축.\n청구항 신설을 일률적으로 금지한다고 암기하지 말 것 — 교재도 유보한 표현.","wrong":[],"right":["A → A+a의 직렬적 부가: 청구범위 감축."],"reason":[],"memory":[],"flags":[]},{"id":114,"area":"특허·실용신안","year":2010,"round":50,"page":49,"metadata":"2010년 제50회(교재 표기) / PDF p.118 / 교재 p.121 / 정답 ②","originalPdfPage":118,"bookPage":121,"answerKey":"②","question":"특허출원의 보정에 관한 설명으로 옳지 않은 것은?","answer":"② 특허법 제67조의2(재심사의 청구)에 따른 재심사의 청구가 있는 경우에 그 청구 전에 한 보정이 부적법한\n경우에는 보정각하 하여야 한다.","correction":"틀린 부분: 보정각하 하여야 한다\n바른 표현: 재심사청구 전에 한 부적법 보정은 교재 기준 최후거절이유통지 대상\n이유: 재심사가 시작된 뒤에는 재심사 청구 전에 했던 보정을 뒤늦게 각하하는 방식으로 처리하지 않습니다. 교재 사\n례에서는 그 보정의 문제를 최후거절이유로 알려 대응하게 하므로, '보정각하하여야 한다'가 틀립니다.","summary":"[틀린 부분 → 바른 표현 → 이유]\n틀린 부분: 보정각하 하여야 한다\n바른 표현: 재심사청구 전에 한 부적법 보정은 교재 기준 최후거절이유통지 대상\n[암기 결론]\n재심사 청구 전의 부적법한 보정: 재심사에서 뒤늦게 각하하지 않고 최후거절이유 통지.","wrong":["보정각하 하여야 한다"],"right":["재심사청구 전에 한 부적법 보정은 교재 기준 최후거절이유통지 대상"],"reason":["재심사가 시작된 뒤에는 재심사 청구 전에 했던 보정을 뒤늦게 각하하는 방식으로 처리하지 않습니다. 교재 사"],"memory":["재심사 청구 전의 부적법한 보정: 재심사에서 뒤늦게 각하하지 않고 최후거절이유 통지."],"flags":[]},{"id":115,"area":"특허·실용신안","year":2020,"round":57,"page":49,"metadata":"2020년 제57회 / PDF p.119 / 교재 p.122 / 정답 ④","originalPdfPage":119,"bookPage":122,"answerKey":"④","question":"특허법 제51조(보정각하)에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"④ 미완성발명을 이유로 하는 최초거절이유를 통지함에 따라 이를 해소하기 위하여 미완성발명을 완성시키는\n보정을 한 경우라고 심사관이 인정하면 결정으로 그 보정을 각하하여야 한다.","correction":"틀린 부분: 그 보정을 각하하여야 한다\n바른 표현: 최초거절이유에 대응한 신규사항 보정은 곧바로 각하할 것이 아니라 최후거절이유통지로 다룸\n이유: 원래 없던 내용을 넣어 발명을 완성했다면 신규사항 추가 문제가 생깁니다. 그러나 최초 명세서·도면에 이미 완\n성된 내용이 있었다면 그 범위 안의 보정으로 문제를 해결할 수 있습니다. 더욱이 최초 통지에 대응한 보정이므\n로, 신규사항을 추가했더라도 곧바로 보정각하가 아니라 최후거절이유통지로 처리한다는 점이 핵심입니다.\n암기 결론: 최초 자료에 완성발명이 있는지 먼저 확인.\n최초 통지 대응 보정의 신규사항 추가 → 곧바로 각하 X, 최후 통지.","summary":"[틀린 표현 직접 수정]\n그 보정을 각하하여야 한다 → 최초거절이유에 대응한 신규사항 보정은 곧바로 각하할 것이 아니라 최후거절이유통지로 다룸\n[암기 결론] 최초 자료에 완성발명이 있는지 \n인해야만 취소할 수 있는 것은 아닙니다.","summary":"[틀린 부분 → 바른 표현 → 이유]\n틀린 부분: 이 역시 위법한 경우에만 심결을 취소할 수 있다\n바른 표현: 보정각하결정이 위법하면 법원은 그 사유만으로 심결을 취소해야 한다\n[암기 결론]\n이 사례의 보정각하가 위법 → 그 이유로 심결 취소. 보정 후 출원을 법원이 대신 심사할 필요 없음.","wrong":["이 역시 위법한 경우에만 심결을 취소할 수 있다"],"right":["보정각하결정이 위법하면 법원은 그 사유만으로 심결을 취소해야 한다"],"reason":["보정을 잘못 각하했다면, 보정 전 내용만 심사한 절차에 이미 문제가 있습니다. 법원은 보정각하가 위법하다는"],"memory":["이 사례의 보정각하가 위법 → 그 이유로 심결 취소. 보정 후 출원을 법원이 대신 심사할 필요 없음."],"flags":[]},{"id":118,"area":"특허·실용신안","year":2024,"round":61,"page":51,"metadata":"2024년 제61회 / PDF p.122 / 교재 p.125 / 정답 ③","originalPdfPage":122,"bookPage":125,"answerKey":"③","question":"특허법상 보정 및 보정각하에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"③ 국제특허출원의 출원인이 제203조(서면의 제출) 제3항에 따른 보정명령을 받고 지정된 기간에 보정을 하지\n아니하면 특허청장은 해당 국제특허출원을 무효로 하여야 한다.","correction":"틀린 부분: 무효로 하여야 한다\n바른 표현: 무효로 할 수 있다(재량)\n이유: 이 조문은 기간 안에 보정하지 않았을 때 무효로 할 수 있는 권한을 줍니다. 반드시 무효로 해야 한다고 정한\n것이 아니므로, 보기의 '하여야 한다'가 틀립니다.","summary":"[틀린 부분 → 바른 표현 → 이유]\n틀린 부분: 무효로 하여야 한다\n바른 표현: 무효로 할 수 있다(재량)\n[암기 결론]\n제203조 보정명령 불이행: 무효로 하여야 한다 X → 무효로 할 수 있다 O.","wrong":["무효로 하여야 한다"],"right":["무효로 할 수 있다(재량)"],"reason":["이 조문은 기간 안에 보정하지 않았을 때 무효로 할 수 있는 권한을 줍니다. 반드시 무효로 해야 한다고 정한"],"memory":["제203조 보정명령 불이행: 무효로 하여야 한다 X → 무효로 할 수 있다 O."],"flags":[]},{"id":119,"area":"특허·실용신안","year":2010,"round":null,"page":51,"metadata":"2010년 / 회차 판독 불명확 / PDF p.123 / 교재 p.126 / 정답 ② (ㄴ, ㄹ)","originalPdfPage":123,"bookPage":126,"answerKey":"② (ㄴ, ㄹ)","question":"분할출원에 관한 설명으로 옳은 것을 모두 고른 것은?","answer":"② ㄴ, ㄹ\nㄴ. 특허법 제52조(분할출원) 제1항의 규정에 의한 분할출원으로 인하여 청구범위가 중복되지 않도록 원특허출\n원의 내용을 보정할 필요가 있는 경우에는 원특허출원서에 첨부된 명세서 등을 보정하여야 한다.\nㄹ. 원출원이 특허법 제54조(조약에 의한 우선권 주장)의 규정에 의한 우선권을 주장하고 있는 경우에 그 특허\n출원서에 그 취지, 최초로 출원한 국명 및 출원의 연월일을 기재하여야 하나, 분할출원서에는 그 취지, 최초로\n출원한 국명 및 출원의 연월일을 직접 기재할 필요는 없다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 원출원·분할출원의 청구범위 중복 → 필요한 원출원 보정.\n우선권 주장한 원출원에서 분할 → 분할출원도 우선권 주장 간주.","summary":"원출원·분할출원의 청구범위 중복 → 필요한 원출원 보정.\n우선권 주장한 원출원에서 분할 → 분할출원도 우선권 주장 간주.","wron
