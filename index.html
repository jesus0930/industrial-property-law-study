d":554,"area":"디자인","year":2013,"round":50,"page":204,"metadata":"2013년 제50회 / PDF p.608 / 교재 p.612 / 정답 ⑤","originalPdfPage":608,"bookPage":612,"answerKey":"⑤","question":"디자인의 유사여부를 판단하는 기준으로 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"⑤ 디자인의 유사 여부는 이를 구성하는 각 요소를 분리하여 개별적으로 대비할 것이 아니라 그 외관을 전체적으로 대비 관찰하여 보는\n사람으로 하여금 상이한 심미감을 느끼게 하는지의 여부에 따라 판단하여야 하므로, 보는 방향에 따라 느껴지는 미감이 같기도 하고\n다르기도 할 경우에는 그 미감이 다르게 느껴지는 방향으로 두고 이를 대비하여 유사 여부를 판단한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 디자인 유사 판단: 전체적 대비관찰. 방향에 따라 미감이 달라지면 같게 느껴지는 방향으로 대비.","summary":"디자인 유사 판단: 전체적 대비관찰. 방향에 따라 미감이 달라지면 같게 느껴지는 방향으로 대비.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":555,"area":"디자인","year":2015,"round":52,"page":205,"metadata":"2015년 제52회 / PDF p.609 / 교재 p.613 / 정답 ④","originalPdfPage":609,"bookPage":613,"answerKey":"④","question":"디자인의 유사 판단에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"④ 디자인의 유사 여부는 이를 구성하는 각 요소를 분리하여 개별적으로 대비할 것이 아니라 그 외관을 전체적으로 대비 관찰하여 보는\n사람으로 하여금 상이한 심미감을 느끼게 하는지의 여부에 따라 판단하여야 하고, 이 경우 그 디자인이 표현된 물품을 사용할 때의\n외관이 아니라 거래할 때의 외관에 의한 심미감을 고려하여야 한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 디자인 유사 판단: 사용 시 외관뿐 아니라 거래 시 외관의 심미감도 함께 고려.","summary":"디자인 유사 판단: 사용 시 외관뿐 아니라 거래 시 외관의 심미감도 함께 고려.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":556,"area":"디자인","year":2016,"round":53,"page":205,"metadata":"2016년 제53회 / PDF p.610 / 교재 p.614 / 정답 ③","originalPdfPage":610,"bookPage":614,"answerKey":"③","question":"디자인의 유사 여부 판단에 관한 설명으로 옳지 않은 것은?","answer":"③ 공지된 부분을 이용한 완성품은 그 부분이 공지된 것을 이유로 거절한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 일부 공지 + 새로운 창작이 포함된 완성품 → 일부 공지만으로 신규성 상실 아님.","summary":"일부 공지 + 새로운 창작이 포함된 완성품 → 일부 공지만으로 신규성 상실 아님.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":557,"area":"디자인","year":2018,"round":55,"page":205,"metadata":"2018년 제55회 / PDF p.611 / 교재 p.615 / 정답 ④","originalPdfPage":611,"bookPage":615,"answerKey":"④","question":"디자인의 유사여부 판단에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"④ 디자인의 구성요소 중 공지의 형상부분이 있는 경우 특별한 심미감을 불러일으키는 요소가 되지 못하는 것이 아닌 한 그것을 포함하여\n전체로서 관찰하여 느껴지는 심미감에 따라 유사판단을 하며, 권리범위를 정함에 있어서도 심미감을 고려하여야 하므로 그 부분에 대한\n중요도를 낮게 평가하지 않는다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 디자인 유사: 공지 형상도 전체 관찰 가능 / 권리범위: 공지 부분 중요도는 낮게 평가.","summary":"디자인 유사: 공지 형상도 전체 관찰 가능 / 권리범위: 공지 부분 중요도는 낮게 평가.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":558,"area":"디자인","year":2020,"round":57,"page":205,"metadata":"2020년 제57회 / PDF p.612 / 교재 p.616 / 정답 ④","originalPdfPage":612,"bookPage":616,"answerKey":"④","question":"디자인의 유사여부 판단에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"④ 대비되는 디자인의 대상 물품들이 다같이 그 기능 내지 속성상 사용에 의하여 당연히 형태의 변화가 일어나는 경우에 그 디자인의 유사\n여부는 형태의 변화 전후에 따라 서로 변화된 상태에서 각각 대비한 다음 이를 세부적인 부분으로 나누어 판단하여야 한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 형태 변화 물품의 디자인 유사: 변화 전후 같은 상태끼리 비교하고 전체 관찰.","summary":"형태 변화 물품의 디자인 유사: 변화 전후 같은 상태끼리 비교하고 전체 관찰.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":559,"area":"디자인","year":2008,"round":45,"page":206,"metadata":"2008년 제45회 / PDF p.613 / 교재 p.617 / 정답 ③","originalPdfPage":613,"bookPage":617,"answerKey":"③","question":"디자인의 신규성 판단에 관한 설명 중 옳은 것은?","answer":"③ 자전거의 디자인이 공개된 후 그 자전거에 부착된 페달과 유사한 자전거용 페달 디자인이 출원된 경우 그 자전거용 페달 디자인은\n신규성을 상실하여 디자인등록을 받을 수 없다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 완성품 공개로 부착 부품이 공지될 수 있음 → 유사 부품디자인 신규성 상실 가능.","summary":"완성품 공개로 부착 부품이 공지될 수 있음 → 유사 부품디자인 신규성 상실 가능.","wrong":[],"right":["완성품 공개로 부착 부품이 공지될 수 있음 → 유사 부품디자인 신규성 상실 가능."],"reason":[],"memory":[],"flags":[]},{"id":560,"area":"디자인","year":2011,"round":48,"page":206,"metadata":"2011년 제48회 / PDF p.614 / 교재 p.618 / 정답 ④","originalPdfPage":614,"bookPage":618,"answerKey":"④","question":"디자인의 등록요건에 관한 설명으로 옳은 것은? (단, 디자인등록출원은 디자인심사등록출원이며, 언급한 경우 이외에는 신규성상실의\n예외규정의 적용을 받지 않고, 우선권주장을 수반하지 아니하며 출원의 분할이나 보정이 없는 것으로 한다)","answer":"④ 디자인과 교수가 스스로 창작한 디자인의 전부를 가지고 강의실에서 학생들에게 강의한 후 디자인등록출원 한 경우, 그 디자인은\n디자인등록출원 전에 공지된 디자인에 해당한다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 비밀유지의무 없는 학생들에게 디자인 전부를 강의에서 공개 → 출원 전 공지 인정.","summary":"비밀유지의무 없는 학생들에게 디자인 전부를 강의에서 공개 → 출원 전 공지 인정.","wrong":[],"right":["비밀유지의무 없는 학생들에게 디자인 전부를 강의에서 공개 → 출원 전 공지 인정."],"reason":[],"memory":[],"flags":[]},{"id":561,"area":"디자인","year":2014,"round":51,"page":206,"metadata":"2014년 제51회 / PDF p.615 / 교재 p.619 / 정답 ④","originalPdfPage":615,"bookPage":619,"answerKey":"④","question":"디자인의 신규성 판단에 관한 설명으로 옳은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"④ 부품제조자가 자동차회사로부터 형식승인을 받기 위하여 위 회사에 디자인에 관한 제작도면을 첨부하여 제출한 형식승인의뢰서는\n공개의 목적으로 만들어진 간행물이라 볼 수 없고 이로써 반포된 것이라고 볼 수 없다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 형식승인 목적의 특정 회사 제출 서류 → 그 자체로 공개·반포된 간행물은 아님.","summary":"형식승인 목적의 특정 회사 제출 서류 → 그 자체로 공개·반포된 간행물은 아님.","wrong":[],"right":["형식승인 목적의 특정 회사 제출 서류 → 그 자체로 공개·반포된 간행물은 아님."],"reason":[],"memory":[],"flags":[]},{"id":562,"area":"디자인","year":2015,"round":52,"page":207,"metadata":"2015년 제52회 / PDF p.616 / 교재 p.620 / 정답 ③","originalPdfPage":616,"bookPage":620,"answerKey":"③","question":"디자인보호법상 신규성에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"③ 甲(디자인권자)에게 등록디자인의 창작을 의뢰한 회사 및 그 직원은 신의칙상 등록디자인이 표현된 카세트테이프 수납케이스 완제품\n샘플에 관하여 비밀로 할 의무가 있지만, 양 당사자 사이에 카세트테이프 수납케이스 제품 개발에 관하여 경쟁관계가 있었다면\n비밀유지의무가 없으므로 등록디자인이 출원 전에 공지되었다고 보아야 한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 창작 의뢰 회사·직원의 비밀유지의무 → 경쟁관계만으로 사라지지 않음 / 그 사정만으로 공지 불인정.","summary":"창작 의뢰 회사·직원의 비밀유지의무 → 경쟁관계만으로 사라지지 않음 / 그 사정만으로 공지 불인정.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":563,"area":"디자인","year":2003,"round":40,"page":207,"metadata":"2003년 제40회 / PDF p.617 / 교재 p.621 / 정답 ⑤","originalPdfPage":617,"bookPage":621,"answerKey":"⑤","question":"특유디자인의 신규성 판단에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"⑤ 전사지(轉寫紙)가 공지된 경우라면 그 전사지의 모양이 전사된 물품의 디자인도 신규성이 상실된다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 전사지 공지 ≠ 그 무늬가 전사된 비유사 물품 디자인의 신규성 자동 상실.","summary":"전사지 공지 ≠ 그 무늬가 전사된 비유사 물품 디자인의 신규성 자동 상실.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":564,"area":"디자인","year":2012,"round":49,"page":207,"metadata":"2012년 제49회 / PDF p.618 / 교재 p.622 / 정답 ③","originalPdfPage":618,"bookPage":622,"answerKey":"③","question":"디자인보호법상 용이창작에 관한 설명으로 옳지 않은 것은?","answer":"③ 디자인보호법 제33조(디자인등록의 요건) 제2항에서 규정한 용이창작은 동일 또는 유사물품 간에만 판단하며, 비유사물품 간에는\n용이창작 여부를 판단하지 아니한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 디자인의 용이창작 판단 → 동일·유사물품으로만 제한하지 않음.","summary":"디자인의 용이창작 판단 → 동일·유사물품으로만 제한하지 않음.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":565,"area":"디자인","year":2013,"round":50,"page":208,"metadata":"2013년 제50회 / PDF p.619 / 교재 p.623 / 정답 ⑤","originalPdfPage":619,"bookPage":623,"answerKey":"⑤","question":"디자인의 등록요건에 관한 설명으로 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"⑤ 디자인보호법 제33조(디자인등록의 요건) 제2항은 그 디자인이 속하는 분야에서 통상의 지식을 가진 자가 제33조 제1항 제1호 또는\n제2호에 해당하는 디자인의 결합에 의하여 용이하게 창작할 수 있는 경우에 적용하고, 여기에는 위 각 호에 해당하는 디자인 각각에\n의하여 용이하게 창작할 수 있는 디자인은 포함되지 않는다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 용이창작 → 공지 디자인 여러 개의 결합뿐 아니라 개별 디자인에서 쉽게 창작한 경우도 포함.","summary":"용이창작 → 공지 디자인 여러 개의 결합뿐 아니라 개별 디자인에서 쉽게 창작한 경우도 포함.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":566,"area":"디자인","year":2015,"round":52,"page":208,"metadata":"2015년 제52회 / PDF p.620 / 교재 p.624 / 정답 ⑤","originalPdfPage":620,"bookPage":624,"answerKey":"⑤","question":"디자인의 창작성 판단에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"⑤ 디자인보호법이 요구하는 객관적 창작성이라면 고도의 창작성, 즉 과거 또는 현존의 모든 것과 유사하지 아니한 독특함이 인정되어야\n한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 객관적 창작성 ≠ 고도의 독창성 필수. 전체적으로 다른 미감적 가치가 있는지 판단.","summary":"객관적 창작성 ≠ 고도의 독창성 필수. 전체적으로 다른 미감적 가치가 있는지 판단.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":567,"area":"디자인","year":2018,"round":55,"page":208,"metadata":"2018년 제55회 / PDF p.621 / 교재 p.625 / 정답 ⑤","originalPdfPage":621,"bookPage":625,"answerKey":"⑤","question":"디자인보호법 제33조(디자인등록의 요건) 제2항 ‘창작비용이성’에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"⑤ 주지의 형상·모양 등에 의한 용이 창작은 기본적 형상이나 모양 등에 의해 물품 디자인의 형태를 구성하는 것이 그 디자인이 속한\n분야에서 통상 행해짐을 전제로 하는 것이므로, 그 분야에서 그러한 기본적 형상·모양에 의하여 구성하는 것이 과거에 전혀 없었던\n경우에도 창작이 용이하다고 볼 수 있다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 기본 형상·모양이 알려졌다는 사실만으로 해당 분야의 용이창작을 항상 인정하지 않음.","summary":"기본 형상·모양이 알려졌다는 사실만으로 해당 분야의 용이창작을 항상 인정하지 않음.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":568,"area":"디자인","year":2022,"round":59,"page":209,"metadata":"2022년 제59회 / PDF p.622 / 교재 p.626 / 정답 ②","originalPdfPage":622,"bookPage":626,"answerKey":"②","question":"디자인보호법 제33조(디자인등록의 요건) 제2항 ‘창작비용이성’에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"② 디자인보호법 제33조 제2항에 따라 등록을 받을 수 없는 디자인에는 그 디자인이 속하는 분야에서 통상의 지식을 가진 자가 제1항\n제1호 또는 제2호에 해당하는 디자인 각각에 의하여 용이하게 창작할 수 있는 디자인은 포함되나 각 호의 디자인의 결합에 의하여\n용이하게 창작할 수 있는 디자인은 포함되지 않는다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 용이창작 판단은 공지 디자인 각각에 따른 경우와 공지 디자인의 결합에 따른 경우를 모두 포함.","summary":"용이창작 판단은 공지 디자인 각각에 따른 경우와 공지 디자인의 결합에 따른 경우를 모두 포함.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":569,"area":"디자인","year":2009,"round":46,"page":209,"metadata":"2009년 제46회 / PDF p.623 / 교재 p.627 / 정답 ③","originalPdfPage":623,"bookPage":627,"answerKey":"③","question":"디자인보호법 제33조 제3항(소위 확대된 선출원) 및 제46조(선출원)에 관한 설명 중 옳지 않은 것은? (단, 설문 중의 디자인등록출원은\n디자인심사등록출원이다)","answer":"③ 2 이상의 동일 또는 유사한 디자인이 동일인에 의하여 디자인등록출원된 경우에는 디자인보호법 제46조(선출원) 제1항 및 제2항의\n규정이 적용되지 않는다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 같은 사람의 동일·유사 디자인 출원에도 선출원주의는 원칙적으로 적용. 확대된 선출원과 구별.","summary":"같은 사람의 동일·유사 디자인 출원에도 선출원주의는 원칙적으로 적용. 확대된 선출원과 구별.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":570,"area":"디자인","year":2011,"round":48,"page":209,"metadata":"2011년 제48회 / PDF p.624 / 교재 p.628 / 정답 ①","originalPdfPage":624,"bookPage":628,"answerKey":"①","question":"디자인보호법 제46조(선출원)에 관한 설명으로 옳지 않은 것은? (단, 디자인등록출원은 디자인심사등록출원이며, 언급한 경우 이외에는\n신규성상실의 예외규정의 적용을 받지 않고, 우선권주장을 수반하지 아니하며 또한 출원의 분할이나 보정이 없는 것으로 한다)","answer":"① 甲의 한 벌 물품의 디자인에 관한 디자인등록출원과 그 한 벌 물품을 구성하는 물품 중 하나의 물품의 디자인과 동일 또는 유사한\n디자인 乙에 관한 乙의 디자인등록출원이 같은 날에 출원된 경우 乙은 甲에 대하여 디자인등록을 받기 위하여 甲과 협의하여야 한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 한 벌 물품의 디자인과 그 구성물품 중 낱개 디자인 → 같은 날 출원되었다는 사실만으로 협의 대상은 아님.","summary":"한 벌 물품의 디자인과 그 구성물품 중 낱개 디자인 → 같은 날 출원되었다는 사실만으로 협의 대상은 아님.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":571,"area":"디자인","year":2012,"round":49,"page":210,"metadata":"2012년 제49회 / PDF p.625 / 교재 p.629 / 정답 ⑤","originalPdfPage":625,"bookPage":629,"answerKey":"⑤","question":"디자인보호법 제33조(디자인등록의 요건) 제3항에서 규정한 소위 확대된 선출원에 관한 설명으로 옳지 않은 것은?","answer":"⑤ 선출원이 출원공개 또는 등록공고된 날과 후출원의 출원일이 동일자인 경우에는 디자인보호법 제33조 제3항의 규정이 적용되지\n아니한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 확대된 선출원 적용과 공개 후 신규성 판단을 구별. 공개·공고일과 같은 날이라는 이유만으로 일률 배제 금지.","summary":"확대된 선출원 적용과 공개 후 신규성 판단을 구별. 공개·공고일과 같은 날이라는 이유만으로 일률 배제 금지.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":572,"area":"디자인","year":2017,"round":54,"page":210,"metadata":"2017년 제54회 / PDF p.626 / 교재 p.630 / 정답 ③","originalPdfPage":626,"bookPage":630,"answerKey":"③","question":"디자인보호법상 선출원(제46조)에 관한 설명으로 옳지 않은 것은?","answer":"③ 무권리자가 한 디자인등록출원은 선출원(제46조) 규정의 적용에 있어 정당한 권리자와의 관계에서는 처음부터 없었던 것으로 보지만\n제3자와의 관계에서는 그러하지 아니하다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 무권리자의 디자인등록출원 → 제46조 선출원 지위는 제3자와의 관계에서도 인정되지 않음.","summary":"무권리자의 디자인등록출원 → 제46조 선출원 지위는 제3자와의 관계에서도 인정되지 않음.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":573,"area":"디자인","year":2019,"round":56,"page":210,"metadata":"2019년 제56회 / PDF p.627 / 교재 p.631 / 정답 ④","originalPdfPage":627,"bookPage":631,"answerKey":"④","question":"2018년 12월 10일에 甲은 자전거의 디자인을 디자인등록출원하였다. 乙은 2019년 1월 7일에 甲이 출원한 디자인에서의 자전거 핸들\n부분과 유사한 자전거 핸들에 관한 디자인을 독자적으로 창작하여 디자인등록출원하였고, 출원 이후부터 바로 그 자전거 핸들을\n생산·판매하였다. 다음 설명 중 옳은 것은? (다툼이 있으면 판례에 따름)","answer":"④ 甲의 디자인등록출원이 乙의 출원 후에 출원공개 또는 등록공고가 된 경우에는 乙의 디자인등록출원은 확대된 선출원의 적용으로\n디자인등록을 받을 수 없게 된다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 앞서 출원된 전체 디자인의 일부와 유사한 후출원 부분디자인 → 앞 출원 사후 공개·공고 시 확대된 선출원 검토.","summary":"앞서 출원된 전체 디자인의 일부와 유사한 후출원 부분디자인 → 앞 출원 사후 공개·공고 시 확대된 선출원 검토.","wrong":[],"right":["앞서 출원된 전체 디자인의 일부와 유사한 후출원 부분디자인 → 앞 출원 사후 공개·공고 시 확대된 선출원 검토."],"reason":[],"memory":[],"flags":[]},{"id":574,"area":"디자인","year":2024,"round":61,"page":211,"metadata":"2024년 제61회 / PDF p.628 / 교재 p.632 / 정답 ③","originalPdfPage":628,"bookPage":632,"answerKey":"③","question":"디자인보호법 제33조 제3항(확대된 선출원)이 적용되지 않는 것은? (다툼이 있으면 판례에 따름)","answer":"③ 甲의 선출원은 형상과 색채의 결합디자인이고, 乙의 후출원은 형상만의 디자인인 경우","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 형상·색채 결합디자인 대 형상만의 디자인 → 이 문제의 확대된 선출원 적용 대상에서 제외.","summary":"형상·색채 결합디자인 대 형상만의 디자인 → 이 문제의 확대된 선출원 적용 대상에서 제외.","wrong":[],"right":["형상·색채 결합디자인 대 형상만의 디자인 → 이 문제의 확대된 선출원 적용 대상에서 제외."],"reason":[],"memory":[],"flags":[]},{"id":575,"area":"디자인","year":2011,"round":48,"page":211,"metadata":"2011년 제48회 / PDF p.629 / 교재 p.633 / 정답 ③","originalPdfPage":629,"bookPage":633,"answerKey":"③","question":"디자인보호법 제34조(디자인등록을 받을 수 없는 디자인)에 관한 설명으로 옳지 않은 것은?","answer":"③ 디자인등록출원한 디자인이 타인의 업무와 관련되는 물품과 혼동을 가져올 염려가 있는 디자인에 해당하는지의 여부를 판단함에\n있어서, 혼동은 형태의 유사성에 의한 물품 상호간의 혼동을 말한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 디자인 부등록사유의 타인 업무 관련 물품 혼동 → 물품의 단순한 형태 유사보다 출처 혼동이 핵심.","summary":"디자인 부등록사유의 타인 업무 관련 물품 혼동 → 물품의 단순한 형태 유사보다 출처 혼동이 핵심.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":576,"area":"디자인","year":2015,"round":52,"page":211,"metadata":"2015년 제52회 / PDF p.630 / 교재 p.634 / 정답 ①","originalPdfPage":630,"bookPage":634,"answerKey":"①","question":"디자인보호법에 관한 설명으로 옳은 것을 모두 고른 것은?","answer":"① ㄱ, ㄷ\nㄱ. 디자인보호법에서의 심미성이란 반드시 미학적으로 높은 수준의 우아하고 고상한 것을 요구하는 것은 아니다.\nㄷ. 타인의 ry":"정답 조합: 제11류 + 제19류\n암기 결론: 일부심사 대상 열거 물품류(교재 기준) 제1·2·3·5·9·11·19류.","wrong":[],"right":["교재 해설에 일부심사 대상 물품류로 제11류 및 제19류가 모두 열거되어 있습니다."],"reason":[],"memory":["일부심사 대상 열거 물품류(교재 기준) 제1·2·3·5·9·11·19류."],"flags":[]},{"id":592,"area":"디자인","year":2023,"round":60,"page":216,"metadata":"2023년 제60회 / PDF p.650 / 교재 p.654 / 정답 ④","originalPdfPage":650,"bookPage":654,"answerKey":"④","question":"디자인보호법에 관한 설명으로 옳지 않은 것은? (다툼이 있는 경우에는 판례에 따름)","answer":"④ 디자인권자 또는 디자인등록출원인은 자기의 등록디자인 또는 디자인등록출원한 디자인(이하 ‘기본디자인’이라 한다)과만 유사한\n디자인(이하 ‘관련디자인’이라 한다)에 대하여 그 기본디자인의 디자인등록출원일부터 2년 이내에 디자인등록출원된 경우에 한하여\n제33조 제1항 각 호 및 제46조 제1항·제2항에도 불구하고 관련디자인으로 디자인등록을 받을 수 있다.","correction":"틀린 부분: 2년 이내\n바른 표현: 기본디자인의 디자인등록출원일부터 3년 이내\n이유: 교재가 제35조 제1항의 기간을 3년으로 제시합니다.","summary":"틀린 부분: 기본디자인 출원일부터 2년 이내\n바른 표현: 3년 이내\n암기 결론: 관련디자인 출원기간은 교재 기준 기본디자인 출원일부터 3년.","wrong":["2년 이내","기본디자인 출원일부터 2년 이내"],"right":["기본디자인의 디자인등록출원일부터 3년 이내","3년 이내"],"reason":["교재가 제35조 제1항의 기간을 3년으로 제시합니다."],"memory":["관련디자인 출원기간은 교재 기준 기본디자인 출원일부터 3년."],"flags":[]},{"id":593,"area":"디자인","year":2012,"round":49,"page":217,"metadata":"2012년 제49회 / PDF p.654 / 교재 p.658 / 정답 ⑤","originalPdfPage":654,"bookPage":658,"answerKey":"⑤","question":"디자인보호법상 거절이유, 무효사유, 정보제공사유, 이의신청이유에 공통적으로 해당되는 이유 또는 사유를 가지는 출원이 아닌 것은?","answer":"⑤ 물품의 명칭이 보통명칭화되거나 통상적으로 사용되는 것이 아닌 외국문자를 사용하여 ‘향수’ 대신 ‘Perfume’로 기재한\n디자인등록출원","correction":"정답 ⑤는 출원의 기재가 잘못된 사례이지만, 네 사유 모두에 공통 해당한다는 설명은 성립하지 않습니다.\n핵심 구별: 거절·무효 사유에 해당한다고 정보제공·이의신청 사유까지 자동으로 되는 것은 아닙니다.","summary":"틀린 판단: 물품명 기재 문제가 네 사유에 모두 공통 해당한다.\n바른 판단: 교재상 거절·무효와 정보제공·이의신청 사유를 구분한다.\n암기 결론: 물품명 기재 사유는 모든 절차의 사유로 일괄 처리하지 않는다.","wrong":[],"right":[],"reason":[],"memory":["물품명 기재 사유는 모든 절차의 사유로 일괄 처리하지 않는다."],"flags":[]},{"id":594,"area":"디자인","year":2016,"round":53,"page":217,"metadata":"2016년 제53회 / PDF p.656 / 교재 p.660 / 정답 ⑤","originalPdfPage":656,"bookPage":660,"answerKey":"⑤","question":"디자인보호법상 디자인등록출원의 심사에 관한 설명으로 옳지 않은 것은?","answer":"⑤ 관련디자인등록출원을 단독의 디자인등록출원으로 변경하거나 단독의 디자인등록출원을 관련디자인등록출원으로 변경하는 보정은\n재심사를 청구할 때에는 할 수 없다.","correction":"틀린 부분: 재심사를 청구할 때에는 할 수 없다\n바른 표현: 교재 기준 재심사 청구기간 중에도 출원 형식의 보정을 할 수 있다\n이유: 제48조 제2항 출원 형식 보정에 대한 교재 해설입니다.","summary":"틀린 부분: 관련디자인 ↔ 단독디자인 변경 보정은 재심사 청구 때 불가능하다\n바른 표현: 교재 기준 재심사 청구기간에도 가능\n암기 결론: 출원 형식의 보정 가능 여부와 심사청구·재심사 시기를 함께 판단.","wrong":["재심사를 청구할 때에는 할 수 없다","관련디자인 ↔ 단독디자인 변경 보정은 재심사 청구 때 불가능하다"],"right":["교재 기준 재심사 청구기간 중에도 출원 형식의 보정을 할 수 있다","교재 기준 재심사 청구기간에도 가능"],"reason":["제48조 제2항 출원 형식 보정에 대한 교재 해설입니다."],"memory":["출원 형식의 보정 가능 여부와 심사청구·재심사 시기를 함께 판단."],"flags":[]},{"id":595,"area":"디자인","year":2024,"round":61,"page":218,"metadata":"2024년 제61회 / PDF p.660 / 교재 p.664 / 정답 ③","originalPdfPage":660,"bookPage":664,"answerKey":"③","question":"디자인보호법 제61조(우선심사) 제1항 제2호에서 규정하는 긴급하게 처리할 필요가 있다고 인정되는 경우에 우선심사대상이 되는\n출원이 아닌 것은?","answer":"③ 조약 당사국에서 디자인등록출원을 기초로 우리나라에 우선권주장 출원을 한 디자인등록출원","correction":"틀린 부분: 외국 출원을 기초로 우리나라에 우선권주장 출원을 한 경우도 우선심사 대상이라는 취지\n바른 표현: 교재의 우선심사 대상은 국내 출원을 기초로 외국에서 관련 절차가 진행 중인 경우\n이유: 우선권주장의 기초가 되는 출원과 우선권을 주장하여 나온 후출원을 구별해야 합니다.","summary":"틀린 판단: 외국에서 먼저 출원하고 한국에 우선권 주장하면 곧바로 우선심사 대상.\n바른 판단: 교재 기준 국내 출원이 외국 절차의 기초가 된 경우와 구별.\n암기 결론: 우선심사 우선권 요건은 출원 순서와 외국 절차 진행 방향을 확인.","wrong":["외국 출원을 기초로 우리나라에 우선권주장 출원을 한 경우도 우선심사 대상이라는 취지"],"right":["교재의 우선심사 대상은 국내 출원을 기초로 외국에서 관련 절차가 진행 중인 경우"],"reason":["우선권주장의 기초가 되는 출원과 우선권을 주장하여 나온 후출원을 구별해야 합니다."],"memory":["우선심사 우선권 요건은 출원 순서와 외국 절차 진행 방향을 확인."],"flags":[]},{"id":596,"area":"디자인","year":2025,"round":62,"page":218,"metadata":"2025년 제62회 / PDF p.661 / 교재 p.665 / 정답 ②","originalPdfPage":661,"bookPage":665,"answerKey":"②","question":"디자인등록출원 심사 절차에 관한 설명으로 옳은 것은?","answer":"② 심사관은 한 벌의 물품의 디자인등록출원에 대하여 디자인등록결정을 한 경우에 디자인보호법 제42조(한 벌의 물품의 디자인)에 의한\n거절이유를 발견하더라도 직권으로 재심사를 할 수 없다.","correction":"정답보기는 옳은 보기입니다.\n판단 근거: 등록결정 뒤 직권 재심사는 언제나 가능한 것이 아니라 정해진 사유와 예외를 확인해야 합니다. 이 보기에서는 제42조를\n이유로 한 직권 재심사 불가가 핵심입니다.","summary":"옳은 판단: 한 벌의 물품에 대한 해당 거절이유를 발견하더라도 직권 재심사를 할 수 없다는 판단\n암기 결론: 한 벌의 물품의 해당 제42조 사유 → 교재 기준 직권 재심사 불가.","wrong":[],"right":[ function progress(){const n=Object.keys(state.done).filter(x=>state.done[x]).length;$('#topStat').textContent=`학습 ${n} / ${PROBLEMS.length}`;$('#percentText').textContent=`${(n/PROBLEMS.length*100).toFixed(1)}%`;$('#progressBar').style.width=`${n/PROBLEMS.length*100}%`}
function setArea(a){state.area=a;save();renderTabs();renderList()}
function renderTabs(){const tabs=['전체','특허·실용신안','상표','디자인'];$('#areaTabs').innerHTML=tabs.map(t=>`<button class="chip ${state.area===t?'active':''}" data-area="${esc(t)}">${esc(t)}</button>`).join('')}
function renderYear(){let yr=[...new Set(PROBLEMS.map(p=>p.year).filter(Boolean))].sort((a,b)=>b-a);$('#yearFilter').innerHTML='<option value="all">전체 연도</option>'+yr.map(y=>`<option value="${y}">${y}년</option>`).join('')}
function renderList(){let list=PROBLEMS.filter(p=>{const query=compact(filter.search).toLowerCase();if(state.area!=='전체'&&p.area!==state.area)return false;if(filter.year!=='all'&&String(p.year)!==filter.year)return false;if(filter.status==='done'&&!state.done[p.id])return false;if(filter.status==='unread'&&state.done[p.id])return false;if(filter.status==='bookmark'&&!state.bookmark[p.id])return false;if(filter.status==='unsure'&&!state.unsure[p.id])return false;if(filter.status==='flag'&&!p.flags.length)return false;if(query){const text=compact([p.id,String(p.id).padStart(3,'0'),p.metadata,p.question,p.answer,p.summary,p.correction].join(' ')).toLowerCase();return text.includes(query)}return true});$('#listHeader').textContent=`문제 ${list.length}개 표시 / 전체 ${PROBLEMS.length}개`;
$('#problemList').innerHTML=list.map(p=>`<button class="p-item ${p.id===state.current?'active':''}" data-go="${p.id}"><span class="p-no">${String(p.id).padStart(3,'0')}</span><span class="p-data"><span class="p-title">${esc(compact(p.question))}</span><span class="p-meta">${esc(p.area)} · ${esc(p.year||'연도 미상')} · 정답 ${esc(p.answerKey)}</span></span><span class="tiny-dot ${state.done[p.id]?'done':state.unsure[p.id]?'unsure':''}"></span></button>`).join('')||'<div class="empty">조건에 맞는 문제가 없습니다.<br>검색어나 필터를 변경해 보세요.</div>';
const chosen=$('.p-item.active');if(chosen&&!filter.search)chosen.scrollIntoView({block:'nearest'})}
function renderMarks(text,kind,p){text=String(text||'');const seg=[];for(const m of state.marks.filter(m=>m.p===p.id&&m.kind===kind)){const st=Math.max(0,m.start),en=Math.min(text.length,m.end);if(st<en&&text.slice(st,en)===m.text)seg.push({st,en,cl:'chosen',id:m.id});}
if(kind==='answer'&&p.wrong&&!sourceMismatch(p)){for(const w of p.wrong){if(!w||w.length>250)continue;const hit=literalSpan(text,w);if(hit)seg.push({st:hit[0],en:hit[1],cl:'wrong-mark',id:''})}}
const cuts=new Set([0,text.length]);seg.forEach(m=>{cuts.add(m.st);cuts.add(m.en)});const points=[...cuts].sort((a,b)=>a-b);let out='';for(let i=0;i<points.length-1;i++){const start=points[i],end=points[i+1],chunk=text.slice(start,end);const present=seg.filter(m=>m.st<=start&&m.en>=end);if(present.length){const cs=[...new Set(present.map(x=>x.cl))].join(' ');let marker=present.find(x=>x.id)?.id||'';out+=`<span class="${cs}" ${marker?`data-markid="${esc(marker)}"`:''}>${esc(chunk)}</span>`}else out+=esc(chunk)}return out||' ';}
function content(kind,text,p){return `<div class="prose" data-selectable="${esc(kind)}" data-problem="${p.id}">${renderMarks(text,kind,p)}</div>`}
function section(title,icon,body,extra=''){return `<section class="doc-card"><div class="card-head"><div class="card-label"><span class="card-icon">${icon}</span>${title}</div>${extra}</div>${body}</section>`}

 let out=`<div class="bridge-head"><div><span class="bridge-pill ${cov.type==='직접 교정 연결'?'':'warn'}">${esc(cov.type)}</span> <span class="bridge-pill">확인 위치 ${cov.found}/${p.wrong.length}</span></div><button class="bridge-btn" data-top="audit">601문항 연결 검증표</button></div><div class="trace-intro"><strong>표현이 달라도 일관된 법리명으로 연결</strong><div class="help">공통 법리명은 분류용입니다. 잘못된 표현과 바른 표현을 동의어로 연결하지 않으며, '누가/언제/어느 범위에서/어떤 요건'이 바뀌었는지를 따로 표시합니다.</div><div class="trace-concept-list">${canon.length?canon.slice(0,4).map(c=>`<button class="trace-chip" data-canon-open="${esc(c.id)}">${esc(c.label)}</button>`).join(''):'<span class="help">표준 법리명은 아직 확인 대상입니다.</span>'}</div></div>`;

  const statements=cov.statements;

  if(p.id===65)out+=chainExtraScope(p);

 if(cov.missing)out+=`<div class="trace-alert">주의: 정답 조합 지문 중 ${cov.missing}개는 직접 교정쌍이 없습니다. PDF의 암기 결론을 확인하되 나머지 지문의 교정이 끝났다고 보지 마세요.</div>`;
 if(!pairs.length){const isPositive=/옳은 것은|옳은 것을|옳은 것만/.test(p.question);out+=`<div class="trace-neutral"><strong>${isPositive?'옳은 보기: 억지로 잘못된 문구를 만들지 않습니다.':'PDF에서 직접 교정 범위가 확인되지 않았습니다.'}</strong><div>PDF 판단 요약: ${esc((p.right||[]).filter(s=>!s.includes('원본 대조 필요')).slice(0,2).join(' / ')||p.memory?.[0]||'추가 원문 대조 필요')}</div></div>`}
 for(let i=0;i<pairs.length;i++){const e=pairs[i],c=e.concept,axis=benchmark?.axis||bridgeAxis(e.w,e.fix,p),notes=bridgeUserRecords(p,c);
 out+=`<article class="bridge-logic"><div class="bridge-title">교정 ${i+1}/${pairs.length}: 문구 → 판단 기준 → 결론</div><div class="bridge-step"><span class="blabel">① 정답보기 속 위치 (잘못되었다고 기록된 범위)</span>${bridgeMark(p,e.w)}</div>
 <div class="bridge-pairs"><div class="bridge-step"><span class="blabel">② PDF에서 틀렸다고 기록한 표현</span><span class="bridge-diff">${esc(e.w)}</span></div><div class="bridge-step"><span class="blabel">③ PDF에서 제시한 바른 표현</span><span class="bridge-correct">${esc(e.fix||'직접 연결되는 교정 표현이 없습니다.')}</span></div></div>

function words(str){return [...new Set((String(str).match(/[가-힣A-Za-z]{2,}/g)||[]).filter(x=>x.length>=2&&!/^(있다|없다|한다|되는|경우|대한|관한|설명|정답|부분|바르게|다음|것은|문제|해당|가지|한다는|있으면|법률)$/.test(x)))];}

function applies(t,p,term){if(t.scope==='single')return t.sourceId===p.id;if(t.scope==='global')return true;const txt=[p.question,p.answer,p.correction,p.summary].join(' ');if(t.scope==='term')return pertinent(t.sourceTerm,p)&&(!compact(term)||compact(term).includes(t.sourceTerm)||t.sourceTerm.includes(compact(term)));if(t.scope==='topic'){if(p.area!==t.area)return false;if(t.sourceId===p.id)return true;return overlap(t.sourceContext,txt)>=Math.min(2,Math.max(1,words(t.sourceContext).length/9|0));}return false;}
function inferIntent(q){if(/왜|이유|틀린|틀렸|옳은|고치|아니라|잘못/.test(q))return 'reason';if(/차이|비교|구별/.test(q))return 'compare';if(/예외|단서|특례|제외/.test(q))return 'exception';if(/사례|예시|실제/.test(q))return 'example';if(/기출|출제|변형/.test(q))return 'exam';if(/암기|기억|외우/.test(q))return 'memory';if(/판례|조문|법령|법률|근거/.test(q))return 'basis';return 'meaning'}

const KW_RELATIONS=['틀린 표현 → 바른 표현','정답보기 내 공동 등장','정답보기 → 최종 정리'];

function kwMeaning(row){const edits=(state.keywordEdits||{})[row.source+'\u241f'+row.target];if(edits?.meaning)return edits.meaning;if(row.entryMeaning)return row.entryMeaning;if(row.manual)return '사용자 직접 분류';return row.evidence.some(e=>e.relation==='틀린 표현 → 바른 표현')?'정정 관계 (PDF 근거)':'함께 등장 (의미 미확인)'}
const KW_TERMS=[...new Set(Object.values(KW_GROUPS).flat())].sort((a,b)=>b.length-a.length||a.localeCompare(b,'ko'));
const KW_TYPE_OF=new Map(Object.entries(KW_GROUPS).flatMap(([t,arr])=>arr.map(s=>[s,t])));
// '선출원'을 '확대된 선출원'의 일부라는 이유만으로 매칭하지 않음.
function kwPresent(text,term){text=String(text||'');term=String(term||'').trim();if(!term)return false;let at=text.indexOf(term);while(at>=0){const end=at+term.length;let inside=false;for(const longer of KW_TERMS){if(longer.length<=term.length||!longer.includes(term))continue;const relative=longer.indexOf(term);if(at-relative>=0&&text.slice(at-relative,at-relative+longer.length)===longer){inside=true;break}}if(!inside)return true;at=text.indexOf(term,at+1)}return false}
function kwExcerpt(text,term,max=145){text=String(text||'');let at=text.indexOf(term);if(at<0)at=0;const start=Math.max(0,at-38);const end=Math.min(text.length,at+Math.max(25,term.length)+76);return (start?'…':'')+compact(text.slice(start,end))+(end<text.length?'…':'')}
const KW_SOURCE_FREQ=KW_TERMS.map(term=>({term,n:PROBLEMS.filter(p=>kwPresent(p.answer,term)).length})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n||a.term.localeCompare(b.term,'ko'));
function kwRows(source,area='전체'){
 const pairs=new Map();source=compact(source);if(!source)return [];
 for(const p of PROBLEMS){if(area!=='전체'&&p.area!==area||!kwPresent(p.answer,source))continue;
  const text=p.answer+'\n'+p.summary;
  for(const target of KW_TERMS){if(target===source||!kwPresent(text,target))continue;
   const inAnswer=kwPresent(p.answer,target),inCorrect=p.right.some(s=>kwPresent(s,target));
   const relation=inCorrect&&p.wrong.some(s=>compact(s).includes(source))?'틀린 표현 → 바른 표현':inAnswer?'정답보기 내 공동 등장':'정답보기 → 최종 정리';
   let row=pairs.get(target);if(!row){row={target,type:KW_TYPE_OF.get(target)||'요건·판단',evidence:[],manual:false};pairs.set(target,row)}
   row.evidence.push({id:p.id,area:p.area,page:p.page,answer:kwExcerpt(p.answer,source),detail:inAnswer?kwExcerpt(p.answer,target):kwExcerpt(p.summary,target),relation});
  }
  // 틀린 정답보기의 해당 문구와 바른 표현을 정확히 일대일로 연결한다.
  // 이 관계는 단순 공동 등장보다 우선하며 사용자가 가장 먼저 확인할 분기다.
  for(let i=0;i<p.wrong.length;i++){
   const wrong=compact(p.wrong[i]),right=compact(p.right[i]||'');
   if(!wrong||!right||!(wrong.includes(source)||source.includes(wrong))||wrong===right)continue;
   let row=pairs.get(right);
   if(!row){row={target:right,type:'정정·대비',evidence:[],manual:false};pairs.set(right,row)}
   row.type='정정·대비';
   if(!row.evidence.some(e=>e.id===p.id&&e.relation==='틀린 표현 → 바른 표현')){
    row.evidence.push({id:p.id,area:p.area,page:p.page,answer:kwExcerpt(p.answer,wrong),detail:right,relation:'틀린 표현 → 바른 표현'});
   }
  }
 }

  if(m.source!==source||area!=='전체'&&m.area!=='전체'&&m.area!==area)continue;

 }

  row.source=source;

  row.hidden=!!edit?.hidden;row.meaning=kwMeaning(row);
  row.evidence.sort((a,b)=>a.id-b.id);
 }
 return [...pairs.values()].sort((a,b)=>b.evidence.length-a.evidence.length||a.target.localeCompare(b.target,'ko'));

function kwLabel(target){const t=compact(target);return t.length>53?t.slice(0,48)+'…':t}
function kwSuggestionFromCurrent(){if(selected?.text){const sel=compact(selected.text);if(sel.length<=32)return sel;const w=KW_TERMS.find(k=>kwPresent(sel,k));if(w)return w}const p=byId(state.current);const possible=KW_TERMS.filter(k=>kwPresent(p.answer,k));return possible[0]||''}
function showKeywords(term){const initial=(term??kwSuggestionFromCurrent()).trim();showPanel('정답보기 키워드 유형분류','같은 키워드에서 서로 다른 키워드로 연결되는 분기를 유형별로 분류합니다.',`<div class="kw-intro"><strong>키워드 → 연결 키워드 → 유형 → 출제 근거</strong><div class="small-btn-row"><button id="openCanonicalFromKeyword" type="button">🧭 표준 법리명으로 묶어서 보기</button></div><div class="help">동일한 기준 키워드가 다양한 정답보기·최종 정리 문맥에서 어떤 분기로 연결되는지 나누어 봅니다. <b>정정·대비</b>는 PDF 교정 내용, <b>공동 등장</b>은 동일 문항에서 발견한 단어입니다. 의미 유형은 사용자가 재분류할 수 있으며, 그 변경은 원문 사실 검증을 뜻하지 않습니다. 공동 등장은 법적 인과관계의 증거가 아닙니다. 직접 추가한 연결은 별도 표시합니다.</div></div><div class="formrow"><label for="kwSource">기준 키워드 (직접 입력 가능)</label><input id="kwSource" list="kwDatalist" placeholder="예: 선출원, 신규성, 진보성" value="${esc(initial)}" autocomplete="off"><datalist id="kwDatalist">${KW_SOURCE_FREQ.slice(0,140).map(x=>`<option value="${esc(x.term)}">${x.n}문항</option>`).join('')}</datalist><div class="kw-two"><div><label for="kwType">연결 유형</label><select id="kwType"><option value="전체">전체 유형</option>${KW_TYPES.map(t=>`<option>${esc(t)}</option>`).join('')}</select></div><div><label for="kwArea">대상 영역</label><select id="kwArea"><option>전체</option><option>특허·실용신안</option><option>상표</option><option>디자인</option></select></div></div><label for="kwRelation">연결 관계 (공동 등장과 직접 정정 구별)</label><select id="kwRelation"><option value="전체">모든 연결 관계</option>${KW_RELATIONS.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('')}</select><label for="kwMeaning">연결 의미 유형 (법리 해석 여부 별도 분류)</label><select id="kwMeaning"><option value="전체">모든 의미 유형</option>${KW_MEANINGS.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('')}</select><div class="help">‘함께 등장’은 법적 연관성이 검증되지 않았습니다. 직접 분류한 의미는 학습자 판단이며 원문 근거와 구별됩니다.</div><label class="kw-check"><input type="checkbox" id="kwHidden"> 숨긴 연결도 보기</label></div><div id="kwResults" aria-live="polite"></div><div class="kw-add"><div class="panel-subtitle">＋ 내가 직접 연결 유형 추가하기</div><div class="help">원하는 연결이 없으면 직접 등록할 수 있습니다. 다른 문제에도 반영되며, 자동 추출 연결과 구별됩니다.</div><div class="formrow"><label for="kwTargetNew">연결할 키워드</label><input id="kwTargetNew" placeholder="예: 동일 발명자"><label for="kwTypeNew">분류 유형</label><select id="kwTypeNew">${KW_TYPES.map(t=>`<option>${esc(t)}</option>`).join('')}</select><label for="kwMeaningNew">연결 의미 유형 (나의 분류)</label><select id="kwMeaningNew">${KW_MEANINGS.filter(t=>t!=='정정 관계 (PDF 근거)').map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('')}</select><label for="kwScopeNew">다른 문제 적용 범위</label><select id="kwScopeNew"><option value="전체">전체 601문항</option><option value="current">현재 영역만</option></select><label for="kwNoteNew">직접 기록한 근거·메모 (선택)</label><textarea id="kwNoteNew" rows="2" placeholder="이 연결을 추가한 이유"></textarea><button id="kwCreate" class="darkbtn">키워드 연결 저장</button></div></div>`,'keywords');
 $('#kwArea').value=state.area;$('#openCanonicalFromKeyword').onclick=()=>openConceptDictionary();
 ['kwSource','kwType','kwArea','kwHidden','kwRelation','kwMeaning'].forEach(id=>$( '#'+id).addEventListener(id==='kwSource'?'input':'change',renderKeywordResults));
 $('#kwCreate').onclick=()=>{const source=compact($('#kwSource').value),target=compact($('#kwTargetNew').value),type=$('#kwTypeNew').value,area=$('#kwScopeNew').value==='전체'?'전체':byId(state.current).area,note=$('#kwNoteNew').value.trim();if(!source||!target||source===target){toast('서로 다른 기준·연결 키워드를 입력하세요');return}if(source.length>85||target.length>85){toast('키워드는 각각 85자 이내로 입력해 주세요');return}state.keywordLinks??=[];const ix=state.keywordLinks.findIndex(m=>m.source===source&&m.target===target&&m.area===area);const entry={id:newId(),source,target,type,area,note,meaning:$('#kwMeaningNew').value,created:Date.now()};if(ix<0)state.keywordLinks.push(entry);else state.keywordLinks[ix]=entry;save();$('#kwTargetNew').value='';$('#kwNoteNew').value='';renderKeywordResults();toast('연결 유형을 저장했습니다. 다른 문항에도 재사용됩니다')};
 renderKeywordResults();
}
function renderKeywordResults(){const dest=$('#kwResults');if(!dest)return;
 const term=compact($('#kwSource').value),type=$('#kwType').value,area=$('#kwArea').value,relation=$('#kwRelation').value,meaning=$('#kwMeaning').value,showHidden=$('#kwHidden').checked;
 const rows=kwRows(term,area).map(x=>({...x,evidence:relation==='전체'?x.evidence:x.evidence.filter(e=>e.relation===relation)})).filter(x=>(type==='전체'||x.type===type)&&(meaning==='전체'||x.meaning===meaning)&&(showHidden||!x.hidden)&&(x.evidence.length>0||(relation==='전체'&&x.manual)));
 const sourceCount=term?PROBLEMS.filter(p=>(area==='전체'||p.area===area)&&kwPresent(p.answer,term)).length:0;
 const groups=KW_TYPES.map(group=>({group,rows:rows.filter(x=>x.type===group)})).filter(x=>x.rows.length);
 let html=`<div class="kw-count"><strong>${esc(term||'(입력 대기)')}</strong> 정답보기 ${sourceCount}문항 · 연결 분기 ${rows.length}개 · 유형 ${groups.length}개</div>`;
 if(!rows.length)html+='<div class="empty">해당 조건의 자동 연결이 없습니다. 다른 키워드를 검색하거나 직접 연결을 추가해 주세요.</div>';
 for(const group of groups){html+=`<section class="kw-group"><h3>${esc(group.group)} <span>${group.rows.length}갈래</span></h3>`;
 for(const row of group.rows.slice(0,90)){const first=row.evidence[0],linkKey=term+'\u241f'+row.target;html+=`<div class="kw-branch"><div class="kw-branch-header"><span class="kw-from">${esc(term)}</span><span class="kw-arrow">→</span><strong title="${esc(row.target)}">${esc(kwLabel(row.target))}</strong><span class="kw-n">${row.evidence.length}건${row.manual?' · 사용자 추가':''}</span><span class="kw-meaning" title="원문 대조 여부를 확인하세요">${esc(row.meaning)}</span></div><div class="small-btn-row"><button data-kw-evidence="${esc(row.target)}">출제 근거 보기</button><select aria-label="연결 의미 유형" data-kw-meaning="${esc(row.target)}" title="직접 판단하여 연결 의미 분류">${KW_MEANINGS.map(t=>`<option value="${esc(t)}" ${row.meaning===t?'selected':''}>${esc(t)}</option>`).join('')}</select><select aria-label="연결 유형 바꾸기" data-kw-type="${esc(row.target)}">${KW_TYPES.map(t=>`<option ${row.type===t?'selected':''}>${esc(t)}</option>`).join('')}</select><button data-kw-hide="${esc(row.target)}">${row.hidden?'복원':'숨김'}</button>${row.manual?`<button data-kw-delete="${esc(row.target)}">내 연결 삭제</button>`:''}</div><div class="kw-evidence hide" data-kw-panel="${esc(row.target)}">${row.manual?`<div class="kw-usernote">직접 추가한 연결 · PDF 확인 전${row.userNote?': '+esc(row.userNote):''}</div>`:''}${row.evidence.slice(0,16).map(e=>`<div class="kw-example"><div class="kw-proof-title">문제 ${String(e.id).padStart(3,'0')} · ${esc(e.area)} · ${esc(e.relation)}</div><div><strong>정답보기:</strong> ${esc(e.answer)}</div><div><strong>${e.relation==='정답보기 내 공동 등장'?'정답보기 관련 구절':'최종 정리·정정 내용'}:</strong> ${esc(e.detail)}</div><div class="small-btn-row"><button data-kw-go="${e.id}">문제 열기</button><button data-kw-ask="${e.id}" data-kw-target="${esc(row.target)}">이 연결 질문하기</button></div></div>`).join('')}${row.evidence.length>16?`<div class="help">나머지 ${row.evidence.length-16}개는 해당 키워드 관련문제 검색으로 확인할 수 있습니다.</div>`:''}</div></div>`}html+='</section>'}
 dest.innerHTML=html;
 dest.querySelectorAll('[data-kw-evidence]').forEach(b=>b.onclick=()=>{const id=b.dataset.kwEvidence;const x=[...dest.querySelectorAll('[data-kw-panel]')].find(el=>el.dataset.kwPanel===id);if(x)x.classList.toggle('hide')});
 dest.querySelectorAll('[data-kw-meaning]').forEach(s=>s.onchange=()=>{const k=term+'\u241f'+s.dataset.kwMeaning;state.keywordEdits??={};state.keywordEdits[k]={...(state.keywordEdits[k]||{}),meaning:s.value};save();renderKeywordResults();toast('연결 의미 유형을 저장했습니다. PDF와 대조하여 확인하세요')});
 dest.querySelectorAll('[data-kw-type]').forEach(s=>s.onchange=()=>{state.keywordEdits??={};state.keywordEdits[term+'\u241f'+s.dataset.kwType]={...(state.keywordEdits[term+'\u241f'+s.dataset.kwType]||{}),type:s.value};save();renderKeywordResults();toast('연결 유형 분류를 변경했습니다')});
 dest.querySelectorAll('[data-kw-hide]').forEach(b=>b.onclick=()=>{state.keywordEdits??={};const k=term+'\u241f'+b.dataset.kwHide;state.keywordEdits[k]={...(state.keywordEdits[k]||{}),hidden:!(state.keywordEdits[k]?.hidden)};save();renderKeywordResults();toast('연결 표시를 변경했습니다')});
 dest.querySelectorAll('[data-kw-delete]').forEach(b=>b.onclick=()=>{const x=b.dataset.kwDelete;state.keywordLinks=state.keywordLinks.filter(m=>!(m.source===term&&m.target===x));save();renderKeywordResults();toast('내가 추가한 연결을 삭제했습니다')});
 dest.querySelectorAll('[data-kw-go]').forEach(b=>b.onclick=()=>go(Number(b.dataset.kwGo)));
 dest.querySelectorAll('[data-kw-ask]').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.kwAsk),target=b.dataset.kwTarget;go(n);openSelect({p:n,kind:'answer',text:term,start:null,end:null,full:byId(n).answer});ask(`정답보기 키워드 ‘${term}’이 이 문제에서 ‘${target}’과 연결되는 문맥과 구별할 조건은 무엇인가요?`)});
}

function handleAction(name){const p=byId(state.current);if(name==='done'){state.done[p.id]=!state.done[p.id];save();renderMain();return}if(name==='bookmark'){state.bookmark[p.id]=!state.bookmark[p.id];save();renderMain();return}if(name==='unsure'){state.unsure[p.id]=!state.unsure[p.id];save();renderMain();return}if(name==='speech'){speak([p.question,p.answer,p.summary].join('. '));return}if(name==='stopSpeech'){stopSpeak();toast('음성 읽기를 중지했습니다');return}if(name==='viewHistory'){showHistory();return}if(name==='bank'){manageBank();return}if(name==='keyword'){showKeywords();return}if(name==='concept'){openConceptDictionary();return}if(name==='quickselect'){openSelect({p:p.id,kind:'question',text:p.question,start:null,end:null,full:p.question});return}}

 const v14ModeBtn=e.target.closest('[data-v14-type]');if(v14ModeBtn){const p=byId(state.current);state.v14Mode[p.id]=v14ModeBtn.dataset.v14Type;save();const ans=document.querySelector('#v14-answer');if(ans)ans.textContent=v14QuestionAnswer(p,state.v14Mode[p.id]);document.querySelectorAll('[data-v14-type]').forEach(b=>b.classList.toggle('active',b===v14ModeBtn));return;}
 const v14Save=e.target.closest('[data-v14-save]');if(v14Save){const p=byId(Number(v14Save.dataset.v14Save)),ta=document.querySelector('#v14-own-'+p.id);const q=(ta?.value||'').trim();if(!q){toast('질문을 입력해 주세요');return;}state.v14Questions[p.id]??=[];if(!state.v14Questions[p.id].includes(q))state.v14Questions[p.id].push(q);save();const el=document.querySelector('#v14-saveinfo-'+p.id);if(el)el.textContent='내 질문 '+state.v14Questions[p.id].length+'건 저장. 답변 생성·검증은 별도입니다.';if(ta)ta.value='';return;}
 const v14Quiz=e.target.closest('[data-v14-quiz]');if(v14Quiz){const id=Number(v14Quiz.dataset.v14Quiz),note=V14_REVIEWED[id],checked=document.querySelector(`input[name=v14check${id}]:checked`),fb=document.querySelector('#v14-feedback-'+id);if(!checked){if(fb)fb.textContent='선택지를 먼저 고르세요.';return;}const ok=Number(checked.value)===note.correct;if(ok){state.v14Quiz[id]=true;save();}if(fb)fb.textContent=ok?'정답입니다. 다만 한 번 맞혔다고 전체 법리 이해를 인증할 수는 없습니다.':'다시 확인해 보세요. 정답은 '+(note.correct+1)+'번입니다. 앞의 설명 4~6단계에서 조건을 다시 읽으세요.';return;}
 const v13Nav=e.target.closest('[data-beginner-go]');if(v13Nav){go(Number(v13Nav.dataset.beginnerGo));return;}
 const v13Quiz=e.target.closest('[data-beginner-check]');if(v13Quiz){const id=Number(v13Quiz.dataset.beginnerCheck);const chosen=document.querySelector(`input[name=v13quiz${id}]:checked`);const box=document.querySelector('#v13-feedback-'+id);if(!chosen){if(box)box.textContent='답을 먼저 선택하세요.';return;}const correct=chosen.value==='no';if(correct){state.beginnerProgress[id]=true;save();}if(box)box.textContent=correct?'정답입니다. 법률에 따른 출원공개·등록공고는 이 문제의 자기공지 예외에서 제외됩니다.':'다시 생각해 보세요. 보기의 뒷부분과 PDF 암기 결론에서 출원공개·등록공고를 제외한다고 했습니다.';return;}
 const v12progress=e.target.closest('[data-v12-progress]');if(v12progress){v12Dashboard();return}

$('#closePanel').onclick=close;$('#veil').addEventListener('click',e=>{if(e.target===$('#veil'))close()});$('#menuBtn').onclick=()=>{$('#sidebar').classList.add('open');$('#shadeAside').classList.add('visible')};$('#shadeAside').onclick=()=>{$('#sidebar').classList.remove('open');$('#shadeAside').classList.remove('visible')};$('#searchInput').oninput=e=>{filter.search=e.target.value;renderList()};$('#yearFilter').onchange=e=>{filter.year=e.target.value;renderList()};$('#statusFilter').onchange=e=>{filter.status=e.target.value;renderList()};document.addEventListener('input',e=>{if(e.target.id==='noteInput'){state.notes[state.current]=e.target.value;save()}});
