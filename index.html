년 제57회 / PDF p.307 / 교재 p.314 / 정답 ③","originalPdfPage":307,"bookPage":314,"answerKey":"③","question":"특허협력조약(PCT)에 따른 국제특허출원에 관한 설명으로 옳지 않은 것은?","answer":"③ 국제출원을 하려는 자는 산업통상자원부령으로 정하는 언어인 국어, 영어 또는 중국어로 작성한 출원서와\n발명의 설명, 청구범위, 필요한 도면 및 요약서를 특허청장에게 제출하여야 한다.","correction":"틀린 부분: 국어, 영어 또는 중국어\n바른 표현: 국어, 영어 또는 일본어\n이유: 교재는 국제출원의 사용언어를 국어·영어·일본어로 제시하므로 중국어로 바꾼 부분이 잘못입니다.","summary":"틀린 부분: 국어, 영어 또는 중국어\n바른 표현: 국어, 영어 또는 일본어\n이유: 교재는 국제출원의 사용언어를 국어·영어·일본어로 제시하므로 중국어로 바꾼 부분이 잘못입니다.\n암기 결론: 국제출원 사용 언어: 국어·영어·일본어. 중국어라고 한 ③이 오답 보기입니다.","wrong":["국어, 영어 또는 중국어"],"right":["국어, 영어 또는 일본어"],"reason":["교재는 국제출원의 사용언어를 국어·영어·일본어로 제시하므로 중국어로 바꾼 부분이 잘못입니다."],"memory":["국제출원 사용 언어: 국어·영어·일본어. 중국어라고 한 ③이 오답 보기입니다."],"flags":[]},{"id":297,"area":"특허·실용신안","year":2016,"round":53,"page":118,"metadata":"2016년 제53회 / PDF p.308 / 교재 p.315 / 정답 ③","originalPdfPage":308,"bookPage":315,"answerKey":"③","question":"특허협력조약(PCT)에 따른 국제출원 또는 국제특허출원에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례\n에 따름)","answer":"③ 외국어로 기재된 국제특허출원의 번역문 제출에 대해서도 외국어 특허출원에 관한 특허법 제42조의3(외국\n어특허출원 등)의 규정이 적용된다.","correction":"틀린 부분: 제42조의3(외국어특허출원 등)의 규정이 적용된다\n바른 표현: PCT 국제특허출원의 국어번역문은 제201조의 독자적 절차를 따른다\n이유: 교재는 일반 외국어특허출원과 국제특허출원의 번역문 제출 제도를 구별합니다.","summary":"틀린 부분: 제42조의3(외국어특허출원 등)의 규정이 적용된다\n바른 표현: PCT 국제특허출원의 국어번역문은 제201조의 독자적 절차를 따른다\n이유: 교재는 일반 외국어특허출원과 국제특허출원의 번역문 제출 제도를 구별합니다.\n암기 결론: PCT 국제특허출원의 번역문 제출은 제201조의 절차를 따릅니다.","wrong":["제42조의3(외국어특허출원 등)의 규정이 적용된다"],"right":["PCT 국제특허출원의 국어번역문은 제201조의 독자적 절차를 따른다"],"reason":["교재는 일반 외국어특허출원과 국제특허출원의 번역문 제출 제도를 구별합니다."],"memory":["PCT 국제특허출원의 번역문 제출은 제201조의 절차를 따릅니다."],"flags":[]},{"id":298,"area":"특허·실용신안","year":2019,"round":56,"page":119,"metadata":"2019년 제56회 / PDF p.309 / 교재 p.316 / 정답 ③","originalPdfPage":309,"bookPage":316,"answerKey":"③","question":"특허협력조약(PCT)에 따른 국제특허출원에 관한 설명으로 옳은 것은?","answer":"③ 출원인은 국제예비심사청구시 선택한 선택국 중 모든 선택을 취하할 수 있으며, 모든 선택국의 선택을 취하\n한 경우에는 국제예비심사의 청구는 취하된 것으로 본다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 선택국 전부 취하 → 국제예비심사청구도 취하된 것으로 봅니다.","summary":"선택국 전부 취하 → 국제예비심사청구도 취하된 것으로 봅니다.","wrong":[],"right":["선택국 전부 취하 → 국제예비심사청구도 취하된 것으로 봅니다."],"reason":[],"memory":[],"flags":[]},{"id":299,"area":"특허·실용신안","year":2017,"round":54,"page":119,"metadata":"2017년 제54회 / PDF p.310 / 교재 p.317 / 정답 ②","originalPdfPage":310,"bookPage":317,"answerKey":"②","question":"국제출원에 관한 설명으로 옳지 않은 것을 모두 고른 것은?","answer":"② ㄱ, ㄴ, ㄹ\nㄱ. 2인 이상이 공동으로 국제출원을 하는 경우에 출원인이 대표자를 정하지 아니한 경우에는 특허청장은 기간\n을 정하여 대표자를 정하도록 보정을 명하여야 하고, 출원인이 기간 내에 이를 이행하지 않으면 출원은 취하된\n것으로 본다.\nㄴ. 국제출원을 하려는 자는 국어, 영어 또는 불어로 작성한 출원서와 발명의 설명, 청구범위, 필요한 도면 및 요\n약서를 특허청장에게 제출하여야 한다.\nㄹ. 외국어로 출원된 국제특허출원의 경우 출원인은 우선일부터 27개월 이내에 발명의 설명, 청구범위 및 도면(\n도면 중 설명부분에 한정한다), 국제특허출원 요약서의 국어번역문을 특허청장에게 제출하여야 한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ② = ㄱ·ㄴ·ㄹ. 국어번역문 제출기간은 27개월이 아니라 31개월입니다.","summary":"정답 ② = ㄱ·ㄴ·ㄹ. 국어번역문 제출기간은 27개월이 아니라 31개월입니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":300,"area":"특허·실용신안","year":2014,"round":51,"page":120,"metadata":"2014년 제51회 / PDF p.311 / 교재 p.318 / 정답 ①","originalPdfPage":311,"bookPage":318,"answerKey":"①","question":"특허협력조약에 관한 설명으로 옳지 않은 것은?","answer":"① 한국 특허청을 수리관청으로 하는 국제출원의 출원인(출원서에 미국인 甲, 한국인 乙 순으로 출원인이 기재\n됨)이 일반 대리자를 선임하지 않은 경우, 한국 특허청은 절차 진행의 원활함을 위해 한국인 乙을 대표자로 간\n주한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 국적만 보고 한국인 乙을 자동 대표자로 간주한다는 ①이 틀립니다.","summary":"국적만 보고 한국인 乙을 자동 대표자로 간주한다는 ①이 틀립니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":301,"area":"특허·실용신안","year":2018,"round":55,"page":120,"metadata":"2018년 제55회 / PDF p.312–313 / 교재 p.319–320 / 정답 ①","originalPdfPage":312,"bookPage":319,"answerKey":"①","question":"국제실용신안등록출원의 국어번역문에 관한 설명으로 옳지 않은 것을 모두 고른 것은?","answer":"① ㄱ, ㄷ, ㄹ\nㄱ. 국제실용신안등록출원을 외국어로 출원한 출원인은 특허협력조약 제2조(xi)의 우선일부터 2년 6개월 이내\n에 국어번역문을 특허청장에게 제출하여야 한다.\nㄷ. 국어번역문을 제출한 출원인은 출원심사를 청구한 후에도 국내서면제출기간 내에는 그 국어번역문을 갈음\n하여 새로운 국어번역문을 제출할 수 있다.\nㄹ. 국제실용신안등록출원을 외국어로 출원한 출원인이 국내서면제출기간에 고안의 설명, 청구범위, 도면(도면\n중 설명부분에 한정한다) 및 요약서의 국어번역문을 제출하지 아니하면 그 국제실용신안등록출원은 취하한 것\n으로 본다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ① = ㄱ·ㄷ·ㄹ. 2년 7개월, 출원심사 청구 후 대체 불가, 미제출 서류별 효과 구분.","summary":"정답 ① = ㄱ·ㄷ·ㄹ. 2년 7개월, 출원심사 청구 후 대체 불가, 미제출 서류별 효과 구분.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":302,"area":"특허·실용신안","year":2015,"round":52,"page":120,"metadata":"2015년 제52회 / PDF p.314 / 교재 p.321 / 정답 ④","originalPdfPage":314,"bookPage":321,"answerKey":"④","question":"특허협력조약(PCT)에 따른 국제특허출원에 관한 설명으로 옳지 않은 것은?","answer":"④ 미국 기업이 미국 특허청을 수리관청으로 국제특허출원하고, 한국을 지정국으로 한 경우, 한국 출원일은 한\n국 특허청에 발명의 설명·청구범위·도면의 국어번역문을 제출한 날로 본다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 한국 지정 PCT 출원의 한국 출원일은 국제출원일입니다.","summary":"한국 지정 PCT 출원의 한국 출원일은 국제출원일입니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":303,"area":"특허·실용신안","year":2010,"round":47,"page":121,"metadata":"2010년 제47회 / PDF p.315 / 교재 p.322 / 정답 ④","originalPdfPage":315,"bookPage":322,"answerKey":"④","question":"특허협력조약(PCT)에 의한 국제출원에 관한 설명으로 옳지 않은 것은?","answer":"④ 특허청장이 국제출원에서 요약서가 제출되지 않아 보정을 명한 경우에 보정명령을 받은 자가 지정된 기간\n내에 보정을 하지 않으면 당해 국제출원은 포기된 것으로 간주한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 보정명령 미이행 → 국제출원 취하 간주. '포기 간주'라고 한 ④가 틀립니다.","summary":"보정명령 미이행 → 국제출원 취하 간주. '포기 간주'라고 한 ④가 틀립니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":304,"area":"특허·실용신안","year":2011,"round":48,"page":121,"metadata":"2011년 제48회 / PDF p.316 / 교재 p.323 / 정답 ①","originalPdfPage":316,"bookPage":323,"answerKey":"①","question":"특허협력조약(PCT)에 의한 특허출원의 보정에 관한 설명으로 옳지 않은 것은?","answer":"① 출원인은 국제조사기관이 국제사무국 및 출원인에게 국제조사보고서를 송부한 날부터 2월의 기간 또는 우\n선일부터 16월 중 늦게 만료되는 기간 내에 국제사무국에 보정서를 제출할 수 있고, 이때 국제출원의 명세서에\n대하여 1회에 한하여 보정할 수 있다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: PCT 제19조 보정: 청구범위에 대하여 1회. 명세서라고 한 ①이 틀립니다.","summary":"PCT 제19조 보정: 청구범위에 대하여 1회. 명세서라고 한 ①이 틀립니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":305,"area":"특허·실용신안","year":2012,"round":49,"page":121,"metadata":"2012년 제49회 / PDF p.317 / 교재 p.324 / 정답 ②","originalPdfPage":317,"bookPage":324,"answerKey":"②","question":"甲은 일본 국내특허출원에 있어 2019년 1월 30일에 일본 특허청을 수리관청으로 하고 우리나라를 지정국으로\n하여 특허협력조약에 의한 국제출원을 하였다. 다음 설명 중 옳은 것은? (단, 공휴일은 고려하지 않는다.)","answer":"② 甲이 특허협력조약 제19조(1)에 의한 보정을 한 경우, 그 보정된 특허청구범위의 국어 번역문으로 국제출원\n일에 제출한 특허청구범위의 번역문을 대체할 수 있다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 원본 정답 표시는 ②. PCT 제19조 보정 청구범위의 번역문 대체 제출에 관한 내용입니다.","summary":"원본 정답 표시는 ②. PCT 제19조 보정 청구범위의 번역문 대체 제출에 관한 내용입니다.","wrong":[],"right":["원본 정답 표시는 ②. PCT 제19조 보정 청구범위의 번역문 대체 제출에 관한 내용입니다."],"reason":[],"memory":[],"flags":[]},{"id":306,"area":"특허·실용신안","year":null,"round":null,"page":122,"metadata":"PDF p.318 / 교재 p.325 / 정답 ①","originalPdfPage":318,"bookPage":325,"answerKey":"①","question":"甲은 발명 A를 2018. 9. 1. 미국특허청에 가출원한 후 중국어로 작성하여 특허협력조약(PCT)에 따른 국제특허\n출원을 2019. 2. 1. 국제출원하였다. 지정국인 한국특허청에 국내단계에 진입한 경우로 옳지 않은 것은? [문제\n첫 문장의 일부는 스캔 흐림으로 원문 대조 필요]","answer":"① 甲이 신규성에 저촉된 것을 이유로 특허법 제62조제1호에 따라 특허거절결정을 받는 경우 제1항에 따른 [판\n독 불명확]을 적용하고자 하는 경우, 그 취지를 적은 서면 및 이를 증명할 수 있는 서류를 2018. 9. 1.부터 2년 7\n개월 이내에 제출하여야 한다. [중간 문구 스캔 흐림]","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 공지 예외 증명서류 제출기간을 2년 7개월로 적은 ①이 오답 보기입니다.","summary":"공지 예외 증명서류 제출기간을 2년 7개월로 적은 ①이 오답 보기입니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":307,"area":"특허·실용신안","year":2010,"round":47,"page":122,"metadata":"2010년 제47회 / PDF p.319 / 교재 p.326 / 정답 ③","originalPdfPage":319,"bookPage":326,"answerKey":"③","question":"국제특허출원에 관한 설명으로 옳지 않은 것은?","answer":"③ 외국어로 출원한 국제특허출원에서 명세서 등을 보정하는 경우나 국제출원인에 외국어로 출원된 실용신안\n등록출원으로 보는 국제출원을 기초로 하여 특허출원으로 변경출원하는 경우에는 수수료 납부, 국어번역문 제\n출 및 기준일 경과의 요건을 충족해야 가능하다. [중간 문구 스캔 흐림으로 원문 대조 필요]","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 변경출원에 기준일 경과가 언제나 필요한 것은 아닙니다.","summary":"변경출원에 기준일 경과가 언제나 필요한 것은 아닙니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":308,"area":"특허·실용신안","year":2009,"round":46,"page":122,"metadata":"2009년 제46회 / PDF p.320 / 교재 p.327 / 정답 ②","originalPdfPage":320,"bookPage":327,"answerKey":"②","question":"국제특허출원에 관한 다음 보기 중 옳은 것으로만 묶인 것은?","answer":"② ㄱ, ㄴ, ㅂ\nㄱ. 특허협력조약(PCT)에 의하여 국제출원일이 인정된 국제출원으로서 특허를 받기 위하여 대한민국을 지정국\n으로 지정한 국제출원은 그 국제출원일에 출원된 특허출원으로 본다.\nㄴ. 국제특허출원한 발명에 관하여 특허법 제30조(공지 등이 되지 아니한 발명으로 보는 경우) 제1항 제1호의\n적용을 받고자 하는 자는 그 취지를 기재한 서면을 통해 제30조 제2항의 규정에 불구하고 제201조(국제특허출\n원의 번역문) 제1항에 따른 기준일 경과 후 30일 이내에 특허청장에게 제출할 수 있다.\n\nㅂ. 특허청장은 외국어로 출원된 국제특허출원의 국내서면제출기간이 경과할 때 그에 관하여 특허공보에 게재\n하여 출원공개를 하여야 한다. 다만, 그 기간 내에 출원인이 출원심사청구를 한 국제특허출원으로서 특허협력\n조약 제21조에서 규정하는 국제공개가 된 것은 우선일부터 1년 6월이 경과한 때 또는 출원심사의 청구일 중 늦\n은 때에 출원공개를 한다. [일부 문구 스캔 흐림]","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 원본 정답은 ② = ㄱ·ㄴ·ㅂ입니다.","summary":"원본 정답은 ② = ㄱ·ㄴ·ㅂ입니다.","wrong":[],"right":["원본 정답은 ② = ㄱ·ㄴ·ㅂ입니다."],"reason":[],"memory":[],"flags":[]},{"id":309,"area":"특허·실용신안","year":2004,"round":41,"page":123,"metadata":"2004년 제41회 / PDF p.321 / 교재 p.328 / 정답 ④","originalPdfPage":321,"bookPage":328,"answerKey":"④","question":"특허법상 출원공개에 관한 설명으로 옳지 않은 것은?","answer":"④ 국어로 출원한 국제특허출원에 관하여 출원공개 전에 이미 특허협력조약(PCT) 제21조에 따른 국제공개가\n된 경우에는 우선일부터 1년 6개월이 되는 날에 출원공개가 된 것으로 본다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 국제공개가 먼저 되었다면 그때 출원공개된 것으로 봅니다.","summary":"국제공개가 먼저 되었다면 그때 출원공개된 것으로 봅니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":310,"area":"특허·실용신안","year":2011,"round":48,"page":123,"metadata":"2011년 제48회 / PDF p.322 / 교재 p.329 / 정답 ⑤","originalPdfPage":322,"bookPage":329,"answerKey":"⑤","question":"특허협력조약에 의한 국제특허출원에 관한 다음 설명 중 옳지 않은 것은? (설문 중의 일자는 공휴일이 아닌 것\n으로 한다)","answer":"⑤ 甲은 미국특허청을 수리관청으로 하고 우리나라를 지정국으로 하여 특허협력조약에 의한 국제출원을 영어\n로 하고, 국제출원일에 제출한 국제출원서류와 동일한 국어 번역문을 제출하였다. 그 이후에 甲은 심사청구를\n하면서 국제출원시 제출한 도면에만 기재되어 있던 발명을 청구범위에 추가하는 보정을 할 수 없다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 도면에만 기재된 발명도 허용 범위 안에서는 청구범위에 추가할 수 있습니다.","summary":"도면에만 기재된 발명도 허용 범위 안에서는 청구범위에 추가할 수 있습니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":311,"area":"특허·실용신안","year":2025,"round":62,"page":123,"metadata":"2025년 제62회 / PDF p.323 / 교재 p.330 / 정답 ②","originalPdfPage":323,"bookPage":330,"answerKey":"②","question":"특허협력조약(PCT)에 따른 국제출원에 관한 설명으로 옳지 않은 것은?","answer":"② 국제특허출원을 외국어로 출원한 출원인은 국제출원서와 발명의 설명, 청구범위 및 도면(도면 중 설명부분\n에 한정한다)의 국어번역문을 우선일부터 2년 7개월이 될 때까지 제출하여야 하고, 이를 제출하지 않으면 출원\n은 취하한 것으로 본다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 국제출원서 자체는 국어번역문 제출 대상이 아닙니다.","summary":"국제출원서 자체는 국어번역문 제출 대상이 아닙니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":312,"area":"특허·실용신안","year":2013,"round":50,"page":124,"metadata":"2013년 제50회 / PDF p.325 / 교재 p.332 / 정답 ①","originalPdfPage":325,"bookPage":332,"answerKey":"①","question":"특허법상 비밀유지명령제도에 관한 설명으로 옳은 것은?","answer":"① 국내는 물론 외국에서 정당한 사유 없이 비밀유지명령을 위반한 자에 대해서도 비밀유지명령을 신청한 자\n의 고소가 있어야 공소를 제기할 수 있다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 국내외 비밀유지명령 위반은 친고죄이므로 신청인의 고소가 필요합니다.","summary":"국내외 비밀유지명령 위반은 친고죄이므로 신청인의 고소가 필요합니다.","wrong":[],"right":["국내외 비밀유지명령 위반은 친고죄이므로 신청인의 고소가 필요합니다."],"reason":[],"memory":[],"flags":[]},{"id":313,"area":"특허·실용신안","year":2018,"round":55,"page":124,"metadata":"2018년 제55회 / PDF p.327 / 교재 p.333 / 정답 ②","originalPdfPage":327,"bookPage":333,"answerKey":"②","question":"특허법상 비밀유지명령에 관한 설명으로 옳은 것은?","answer":"② 비밀유지명령을 취소하는 재판은 확정되어야 효력이 발생하고, 비밀유지명령의 취소신청에 대한 재판에 대\n해서는 즉시항고를 할 수 있다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 취소재판의 효력은 확정 후 발생하고, 즉시항고가 가능합니다.","summary":"취소재판의 효력은 확정 후 발생하고, 즉시항고가 가능합니다.","wrong":[],"right":["취소재판의 효력은 확정 후 발생하고, 즉시항고가 가능합니다."],"reason":[],"memory":[],"flags":[]},{"id":314,"area":"특허·실용신안","year":2010,"round":47,"page":124,"metadata":"2010년 제47회 / PDF p.328 / 교재 p.334 / 정답 ②","originalPdfPage":328,"bookPage":334,"answerKey":"②","question":"특허권침해에 대한 구제조치에 관한 설명 중 옳은 것만 모두 고른 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"② ㄴ, ㄷ\nㄴ. 확장해석을 금하는 죄형법정주의의 원칙이나 특허권 직접침해의 예비단계 행위에 불과한 간접침해행위를\n특허권 직접침해의 기수범과 같은 벌칙에 의하여 처벌할 때 초래되는 형벌의 불균형성 등에 비추어 간접침해\n\n행위는 형사처벌 할 수 없다.\nㄷ. 침해죄, 거짓행위죄 및 허위표시의 죄에 대해서는 양벌규정이 적용되나, 법인 또는 개인은 그 위반행위 방\n지를 위해 해당 업무에 관하여 상당한 주의와 감독을 게을리 하지 않은 경우 책임을 면할 수 있다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 정답 ② = ㄴ(간접침해 형사처벌 제한) + ㄷ(양벌규정과 예외).","summary":"정답 ② = ㄴ(간접침해 형사처벌 제한) + ㄷ(양벌규정과 예외).","wrong":[],"right":["정답 ② = ㄴ(간접침해 형사처벌 제한) + ㄷ(양벌규정과 예외)."],"reason":[],"memory":[],"flags":[]},{"id":315,"area":"특허·실용신안","year":2016,"round":53,"page":125,"metadata":"2016년 제53회 / PDF p.329 / 교재 p.335 / 정답 ④","originalPdfPage":329,"bookPage":335,"answerKey":"④","question":"특허법상 벌칙에 관한 설명 중 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"④ 피고인의 행위가 특허권 침해죄에 해당하는지 여부를 판단함에 있어서도 특허청 결정의 소급적 효력이 미\n친다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 형사상 침해죄 판단에 특허청 결정의 소급효가 언제나 미친다는 ④가 틀립니다.","summary":"형사상 침해죄 판단에 특허청 결정의 소급효가 언제나 미친다는 ④가 틀립니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":316,"area":"특허·실용신안","year":2002,"round":39,"page":125,"metadata":"2002년 제39회 / PDF p.331 / 교재 p.336 / 정답 ⑤","originalPdfPage":331,"bookPage":336,"answerKey":"⑤","question":"특허법에 규정된 벌칙에 관한 설명으로 옳지 않은 것은?","answer":"⑤ 법인의 대표자나 법인 또는 개인의 대리인, 사용인, 그 밖의 종업원이 그 법인 또는 개인의 업무에 관하여 비\n밀누설죄를 범하면 그 행위자를 벌하는 외에 그 법인에는 6천만원 이하의 벌금형을, 그 개인에게는 해당 조문\n의 벌금형을 과한다. 다만, 법인 또는 개인이 그 위반행위를 방지하기 위하여 해당 업무에 관하여 상당한 주의\n와 감독을 게을리하지 아니한 경우에는 그러하지 아니하다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 비밀누설죄는 특허법 양벌규정 대상이 아닙니다.","summary":"비밀누설죄는 특허법 양벌규정 대상이 아닙니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":317,"area":"특허·실용신안","year":2018,"round":55,"page":125,"metadata":"2018년 제55회 / PDF p.332 / 교재 p.337 / 정답 ②","originalPdfPage":332,"bookPage":337,"answerKey":"②","question":"특허법 또는 실용신안법상 벌칙에 관한 설명으로 옳지 않은 것은?","answer":"② 특허법 제58조(전문기관의 등록 등) 제2항에 따른 전문기관 또는 제58조 제3항에 따른 전담기관의 임직원이\n거나 임직원이었던 사람은 특허법 제226조(비밀누설죄 등)를 적용하는 경우에는 특허청 소속 직원 또는 직원이\n었던 사람으로 추정한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: '추정한다'가 아니라 '본다'입니다.","summary":"'추정한다'가 아니라 '본다'입니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":318,"area":"특허·실용신안","year":2004,"round":41,"page":126,"metadata":"2004년 제41회 / PDF p.333 / 교재 p.338 / 정답 ①","originalPdfPage":333,"bookPage":338,"answerKey":"①","question":"특허법상 벌칙에 관한 설명으로 옳지 않은 것은?","answer":"① 국내외에서 정당한 사유 없이 비밀유지명령을 위반한 자는 5년 이하의 징역 또는 5천만원 이하의 벌금에 처\n하며, 이에 비밀유지명령을 신청한 자의 고소가 없어도 공소를 제기할 수 있다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 비밀유지명령 위반죄는 신청인의 고소가 있어야 공소를 제기할 수 있습니다.","summary":"비밀유지명령 위반죄는 신청인의 고소가 있어야 공소를 제기할 수 있습니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":319,"area":"특허·실용신안","year":2025,"round":62,"page":126,"metadata":"2025년 제62회 / PDF p.334 / 교재 p.339 / 원본 정답 표시 ③","originalPdfPage":334,"bookPage":339,"answerKey":"표시 ③","question":"특허법과 실용신안법상 벌칙에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)","answer":"③ ㄱ, ㄴ, ㄷ\nㄱ. 특허법에 따라 선서한 증인, 감정인 또는 통역인이 거짓으로 특허심판원에 대하여 진술·감정 또는 통역한\n경우에 그 사건의 특허취소신청에 대한 결정 또는 심결이 확정되기 전에 자수한다면 그 형을 감경 또는 면제할\n수 있다.\nㄴ. 특허청 또는 특허심판원 소속 직원이거나 직원이었던 사람이 실용신안등록 출원 중인 고안(국제출원 중인\n고안을 포함한다)에 관하여 직무상 알게 된 비밀을 누설하거나 도용한 경우에는 5년 이하의 징역 또는 5천만원\n이하의 벌금에 처한다.\nㄷ. 특허법상 특허심판원으로부터 증거조사 또는 증거보전에 관하여 서류나 그 밖의 물건 제출 또는 제시의 명\n령을 받은 자로서 정당한 이유 없이 그 명령에 따르지 아니한 자에게는 50만원 이하의 과태료를 부과한다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 원본 정답 표시 ③과 해설상 조합 ②가 충돌합니다. 원본 확인이 필요합니다.","summary":"원본 정답 표시 ③과 해설상 조합 ②가 충돌합니다. 원본 확인이 필요합니다.","wrong":[],"right":["원본 정답 표시 ③과 해설상 조합 ②가 충돌합니다. 원본 확인이 필요합니다."],"reason":[],"memory":[],"flags":["정답·해설 확인 필요"]},{"id":320,"area":"특허·실용신안","year":2021,"round":58,"page":126,"metadata":"2021년 제58회 / PDF p.335 / 교재 p.340 / 정답 ⑤","originalPdfPage":335,"bookPage":340,"answerKey":"⑤","question":"특허법에 규정된 최고 벌금액수를 제일 많은 것부터 작은 것까지의 순서로 올바르게 나열한 것은?","answer":"⑤ ㄹ-ㄴ-ㄷ-ㄱ-ㅁ\nㄹ. 법인의 업무에 관하여 그 종업원이 전용실시권을 침해한 경우 법인에 대한 벌금\nㄴ. 법인의 업무에 관하여 그 대표자가 특허권을 침해한 경우 그 대표자에 대한 벌금\nㄷ. 법인의 업무에 관하여 그 종업원이 특허된 것이 아닌 방법을 사용하기 위하여 광고에 그 방법이 특허 또는\n특허출원된 것으로 혼동하기 쉬운 표시를 한 경우 법인에 대한 벌금\nㄱ. 특허법에 따라 선서한 통역인이 특허심판원에 대하여 거짓으로 통역을 한 경우 그 통역인에 대한 벌금\nㅁ. 개인이 부정한 행위로 특허권의 존속기간 연장등록에 대한 결정을 받은 경우 개인에 대한 벌금","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 정답 ⑤: ㄹ 3억원 > ㄴ 1억원 > ㄷ 6천만원 > ㄱ 5천만원 > ㅁ 3천만원.","summary":"정답 ⑤: ㄹ 3억원 > ㄴ 1억원 > ㄷ 6천만원 > ㄱ 5천만원 > ㅁ 3천만원.","wrong":[],"right":["정답 ⑤: ㄹ 3억원 > ㄴ 1억원 > ㄷ 6천만원 > ㄱ 5천만원 > ㅁ 3천만원."],"reason":[],"memory":[],"flags":[]},{"id":321,"area":"특허·실용신안","year":2019,"round":56,"page":127,"metadata":"2019년 제56회 / PDF p.336 / 교재 p.341 / 정답 ②","originalPdfPage":336,"bookPage":341,"answerKey":"②","question":"특허제도는 발명의 공개를 통한 이용을 근간으로 하므로, 특허법은 발명의 공개를 위한 여러 규정을 두고 있다.\n아래의 발명의 공개와 관련된 제도 중 우리나라 특허제도에 가장 늦게 도입된 두 제도로 묶인 것으로 옳은 것\n은?","answer":"② ㄴ, ㅁ\nㄴ. 제87조 제3항에 따른 등록공고\nㅁ. 제42조 제2항에 따른 요약서","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 가장 늦게 도입된 두 제도는 등록공고(1997)와 요약서(1990), 정답 ②입니다.","summary":"가장 늦게 도입된 두 제도는 등록공고(1997)와 요약서(1990), 정답 ②입니다.","wrong":[],"right":["가장 늦게 도입된 두 제도는 등록공고(1997)와 요약서(1990), 정답 ②입니다."],"reason":[],"memory":[],"flags":[]},{"id":322,"area":"특허·실용신안","year":2009,"round":46,"page":127,"metadata":"2009년 제46회 / PDF p.338 / 교재 p.342 / 정답 ⑤","originalPdfPage":338,"bookPage":342,"answerKey":"⑤","question":"공업소유권의 보호를 위한 파리협약(이하 “파리협약”이라 함) 상의 특허독립의 원칙에 관하여 다음 설명 중 옳\n지 않은 것은?","answer":"⑤ 파리협약은 특허독립의 원칙에 관한 조항과 별도로 상표독립의 원칙에 관해서 명시하고 있지 않다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 파리협약에는 상표독립 원칙도 명시되어 있습니다.","summary":"파리협약에는 상표독립 원칙도 명시되어 있습니다.","wrong":[],"right":["파리협약에는 상표독립 원칙도 명시되어 있습니다."],"reason":[],"memory":[],"flags":[]},{"id":323,"area":"특허·실용신안","year":2009,"round":46,"page":128,"metadata":"2009년 제46회 / PDF p.339 / 교재 p.343 / 정답 ④","originalPdfPage":339,"bookPage":343,"answerKey":"④","question":"무역관련 지적재산권에 관한 협정(이하 “TRIPs 협정”이라고 함)에 관한 설명 중 옳지 않은 것은?","answer":"④ TRIPs 협정은 권리소진의 원칙이 적용됨을 명시적으로 규정하고 있으므로 회원국이 진정상품의 병행수입을\n허용하지 않는 것은 TRIPs 협정에 규정된 권리소진의 원칙을 위반하는 결과가 된다.","correction":"틀린 부분: 권리소진의 원칙이 적용됨을 명시적으로 규정\n바른 표현: 권리소진 및 병행수입 허용 여부는 일률적으로 강제하지 않는다\n이유: 교재 해설은 TRIPs 협정이 병행수입에 관한 회원국의 선택을 남긴다고 설명합니다.","summary":"틀린 부분: 권리소진의 원칙이 적용됨을 명시적으로 규정\n바른 표현: 권리소진 및 병행수입 허용 여부는 일률적으로 강제하지 않는다\n이유: 교재 해설은 TRIPs 협정이 병행수입에 관한 회원국의 선택을 남긴다고 설명합니다.\n암기 결론: TRIPs 협정이 병행수입 허용을 일률적으로 강제한다는 ④가 틀립니다.","wrong":["권리소진의 원칙이 적용됨을 명시적으로 규정"],"right":["권리소진 및 병행수입 허용 여부는 일률적으로 강제하지 않는다"],"reason":["교재 해설은 TRIPs 협정이 병행수입에 관한 회원국의 선택을 남긴다고 설명합니다."],"memory":["TRIPs 협정이 병행수입 허용을 일률적으로 강제한다는 ④가 틀립니다."],"flags":[]},{"id":324,"area":"특허·실용신안","year":2013,"round":50,"page":128,"metadata":"2013년 제50회 / PDF p.340 / 교재 p.344 / 정답 ②","originalPdfPage":340,"bookPage":344,"answerKey":"②","question":"무역관련 지적재산권에 관한 협정(TRIPs 협정)에 관한 설명으로 옳지 않은 것은?","answer":"② 회원국의 법률이 정부 또는 정부의 승인을 받은 제3자에 의한 사용을 포함하여 권리자의 승인 없이 특허대\n상의 다른 사용을 허용하는 경우에 그 사용의 범위 및 기간은 동 사용이 승인된 목적에 한정되며 생명공학 기\n술의 경우는 공공의 비상업적 사용 또는 사법 혹은 행정절차의 결과 반경쟁적이라고 판결된 관행을 교정하는\n것에 한정된다.","correction":"틀린 부분: 생명공학 기술의 경우\n바른 표현: 반도체 기술의 경우\n이유: 교재의 TRIPs 협정 제31조 (c) 설명은 해당 제한의 대상을 반도체 기술이라고 명시합니다.","summary":"틀린 부분: 생명공학 기술의 경우\n바른 표현: 반도체 기술의 경우\n이유: 교재의 TRIPs 협정 제31조 (c) 설명은 해당 제한의 대상을 반도체 기술이라고 명시합니다.\n암기 결론: 해당 제한은 반도체 기술에 관한 것이므로, 생명공학 기술이라고 한 ②가 틀립니다.","wrong":["생명공학 기술의 경우"],"right":["반도체 기술의 경우"],"reason":["교재의 TRIPs 협정 제31조 (c) 설명은 해당 제한의 대상을 반도체 기술이라고 명시합니다."],"memory":["해당 제한은 반도체 기술에 관한 것이므로, 생명공학 기술이라고 한 ②가 틀립니다."],"flags":[]},{"id":325,"area":"특허·실용신안","year":2008,"round":45,"page":128,"metadata":"2008년 제45회 / PDF p.341 / 교재 p.345 / 정답 ②","originalPdfPage":341,"bookPage":345,"answerKey":"②","question":"특허에 관한 조약을 설명한 다음 보기 중 옳지 않은 것으로만 묶인 것은?","answer":"② ㄴ, ㄷ, ㄹ\nㄴ. WTO/TRIPs 협정 및 파리협약의 해석이나 집행에 관한 분쟁해결은 WTO 분쟁해결기구에 제소할 수 있다.\nㄷ. WTO/TRIPs 협정에 의하면 식물변종(plant varieties)을 특허와는 독립된 입법에 의하여 보호할 것을 규정하\n\n고 있다.\nㄹ. 특허협력조약(PCT)에 의하면 세계 모든 국가에 효력을 발생시키는 단일의 국제특허를 취득할 수 있다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ② = ㄴ·ㄷ·ㄹ. PCT 출원만으로 전 세계 단일특허가 생기지 않습니다.","summary":"정답 ② = ㄴ·ㄷ·ㄹ. PCT 출원만으로 전 세계 단일특허가 생기지 않습니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":326,"area":"특허·실용신안","year":2004,"round":41,"page":129,"metadata":"2004년 제41회 / PDF p.342 / 교재 p.346 / 정답 ④","originalPdfPage":342,"bookPage":346,"answerKey":"④","question":"특허관련 국제조약에 관한 설명으로 옳은 것은?","answer":"④ WTO/TRIPs 협정은 파리협약과 달리 그 기본원칙 중 하나로서 최혜국대우원칙을 천명하고 있다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 정답 ④. TRIPs 협정의 3대 원칙: 최소보호·내국민대우·최혜국대우.","summary":"정답 ④. TRIPs 협정의 3대 원칙: 최소보호·내국민대우·최혜국대우.","wrong":[],"right":["정답 ④. TRIPs 협정의 3대 원칙: 최소보호·내국민대우·최혜국대우."],"reason":[],"memory":[],"flags":[]},{"id":327,"area":"특허·실용신안","year":2022,"round":59,"page":129,"metadata":"2022년 제59회 / PDF p.344 / 교재 p.348 / 정답 ③, ⑤","originalPdfPage":344,"bookPage":348,"answerKey":"③, ⑤","question":"실용신안권 및 침해에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"③ 등록고안과 대비되는 고안이 공지의 기술만으로 이루어진 경우라 하더라도 등록고안과 대비하여 등록고안\n의 권리범위에 속하는지 여부를 판단하고, 이 경우에 그 등록내용과 동일·유사한 물품을 제작·판매하였다면 실\n용신안권 침해죄를 구성할 수 있다.\n⑤ 실용신안권 침해죄는 7년 이하 징역 또는 1억원 이하 벌금에 처하고, 고소가 없으면 공소(公訴)를 제기할 수\n없다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ③·⑤. 공지기술에 관한 권리범위 판단과 침해죄의 공소제기 조건을 구별합니다.","summary":"정답 ③·⑤. 공지기술에 관한 권리범위 판단과 침해죄의 공소제기 조건을 구별합니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":328,"area":"특허·실용신안","year":2021,"round":58,"page":129,"metadata":"2021년 제58회 / PDF p.345 / 교재 p.349 / 정답 ⑤","originalPdfPage":345,"bookPage":349,"answerKey":"⑤","question":"실용신안등록출원에 관한 설명으로 옳은 것을 모두 고른 것은?","answer":"⑤ ㄱ, ㄴ, ㄷ, ㄹ\nㄱ. 실용신안등록출원인이 외국어실용신안등록출원을 한 경우, 실용신안법 제11조(특허법의 준용)에 따라 준용\n되는 특허법 제47조(특허출원의 보정) 제1항 제1호 또는 제2호에 따른 기간에 정정을 하는 경우에는 마지막 정\n정 전에 한 모든 정정은 처음부터 없었던 것으로 본다.\nㄴ. 하나의 총괄적 고안의 개념을 형성하는 일 군(群)의 고안에 대하여도 하나의 실용신안등록출원을 할 수 있\n다.\nㄷ. 특허심판원 소속 직원이었던 사람이 실용신안등록출원 중인 고안에 관하여 직무상 알게 된 비밀을 도용한\n경우에는 5년 이하의 징역 또는 5천만원 이하의 벌금에 처한다.\nㄹ. 실용신안등록출원일부터 3년이 지난 후에도 변경출원을 010년 제47회 / PDF p.389 / 교재 p.392 / 정답 ④","originalPdfPage":389,"bookPage":392,"answerKey":"④","question":"상표법상 서적의 제호에 관한 설명으로 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)","answer":"④ 서적, 콤팩트릿, 녹화된 콤팩트 디스크(음악이 아닌 시디)를 지정상품으로 하는 ‘Linux’의 경우, 지정상품의\n내용이 그 프로그램에 관련된 것임을 암시할 가능성이 있으며, 그 상품에 수록된 창작물의 내용이나 그 내용을\n나타내는 제목에 중점을 두고 상품을 거래하는 점에 비추어 볼 때 기술적 표장에 해당한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ④. 상품 내용과 관련될 가능성만으로 ‘Linux’를 서적 등의 기술적 표장으로 단정할 수 없습니다.","summary":"정답 ④. 상품 내용과 관련될 가능성만으로 ‘Linux’를 서적 등의 기술적 표장으로 단정할 수 없습니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":366,"area":"상표","year":2011,"round":48,"page":142,"metadata":"2011년 제48회 / PDF p.390 / 교재 p.393 / 정답 ④","originalPdfPage":390,"bookPage":393,"answerKey":"④","question":"상표법상 상표의 사용 또는 상품에 관한 설명으로 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"④ 약사법에서 규정하는 보건복지부장관의 품목별 허가를 받지 않은 의약품을 지정상품으로 하는 등록상표라\n도 이를 선전·광고하거나 지정상품에 부착하여 판매하는 것은 정당한 상표사용에 해당하여 상표등록의 취소를\n면할 수 있다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ④. 필요한 품목별 허가 없이 의약품을 광고·판매하며 상표를 표시한 경우, 교재는 정당한 상표사용으로\n보지 않습니다.","summary":"정답 ④. 필요한 품목별 허가 없이 의약품을 광고·판매하며 상표를 표시한 경우, 교재는 정당한 상표사용으로\n보지 않습니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":367,"area":"상표","year":2012,"round":49,"page":143,"metadata":"2012년 제49회 / PDF p.391 / 교재 p.394 / 해설상 정답 ④","originalPdfPage":391,"bookPage":394,"answerKey":"④","question":"상표 및 상표의 사용에 관한 설명으로 옳은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"④ 등록상표와 동일 또는 유사한 상표가 표시되어 있고, 그 지정상품과 동일 또는 유사한 상품을 양도하기 위하\n여 소지하는 행위는 상표의 사용에 포함된다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 해설상 정답 ④로 판단되나, 원본의 정답 번호와 ④ 해설의 대응은 추가 대조가 필요합니다.","summary":"해설상 정답 ④로 판단되나, 원본의 정답 번호와 ④ 해설의 대응은 추가 대조가 필요합니다.","wrong":[],"right":["해설상 정답 ④로 판단되나, 원본의 정답 번호와 ④ 해설의 대응은 추가 대조가 필요합니다."],"reason":[],"memory":[],"flags":[]},{"id":368,"area":"상표","year":2013,"round":50,"page":143,"metadata":"2013년 제50회 / PDF p.392 / 교재 p.395 / 정답 ④, ⑤","originalPdfPage":392,"bookPage":395,"answerKey":"④, ⑤","question":"상표 및 상품의 유사여부 판단에 관한 설명으로 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"④ 판례에 의하면 ‘휴대용 통신기계기구’와 ‘MP3 플레이어’는 유사하며, ‘일반의료기계기구’와 ‘치과용 의료기계\n기구’도 유사하다.\n⑤ 상표법 제34조 제1항 제7호(선등록상표와 동일·유사)와 관련하여 등록상표와 인용상표의 유사여부를 판단\n하는 경우 등록상표 또는 인용상표의 각 구성부분 중 일부가 자타상품의 식별력이 없는지 여부는 등록상표의\n출원시를 기준으로 판단한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ④·⑤. 상품의 구체적인 용도·수요자를 살피고, 식별력 판단시점은 교재 기준 등록여부결정시입니다.","summary":"정답 ④·⑤. 상품의 구체적인 용도·수요자를 살피고, 식별력 판단시점은 교재 기준 등록여부결정시입니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":369,"area":"상표","year":2014,"round":51,"page":143,"metadata":"2014년 제51회 / PDF p.393 / 교재 p.396 / 정답 ②","originalPdfPage":393,"bookPage":396,"answerKey":"②","question":"상표 및 상표의 사용에 관한 설명으로 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"② 불사용취소심판에 관한 상표법 제119조(상표등록의 취소심판) 제1항 제3호의 적용 시, 상표권자가 외국에서\n자신의 등록상표를 상품에 표시하였을 뿐 우리나라에서 직접 또는 대리인을 통하여 상품을 수입한 바 없다면,\n그 상품이 제3자에 의해 국내에 수입되어 정상적인 거래가 이루어졌다고 하더라도 상표권자의 상표사용으로\n볼 수 없다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ②. 상표권자가 직접 수입하지 않았더라도, 표시된 상품이 정상적으로 국내 유통되면 국내 상표 사용이 인\n정될 수 있습니다.","summary":"정답 ②. 상표권자가 직접 수입하지 않았더라도, 표시된 상품이 정상적으로 국내 유통되면 국내 상표 사용이 인\n정될 수 있습니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":370,"area":"상표","year":2015,"round":52,"page":144,"metadata":"2015년 제52회 / PDF p.394 / 교재 p.397 / 정답 ①","originalPdfPage":394,"bookPage":397,"answerKey":"①","question":"상표의 사용에 의한 식별력에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","answer":"① 사용에 의한 식별력 취득여부의 판단 시기는 원칙적으로 ‘상표등록여부 결정시’이지만, 권리범위 확인 심판\n절차에서 상표의 요부 해당 여부 판단 시에는 ‘심결시’를 기준으로 판단할 수 있다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 정답 ①. 등록을 위한 사용에 의한 식별력은 상표등록여부 결정시, 권리범위확인심판에서 유사 여부를 판단하\n는 요소로서의 식별력은 심결시를 기준으로 봅니다.","summary":"정답 ①. 등록을 위한 사용에 의한 식별력은 상표등록여부 결정시, 권리범위확인심판에서 유사 여부를 판단하\n는 요소로서의 식별력은 심결시를 기준으로 봅니다.","wrong":[],"right":["정답 ①. 등록을 위한 사용에 의한 식별력은 상표등록여부 결정시, 권리범위확인심판에서 유사 여부를 판단하"],"reason":[],"memory":[],"flags":[]},{"id":371,"area":"상표","year":2015,"round":52,"page":144,"metadata":"2015년 제52회 / PDF p.395 / 교재 p.398 / 해설상 정답 ④ (정답 표시가 원본 오른쪽 가장자리에 걸려 직접 판 / 독되지 않음)","originalPdfPage":395,"bookPage":398,"answerKey":"④ (정답 표시가 원본 오른쪽 가장자리에 걸려 직접 판","question":"상표의 동일·유사에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"④ 외국어로 이루어진 상표의 호칭은 우리나라의 거래자나 일반수요자의 대부분이 실제로 그 외국어 상표를\n특정한 발음으로 널리 호칭·인식하고 있다는 등의 구체적·개별적 사정이 있는 경우에는 이를 고려하여 외국어\n상표의 호칭을 정할 수 있으며, 그와 같은 구체적·개별적 사정은 증거에 의해 명백하게 인정받을 필요까지는 없\n다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 해설상 정답 ④. 외국어 상표를 예외적인 특정 발음으로 호칭한다는 사정은 증거로 명백히 인정되어야 합니다.","summary":"해설상 정답 ④. 외국어 상표를 예외적인 특정 발음으로 호칭한다는 사정은 증거로 명백히 인정되어야 합니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":372,"area":"상표","year":2016,"round":53,"page":144,"metadata":"2016년 제53회 / PDF p.396 / 교재 p.399 / 정답 ⑤","originalPdfPage":396,"bookPage":399,"answerKey":"⑤","question":"상표법에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","answer":"⑤ 디자인과 상표는 배타적·선택적인 관계에 있는 것이 아니므로 디자인이 될 수 있는 형상이나 모양이라고 하\n더라도 그것이 상표의 본질적인 기능이라고 할 수 있는 자타상품의 출처표시를 위하여 사용되는 것으로 볼 수\n있는 경우에는 위 사용은 상표로서의 사용이라고 보아야 할 것이다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 정답 ⑤. 디자인이 될 수 있는 형상·모양도 출처표시로 사용되면 상표로서의 사용이 될 수 있습니다.","summary":"정답 ⑤. 디자인이 될 수 있는 형상·모양도 출처표시로 사용되면 상표로서의 사용이 될 수 있습니다.","wrong":[],"right":["정답 ⑤. 디자인이 될 수 있는 형상·모양도 출처표시로 사용되면 상표로서의 사용이 될 수 있습니다."],"reason":[],"memory":[],"flags":[]},{"id":373,"area":"상표","year":2019,"round":56,"page":145,"metadata":"2019년 제56회 / PDF p.397 / 교재 p.400 / 정답 ①","originalPdfPage":397,"bookPage":400,"answerKey":"①","question":"상표법상 상표의 식별력에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","answer":"① 상표등록여부결정을 할 때에 식별력이 없어 등록을 받을 수 없었음에도 불구하고 잘못하여 상표등록이 이\n루어진 경우에는 비록 그 등록 후의 사용에 의하여 식별력을 취득하였더라도 등록무효의 하자가 치유되지 아\n니한다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 정답 ①. 등록 당시의 식별력 부족으로 생긴 등록무효의 하자는 등록 후의 식별력 취득만으로 치유되지 않습니\n다.","summary":"정답 ①. 등록 당시의 식별력 부족으로 생긴 등록무효의 하자는 등록 후의 식별력 취득만으로 치유되지 않습니\n다.","wrong":[],"right":["정답 ①. 등록 당시의 식별력 부족으로 생긴 등록무효의 하자는 등록 후의 식별력 취득만으로 치유되지 않습니"],"reason":[],"memory":[],"flags":[]},{"id":374,"area":"상표","year":2019,"round":56,"page":145,"metadata":"2019년 제56회 / PDF p.398 / 교재 p.401 / 정답 ②","originalPdfPage":398,"bookPage":401,"answerKey":"②","question":"상표법상 상표의 사용에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"② 상표법 제2조 제1항 제11호 다목에서 말하는 상품에 관한 광고에는 시각으로 인식할 수 있는 것이 포함되어\n야 하므로 그 광고에는 상품명이나 제조원이 표시되어야 상표의 사용으로 인정된다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ②. 광고에 상품명·제조원이 반드시 표시되어야만 상표 사용이 되는 것은 아닙니다.","summary":"정답 ②. 광고에 상품명·제조원이 반드시 표시되어야만 상표 사용이 되는 것은 아닙니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":375,"area":"상표","year":2019,"round":56,"page":145,"metadata":"2019년 제56회 / PDF p.399 / 교재 p.402 / 정답 ②","originalPdfPage":399,"bookPage":402,"answerKey":"②","question":"상표법상 다음 설명 중 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"② 상품에 상표를 표시한 것을 인도할 목적으로 수출하는 행위는 상표의 사용에 해당하지 아니한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ②. 상표를 표시한 상품을 인도할 목적으로 수출하는 행위도 상표의 사용에 포함됩니다.","summary":"정답 ②. 상표를 표시한 상품을 인도할 목적으로 수출하는 행위도 상표의 사용에 포함됩니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":376,"area":"상표","year":2020,"round":57,"page":146,"metadata":"2020년 제57회 / PDF p.400 / 교재 p.403 / 정답 ①","originalPdfPage":400,"bookPage":403,"answerKey":"①","question":"상표의 식별력에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"① 상표의 구성 중 식별력이 없거나 미약한 부분이 거래사회에서 오랜기간 사용된 결과 수요자 간에 누구의 업\n무에 관련된 상품을 표시하는 것인가 현저하게 인식되어 있는 경우에는 그 부분은 사용된 상품에 관계없이 식\n별력 있는 요부로 보아 상표의 유사여부를 판단할 수 있다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ①. 사용으로 식별력을 얻은 약한 구성 부분을 요부로 보는 판단은 선사용상표가 사용된 상품에 한정됩니\n다.","summary":"정답 ①. 사용으로 식별력을 얻은 약한 구성 부분을 요부로 보는 판단은 선사용상표가 사용된 상품에 한정됩니\n다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":377,"area":"상표","year":2020,"round":57,"page":146,"metadata":"2020년 제57회 / PDF p.401 / 교재 p.404 / 정답 ⑤(ㄴ, ㄷ, ㄹ)","originalPdfPage":401,"bookPage":404,"answerKey":"⑤(ㄴ, ㄷ, ㄹ)","question":"甲은 2017년 1월 7일부터 본인이 판매하는 자동차 용품에 붙여 사용한 A(기술적 표장)를 2018년 11월 26일 출\n원하였고, 출원 전부터 활발하게 사용된 A상표는 2019년 4월경 거래사회에서 일반수요자나 거래자에게 특정인\n의 상품에 관한 출처를 표시하는 것으로 현저하게 인식되었으며, 2020년 1월 8일 등록결정 되었다. 이와 관련\n하여 옳은 것을 모두 고른 것은? (다툼이 있으면 판례에 의함)","answer":"⑤ ㄴ, ㄷ, ㄹ\nㄴ. 식별력 없는 기술적 표장이라고 할지라도 사용에 의한 식별력을 취득하면 예외적으로 상표 등록을 인정해\n주는 상표법 제33조(상표등록의 요건) 제2항의 적용은 [원문 중간 표현 판독 불명확] 상표 등록여부결정을 할\n때를 기준으로 판단하여야 하므로 A상표는 등록결정을 받을 수 있다.\nㄷ. 일반수요자의 A상표에 대한 상품표지로서의 인식은 익명의 존재로서의 추상적 출처이면 족한 것이지 구체\n적으로 甲의 성명이나 명칭까지 인식할 필요는 없다.\nㄹ. A상표는 출원 시 비록 기술적 표장에 불과하였지만 등록여부결정 전까지 사용에 의한 식별력을 취득하여\n등록된 이상 식별력 있는 표장으로서 상표법 제90조(상표권의 효력이 미치지 아니하는 범위) 제1항 제2호에 의\n한 상표권 효력 제한을 받지 않는다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 정답 ⑤(ㄴ, ㄷ, ㄹ). 등록결정 전 식별력 취득, 동일한 출처에 대한 인식, 등록 후 효력 제한 여부를 구분합니다.","summary":"정답 ⑤(ㄴ, ㄷ, ㄹ). 등록결정 전 식별력 취득, 동일한 출처에 대한 인식, 등록 후 효력 제한 여부를 구분합니다.","wrong":[],"right":["정답 ⑤(ㄴ, ㄷ, ㄹ). 등록결정 전 식별력 취득, 동일한 출처에 대한 인식, 등록 후 효력 제한 여부를 구분합니다."],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":378,"area":"상표","year":2020,"round":57,"page":147,"metadata":"2020년 제57회 / 문제 PDF p.402·교재 p.405 / 해설 PDF p.403·교재 p.406 / 정답 ②","originalPdfPage":402,"bookPage":405,"answerKey":"②","question":"상표의 사용에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 의함)","answer":"② 소관부처로부터 등록상표의 지정상품인 의약품의 제조나 수입에 관한 품목별허가를 받지 아니한 상태에서\n신문에 1년 못미치게 한차례씩 그 상표를 광고하였거나 국내의 일부 특정지역에서 해당 상표를 부착한 지정상\n품이 판매된 경우라면 불사용으로 인한 상표등록취소심판에서의 정당한 사용이 있었다고 볼 수 없다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 정답 ②. 의약품의 필요한 품목별 허가 없이 제한적인 광고·판매만 있었다면 이 사안에서는 불사용취소심판상\n정당한 사용으로 보지 않습니다.","summary":"정답 ②. 의약품의 필요한 품목별 허가 없이 제한적인 광고·판매만 있었다면 이 사안에서는 불사용취소심판상\n정당한 사용으로 보지 않습니다.","wrong":[],"right":["정답 ②. 의약품의 필요한 품목별 허가 없이 제한적인 광고·판매만 있었다면 이 사안에서는 불사용취소심판상"],"reason":[],"memory":[],"flags":[]},{"id":379,"area":"상표","year":2021,"round":58,"page":147,"metadata":"2021년 제58회 / PDF p.404 / 교재 p.407 / 정답 ③","originalPdfPage":404,"bookPage":407,"answerKey":"③","question":"상표법상 상품에 해당되는 것은? (다툼이 있으면 판례에 따름)","answer":"③ 인터넷에서 다운로드의 형태로 판매되는 컴퓨터프로그램","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 정답 ③. 다운로드형 컴퓨터프로그램도 독립적으로 거래되는 상품에 해당합니다.","summary":"정답 ③. 다운로드형 컴퓨터프로그램도 독립적으로 거래되는 상품에 해당합니다.","wrong":[],"right":["정답 ③. 다운로드형 컴퓨터프로그램도 독립적으로 거래되는 상품에 해당합니다."],"reason":[],"memory":[],"flags":[]},{"id":380,"area":"상표","year":2021,"round":58,"page":147,"metadata":"2021년 제58회 / PDF p.405 / 교재 p.408 / 정답 ⑤","originalPdfPage":405,"bookPage":408,"answerKey":"⑤","question":"상표의 식별력에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"⑤ 수요자를 기만할 염려가 있는 상표가 특정인의 상표나 상품이라고 인식되었다고 인정되려면 선사용상표가\n국내 전역에 걸쳐 수요자와 거래자에게 알려져야 하고, 특정인의 상표 등으로 인식되었는지 여부는 구체적인\n사안에서 개별적으로 새로운 관념이나 식별력이 생겼는지를 판단하여야 한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ⑤. 선사용상표가 반드시 국내 전역에 알려져야 하는 것은 아니며, 사용과 거래 실정을 종합해 인식 정도\n를 판단합니다.","summary":"정답 ⑤. 선사용상표가 반드시 국내 전역에 알려져야 하는 것은 아니며, 사용과 거래 실정을 종합해 인식 정도\n를 판단합니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":381,"area":"상표","year":2021,"round":58,"page":148,"metadata":"2021년 제58회 / PDF p.406 / 교재 p.409 / 정답 ④","originalPdfPage":406,"bookPage":409,"answerKey":"④","question":"상표 유사에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"④ 도형상표들에서 상표의 유사 여부 판단은 두 개의 상표 자체를 나란히 놓고 대비하여 두 개의 상표를 대하\n는 일반 수요자에게 상품 출처에 관하여 오인·혼동을 일으킬 우려가 있는지의 관점에서 이루어져야 한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ④. 상표 유사 여부는 나란히 직접 비교하는 방식이 아니라 별도의 기회와 장소에서 생기는 출처 혼동 가\n능성을 기준으로 판단합니다.","summary":"정답 ④. 상표 유사 여부는 나란히 직접 비교하는 방식이 아니라 별도의 기회와 장소에서 생기는 출처 혼동 가\n능성을 기준으로 판단합니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":382,"area":"상표","year":2022,"round":59,"page":148,"metadata":"2022년 제59회 / PDF p.407 / 교재 p.410 / 정답 ③","originalPdfPage":407,"bookPage":410,"answerKey":"③","question":"사용에 의한 식별력을 취득한 상표에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"③ 상표법 제34조(상표등록을 받을 수 없는 상표) 제1항 제7호의 적용에 있어 선출원 등록상표의 등록여부결정\n시에는 식별력이 미약하였던 일부 구성부분이 타인의 후출원상표와 유사판단 시 요부로 되기 위해서는 타인의\n후출원상표의 출원시를 기준으로 사용에 의한 식별력을 취득하여야 한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ③. 이 문제에서 교재가 제시한 판단 기준시점은 후출원상표의 출원시가 아니라 등록여부결정시입니다.","summary":"정답 ③. 이 문제에서 교재가 제시한 판단 기준시점은 후출원상표의 출원시가 아니라 등록여부결정시입니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":383,"area":"상표","year":2022,"round":59,"page":148,"metadata":"2022년 제59회 / PDF p.408 / 교재 p.411 / 정답 ④","originalPdfPage":408,"bookPage":411,"answerKey":"④","question":"상표법상 상표가 동일 또는 동일성이 있는 경우뿐만 아니라 유사한 경우에도 적용 되는 것은?","answer":"④ 타인의 등록상표가 표시된 상품을 양도, 인도하기 위한 소지 행위가 침해로 보는 행위(제108조 제1항 제4호)\n에 해당하는 지 여부 판단 시","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 정답 ④. 양도·인도를 위한 소지 행위가 침해로 보는 행위인지 판단할 때는 등록상표와 유사한 상표도 포함됩니\n다.","summary":"정답 ④. 양도·인도를 위한 소지 행위가 침해로 보는 행위인지 판단할 때는 등록상표와 유사한 상표도 포함됩니\n다.","wrong":[],"right":["정답 ④. 양도·인도를 위한 소지 행위가 침해로 보는 행위인지 판단할 때는 등록상표와 유사한 상표도 포함됩니"],"reason":[],"memory":[],"flags":[]},{"id":384,"area":"상표","year":2024,"round":61,"page":149,"metadata":"2024년 제61회 / PDF p.409 / 교재 p.412 / 정답 ⑤","originalPdfPage":409,"bookPage":412,"answerKey":"⑤","question":"상표의 유사판단에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"⑤ 등록상표의 구성 중 식별력 없는 일부분이 등록 전 사용에 의한 식별력을 취득한 경우에는 그 부분은 사용\n상품과 유사한 상품에 관하여 상표유사판단의 요부가 될 수 있다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ⑤. 사용에 의해 식별력을 얻은 부분의 요부 판단을 사용된 상품과 유사한 상품으로까지 곧바로 넓히지\n않습니다.","summary":"정답 ⑤. 사용에 의해 식별력을 얻은 부분의 요부 판단을 사용된 상품과 유사한 상품으로까지 곧바로 넓히지\n않습니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":385,"area":"상표","year":2024,"round":61,"page":149,"metadata":"2024년 제61회 / PDF p.410 / 교재 p.413 / 정답 ③","originalPdfPage":410,"bookPage":413,"answerKey":"③","question":"상표의 식별력에 관한 설명으로 옳지 않은 것은?","answer":"③ 상표법 제33조(상표등록의 요건) 제1항 제1호 내지 제3호를 이유로 거절결정을 하는 경우에는 지정상품 전\n부에 대하여 거절결정을 하여야 한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ③. 제33조 제1항 제3호에 따른 식별력 판단에서도 지정상품별 부분거절이 가능합니다.","summary":"정답 ③. 제33조 제1항 제3호에 따른 식별력 판단에서도 지정상  상표등록출원하여 등록받은 경우, 甲이 취할 수 있는 조치에 관한 설명 중 옳은 것\n은?","answer":"③ ①의 조건과 무관하게 등록 후 언제든지 상표등록의 무효심판을 청구할 수 있다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 정답 ③. 이 문제의 대리인 무단 등록에 대한 무효심판은 ①의 선행 조건과 관계없이 청구할 수 있다고 교재가\n설명합니다.","summary":"정답 ③. 이 문제의 대리인 무단 등록에 대한 무효심판은 ①의 선행 조건과 관계없이 청구할 수 있다고 교재가\n설명합니다.","wrong":[],"right":["정답 ③. 이 문제의 대리인 무단 등록에 대한 무효심판은 ①의 선행 조건과 관계없이 청구할 수 있다고 교재가"],"reason":[],"memory":[],"flags":[]},{"id":392,"area":"상표","year":2009,"round":46,"page":152,"metadata":"2009년 제46회 / PDF p.420 / 교재 p.423 / 정답 ⑤","originalPdfPage":420,"bookPage":423,"answerKey":"⑤","question":"甲은 국내에서 주지된 乙의 미등록상표와 유사한 상표를 그 지정상품과 유사한 상품을 지정상품으로 하여 출\n원하였는데 심사착오로 상표등록이 되었다. 이 경우 甲과 乙 양자의 관계에 관한 설명 중 옳지 않은 것은?","answer":"⑤ 甲의 등록상표가 무효로 되기 전이라면 그 존속기간 동안 甲의 등록상표의 사용에 제약을 받는 경우는 없다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ⑤. 등록상표가 무효가 되기 전에도 부정경쟁행위에 해당하면 그 사용이 제한될 수 있습니다.","summary":"정답 ⑤. 등록상표가 무효가 되기 전에도 부정경쟁행위에 해당하면 그 사용이 제한될 수 있습니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":393,"area":"상표","year":2010,"round":47,"page":152,"metadata":"2010년 제47회 / PDF p.421 / 교재 p.424 / 해설상 정답 ⑤ (원본 정답 표시가 오른쪽 가장자리에 걸림)","originalPdfPage":421,"bookPage":424,"answerKey":"⑤ (원본 정답 표시가 오른쪽 가장자리에 걸림)","question":"상표법 제34조 제1항 제13호(부정한 목적에 의한 상표등록출원)에 관한 설명으로 옳지 않은 것은? (다툼이 있\n는 경우 판례에 의함)","answer":"⑤ 본 호에 해당하는 것을 사유로하는 상표등록의 무효심판은 상표등록일부터 5년을 경과한 후에는 이를 청구\n할 수 없다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 해설상 정답 ⑤. 이 무효사유에는 교재상 5년의 제척기간이 없습니다.","summary":"해설상 정답 ⑤. 이 무효사유에는 교재상 5년의 제척기간이 없습니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":394,"area":"상표","year":2010,"round":47,"page":152,"metadata":"2010년 제47회 / PDF p.422 / 교재 p.425 / 정답 ④","originalPdfPage":422,"bookPage":425,"answerKey":"④","question":"상표법 제34조 제1항 제2호(국가 등과의 관계를 허위로 표시하거나 모욕하는 상표)에 관한 설명으로 옳지 않은\n것은? (다툼이 있는 경우 판례에 의함)","answer":"④ 등록상표 ‘인디안’은 지정상품인 건과자, 아이스크림과의 관계에서 특정국가, 민족을 비방, 모욕 또는 악평을\n받게할 염려가 있는 상표에 해당한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ④. 이 사례의 ‘인디안’ 표장은 지정상품과의 관계에서 비방·모욕 우려가 있다고 보기 어렵다는 것이 교재\n해설입니다.","summary":"정답 ④. 이 사례의 ‘인디안’ 표장은 지정상품과의 관계에서 비방·모욕 우려가 있다고 보기 어렵다는 것이 교재\n해설입니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":395,"area":"상표","year":2010,"round":47,"page":153,"metadata":"2010년 제47회 / PDF p.423 / 교재 p.426 / 정답 ②","originalPdfPage":423,"bookPage":426,"answerKey":"②","question":"식별력 없는 상표에 관한 설명으로 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)","answer":"② 기술적 표장만으로 된 상표와 다른 식별력 있는 상표의 유사여부를 판단함에 있어 상표의 식별력 유무는 고\n려대상이 되지 않는다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ②. 기술적 표장과 다른 상표를 비교할 때에도 식별력의 유무를 고려합니다.","summary":"정답 ②. 기술적 표장과 다른 상표를 비교할 때에도 식별력의 유무를 고려합니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":396,"area":"상표","year":2011,"round":48,"page":153,"metadata":"2011년 제48회 / PDF p.424 / 교재 p.427 / 정답 ②","originalPdfPage":424,"bookPage":427,"answerKey":"②","question":"상표법 제34조(상표등록을 받을 수 없는 상표)에 관한 설명으로 옳지 않은 것은?","answer":"② 상표법 제34조 제1항 제1호 나목에 규정된 ‘공업소유권의 보호를 위한 파리협약’ 동맹국, 세계무역기구 회원\n국 또는 ‘상표법조약’ 체약국의 국기와 동일하거나 이와 유사한 상표는 등록을 받을 수 없으며, 본 호에서 나열\n하는 국가는 우리나라가 승인한 국가만을 의미한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ②. 제34조 제1항 제1호 나목의 적용에 우리나라의 승인 요건은 필요하지 않습니다.","summary":"정답 ②. 제34조 제1항 제1호 나목의 적용에 우리나라의 승인 요건은 필요하지 않습니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":397,"area":"상표","year":2012,"round":49,"page":153,"metadata":"2012년 제49회 / PDF p.425 / 교재 p.428 / 해설상 정답 ② (원본 정답 표시는 가장자리에서 확인되지 않음)","originalPdfPage":425,"bookPage":428,"answerKey":"② (원본 정답 표시는 가장자리에서 확인되지 않음)","question":"상표의 식별력에 관한 설명으로 옳은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"② 간단하고 흔한 도형의 조합이 반복되는 표장이라도 흔히 사용될 수 있는 것이라고 볼 수 없고, 지정상품의\n특성을 기술하지 않는 경우에는 식별력이 있는 것으로 본다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 해설상 정답 ②. 단순한 도형의 조합도 실제 표장의 모습과 지정상품과의 관계에 따라 식별력을 인정받을 수\n있습니다.","summary":"해설상 정답 ②. 단순한 도형의 ge":435,"bookPage":438,"answerKey":"⑤","question":"상표법 제34조 제1항 제6호의 저명한 타인의 성명·명칭 등 또는 이들의 약칭을 포함하는 상표에 관한 설명으로\n옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"⑤ 저명한 타인의 성명, 명칭 등 또는 이들의 약칭이 상표의 부기적인 부분으로 포함되어 있는 경우는 본호에\n해당하지 않는 것으로 본다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ⑤. 저명한 타인의 성명·명칭 등이 부기적 부분에 있어도 ‘포함’될 수 있습니다.","summary":"정답 ⑤. 저명한 타인의 성명·명칭 등이 부기적 부분에 있어도 ‘포함’될 수 있습니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":408,"area":"상표","year":2017,"round":54,"page":157,"metadata":"2017년 제54회 / PDF p.436 / 교재 p.439 / 정답 ④","originalPdfPage":436,"bookPage":439,"answerKey":"④","question":"甲은 영업 a에 X상표를 2010년 초부터 사용하면서 집중적으로 광고하여 X상표는 2015년 말부터 저명하게 되\n었다. 한편, 乙은 甲의 승낙 없이 X상표와 유사한 X′상표를 b상품을 지정상품으로 하여 2016년 9월 9일에 등록\n출원하여 2017년 2월 20일에 설정등록 되었다. 甲은 乙의 등록상표에 대해 무효심판을 청구하면서 동시에 甲\n의 상표 사용이 乙의 등록상표의 권리범위에 속하지 않는다는 소극적 권리범위 확인심판을 청구하였다. 다음\n설명 중 옳은 것은? (다툼이 있으면 판례에 따름)","answer":"④ 권리범위 확인심판에서 甲이 표장의 동일 유사여부 등 다른 주장은 하지 아니하고 오로지 자신이 상표법 제\n99조 제2항의 '선사용에 따른 상표를 계속 사용할 권리'를 가지고 있다는 것만을 주장할 경우 특허심판원은 甲\n의 청구를 각하하는 심결을 하여야 한다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 정답 ④. 선사용권만을 내세운 소극적 권리범위 확인심판의 청구는 확인 이익 문제로 각하됩니다.","summary":"정답 ④. 선사용권만을 내세운 소극적 권리범위 확인심판의 청구는 확인 이익 문제로 각하됩니다.","wrong":[],"right":["정답 ④. 선사용권만을 내세운 소극적 권리범위 확인심판의 청구는 확인 이익 문제로 각하됩니다."],"reason":[],"memory":[],"flags":[]},{"id":409,"area":"상표","year":2017,"round":54,"page":157,"metadata":"2017년 제54회 / PDF p.437 / 교재 p.440 / 정답 ⑤","originalPdfPage":437,"bookPage":440,"answerKey":"⑤","question":"甲은 X상표에 대하여 a상품을 지정상품으로 하여 2016년 8월 8일에 상표등록 출원을 하였고, 현재 심사 진행\n중에 있다. 다음 설명 중 옳은 것은? (명시적으로 인용된 경우를 제외하고 각 지문은 서로 독립된 것으로 취급\n함)","answer":"⑤ 甲의 출원이 2017년 2월 24일에 상표등록된 경우 특허청장은 상표권자의 성명·주소 및 상표등록번호 등을\n상표공보에 게재하여 등록공고를 하여야 한다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 정답 ⑤. 설정등록 후 상표공보에 등록공고를 합니다.","summary":"정답 ⑤. 설정등록 후 상표공보에 등록공고를 합니다.","wrong":[],"right":["정답 ⑤. 설정등록 후 상표공보에 등록공고를 합니다."],"reason":[],"memory":[],"flags":[]},{"id" Key":"②","question":"상표등록을 받을 수 있는 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)","answer":"② ㄴ, ㄷ\nㄴ. 외투를 지정상품으로 하는 상표 'JAMES DEAN'\nㄷ. 지정상품이 기저귀인 출원상표 'KSB'","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 정답 ②(ㄴ·ㄷ). JAMES DEAN과 기저귀의 KSB가 교재의 등록 가능 사례입니다.","summary":"정답 ②(ㄴ·ㄷ). JAMES DEAN과 기저귀의 KSB가 교재의 등록 가능 사례입니다.","wrong":[],"right":["정답 ②(ㄴ·ㄷ). JAMES DEAN과 기저귀의 KSB가 교재의 등록 가능 사례입니다."],"reason":[],"memory":[],"flags":[]},{"id":414,"area":"상표","year":2022,"round":59,"page":159,"metadata":"2022년 제59회 / PDF p.443 / 교재 p.446 / 정답 ④","originalPdfPage":443,"bookPage":446,"answerKey":"④","question":"상표법 제34조(상표등록을 받을 수 없는 상표) 제1항 제13호에 관한 설명으로 옳지 않은 것은? (다툼이 있으면\n판례에 따름)","answer":"④ 선사용상표가 양도된 경우 본 호의 국내 또는 외국의 수요자들에게 특정인의 상품을 표시하는 것이라고 인\n식되어 있는 상표로 인정되기 위해서는 선사용상표에 관한 주지성이 양수인에게 승계되었거나 양수인이 독자\n적으로 주지성을 획득해야 하며, 양도 전의 사용실적을 고려할 수는 없다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ④. 양도 전 사용실적도 사안에 따라 고려할 수 있습니다.","summary":"정답 ④. 양도 전 사용실적도 사안에 따라 고려할 수 있습니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":415,"area":"상표","year":2023,"round":60,"page":159,"metadata":"2023년 제60회 / PDF p.444 / 교재 p.447 / 정답 ④","originalPdfPage":444,"bookPage":447,"answerKey":"④","question":"상표법 제34조(상표등록을 받을 수 없는 상표) 제1항 각 호의 내용으로 옳은 것을 모두 고른 것은?","answer":"④ ㄴ, ㄹ\nㄴ. 동업·고용 등 계약관계나 업무상 거래관계 또는 그 밖의 관계를 통하여 타인이 사용하거나 사용을 준비 중\n인 상표임을 알면서 그 상표와 동일·유사한 상표를 동일·유사한 상품에 등록출원한 상표\nㄹ. 국가·인종·민족·공공단체·종교 또는 저명한 고인(故人)과의 관계를 거짓으로 표시하거나 이들을 비방 또는\n모욕하거나 이들에 대한 평판을 나쁘게 할 우려가 있는 상표","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 정답 ④(ㄴ·ㄹ). 각각 제34조 제1항 제20호와 제2호의 내용입니다.","summary":"정답 ④(ㄴ·ㄹ). 각각 제34조 제1항 제20호와 제2호의 내용입니다.","wrong":[],"right":["정답 ④(ㄴ·ㄹ). 각각 제34조 제1항 제20호와 제2호의 내용입니다."],"reason":[],"memory":[],"flags":[]},{"id":416,"area":"상표","year":2024,"round":61,"page":160,"metadata":"2024년 제61회 / PDF p.445 / 교재 p.448 / 정답 ⑤","originalPdfPage":445,"bookPage":448,"answerKey":"⑤","question":"상표법 제34조(상표등록을 받을 수 없는 상표)에 관한 설명으로 옳지 않은 것은?","answer":"⑤ 저명한 임이 간과되어 등록되었음이 상표권의 설정등록이 있은 후에 인정된 때에는 그 상표등록출원은 그\n보정서를 제출한 때에 상표등록출원한 것으로 본다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ⑤. 등록 후 인정된 문제 보정은 보정서 제출일로 출원일을 바꾸지 않습니다.","summary":"정답 ⑤. 등록 후 인정된 문제 보정은 보정서 제출일로 출원일을 바꾸지 않습니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":424,"area":"상표","year":2011,"round":48,"page":162,"metadata":"2011년 제48회 / PDF p.454 / 교재 p.458 / 정답 ③","originalPdfPage":454,"bookPage":458,"answerKey":"③","question":"상표법상 국내상표등록출원에 관한 설명으로 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"③ 출원상표에 대한 심사에 있어서 그와 유사하다는 인용상표에 대한 등록무효심결이 대법원에 계속 중인 경\n우, 심사관은 그 심사절차를 중지하여야 한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ③. 관련 사건이 있어도 심사절차 중지는 의무가 아니라 가능 규정입니다.","summary":"정답 ③. 관련 사건이 있어도 심사절차 중지는 의무가 아니라 가능 규정입니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":425,"area":"상표","year":2012,"round":49,"page":162,"metadata":"2012년 제49회 / PDF p.455 / 교재 p.459 / 정답 ①","originalPdfPage":455,"bookPage":459,"answerKey":"①","question":"출원상표에 대한 1차 심사결과 지정상품 중 일부 지정상품에 대하여 타인의 선등록상표와 저촉하므로 상표법\n제34조(상표등록을 받을 수 없는 상표) 제1항 제7호에 해당하여 등록받을 수 없다는 의견제출통지서를 송달받\n았다. 의견제출통지서의 내용을 검토한 결과 심사관의 거절이유통지는 타당한 것으로 판단되었다. 이 경우 출\n원상표의 상표등록방법으로 옳은 것을 모두 고른 것은?","answer":"① ㄱ, ㄴ, ㄷ, ㄹ\nㄱ. 선등록상표의 권리자로부터 선등록상표를 양수받은 후 그 사실을 증명하는 서류와 함께 의견서를 제출하는\n방법\nㄴ. 출원상표가 등록되는 것을 허락한다는 공존동의서를 선등록상표의 권리자에게 받은 후 이를 첨부하여 의견\n서를 제출하는 방법\nㄷ. 출원상표의 지정상품 중 선등록상표와 저촉하는 상품 전부를 삭제하는 보정서 및 의견서를 제출하는 방법\nㄹ. 선등록상표에 대하여 상표법 제119조(상표등록의 취소심판) 제1항 제3호에 기한 취소심판을 청구한 후 의\n견서에 심사보류를 요청하는 방법","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 정답 ①(ㄱ·ㄴ·ㄷ·ㄹ). 교재는 네 조치를 모두 거절이유 극복 방법으로 봅니다.","summary":"정답 ①(ㄱ·ㄴ·ㄷ·ㄹ). 교재는 네 조치를 모두 거절이유 극복 방법으로 봅니다.","wrong":[],"right":["정답 ①(ㄱ·ㄴ·ㄷ·ㄹ). 교재는 네 조치를 모두 거절이유 극복 방법으로 봅니다."],"reason":[],"memory":[],"flags":[]},{"id":426,"area":"상표","year":2012,"round":49,"page":163,"metadata":"2012년 제49회 / PDF p.456 / 교재 p.460 / 정답 ④","originalPdfPage":456,"bookPage":460,"answerKey":"④","question":"2001년 한글과 영문을 2단으로 병기하여 등록한 상표를 오랫동안 사용해 왔던 甲은 영문 또는 국문만으로 된\n상표만을 사용하고 있다. 등록상표에 대한 존속기간갱신 등록신청을 할 시점에 즈음하여 심사용 상표의 형태에\n맞추고 지정상품도 종전보다 확대하여 상표권을 확보하고자 한다. 다음 설명 중 옳지 않은 것은? (다툼이 있는\n경우에는 판례에 의함)","answer":"④ 甲이 등록상표의 포기등록과 동시에 새로 출원하더라도 타인의 유사한 출원은 1년간 상표등록이 [원문 중간\n표현 판독 불명확]되고, 그 타인이 甲이 포기한 등록상표가 소멸일부터 소급하여 1년 이상 사용하지 않았음을\n입증하지 못하는 한, 그 타인의 출원으로 인하여 甲의 출원의 등록이 거절될 염려는 없다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ④. 교재에 따르면 포기된 상표에 관한 과거의 1년 제한 규정은 삭제되었습니다.","summary":"정답 ④. 교재에 따르면 포기된 상표에 관한 과거의 1년 제한 규정은 삭제되었습니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":427,"area":"상표","year":2013,"round":50,"page":163,"metadata":"2013년 제50회 / PDF p.457 / 교재 p.461 / 해설상 정답 ③(정답 숫자 직접 판독 불명확)","originalPdfPage":457,"bookPage":461,"answerKey":"③(정답 숫자 직접 판독 불명확)","question":"상표권의 존속기간갱신등록 및 신청에 관한 설명으로 옳은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"③ 상표권의 존속기간갱신등록을 무효로 하는 심결이 확정된 경우 설정등록에 의하여 발생한 상표권은 갱신되\n기 전 상표권의 존속기간이 종료하였을 때 소멸한다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 해설상 정답 ③. 갱신 무효가 확정되면 종전 존속기간의 종료 시점에 상표권이 소멸합니다.","summary":"해설상 정답 ③. 갱신 무효가 확정되면 종전 존속기간의 종료 시점에 상표권이 소멸합니다.","wrong":[],"right":["해설상 정답 ③. 갱신 무효가 확정되면 종전 존속기간의 종료 시점에 상표권이 소멸합니다."],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":428,"area":"상표","year":2014,"round":51,"page":164,"metadata":"2014년 제51회 / PDF p.458 / 교재 p.462 / 해설상 정답 ②(정답 숫자 직접 판독 불명확)","originalPdfPage":458,"bookPage":462,"answerKey":"②(정답 숫자 직접 판독 불명확)","question":"상표법상 이의신청제도에 관한 설명으로 옳지 않은 것은?","answer":"② 심사관은 상표등록이의신청이 있는 때에는 출원인에게 답변서를 제출할 수 있는 기회를 주어야 하며, 출원\n인의 답변서를 이의신청인에게 송달하여야 한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 해설상 정답 ②. 이의신청서 부본을 출원인에게 송달하는 절차와 출원인 답변서의 송달을 혼동하지 않습니다.","summary":"해설상 정답 ②. 이의신청서 부본을 출원인에게 송달하는 절차와 출원인 답변서의 송달을 혼동하지 않습니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":429,"area":"상표","year":2014,"round":51,"page":164,"metadata":"2014년 제51회 / PDF p.459 / 교재 p.463 / 정답 ①","originalPdfPage":459,"bookPage":463,"answerKey":"①","question":"상표권의 존속기간과 존속기간갱신등록신청에 관한 설명으로 옳지 않은 것은?","answer":"① 甲과 乙이 상표권을 공유하는 경우, 甲 또는 乙 단독에 의한 존속기간갱신등록신청은 허용되지 않는다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ①. 교재는 공동 신청 의무를 둔 구법 조항이 삭제되었다고 설명합니다.","summary":"정답 ①. 교재는 공동 신청 의무를 둔 구법 조항이 삭제되었다고 설명합니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":430,"area":"상표","year":2015,"round":52,"page":164,"metadata":"2015년 제52회 / PDF p.460 / 교재 p.464 / 해설상 정답 ④(정답 숫자 직접 판독 불명확)","originalPdfPage":460,"bookPage":464,"answerKey":"④(정답 숫자 직접 판독 불명확)","question":"상표법 제58조(손실보상청구권)에 관한 설명으로 옳은 것은?","answer":"④ 손실보상청구권은 상표권의 설정등록일로부터 3년간 행사하지 아니하거나 제3자가 출원상표를 사용한 날\n로부터 10년을 경과한 때에는 시효로 인하여 소멸한다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 해설상 정답 ④. 손실보상청구권에도 소멸시효가 적용됩니다.","summary":"해설상 정답 ④. 손실보상청구권에도 소멸시효가 적용됩니다.","wrong":[],"right":["해설상 정답 ④. 손실보상청구권에도 소멸시효가 적용됩니다."],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":431,"area":"상표","year":2016,"round":53,"page":164,"metadata":"2016년 제53회 / PDF p.461 / 교재 p.465 / 정답 ⑤","originalPdfPage":461,"bookPage":465,"answerKey":"⑤","question":"영화제작자 甲은 제작·흥행에 성공한 만화영화 주인공 캐릭터를 상표로 사용하기 전에 그 캐릭터 도형을 문방\n구류의 상품을 지정상품으로 하여 상표등록출원을 한 후, 제3자인 乙이 거의 동일한 캐릭터를 甲의 출원과 동\n일 또는 유사한 지정 상품에 선출원한 사실을 확인하였다. 사안에 대한 설명으로 옳은 것은? (심벌릭은 문제 삼\n지 않으며, 다툼이 있으면 판례에 따름)","answer":"⑤ 乙이 상표등록을 받는다면 乙이 甲의 동의를 받지 않고 등록상표를 사용하여도 상표의 정당한 사용이 아니\n라고 할 수 없으므로 불사용취소심판에 의해 등록이 취소될 수 없다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 정답 ⑤. 교재는 저작권자의 동의 문제와 불사용취소의 '정당한 사용' 판단을 분리합니다.","summary":"정답 ⑤. 교재는 저작권자의 동의 문제와 불사용취소의 '정당한 사용' 판단을 분리합니다.","wrong":[],"right":["정답 ⑤. 교재는 저작권자의 동의 문제와 불사용취소의 '정당한 사용' 판단을 분리합니다."],"reason":[],"memory":[],"flags":[]},{"id":432,"area":"상표","year":2017,"round":54,"page":165,"metadata":"2017년 제54회 / PDF p.462 / 교재 p.466 / 정답 ①","originalPdfPage":462,"bookPage":466,"answerKey":"①","question":"甲은 X상표를 a상품에 대하여 2010년경부터 사용하기 시작하여 현재까지도 사용하고 있다. 한편, 乙은 甲의 X\n상표와 유사한 X′상표를 a상품과 유사한 a′상품에 대하여 2016년 6월 15일에 출원하여 2016년 12월 1일에 출\n원공고되고 2017년 2월 20일에 등록되었다. 다음 설명 중 옳지 않은 것은?","answer":"① 甲이 乙의 X′상표등록출원에 대하여 이의신청을 제기하였을 경우 특허청장은 직권으로 이의신청에 대한 보\n정기간을 30일 이내에서 한 차례 연장할 수 있으며, 甲이 교통이 불편한 지역에 있는 자에 해당하는 경우 그 횟\n수 및 기간을 추가로 연장할 수 있다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ①. 출원일 2016. 6. 15.는 개정법 시행일 2016. 9. 1.보다 앞섭니다.","summary":"정답 ①. 출원일 2016. 6. 15.는 개정법 시행일 2016. 9. 1.보다 앞섭니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":433,"area":"상표","year":2021,"round":58,"page":165,"metadata":"2021년 제58회 / PDF p.463 / 교재 p.467 / 정답 ③","originalPdfPage":463,"bookPage":467,"answerKey":"③","question":"상표법상 손실보상청구권에 관한 설명으로 옳지 않은 것은?","answer":"③ 상표등록출원이 포기·취하·무효가 되거나 상표등록거절결정이 확정된 경우, 손실보상청구권은 처음부터 발\n생하지 않는 것으로 추정한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ③. 교재는 이 효과를 '추정'이 아니라 '간주'라고 설명합니다.","summary":"정답 ③. 교재는 이 효과를 '추정'이 아니라 '간주'라고 설명합니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":434,"area":"상표","year":2022,"round":59,"page":165,"metadata":"2022년 제59회 / PDF p.464 / 교재 p.468 / 정답 ⑤","originalPdfPage":464,"bookPage":468,"answerKey":"⑤","question":"상표권의 존속기간과 존속기간갱신등록에 관한 설명으로 옳지 않은 것은?","answer":"⑤ 존속기간갱신등록신청에 대해서는 실체심사를 하지 아니하므로 1상표 1출원(제38조), 절차의 보정(제39조)\n등 상표등록출원의 심사에 따른 규정이 준용되지 아니한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ⑤. 실체심사가 없어도 절차 규정은 적용됩니다.","summary":"정답 ⑤. 실체심사가 없어도 절차 규정은 적용됩니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":435,"area":"상표","year":2022,"round":59,"page":166,"metadata":"2022년 제59회 / PDF p.465 / 교재 p.469 / 정답 ③","originalPdfPage":465,"bookPage":469,"answerKey":"③","question":"상표법상 기간에 관한 설명으로 옳은 것은?","answer":"③ 상표권자가 사망한 날부터 3년 이내에 상속인이 그 상표권의 이전등록을 하지 아니한 경우에는 상표권자가\n사망한 날부터 3년이 되는 날의 다음 날에 상표권이 소멸한다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 정답 ③. 사망 후 3년 내 이전등록이 없으면 3년이 되는 날의 다음 날 상표권이 소멸합니다.","summary":"정답 ③. 사망 후 3년 내 이전등록이 없으면 3년이 구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ①. 교재는 전용사용권 등록을 제3자 대항요건으로 설명한다.","summary":"정답 ①. 교재는 전용사용권 등록을 제3자 대항요건으로 설명한다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":443,"area":"상표","year":2008,"round":45,"page":168,"metadata":"2008년 제45회 / PDF p.474 / 교재 p.478 / 정답 ④","originalPdfPage":474,"bookPage":478,"answerKey":"④","question":"甲은 컴퓨터를 지정상품으로 하여 상표 'A'를 1995년 2월 1일 상표등록출원하여 1996년 1월 [등록 월·일 판독\n보류] 상표등록 받은 후 계속하여 사용함으로써 'A'상표는 주지상표가 되었다. 그런데, 그 후 乙이 컴퓨터를 지\n정상품으로 하여 甲의 'A'상표와 유사한 'A+'상표를 2001년 3월 5일 상표등록출원하여 2002년 2월 8일 상표등\n록을 받았고 그 후 丙에게 2005년 10월 8일 통상사용권을 설정하였다. 한편, 丙은 乙로부터 통상사용권을 설정\n받은 'A+'상표를 사용하지 아니하고 乙의 묵인 하에 甲의 'A'상표와 극히 유사한 'AO'상표를 사용함으로써 수요\n자로 하여금 甲의 'A'상표 상품과 출처의 혼동을 야기하고 있다. 이 경우 甲이 乙의 'A+'상표에 대해 취할 수 있\n는 상표법상의 조치로서 옳은 것은?\n※ 첫 문장의 등록 월·일은 원본 스캔이 흐려 판독을 보류한다.","answer":"④ 상표법 제119조 제1항 제2호(사용권자의 부정사용)에 기한 상표등록 취소심판청구","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 정답 ④. 교재 기준으로 제척기간 때문에 사용권자 부정사용에 관한 취소심판청구만 답이다.","summary":"정답 ④. 교재 기준으로 제척기간 때문에 사용권자 부정사용에 관한 취소심판청구만 답이다.","wrong":[],"right":["정답 ④. 교재 기준으로 제척기간 때문에 사용권자 부정사용에 관한 취소심판청구만 답이다."],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":444,"area":"상표","year":2008,"round":45,"page":169,"metadata":"2008년 제45회 / PDF p.475 / 교재 p.479 / 정답 ②","originalPdfPage":475,"bookPage":479,"answerKey":"②","question":"상표법상 선사용권에 관한 설명 중 옳지 않은 것은?","answer":"② 상표를 사용한 결과 타인의 상표등록출원시에 국내 수요자간에 그 상표가 특정인의 상품을 표시하는 것이\n라고 [이하 부사 한 단어 판독 보류] 인식되어 있어야 한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ②. 선사용권에 요구되는 인식 범위를 보기처럼 절대적으로 단정해서는 안 된다.","summary":"정답 ②. 선사용권에 요구되는 인식 범위를 보기처럼 절대적으로 단정해서는 안 된다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":445,"area":"상표","year":2008,"round":45,"page":169,"metadata":"2008년 제45회 / PDF p.476 / 교재 p.480 / 해설상 정답 ③","originalPdfPage":476,"bookPage":480,"answerKey":"③","question":"甲은 '세한'이라는 상표를 가방류, 화장품류, 신발류 및 의류에 상표등록을 하고 10년 이상 [이후 짧은 부분 판\n독 보류] 유명 백화점에서 자기의 상표를 부착한 상품을 인기리에 판매하여 오던 중 乙이 '주식회사 세한'이라\n는 자기의 상호를 사용하여 '의류세탁업'을 시작하는 경우 甲과 乙의 지위에 관한 설명 중 옳지 않은 것은? (다\n툼이 있는 경우 판례에 의함)","answer":"③ ②에서 乙의 주장이 인정되더라도 乙이 부정경쟁의 목적이 없음을 입증하지 못하는 한 乙은 상표권 침해의\n책임을 면할 수 없다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 해설상 정답 ③. 부정경쟁 목적의 입증책임을 乙에게 돌린 것이 잘못이다.","summary":"해설상 정답 ③. 부정경쟁 목적의 입증책임을 乙에게 돌린 것이 잘못이다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":446,"area":"상표","year":2010,"round":47,"page":169,"metadata":"2010년 제47회 / PDF p.477 / 교재 p.481 / 정답 ④","originalPdfPage":477,"bookPage":481,"answerKey":"④","question":"상표권의 행사와 권리남용에 관한 설명으로 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)","answer":"④ 주지성을 획득하지 못한 상표의 경우에는 특수한 개별적인 관계에서 부정한 의도가 존재하거나 경업금지의\n무 등의 위반이 있는 경우와 같이 상표권의 행사가 신의칙 내지 사회질서에 반하는 경우라도 권리행사의 외형\n을 갖추었다면 등록상표에 관한 권리를 남용하는 것으로 볼 수 없다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ④. 주지성이 없더라도 구체적 권리 행사에 부정한 의도나 신의칙 위반이 있으면 권리남용이 문제 된다.","summary":"정답 ④. 주지성이 없더라도 구체적 권리 행사에 부정한 의도나 신의칙 위반이 있으면 권리남용이 문제 된다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":447,"area":"상표","year":2010,"round":47,"page":170,"metadata":"2010년 제47회 / PDF p.478 / 교재 p.482 / 정답 ⑤","originalPdfPage":478,"bookPage":482,"answerKey":"⑤","question":"상표권의 공유에 관한 설명으로 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)","answer":"⑤ 상표등록원부에 공유상표권자로 등재되어 있는 상표권자 중 일부가 존속기간갱신등록출원 포기를 표시한\n경우에 그 포기가 등록되지 않은 상태에서 나머지 공유자들이 존속기간갱신등록출원을 한 것은 거절이유에 해\n당한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ⑤. 교재 기준으로 공유자 1인도 존속기간갱신등록신청을 할 수 있다.","summary":"정답 ⑤. 교재 기준으로 공유자 1인도 존속기간갱신등록신청을 할 수 있다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":448,"area":"상표","year":2011,"round":48,"page":170,"metadata":"2011년 제48회 / PDF p.479·p.480 / 교재 p.483 / 정답 ②","originalPdfPage":479,"bookPage":483,"answerKey":"②","question":"상표법 제90조(상표권의 효력이 미치지 아니하는 범위)의 적용에 관한 설명으로 옳지 않은 것은?","answer":"② 상표법 제33조(상표등록의 요건) 제2항의 '사용에 의한 식별력'을 인정받아 등록된 상표라 하더라도 그 상표\n의 지정상품과 동일한 상품의 품질을 보통으로 사용하는 방법으로 표시하는 상표에는 상표권의 효력이 미치지\n아니한다고 보는 것이 판례의 일관된 입장이다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ②. 사용으로 식별력을 얻은 표장은 제90조의 효력 제한을 당연히 받는 것은 아니다.","summary":"정답 ②. 사용으로 식별력을 얻은 표장은 제90조의 효력 제한을 당연히 받는 것은 아니다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":449,"area":"상표","year":2011,"round":48,"page":170,"metadata":"2011년 제48회 / PDF p.481·p.482 / 교재 p.484 / 정답 ⑤(ㄷ, ㄹ)","originalPdfPage":481,"bookPage":484,"answerKey":"⑤(ㄷ, ㄹ)","question":"상표법상 상표권 소멸에 관한 설명으로 옳은 것만을 모두 고른 것은?","answer":"⑤ ㄷ, ㄹ\nㄷ. 상표권의 포기에 의한 소멸은 이를 등록하지 아니하여도 그 효력이 발생한다.\nㄹ. 상품분류전환등록을 무효로 한다는 심결이 확정된 경우, 그 지정상품에 관한 상표권은 상표법 제214조(상\n품분류전환등록의 신청) 제3항의 규정에 의한 상품분류전환등록신청기간의 종료일이 속하는 존속기간의 만료\n일 다음 날에 소멸한다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 정답 ⑤(ㄷ, ㄹ). 포기와 상품분류전환등록 무효에 따른 소멸 시점을 구별한다.","summary":"정답 ⑤(ㄷ, ㄹ). 포기와 상품분류전환등록 무효에 따른 소멸 시점을 구별한다.","wrong":[],"right":["정답 ⑤(ㄷ, ㄹ). 포기와 상품분류전환등록 무효에 따른 소멸 시점을 구별한다."],"reason":[],"memory":[],"flags":[]},{"id":450,"area":"상표","year":2012,"round":49,"page":171,"metadata":"2012년 제49회 / PDF p.483 / 교재 p.485 / 정답 ①","originalPdfPage":483,"bookPage":485,"answerKey":"①","question":"상표권에 관한 설명으로 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"① 상표법상 2개의 유사한 상표가 유사한 상품을 지정상품으로 하여 시기를 달리하여 각각 출원되어 등록되었\n다 하더라도 무효심판 등에 의하여 어느 일방의 권리가 소멸되지 않는 한 각각이 상표권으로서 보호를 받고 어\n느 일방의 사용이 다른 일방의 상표권에 대한 침해가 되지 않는다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ①. 선출원 상표와 저촉되는 후출원 등록상표는 무효심결 확정 전에도 침해가 성립할 수 있다.","summary":"정답 ①. 선출원 상표와 저촉되는 후출원 등록상표는 무효심결 확정 전에도 침해가 성립할 수 있다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":451,"area":"상표","year":2012,"round":49,"page":171,"metadata":"2012년 제49회 / PDF p.484 / 교재 p.486 / 정답 ①(B, C)","originalPdfPage":484,"bookPage":486,"answerKey":"①(B, C)","question":"A는 의류브랜드로 유명한 타인의 등록상표 'BRIN'에 대한 위조 상품을 제조하기로 마음먹고 다음과 같이 이를\n실행하였다. 우선, A는 의류 라벨 전문제조업자인 B에게 'BRIN' 라벨을 제조하여 공급해달라는 요청을 하였고,\nB는 A가 위조상품에 사용하려는 사실을 알고도 A의 요청대로 'BRIN' 라벨 500개를 제조하여 A에게 교부하였다.\nA는 B가 만든 'BRIN' 라벨을 C 및 D에게 전달하였고, 이 때 C는 A로부터 전달받은 'BRIN' 라벨을 의류에 사용\n하게 할 목적으로 판매하였으며, D는 A로부터 받은 'BRIN' 라벨을 이용하여 위조상품을 제조하였다. A는 완성\n된 위조 상품을 D로부터 인도받아 의류 판매업자인 E에게 전량 판매하였고, E는 이 제품을 자신의 매장에서 일\n반소비자를 상대로 판매하였다. E는 위조상품을 판매하고 남은 재고 일부를 해외 바이어(buyer)인 F에게 팔았\n고, F는 이를 자신의 본국에 수출하였다. 위 침해 행위 중에서 같은 유형의 상표권 침해를 한 자는?","answer":"① B, C","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 정답 ①(B, C). 둘 다 교재에서 간접침해로 분류한다.","summary":"정답 ①(B, C). 둘 다 교재에서 간접침해로 분류한다.","wrong":[],"right":["정답 ①(B, C). 둘 다 교재에서 간접침해로 분류한다."],"reason":[],"memory":[],"flags":[]},{"id":452,"area":"상표","year":2012,"round":49,"page":171,"metadata":"2012년 제49회 / PDF p.485 / 교재 p.487 / 정답 ⑤","originalPdfPage":485,"bookPage":487,"answerKey":"⑤","question":"다음 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"⑤ 상표법의 규정에 의하여 선서한 당사자·증인·감정인 또는 통역인이 특허심판원에 대하여 허위의 진술·감정\n또는 통역을 한 때에는 상표법상 위증죄에 해당한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ⑤. 교재 기준으로 당사자에게는 위증죄가 적용되지 않는다.","summary":"정답 ⑤. 교재 기준으로 당사자에게는 위증죄가 적용되지 않는다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":453,"area":"상표","year":2013,"round":50,"page":172,"metadata":"2013년 제50회 / PDF p.486 / 교재 p.488 / 정답 ②","originalPdfPage":486,"bookPage":488,"answerKey":"②","question":"상표법의 내용에 관한 설명으로 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"② 행정소송인 심결취소소송에서도 원칙적으로 변론주의가 적용되므로 상표법 제34조 제1항 제12호의 국내\n또는 외국의 수요자 간에 특정인의 상품을 표시하는 것이라고 인식되어 있는 상표와 동일 또는 유사한 상표 인\n지 여부에 대한 판단에 대하여 자백이 인정된다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ②. 자백은 사실에 관한 것이고, 법률 요건 해당 여부라는 법적 평가는 별도로 판단한다.","summary":"정답 ②. 자백은 사실에 관한 것이고, 법률 요건 해당 여부라는 법적 평가는 별도로 판단한다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":454,"area":"상표","year":2013,"round":50,"page":172,"metadata":"2013년 제50회 / PDF p.487 / 교재 p.489 / 정답 ①","originalPdfPage":487,"bookPage":489,"answerKey":"①","question":"상표권에 관한 설명으로 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"① 상표등록출원일 전에 출원되어 등록된 특허권이 그 상표권과 저촉되는 경우 그 특허권이 만료되는 때에 원\n특허권의 범위 안에서 상표를 사용할 권리를 가지는 원특허권자는 상표권자 또는 전용사용권자에게 상당한 대\n가를 지급하여야 한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ①. 교재 기준으로 원특허권자의 상표 사용은 무상이고, 실시권자의 경우는 유상으로 설명한다.","summary":"정답 ①. 교재 기준으로 원특허권자의 상표 사용은 무상이고, 실시권자의 경우는 유상으로 설명한다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":455,"area":"상표","year":2014,"round":51,"page":172,"metadata":"2014년 제51회 / PDF p.488 / 교재 p.490 / 정답 ⑤","originalPdfPage":488,"bookPage":490,"answerKey":"⑤","question":"상표법의 사용권 제도에 관한 설명으로 옳은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"⑤ 상표법 제97조에 의한 통상사용권은 상표권자 혹은 상표권자의 동의를 얻은 전용사용권자만이 설정하여 줄\n수 있을 뿐이고 통상사용권자가 다시 이를 설정하여 줄 수는 없다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 정답 ⑤. 교재 기준으로 통상사용권자는 다시 통상사용권을 설정할 수 없다.","summary":"정답 ⑤. 교재 기준으로 통상사용권자는 다시 통상사용권을 설정할 수 없다.","wrong":[],"right":["정답 ⑤. 교재 기준으로 통상사용권자는 다시 통상사용권을 설정할 수 없다."],"reason":[],"memory":[],"flags":[]},{"id":456,"area":"상표","year":2015,"round":52,"page":173,"metadata":"2015년 제52회 / PDF p.489 / 교재 p.491 / 정답 ⑤(ㄷ, ㄹ)","originalPdfPage":489,"bookPage":491,"answerKey":"⑤(ㄷ, ㄹ)","question":"상표권 또는 전용사용권의 침해에 대한 구제에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있으면 판례\n에 따름)","answer":"⑤ ㄷ, ㄹ\nㄷ. 전용사용권자는 자기의 전용사용권을 고의는 물론 과실로 침해한 자에 대하여도 그 침해에 의하여 자기가\n받은 손해의 배상을 청구할 수 있으며, 이때 권리를 침해한 자가 그 침해행위에 의하여 이익을 받은 때에는 그\n이익의 액을 전용사용권자가 받은 손해액으로 추정한다.\nㄹ. 상표권 침해행위로 인하여 영업상의 이익이 침해되었음을 이유로 상표법 제110조(손해액의 추정 등) 제4항\n의 규정에 따라 영업상 손해의 배상을 구하는 상표권자로서는 스스로 업으로 등록상표를 사용하고 있음을 주\n장·입증할 필요가 있으며, 이때 등록상표를 사용하고 있는 경우란 등록상표를 지정상품 그 자체 또는 거래사회\n의 통념상 이와 동일하게 볼 수 있는 상품에 현실로 사용한 때를 말하고, 지정상품과 유사한 상품에 사용한 것\n만으로는 등록상표를 사용하였다고 볼 수 없다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 정답 ⑤(ㄷ, ㄹ). 전용사용권자의 손해액 추정과 상표권자의 실제 사용 입증을 구별한다.","summary":"정답 ⑤(ㄷ, ㄹ). 전용사용권자의 손해액 추정과 상표권자의 실제 사용 입증을 구별한다.","wrong":[],"right":["정답 ⑤(ㄷ, ㄹ). 전용사용권자의 손해액 추정과 상표권자의 실제 사용 입증을 구별한다."],"reason":[],"memory":[],"flags":[]},{"id":457,"area":"상표","year":2015,"round":52,"page":173,"metadata":"2015년 제52회 / PDF p.490 / 교재 p.492 / 해설상 정답 ①","originalPdfPage":490,"bookPage":492,"answerKey":"①","question":"상표권자의 허락에 의한 사용권에 관한 설명으로 옳은 것은?","answer":"① 통상사용권을 목적으로 하는 질권을 상속하는 경우에는 지체없이 그 취지를 특허청장에게 신고해야 한다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 해설상 정답 ①. 사용권 및 관련 질권의 상속 등 일반승계는 지체 없이 신고한다.","summary":"해설상 정답 ①. 사용권 및 관련 질권의 상속 등 일반승계는 지체 없이 신고한다.","wrong":[],"right":["해설상 정답 ①. 사용권 및 관련 질권의 상속 등 일반승계는 지체 없이 신고한다."],"reason":[],"memory":[],"flags":[]},{"id":458,"area":"상표","year":2015,"round":52,"page":173,"metadata":"2015년 제52회 / PDF p.491 / 교재 p.493 / 정답 ⑤","originalPdfPage":491,"bookPage":493,"answerKey":"⑤","question":"甲의 등록상표의 사용이 그 사용상태에 따라 甲의 상표등록출원일 전에 출원되어 등록된 乙의 디자인권과 저\n촉되거나 선 발생한 丙의 저작권 등 타인의 선행 권리 또는 법적 지위와 저촉되는 경우, 다음 설명 중 옳은 것\n은?","answer":"⑤ 乙 등의 선행권리와 甲의 등록상표와의 저촉은 상표등록 무효사유에는 해당하지 않으나, 甲의 등록상표의\n사용이 '부정경쟁방지 및 영업비밀보호에 관한 법률' 제2조(정의)의 일반조항을 위반하는 경우 상표등록취소사\n유가 될 수 있다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 정답 ⑤. 선행권리와 저촉되는 상표 사용은 등록의 효력과 사용에 대한 제한·취소사유를 나누어 본다.","summary":"정답 ⑤. 선행권리와 저촉되는 상표 사용은 등록의 효력과 사용에 대한 제한·취소사유를 나누어 본다.","wrong":[],"right":["정답 ⑤. 선행권리와 저촉되는 상표 사용은 등록의 효력과 사용에 대한 제한·취소사유를 나누어 본다."],"reason":[],"memory":[],"flags":[]},{"id":459,"area":"상표","year":2016,"round":53,"page":174,"metadata":"2016년 제53회 / PDF p.492 / 교재 p.494 / 해설상 정답 ④(ㄱ, ㄴ, ㄷ, ㄹ)","originalPdfPage":492,"bookPage":494,"answerKey":"④(ㄱ, ㄴ, ㄷ, ㄹ)","question":"다음 행위 중 상표법상 상표권 침해에 해당하지 않는 경우를 모두 고른 것은? (단, 국내에 유효한 타인의 등록\n상표가 존속하고 있고 국내 상표권자인 타인은 외국 상표권자와 동일인으로 볼 수 있으며, 다툼이 있으면 판례\n에 따름)","answer":"④ ㄱ, ㄴ, ㄷ, ㄹ\nㄱ. 자동차부품 제조업자가 허락 없이 부품 포장상자에 부품이 사용되는 자동차를 밝히기 위하여 완성차 제조\n회사의 등록상표를 표시한 경우\nㄴ. 타인의 저명상표와 유사한 상표를 허락 없이 비유사 상품에 사용한 경우\nㄷ. 타인의 등록상표가 인쇄된 트럼프 카드를 구입한 후 특수염료로 처리하여 육안으로 식별하기 불가능하게\n한 후 유통시킨 경우\nㄹ. 진정상품을 일본국 내에서만 판매하기로 한 약정을 위반하여 일본의 수입업자가 대한민국으로 수출하여 유\n통시킨 경우","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 해설상 정답 ④(ㄱ, ㄴ, ㄷ, ㄹ). ㄱ의 교재 해설 사례는 보기와 표현이 달라 대조 필요.","summary":"해설상 정답 ④(ㄱ, ㄴ, ㄷ, ㄹ). ㄱ의 교재 해설 사례는 보기와 표현이 달라 대조 필요.","wrong":[],"right":["해설상 정답 ④(ㄱ, ㄴ, ㄷ, ㄹ). ㄱ의 교재 해설 사례는 보기와 표현이 달라 대조 필요."],"reason":[],"memory":[],"flags":[]},{"id":460,"area":"상표","year":2016,"round":53,"page":174,"metadata":"2016년 제53회 / PDF p.493 / 교재 p.495 / 정답 ③","originalPdfPage":493,"bookPage":495,"answerKey":"③","question":"상표법 제110조(손해액의 추정 등) 제4항의 통상 받을 수 있는 합리적인 손해액의 청구에 대한 설명으로 옳지\n않은 것은? (다툼이 있으면 판례에 따름)","answer":"③ 상표권자가 상표법 제110조 제4항에 따라 손해배상을 청구하는 경우에 상표권자가 침해자와 동종의 영업을\n하고 있다 하여도 상표권 침해에 의하여 영업상의 손해를 입었음이 사실상 추정되지는 아니한다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 정답 ③. 동종 영업이 증명되면 특별한 사정이 없는 한 영업상 손해가 사실상 추정된다.","summary":"정답 ③. 동종 영업이 증명되면 특별한 사정이 없는 한 영업상 손해가 사실상 추정된다.","wrong":[],"right":["정답 ③. 동종 영업이 증명되면 특별한 사정이 없는 한 영업상 손해가 사실상 추정된다."],"reason":[],"memory":[],"flags":[]},{"id":461,"area":"상표","year":2017,"round":54,"page":175,"metadata":"2017년 제54회 / PDF p.495 / 교재 p.497 / 정답 ②(ㄱ, ㄹ)","originalPdfPage":495,"bookPage":497,"answerKey":"②(ㄱ, ㄹ)","question":"다음 설명 중 옳은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)","answer":"② ㄱ, ㄹ\nㄱ. 甲의 상표(X)가 정당하게 출원·등록된 후 제3자인 乙이 甲의 등록상표(X)와 동일·유사한 상표(Y)를 정당한 이\n유 없이 사용한 결과 사용상표(Y)가 주지성을 획득하더라도 상표권자(甲)가 상표사용자(乙)를 상대로 등록상표\n(X)의 상표권에 기초한 침해금지청구를 청구하는 것은 권리남용에 해당하지 아니한다.\nㄹ. 丙의 X 상표가 정당하게 출원·등록된 후 丙의 X 상표와 동일·유사한 표장 및 지정상품에 대해 출원·등록(Y\n상표)한 경우, X 상표와 동일·유사한 상표로서 X 상표의 등록 이후부터 사용되어 온 결과 Y 상표의 등록결정 당\n시 丁의 상표로 인식된 乙 상표와의 관계에서, 乙 상표와 유사한 Y 상표는 상표법 제34조 제1항 제12호 무단의 '\n수요자를 기만할 염려가 있는 상표'에 해당하여 등록이 무효로 될 수 있다.\n※ ㄹ의 당사자 표기와 가운데 문구는 스캔이 흐려 원문 대조가 필요하다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 정답 ②(ㄱ, ㄹ). 선등록권자의 침해금지청구와 후출원 상표의 수요자 기만 문제를 구별한다.","summary":"정답 ②(ㄱ, ㄹ). 선등록권자의 침해금지청구와 후출원 상표의 수요자 기만 문제를 구별한다.","wrong":[],"right":["정답 ②(ㄱ, ㄹ). 선등록권자의 침해금지청구와 후출원 상표의 수요자 기만 문제를 구별한다."],"reason":[],"memory":[],"flags":[]},{"id":462,"area":"상표","year":2017,"round":54,"page":175,"metadata":"2017년 제54회 / PDF p.496 / 교재 p.498 / 해설상 정답 ③","originalPdfPage":496,"bookPage":498,"answerKey":"③","question":"상표권의 전용사용권에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"③ 전용사용 법상 사용권에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","answer":"④ 상표권자 甲은 자신의 상표권에 대하여 조그만 개인 식당을 운영하던 아버지에게 전용사용권을 설정하여\n주었는데, 아버지가 사망하여 전용사용권을 甲이 단독 상속하는 경우라면 상속에 관한 사항을 등록하지 아니하\n여도 제3자에 대항할 수 있다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 해설상 정답 ④. 전용사용권의 상속에 의한 이전은 등록 없이도 제3자 대항이 가능하다는 교재 설명.","summary":"해설상 정답 ④. 전용사용권의 상속에 의한 이전은 등록 없이도 제3자 대항이 가능하다는 교재 설명.","wrong":[],"right":["해설상 정답 ④. 전용사용권의 상속에 의한 이전은 등록 없이도 제3자 대항이 가능하다는 교재 설명."],"reason":[],"memory":[],"flags":[]},{"id":470,"area":"상표","year":2021,"round":58,"page":178,"metadata":"2021년 제58회 / PDF p.508 / 교재 p.509 / 정답 ③","originalPdfPage":508,"bookPage":509,"answerKey":"③","question":"상표권의 이전에 관한 설명으로 옳지 않은 것은?","answer":"③ 업무표장권은 이전할 수 없다. 다만, 그 업무와 함께 이전할 경우에는 특허청장의 허가를 받아 이전할 수 있\n다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ③. 업무표장권은 업무와 함께 이전할 수 있고, 교재 기준으로 특허청장 허가는 필요 없다.","summary":"정답 ③. 업무표장권은 업무와 함께 이전할 수 있고, 교재 기준으로 특허청장 허가는 필요 없다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":471,"area":"상표","year":2021,"round":58,"page":178,"metadata":"2021년 제58회 / PDF p.509–510 / 교재 p.510–511 / 정답 ①","originalPdfPage":509,"bookPage":510,"answerKey":"①","question":"상표권에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","answer":"① 상표권자에 대하여 상표권에 관한 이전약정에 기하여 이전등록절차의 이행을 청구할 권리를 가지는 사람이\n이미 그 상표를 실제로 사용하고 있으면 상표권에 관한 이전등록절차 이행청구권의 소멸시효는 진행되지 아\n니한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ①. 상표의 실제 사용만으로 이전등록청구권의 소멸시효가 멈추지는 않는다.","summary":"정답 ①. 상표의 실제 사용만으로 이전등록청구권의 소멸시효가 멈추지는 않는다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":472,"area":"상표","year":2021,"round":58,"page":178,"metadata":"2021년 제58회 / PDF p.511 / 교재 p.512 / 해설상 정답 ②","originalPdfPage":511,"bookPage":512,"answerKey":"②","question":"상표법상 벌칙에 관한 설명으로 옳지 않은 것은?","answer":"② 상표법에 따라 선서한 증인으로서 특허심판원에 대하여 거짓의 진술·감정을 하여 위증죄를 범한 자가 그 사\n건의 상표등록여부결정 또는 심결의 확정 전에 자수하였을 경우에는 필요적으로 그 형을 감경하거나 면제하여\n야 한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 해설상 정답 ②. 확정 전 자수 시 형 감경·면제는 교재 기준으로 필요적이지 않다.","summary":"해설상 정답 ②. 확정 전 자수 시 형 감경·면제는 교재 기준으로 필요적이지 않다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":473,"area":"상표","year":2022,"round":59,"page":178,"metadata":"2022년 제59회 / PDF p.514 / 교재 p.515 / 정답 ④","originalPdfPage":514,"bookPage":515,"answerKey":"④","question":"상표법상 표시에 관한 설명으로 옳지 않은 것은?","answer":"④ 상표법 제223조(동음이의어 지리적 표시 등록단체표장의 표시)를 위반한 자는 3년 이하의 징역 또는 3천만\n원 이하의 벌금에 처한다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ④. 교재의 3년 이하 징역·3천만원 이하 벌금은 제234조의 거짓 행위에 관한 설명이다.","summary":"정답 ④. 교재의 3년 이하 징역·3천만원 이하 벌금은 제234조의 거짓 행위에 관한 설명이다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":474,"area":"상표","year":2022,"round":59,"page":179,"metadata":"2022년 제59회 / PDF p.515–516 / 교재 p.516–517 / 정답 ④(ㄱ, ㄴ, ㅁ)","originalPdfPage":515,"bookPage":516,"answerKey":"④(ㄱ, ㄴ, ㅁ)","question":"상표법상 저촉에 관한 설명으로 옳지 않은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)","answer":"④ ㄱ, ㄴ, ㅁ\nㄱ. 상표권자는 지정상품에 있는 타인의 등록상표를 확인대상표장으로 하여 권리의 범위가 [일부 스캔 흐림] 적\n극적 권리범위확인심판을 청구할 수 있다.\nㄴ. 상표등록출원일 전에 발생한 저작권자는 저작권과 상표권이 저촉되는 경우 부정경쟁의 목적이 없는 한 저\n작권자는 존속기간이 만료한 후에도 원 저작권의 범위 내에서 등록상표와 동일·유사한 표장을 계속하여 사용할\n수 있다.\nㅁ. 후출원 등록상표를 무효로 한다는 심결이 확정될 때까지는 후출원 등록상표권자가 자신의 상표권 실현을\n위하여 선출원 등록상표와 동일 또는 유사한 상표를 지정상품과 동일 또는 유사한 상품에 사용하는 것은 선출\n원 등록상표권에 대한 침해가 되지 않는다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ④(ㄱ, ㄴ, ㅁ)로 표시. ㄱ·ㄴ의 세부 원문은 판독 보류.","summary":"정답 ④(ㄱ, ㄴ, ㅁ)로 표시. ㄱ·ㄴ의 세부 원문은 판독 보류.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":475,"area":"상표","year":2022,"round":59,"page":179,"metadata":"2022년 제59회 / PDF p.517 / 교재 p.518 / 정답 ⑤","originalPdfPage":517,"bookPage":518,"answerKey":"⑤","question":"상표법에 관한 설명으로 옳은 것은?","answer":"⑤ 질권자가 질권의 목적인 상표권을 이전받은 경우, 권리의 혼동으로 인한 그 질권의 소멸은 등록하지 아니하\n더라도 그 효력이 발생한다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 정답 ⑤. 혼동으로 질권이 소멸하는 경우에는 등록 없이 효력이 발생한다.","summary":"정답 ⑤. 혼동으로 질권이 소멸하는 경우에는 등록 없이 효력이 발생한 y":[],"flags":[]},{"id":489,"area":"상표","year":2012,"round":49,"page":184,"metadata":"2012년 제49회 / PDF p.533 / 교재 p.534 / 해설상 정답 ①(정답 표시 흐림)","originalPdfPage":533,"bookPage":534,"answerKey":"①(정답 표시 흐림)","question":"甲은 상표법 시행규칙 제6조(상품류 구분 등)에 의한 제18류의 상품 전부를 지정하여 상표등록출원을 하였으나,\n심사과정에서 타인의 선등록상표(이하 '인용상표'라 함)와 저촉된다는 취지의 거절이유통지를 송달받았고, 이\n에 대한 의견서를 제출하였으나 심사관에 의해 거절결정이 내려졌다. 이에 대하여 甲은 상표등록을 위해 인용\n상표에 대하여 상표법 제119조(상표등록 취소심판) 제1항 제3호에 의한 불사용을 근거로 취소심판청구를 고려\n하고 있다. 이와 관련하여 다음 설명 중 옳지 않은 것은?","answer":"① 甲은 A상품군과 B상품군을 취소대상 상품으로 취소심판을 청구한 후에 심리과정에서 B상품군에 대한 취소\n심판 청구를 취하할 수는 없다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 해설상 정답 ①. 불사용 취소심판의 지정상품별 청구를 고려해야 한다.","summary":"해설상 정답 ①. 불사용 취소심판의 지정상품별 청구를 고려해야 한다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":490,"area":"상표","year":2012,"round":49,"page":184,"metadata":"2012년 제49회 / PDF p.534 / 교재 p.535 / 정답 ⑤","originalPdfPage":534,"bookPage":535,"answerKey":"⑤","question":"상표에 관한 심판 및 소송제도에 관한 설명으로 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"⑤ 상표등록무효심판에서의 심결에 대한 취소소송을 담당하는 특허법원은 심결이 위법하다고 판단되면 이를\n취소하고 환송하는 판결을 할 수 있을 뿐 아니라 스스로 판단하여 당해 상표의 등록을 무효화할 수 있다.","correction":"틀린 문구의 정확한 위치와 교체 표현: 추가 대조 필요.\n기존 판단 요약: 정답 ⑤. 심결취소소송에서 법원은 심결의 위법성을 판단한다.","summary":"정답 ⑤. 심결취소소송에서 법원은 심결의 위법성을 판단한다.","wrong":[],"right":[],"reason":[],"memory":[],"flags":["원문 판독·검증 필요"]},{"id":491,"area":"상표","year":2013,"round":50,"page":184,"metadata":"2013년 제50회 / PDF p.535 / 교재 p.536 / 해설상 정답 ④(정답 원형 흐림)","originalPdfPage":535,"bookPage":536,"answerKey":"④(정답 원형 흐림)","question":"상표법 제119조(상표등록의 취소심판)에 관한 설명으로 옳은 것은? (다툼이 있는 경우에는 판례에 의함)","answer":"④ 심판청구시에는 불사용기간이 완성되지 아니하였으나 심판청구사건의 심리종결전에 불사용기간이 완성된\n경우에는 그 상표등록은 제119조 제1항 제3호(불사용으로 인한 취소심판)에 의하여 취소될 수 있다.","correction":"옳은 보기·정답 조합: 잘못된 문구를 찾는 문제가 아닙니다.\n핵심 판단: 해설상 정답 ④. 심리종결 전에 불사용 기간이 완성된 경우의 취소 가능성을 묻는다.","summary":"해설상 정답 ④. 심리종결 전에 불사용 기간이 완성된 경우의 취소 가능성을 묻는다.","wrong":[],"right":["해설상 정답 ④. 심리종결 전에 불사용 기간이 완성된 경우의 취소 가능성을 묻는다."],"reason":[],
